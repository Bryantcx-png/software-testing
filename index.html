 behavior of the test object without knowledge of the internal structure - the answer describes white box testing procedures (see [CTFL 4.0], section 4.1, paragraph White Box Testing Procedures)."},{"text":"Black box test techniques can be created regardless of the implementation of the software.","correct":true,"why":"CORRECT – This is an advantage of black box test techniques that is described in the syllabus text (see [CTFL 4.0], section 4.1.1). Black box test techniques can be carried out regardless of the implementation of the software. This means that the tester does not need any knowledge of the source code or the internal structure of the software Black box test techniques are therefore suitable for checking e.g. the functionality, usability and performance of the software from the end user's perspective."},{"text":"Black box test techniques better utilize the knowledge and experience of the testers.","correct":false,"why":"FALSE – Experience-based testing approach effectively utilize the knowledge and experience of testers to design and implement test cases (see [CTFL 4.0], section 4.1, Experience-based Testing paragraph)."},{"text":"Black box testing techniques can be performed without adjustment even though the required behavior of the test object has changed.","correct":false,"why":"FALSE – the opposite is true: since black box testing procedures are based on an analysis of the specified behavior, the test cases must be adjusted as soon as the specified behavior changes (see [CTFL 4.0], section 4.1, section Black Box Testing)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-20","source":"GTB Sample Exam F, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"A fitness app measures the number of steps taken daily and provides feedback to motivate the user to stay fit.\nThe feedback for different step counts should be as follows:\n• Up to and including 1000: Couch Potato!\n• Over 1000, up to and including 2000: Get moving!\n• Over 2000, up to and including 4000: On the right track!\n• Over 4000, up to and including 6000: Well done!\n• Over 6000: Super!\nWhich of the following groups of test input values would provide the HIGHEST coverage of equivalence classes?","stemAfter":null,"table":null,"options":[{"text":"0, 1000, 2000, 3000, 4000","correct":false,"why":"0 (1), 1000 (1), 2000 (2), 3000 (3), 4000 (3) – 3 classes (out of 5) = 60% coverage."},{"text":"1000, 2001, 4000, 4001, 6000","correct":false,"why":"1000 (1), 2001 (3), 4000 (3), 4001 (4), 6000 (4) – 3 classes (out of 5) = 60% coverage."},{"text":"123, 2345, 3456, 4567, 5678","correct":false,"why":"123 (1), 2345 (3), 3456 (3), 4567 (4), 5678 (4) – 3 classes (out of 5) = 60% coverage."},{"text":"666, 999, 2222, 5555, 6666","correct":true,"why":"666 (1), 999 (1), 2222 (3), 5555 (4), 6666 (5) – 4 classes (out of 5) = 80% coverage. Therefore, this option is CORRECT."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The following five valid equivalence partitions can be formed (see [CTFL 4.0], Section 4.2.1):\n1) 0 - 1000 - Couch Potato!\n2) 1001 - 2000 - Get moving!\n3) 2001 - 4000 - On the right track!\n4) 4001 - 6000 - Well done!\n5) 6000 - MaxInt - Super!\nTherefore, the groups of test input values cover the following classes:"},{"id":"GTB-F-26","source":"GTB Sample Exam F, Q26","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"What is the purpose of a test charter in session-based exploratory testing?","stemAfter":null,"table":null,"options":[{"text":"The test charter specifies the test objectives for the test session.","correct":true,"why":"CORRECT – as this is the purpose of a test charter described in the syllabus text (see [CTFL 4.0], section 4.4.2, 2nd paragraph, 3rd sentence). The test charter defines the test objectives for the test session. A test charter is a statement of test objectives and possible test ideas on how to test."},{"text":"The test charter documents the steps taken and the findings made.","correct":false,"why":"FALSE – The test session sheets document the steps taken and the findings made (see [CTFL 4.0], section 4.4.2, 2nd paragraph, last sentence)."},{"text":"The test charter is often formulated in the form of questions.","correct":false,"why":"FALSE – While questions can be part of a test charter (e.g. to clarify certain aspects), this is not absolutely necessary. The main function of the test charter is to define the objectives and scope of the test session, whether this is done in the form of questions or not. (see [CTFL 4.0], Section 4.4.3"},{"text":"The test charter evaluates the test results after the test session.","correct":false,"why":"FALSE – The test results are discussed in the debriefing, but not evaluated by the test charter (see [CTFL 4.0], section 4.4.2, 2nd paragraph, 4th sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-27","source":"GTB Sample Exam F, Q27","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"Which of the following statements is MOST LIKELY an advantage of checklist-based testing?","stemAfter":null,"table":null,"options":[{"text":"It enables high repeatability of the tests.","correct":false,"why":"FALSE – since the testers can choose different ways to work through the test conditions of the checklists, an identical repetition is unlikely and therefore this is not an advantage of checklist-based testing (see [CTFL 4.0], section 4.4.3, 4th paragraph, last sentence)."},{"text":"It provides a structured approach to testing without requiring detailed test cases.","correct":false,"why":"FALSE – checklist-based testing does not require detailed test cases but is often formulated in the form of questions based on experience and knowledge etc. (see [CTFL 4.0], section 4.4.3, 1st paragraph, 2nd sentence & 2nd paragraph, 1st sentence)."},{"text":"It covers all requirements for the test object.","correct":false,"why":"FALSE – because checklist-based testing does not cover all requirements, but only those contained in the checklist. The checklist may be incomplete or outdated (see [CTFL 4.0], section 4.4.3, 2nd paragraph, 1st & 2nd sentence)."},{"text":"It supports functional and non-functional testing.","correct":true,"why":"CORRECT – Checklists can support different types of tests including non-functional tests (see [CTFL 4.0], section 4.4.3, 2nd paragraph, 3rd sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"LQ-1-1","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which statement best describes \"validation\"?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Checking the software matches its written specification","correct":false,"why":"Is not correct. That is verification: \"are we building the product right?\""},{"text":"Checking the software meets the actual needs of the user","correct":true,"why":"Is correct. Validation asks \"are we building the right product?\", i.e. does it meet user needs for the intended use."},{"text":"Running the software as fast as possible","correct":false,"why":"Is not correct. Speed of execution has nothing to do with validation."},{"text":"Finding every possible defect in the code","correct":false,"why":"Is not correct. Exhaustive defect finding is impossible (principle 2) and is not the definition of validation."}]},{"id":"LQ-1-2","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.2.3","k":"K2","stem":"A developer misreads a discount rule and writes the wrong formula in the code. What is this an example of?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"A failure","correct":false,"why":"Is not correct. A failure is the wrong behaviour seen when the code runs (the customer is overcharged)."},{"text":"A defect","correct":false,"why":"Is not correct. The wrong formula in the code is the defect; misreading the rule is the human action that caused it."},{"text":"An error","correct":true,"why":"Is correct. Misreading the rule is a human mistake, i.e. an error, which then produces a defect."},{"text":"A risk","correct":false,"why":"Is not correct. A risk is a possible future negative outcome, not a mistake that has happened."}]},{"id":"LQ-1-3","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"A regression suite keeps passing every release but stops catching new bugs. Which principle explains this?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Exhaustive testing is impossible","correct":false,"why":"Is not correct. This principle is about not being able to test every input and path."},{"text":"Defect clustering","correct":false,"why":"Is not correct. Defect clustering says a few modules contain most defects."},{"text":"Tests wear out","correct":true,"why":"Is correct. Repeating the same tests stops finding new defects, so tests must be reviewed and varied (pesticide paradox)."},{"text":"Absence-of-defects fallacy","correct":false,"why":"Is not correct. This fallacy is about bug-free software that still misses user needs."}]},{"id":"LQ-1-4","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which test process activity answers the question \"What to test?\"","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Test planning","correct":false,"why":"Is not correct. Planning defines objectives, scope and approach."},{"text":"Test analysis","correct":true,"why":"Is correct. Test analysis analyses the test basis and identifies test conditions: what to test."},{"text":"Test design","correct":false,"why":"Is not correct. Test design answers \"how to test?\" (test cases and data)."},{"text":"Test implementation","correct":false,"why":"Is not correct. Test implementation answers \"do we have everything?\" (procedures, suites, environment)."}]},{"id":"LQ-1-5","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"A test suite is assembled and the environment is confirmed ready, but tests have not run yet. Which activity is this?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Test design","correct":false,"why":"Is not correct. Design produces test cases and test data, not suites and a ready environment."},{"text":"Test execution","correct":false,"why":"Is not correct. Nothing has been run yet, so it is not execution."},{"text":"Test implementation","correct":true,"why":"Is correct. Implementation creates suites and procedures and checks the environment is ready."},{"text":"Test completion","correct":false,"why":"Is not correct. Completion happens after testing finishes (archiving, lessons learned)."}]},{"id":"LQ-1-6","source":"Lecture slides quiz, Chapter 1","chapter":1,"lo":"FL-1.5.3","k":"K2","stem":"Why can it help to have testers who are independent of the developers?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"They work faster than developers","correct":false,"why":"Is not correct. Independence is not about speed."},{"text":"They avoid the author's own assumptions and biases","correct":true,"why":"Is correct. Independent testers bring different perspectives and are not subject to the author's confirmation bias."},{"text":"They do not need to understand the requirements","correct":false,"why":"Is not correct. Testers must understand the requirements."},{"text":"They can skip writing test reports","correct":false,"why":"Is not correct. Reporting is still required."}]},{"id":"LQ-2-1","source":"Lecture slides quiz, Chapter 2","chapter":2,"lo":"FL-2.1.1","k":"K2","stem":"In the V-model, which stage is the primary test basis for system testing?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Detailed design only","correct":false,"why":"Is not correct. Detailed design (with code) is the basis for component testing; with high-level design, for integration testing."},{"text":"Requirements and high-level design","correct":true,"why":"Is correct. System testing faces the requirement specification and high-level design."},{"text":"Code only","correct":false,"why":"Is not correct. Code is the basis for component testing."},{"text":"Business contracts","correct":false,"why":"Is not correct. Contracts are a basis for contractual acceptance testing."}]},{"id":"LQ-2-2","source":"Lecture slides quiz, Chapter 2","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which practice expresses desired behaviour as Given/When/Then test cases in natural language?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Test-Driven Development (TDD)","correct":false,"why":"Is not correct. TDD uses failing unit tests written in code before the code."},{"text":"Behaviour-Driven Development (BDD)","correct":true,"why":"Is correct. BDD writes behaviour as Given/When/Then so business stakeholders can read and agree it."},{"text":"Acceptance Test-Driven Development (ATDD)","correct":false,"why":"Is not correct. ATDD derives tests from acceptance criteria; it may use this format, but Given/When/Then is the hallmark of BDD."},{"text":"Continuous Integration (CI)","correct":false,"why":"Is not correct. CI is a build and integration practice, not a specification style."}]},{"id":"LQ-2-3","source":"Lecture slides quiz, Chapter 2","chapter":2,"lo":"FL-2.2.1","k":"K2","stem":"Which test level focuses on the interfaces and interactions between integrated components?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Component testing","correct":false,"why":"Is not correct. Component testing tests components in isolation."},{"text":"Component integration testing","correct":true,"why":"Is correct. Component integration testing tests interfaces and interactions between components."},{"text":"System testing","correct":false,"why":"Is not correct. System testing looks at end-to-end behaviour of the whole system."},{"text":"Acceptance testing","correct":false,"why":"Is not correct. Acceptance testing checks readiness and business needs."}]},{"id":"LQ-2-4","source":"Lecture slides quiz, Chapter 2","chapter":2,"lo":"FL-2.2.3","k":"K2","stem":"A tester re-runs a previously failed test case to confirm the defect is gone. What is this an example of?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Regression testing","correct":false,"why":"Is not correct. Regression testing checks that changes have not broken other, unchanged areas."},{"text":"White-box testing","correct":false,"why":"Is not correct. White-box testing is based on internal structure."},{"text":"Confirmation testing","correct":true,"why":"Is correct. Confirmation testing re-runs the failed test to check the fix: \"is the bug really gone?\""},{"text":"Acceptance testing","correct":false,"why":"Is not correct. Acceptance testing checks readiness for deployment."}]},{"id":"LQ-2-5","source":"Lecture slides quiz, Chapter 2","chapter":2,"lo":"FL-2.3.1","k":"K2","stem":"A company moves its application from an old server OS to a new one. Which maintenance trigger is this?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Modification","correct":false,"why":"Is not correct. Modification covers enhancements, fixes and patches."},{"text":"Migration","correct":true,"why":"Is correct. Moving to a new platform, OS, hardware or database version is migration."},{"text":"Retirement","correct":false,"why":"Is not correct. Retirement is the end of life of a system."},{"text":"Regression","correct":false,"why":"Is not correct. Regression is a type of testing, not a trigger."}]},{"id":"LQ-3-1","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Which statement best describes the difference between static and dynamic testing?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Static testing finds failures; dynamic testing finds defects","correct":false,"why":"Is not correct. It is the other way round."},{"text":"Static testing finds defects directly without executing the test object; dynamic testing finds failures by executing it","correct":true,"why":"Is correct. Static testing examines work products without executing them, so it finds defects directly; dynamic testing finds failures caused by defects."},{"text":"Static testing applies only to source code","correct":false,"why":"Is not correct. Static testing applies to almost any work product, including requirements."},{"text":"Dynamic testing can be done without any software","correct":false,"why":"Is not correct. Dynamic testing needs executable software."}]},{"id":"LQ-3-2","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.1.2","k":"K2","stem":"Which defect is typically easier and cheaper to find with static testing than with dynamic testing?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Slow response time under heavy load","correct":false,"why":"Is not correct. Load behaviour needs dynamic (performance) testing."},{"text":"An ambiguity in a requirement","correct":true,"why":"Is correct. Requirement ambiguities, omissions and contradictions are found directly by reviewing the document."},{"text":"A memory leak that appears at runtime","correct":false,"why":"Is not correct. Memory leaks show up at runtime."},{"text":"A wrong result for one rare input combination","correct":false,"why":"Is not correct. Wrong results for specific inputs are found by executing the software."}]},{"id":"LQ-3-3","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"In which review process activity are the entry and exit criteria for a formal review defined?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Planning","correct":true,"why":"Is correct. Planning defines scope, objectives and, for formal reviews, the entry and exit criteria."},{"text":"Review initiation","correct":false,"why":"Is not correct. Initiation distributes material and explains roles."},{"text":"Individual review","correct":false,"why":"Is not correct. Individual review is where reviewers find anomalies."},{"text":"Fixing and reporting","correct":false,"why":"Is not correct. Exit criteria are checked here, but defined during planning."}]},{"id":"LQ-3-4","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.2.3","k":"K1","stem":"Which role mediates between different points of view and is often the person the success of a review depends on?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Manager","correct":false,"why":"Is not correct. The manager decides what is reviewed and provides resources."},{"text":"Author","correct":false,"why":"Is not correct. The author creates and fixes the work product."},{"text":"Moderator (facilitator)","correct":true,"why":"Is correct. The moderator ensures meetings run effectively and mediates between views."},{"text":"Scribe","correct":false,"why":"Is not correct. The scribe records defects and decisions."}]},{"id":"LQ-3-5","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.2.4","k":"K2","stem":"Which review type uses entry and exit criteria and is led by a trained facilitator (not the author)?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Informal review","correct":false,"why":"Is not correct. Informal reviews have no defined process."},{"text":"Walkthrough","correct":false,"why":"Is not correct. Walkthroughs are typically led by the author."},{"text":"Technical review","correct":false,"why":"Is not correct. Technical reviews are led by a trained facilitator but do not have the formal entry/exit criteria and metrics of an inspection."},{"text":"Inspection","correct":true,"why":"Is correct. Inspection is the most formal type: defined process, mandatory roles, entry and exit criteria, metrics."}]},{"id":"LQ-3-6","source":"Lecture slides quiz, Chapter 3","chapter":3,"lo":"FL-3.2.5","k":"K1","stem":"Which is a people-related success factor for reviews?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Review outcomes are used to evaluate each participant","correct":false,"why":"Is not correct. Outcomes must not be used to evaluate people."},{"text":"Reviews are held in an atmosphere of trust","correct":true,"why":"Is correct. An atmosphere of trust is essential."},{"text":"Large documents are reviewed in one single session","correct":false,"why":"Is not correct. Large documents should be reviewed in small chunks."},{"text":"Only developers take part in reviews","correct":false,"why":"Is not correct. The right mix of people, including testers, should take part."}]},{"id":"LQ-4-1","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"Which category derives test cases from the specified behaviour, without reference to internal structure?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"White-box","correct":false,"why":"Is not correct. White-box uses internal structure."},{"text":"Black-box","correct":true,"why":"Is correct. Black-box (specification-based) techniques use specified behaviour only."},{"text":"Experience-based","correct":false,"why":"Is not correct. Experience-based uses the tester's knowledge."},{"text":"Static analysis","correct":false,"why":"Is not correct. Static analysis is a static testing approach, not a test technique category."}]},{"id":"LQ-4-2","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"Which statement about white-box techniques is correct?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Test cases can be created before any design exists","correct":false,"why":"Is not correct. Without a design or code there is no structure to derive from."},{"text":"Test cases depend on how the software is designed","correct":true,"why":"Is correct. They derive from internal structure, so they can only be created after design or implementation."},{"text":"They cannot measure coverage","correct":false,"why":"Is not correct. Code coverage is measured objectively, usually with tools."},{"text":"They are the same as exploratory testing","correct":false,"why":"Is not correct. Exploratory testing is experience-based."}]},{"id":"LQ-4-3","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which question does test analysis answer?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"How to test?","correct":false,"why":"Is not correct. That is test design."},{"text":"What to test?","correct":true,"why":"Is correct. Test analysis identifies test conditions: what to test."},{"text":"Who will test?","correct":false,"why":"Is not correct. Staffing is a planning concern."},{"text":"When to stop testing?","correct":false,"why":"Is not correct. Exit criteria are set in planning."}]},{"id":"LQ-4-4","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"A technique has 20 coverage items. The tests exercise 15 of them. What is the coverage?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"15%","correct":false,"why":"Is not correct. 15 is the number of items, not a percentage."},{"text":"65%","correct":false,"why":"Is not correct. Miscalculated."},{"text":"75%","correct":true,"why":"Is correct. Coverage = 15 ÷ 20 × 100% = 75%."},{"text":"85%","correct":false,"why":"Is not correct. Miscalculated."}]},{"id":"LQ-4-5","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":4,"lo":"Course ext.","k":"K3","stem":"Technical risk is 3 and business risk is 4 (1 = very high, 5 = very low). Which extent of testing applies? (Extensive 1–5, Broad 6–10, Cursory 11–15, Opportunity 16–20)","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Extensive (1 to 5)","correct":false,"why":"Is not correct. RPN is 12, not 1–5."},{"text":"Broad (6 to 10)","correct":false,"why":"Is not correct. RPN is 12, not 6–10."},{"text":"Cursory (11 to 15)","correct":true,"why":"Is correct. RPN = 3 × 4 = 12, which falls in Cursory."},{"text":"Opportunity (16 to 20)","correct":false,"why":"Is not correct. RPN is 12, not 16–20."}]},{"id":"LQ-4-6","source":"Lecture slides quiz, Chapter 4 Part 1","chapter":4,"lo":"FL-4.4.1","k":"K2","stem":"How should experience-based techniques be used alongside other techniques?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"As a replacement for black-box techniques","correct":false,"why":"Is not correct. They should not replace systematic techniques."},{"text":"Only when no tester is available","correct":false,"why":"Is not correct. They depend on skilled testers."},{"text":"To complement black-box and white-box techniques","correct":true,"why":"Is correct. They find defects others miss, so they complement systematic techniques."},{"text":"They should never be combined","correct":false,"why":"Is not correct. Combining techniques is recommended."}]},{"id":"LQ-4-7","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"A field accepts integers from 1 to 100. How many tests are needed for 100% equivalence partitioning coverage?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"1","correct":false,"why":"Is not correct. One test covers only the valid partition."},{"text":"2","correct":false,"why":"Is not correct. Two tests miss one invalid partition."},{"text":"3","correct":true,"why":"Is correct. Three partitions: below 1, 1–100, above 100."},{"text":"4","correct":false,"why":"Is not correct. Three is the minimum."}]},{"id":"LQ-4-8","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A field accepts values 10 to 21. Which set is the 3-value BVA test data?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"10, 21","correct":false,"why":"Is not correct. Only the boundary values."},{"text":"9, 10, 21, 22","correct":false,"why":"Is not correct. That is 2-value BVA."},{"text":"9, 10, 11, 20, 21, 22","correct":true,"why":"Is correct. Each boundary plus both neighbours."},{"text":"10, 11, 20, 21","correct":false,"why":"Is not correct. Missing the invalid neighbours 9 and 22."}]},{"id":"LQ-4-9","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A password must be 6 to 10 characters long. Which lengths does 2-value BVA use?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"5, 6, 10, 11","correct":true,"why":"Is correct. Each boundary plus its closest neighbour in the adjacent partition."},{"text":"6, 7, 9, 10","correct":false,"why":"Is not correct. These are inside the valid partition only."},{"text":"5, 6, 7, 9, 10, 11","correct":false,"why":"Is not correct. That is 3-value BVA."},{"text":"1, 6, 10, 20","correct":false,"why":"Is not correct. 1 and 20 are not neighbours of the boundaries."}]},{"id":"LQ-4-10","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"A decision table has 3 Boolean conditions and no infeasible combinations. How many columns does the full table have?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"3","correct":false,"why":"Is not correct. One per condition is wrong."},{"text":"6","correct":false,"why":"Is not correct. 2 × 3 is wrong."},{"text":"8","correct":true,"why":"Is correct. 2³ = 8 columns."},{"text":"9","correct":false,"why":"Is not correct. 3² is wrong."}]},{"id":"LQ-4-11","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.4","k":"K2","stem":"Which coverage criterion requires attempting invalid transitions as well as exercising valid ones?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"All states","correct":false,"why":"Is not correct. Only visits every state."},{"text":"Valid transitions (0-switch)","correct":false,"why":"Is not correct. Only exercises valid transitions."},{"text":"All transitions","correct":true,"why":"Is correct. All transitions = every valid transition exercised and every invalid one attempted."},{"text":"Statement coverage","correct":false,"why":"Is not correct. A white-box criterion."}]},{"id":"LQ-4-12","source":"Lecture slides quiz, Chapter 4 Part 2","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"Parameters have 3, 4 and 2 partitions. What is the minimum number of tests for each choice coverage?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"2","correct":false,"why":"Is not correct. Too few to cover the 4 partitions of the second parameter."},{"text":"4","correct":true,"why":"Is correct. Each choice = the size of the largest set = 4."},{"text":"9","correct":false,"why":"Is not correct. That is the sum 3 + 4 + 2."},{"text":"24","correct":false,"why":"Is not correct. That is all combinations (3 × 4 × 2)."}]},{"id":"LQ-4-13","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"A function has 10 executable statements and the tests execute 8 of them. What is the statement coverage?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"8%","correct":false,"why":"Is not correct. Miscalculated."},{"text":"20%","correct":false,"why":"Is not correct. That is the uncovered part."},{"text":"80%","correct":true,"why":"Is correct. 8 ÷ 10 × 100% = 80%."},{"text":"100%","correct":false,"why":"Is not correct. Two statements were not executed."}]},{"id":"LQ-4-14","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.3.2","k":"K2","stem":"Which statement about branch and statement coverage is correct?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"100% statement coverage guarantees 100% branch coverage","correct":false,"why":"Is not correct. An IF without ELSE can reach 100% statements while missing the False branch."},{"text":"100% branch coverage guarantees 100% statement coverage","correct":true,"why":"Is correct. Branch coverage subsumes statement coverage."},{"text":"They are always equal","correct":false,"why":"Is not correct. They often differ."},{"text":"Neither implies the other","correct":false,"why":"Is not correct. Branch implies statement."}]},{"id":"LQ-4-15","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"In session-based exploratory testing, what guides the tester during a time-boxed session?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"A detailed test procedure","correct":false,"why":"Is not correct. Detailed procedures belong to scripted testing."},{"text":"A test charter with test objectives","correct":true,"why":"Is correct. The charter sets the objectives of the session."},{"text":"The code coverage report","correct":false,"why":"Is not correct. Coverage reports are a white-box tool."},{"text":"The test summary report","correct":false,"why":"Is not correct. Summary reports come at completion."}]},{"id":"LQ-4-16","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"Which item should NOT be included in a checklist for checklist-based testing?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"\"Is the password masked while typing?\"","correct":false,"why":"Is not correct. A good checklist item."},{"text":"An item that a tool can check automatically","correct":true,"why":"Is correct. Items that can be checked automatically should be left to tools."},{"text":"\"Does the error message avoid revealing user names?\"","correct":false,"why":"Is not correct. A good checklist item."},{"text":"\"Can the form be used with the keyboard only?\"","correct":false,"why":"Is not correct. A good checklist item."}]},{"id":"LQ-4-17","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"Which format of acceptance criteria uses Given / When / Then?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"Rule-oriented","correct":false,"why":"Is not correct. Rule-oriented uses bullet lists or input-output tables."},{"text":"Scenario-oriented","correct":true,"why":"Is correct. Scenario-oriented criteria use Given/When/Then, as in BDD."},{"text":"Tabulated input-output mapping","correct":false,"why":"Is not correct. A rule-oriented form."},{"text":"Bullet-point verification list","correct":false,"why":"Is not correct. A rule-oriented form."}]},{"id":"LQ-4-18","source":"Lecture slides quiz, Chapter 4 Part 3","chapter":4,"lo":"FL-4.5.3","k":"K2","stem":"In acceptance test-driven development, when are the test cases created?","stemAfter":null,"table":null,"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"","options":[{"text":"After the story has been implemented","correct":false,"why":"Is not correct. ATDD is test-first."},{"text":"Only by the testers, alone","correct":false,"why":"Is not correct. They are created collaboratively by customers, developers and testers."},{"text":"Only after system testing","correct":false,"why":"Is not correct. Too late for test-first."},{"text":"Before the story is implemented","correct":true,"why":"Is correct. ATDD creates test cases before implementation."}]}]</script>
<script type="application/json" id="sdata">{"questions":[{"id":"S1-process","lo":"FL-1.4.1","k":"K2","topic":"process","title":"The test process","scenario":"You have joined a team that is building a mobile food-ordering app. Your test manager asks you to explain the test process that the team will follow.","parts":[{"label":"(a)","q":"List the seven groups of test activities in the test process, in their logical order.","marks":8,"points":[{"t":"Test planning","k":[["planning","plan the test","test plan"]],"m":1},{"t":"Test monitoring and test control","k":[["monitor","control"]],"m":1},{"t":"Test analysis","k":[["analy"]],"m":1},{"t":"Test design","k":[["design"]],"m":1},{"t":"Test implementation","k":[["implement"]],"m":1},{"t":"Test execution","k":[["execut","run the test","running test"]],"m":1},{"t":"Test completion","k":[["complet","closure"]],"m":1},{"t":"Correct order: planning → analysis → design → implementation → execution → completion (monitoring and control runs alongside the others)","order":[["planning","plan the test","test plan"],["analy"],["design"],["implement"],["execut","run the test","running test"],["complet","closure"]],"m":1}]},{"label":"(b)","q":"In practice the activities do not always run strictly in this sequence. Briefly explain why.","marks":2,"points":[{"t":"Activities are often carried out iteratively and/or in parallel","k":[["iterat","parallel","overlap","concurrent","repeat"]],"m":1},{"t":"The test process is tailored to the context (project, development approach); test planning decides which activities are included and when","k":[["context","tailor","project","development approach","sdlc","agile","depend"]],"m":1}]}],"ch":1},{"id":"S2-testware","lo":"FL-1.4.3","k":"K2","topic":"process","title":"Testware produced by each activity","scenario":"Testware is the set of work products created by the test activities.","parts":[{"label":"(a)","q":"Name TWO testware items produced by test planning.","marks":2,"points":[{"t":"Test plan","k":[["test plan"]],"m":1},{"t":"Test schedule","k":[["schedule","timeline"]],"m":1},{"t":"Entry and exit criteria","k":[["entry","exit"]],"m":1},{"t":"Risk register (list of risks with likelihood, impact, mitigation)","k":[["risk"]],"m":1}]},{"label":"(b)","q":"Name TWO testware items produced by test analysis.","marks":2,"points":[{"t":"(Prioritised) test conditions","k":[["test condition"]],"m":1},{"t":"Acceptance criteria (as test conditions)","k":[["acceptance criteri"]],"m":1},{"t":"Defect reports on defects in the test basis","k":[["defect","bug","issue"],["report","basis","requirement"]],"m":1}]},{"label":"(c)","q":"Name TWO testware items produced by test design.","marks":2,"points":[{"t":"(Prioritised) test cases","k":[["test case"]],"m":1},{"t":"Test charters","k":[["charter"]],"m":1},{"t":"Coverage items","k":[["coverage"]],"m":1},{"t":"Test data requirements","k":[["test data","data requirement"]],"m":1},{"t":"Test environment requirements / design","k":[["environment"],["requirement","design"]],"m":1}]},{"label":"(d)","q":"Name TWO testware items produced by test implementation.","marks":2,"points":[{"t":"Test procedures","k":[["test procedure","procedure"]],"m":1},{"t":"Manual or automated test scripts","k":[["script"]],"m":1},{"t":"Test suites","k":[["suite"]],"m":1},{"t":"Test data","k":[["test data"]],"m":1},{"t":"Test execution schedule / plan","k":[["execution schedule","execution plan","schedule"]],"m":1},{"t":"Test environment items, e.g. stubs, drivers, simulators, service virtualizations","k":[["stub","driver","simulator","virtuali","environment"]],"m":1}]},{"label":"(e)","q":"Name TWO testware items produced by test execution.","marks":2,"points":[{"t":"Test logs (results: passed, failed, blocked)","k":[["log","test result","results"]],"m":1},{"t":"Defect reports","k":[["defect report","bug report","incident report","failure report","report defect","report"]],"m":1}]}],"ch":1},{"id":"S3-which-activity","lo":"FL-1.4.3","k":"K2","topic":"process","title":"Which activity produces it?","scenario":"For each work product below, state the test activity that produces it.","parts":[{"label":"(a)","q":"Test charters","marks":1,"points":[{"t":"Test design","k":[["design"]],"m":1}]},{"label":"(b)","q":"Test logs","marks":1,"points":[{"t":"Test execution","k":[["execut","run the test","running test"]],"m":1}]},{"label":"(c)","q":"Test execution schedule, test suites and test scripts","marks":1,"points":[{"t":"Test implementation","k":[["implement"]],"m":1}]},{"label":"(d)","q":"Test progress reports and documented control directives","marks":1,"points":[{"t":"Test monitoring and test control","k":[["monitor","control"]],"m":1}]},{"label":"(e)","q":"Prioritised test conditions and defect reports on the test basis","marks":1,"points":[{"t":"Test analysis","k":[["analy"]],"m":1}]},{"label":"(f)","q":"Change requests or product backlog items for unresolved defects, and lessons learned","marks":1,"points":[{"t":"Test completion","k":[["complet","closure"]],"m":1}]},{"label":"(g)","q":"Entry and exit criteria, and the risk register","marks":1,"points":[{"t":"Test planning","k":[["planning","plan the test","test plan"]],"m":1}]}],"ch":1},{"id":"S4-analysis-design","lo":"FL-1.4.1","k":"K2","topic":"process","title":"Test analysis versus test design","scenario":"The requirements for the payment feature of an online shop have just been approved.","parts":[{"label":"(a)","q":"What question does test analysis answer? Describe its main tasks.","marks":4,"points":[{"t":"Answers “WHAT should be tested?”","k":[["what"]],"m":1},{"t":"Analyse the test basis (e.g. requirements, user stories, specifications) to identify testable features","k":[["test basis","requirement","specification","user stor","testable","feature"]],"m":1},{"t":"Define and prioritise test conditions","k":[["test condition"]],"m":1},{"t":"Evaluate the test basis/test object for testability and find defects in it (and identify risks)","k":[["defect","testabil","risk"]],"m":1}]},{"label":"(b)","q":"What question does test design answer? Describe its main tasks.","marks":4,"points":[{"t":"Answers “HOW should it be tested?”","k":[["how"]],"m":1},{"t":"Elaborate test conditions into test cases (and other testware, e.g. test charters)","k":[["test case","charter"]],"m":1},{"t":"Use test techniques to identify coverage items that guide the test case inputs","k":[["technique","coverage"]],"m":1},{"t":"Define test data requirements, design the test environment and identify infrastructure and tools","k":[["test data","environment","infrastructure","tool"]],"m":1}]}],"ch":1},{"id":"S5-impl-exec","lo":"FL-1.4.1","k":"K2","topic":"process","title":"Test implementation and test execution","scenario":"Your team has finished designing the test cases for the next release.","parts":[{"label":"(a)","q":"Describe THREE tasks carried out during test implementation.","marks":3,"points":[{"t":"Create or acquire testware needed to run the tests, e.g. test data","k":[["test data","acquire","create testware"]],"m":1},{"t":"Organise test cases into test procedures and group them into test suites","k":[["procedure","suite"]],"m":1},{"t":"Create manual or automated test scripts","k":[["script","automat"]],"m":1},{"t":"Prioritise test procedures and arrange them in a test execution schedule","k":[["schedule","execution plan","priorit"]],"m":1},{"t":"Build/set up the test environment and verify it is set up correctly","k":[["environment"]],"m":1}]},{"label":"(b)","q":"Describe THREE tasks carried out during test execution.","marks":3,"points":[{"t":"Run the tests (manually or automatically) according to the test execution schedule","k":[["run","execut"]],"m":1},{"t":"Compare actual results with expected results","k":[["actual","expected","compar"]],"m":1},{"t":"Analyse anomalies/deviations to find their likely causes","k":[["anomal","deviation","analy","investigat","cause"]],"m":1},{"t":"Report defects based on the observed failures","k":[["defect report","report defect","report the defect","report bug","bug report","report failure","report"]],"m":1},{"t":"Log/record the test results","k":[["log","record"]],"m":1}]}],"ch":1},{"id":"S6-completion","lo":"FL-1.4.1","k":"K2","topic":"process","title":"Test completion","scenario":"The final iteration of the project has ended and the system is about to be released.","parts":[{"label":"(a)","q":"When does test completion usually take place?","marks":1,"points":[{"t":"At a project milestone, e.g. end of an iteration, completion of a test level or a release","k":[["milestone","end of","release","iteration","test level","finish"]],"m":1}]},{"label":"(b)","q":"List FOUR tasks performed during test completion.","marks":4,"points":[{"t":"Create the test completion report and communicate it to stakeholders","k":[["completion report","summary report","report"]],"m":1},{"t":"Create change requests or product backlog items for unresolved defects","k":[["change request","backlog","unresolved","open defect","remaining defect"]],"m":1},{"t":"Identify useful testware and archive it or hand it over (e.g. to the maintenance team)","k":[["archiv","hand over","handover","hand it over","reuse","testware"]],"m":1},{"t":"Shut down / restore the test environment to an agreed state","k":[["environment"]],"m":1},{"t":"Analyse the test activities to identify lessons learned and improvements","k":[["lesson","improve","retrospective"]],"m":1}]}],"ch":1},{"id":"S7-mon-control","lo":"FL-1.4.1","k":"K2","topic":"process","title":"Test monitoring and test control","scenario":"Halfway through system testing, only 40% of the planned test cases have been executed and many critical defects are still open.","parts":[{"label":"(a)","q":"Explain the difference between test monitoring and test control.","marks":2,"points":[{"t":"Monitoring: ongoing checking of test activities and comparison of actual progress against the plan (using metrics/exit criteria)","k":[["monitor"],["progress","plan","metric","check","compar","track"]],"m":1},{"t":"Control: taking corrective actions (control directives) to still achieve the test objectives","k":[["control"],["corrective","action","adjust","change","directive","objective","decision"]],"m":1}]},{"label":"(b)","q":"Name TWO testware items produced by test monitoring and control.","marks":2,"points":[{"t":"Test progress reports","k":[["progress report","status report","report"]],"m":1},{"t":"Documentation of control directives (plan changes)","k":[["control directive","directive","plan change","control decision","decision"]],"m":1},{"t":"Risk information (updates to the risk register)","k":[["risk"]],"m":1}]},{"label":"(c)","q":"Suggest ONE test control action for the situation described.","marks":1,"points":[{"t":"E.g. re-prioritise tests, add resources/testers, change the schedule or scope, adjust exit criteria, focus on high-risk areas","k":[["priorit","resource","tester","schedule","scope","postpone","delay","overtime","risk","exit criteri","focus","reschedul","re-plan","replan"]],"m":1}]}],"ch":1},{"id":"S8-roles","lo":"FL-1.4.5","k":"K2","topic":"roles","title":"Roles in testing","scenario":"The CTFL syllabus describes two principal roles in testing.","parts":[{"label":"(a)","q":"Describe the test management role: what it is responsible for and which test activities it mainly focuses on.","marks":4,"points":[{"t":"Overall responsibility for the test process, the test team and leadership of the test activities","k":[["process","team","lead","manag","overall"]],"m":1},{"t":"Focuses on test planning","k":[["planning","plan the test","test plan"]],"m":1},{"t":"Focuses on test monitoring and test control","k":[["monitor","control"]],"m":1},{"t":"Focuses on test completion","k":[["complet","closure"]],"m":1}]},{"label":"(b)","q":"Describe the testing role: what it is responsible for and which test activities it mainly focuses on.","marks":4,"points":[{"t":"Overall responsibility for the engineering (technical/operational) aspect of testing","k":[["engineering","technical","operational","hands-on","hands on"]],"m":1},{"t":"Focuses on test analysis and test design","k":[["analy","design"]],"m":1},{"t":"Focuses on test implementation","k":[["implement"]],"m":1},{"t":"Focuses on test execution","k":[["execut","run the test","running test"]],"m":1}]}],"ch":1},{"id":"S9-roles-scenario","lo":"FL-1.4.5","k":"K2","topic":"roles","title":"Roles in an Agile team","scenario":"In a Scrum team, Aina (a business analyst) writes test cases for the new checkout feature, while the team lead tracks how many tests have passed and decides to move some tests to the next sprint.","parts":[{"label":"(a)","q":"Which role is Aina taking on, and which role is the team lead taking on? Justify briefly.","marks":2,"points":[{"t":"Aina: testing role (test design is a testing-role activity)","k":[["testing role","tester role","role of tester","role of testing","testing"]],"m":1},{"t":"Team lead: test management role (test monitoring and control)","k":[["management","manager"]],"m":1}]},{"label":"(b)","q":"Can the same person take on both roles? What decides which tasks each role gets?","marks":3,"points":[{"t":"Yes – one person can take on both roles (at the same time or at different times)","k":[["yes","both","same person"]],"m":1},{"t":"Roles can be taken by different people at different times (e.g. in Agile, the team shares test management tasks)","k":[["different","time","team","agile","temporar"]],"m":1},{"t":"Allocation depends on the context: project and product, the organisation and people's skills","k":[["context","project","product","organi","skill"]],"m":1}]}],"ch":1},{"id":"S10-traceability","lo":"FL-1.4.4","k":"K2","topic":"process","title":"Traceability","scenario":"Your project keeps a traceability matrix linking requirements to test cases, test results and defects.","parts":[{"label":"(a)","q":"Between which items should traceability be maintained?","marks":1,"points":[{"t":"Between elements of the test basis (e.g. requirements, risks) and the testware (test conditions, test cases, test results, defects)","k":[["test basis","requirement","risk"],["test case","test condition","test result","defect","testware"]],"m":1}]},{"label":"(b)","q":"Explain FOUR benefits of maintaining traceability.","marks":4,"points":[{"t":"Evaluate coverage (e.g. which requirements are covered by test cases)","k":[["coverage","covered"]],"m":1},{"t":"Impact analysis of changes (which tests are affected)","k":[["impact","affected","change"]],"m":1},{"t":"Make testing auditable / meet IT governance criteria","k":[["audit","governance","compliance","regulat"]],"m":1},{"t":"Make test progress and completion reports easier to understand (status of elements of the test basis)","k":[["report","status","progress"]],"m":1},{"t":"Communicate technical aspects of testing to stakeholders in an understandable way","k":[["stakeholder","communicat","understand"]],"m":1},{"t":"Assess product quality, process capability and project progress against objectives; assess residual risk","k":[["quality","residual risk","risk","objective"]],"m":1}]}],"ch":1},{"id":"S11-context","lo":"FL-1.4.2","k":"K2","topic":"process","title":"Testing in context","scenario":"Two teams in the same company test very differently: a bank's payment system team and a team building an internal lunch-booking app.","parts":[{"label":"(a)","q":"List FIVE contextual factors that influence the test process.","marks":5,"points":[{"t":"Stakeholders (needs, expectations, requirements, willingness to cooperate)","k":[["stakeholder"]],"m":1},{"t":"Team members (skills, knowledge, experience, availability, training needs)","k":[["team member","skill","knowledge","experience","people"]],"m":1},{"t":"Business domain (criticality, risks, market needs, legal regulations)","k":[["business","domain","critical","regulat","market","legal"]],"m":1},{"t":"Technical factors (type of software, architecture, technology)","k":[["technical","technolog","architecture","type of software"]],"m":1},{"t":"Project constraints (scope, time, budget, resources)","k":[["budget","time","scope","resource","constraint","deadline"]],"m":1},{"t":"Organisational factors (structure, policies, practices)","k":[["organi","polic","practice"]],"m":1},{"t":"Software development lifecycle (engineering practices, development methods)","k":[["sdlc","lifecycle","life cycle","development method","agile","waterfall"]],"m":1},{"t":"Tools (availability, usability, compliance)","k":[["tool"]],"m":1}]},{"label":"(b)","q":"Give TWO test-related aspects that these factors affect.","marks":2,"points":[{"t":"Test strategy / test techniques used","k":[["strategy","technique"]],"m":1},{"t":"Degree of test automation","k":[["automat"]],"m":1},{"t":"Required level of coverage","k":[["coverage"]],"m":1},{"t":"Level of detail of test documentation and reporting","k":[["documentation","report","detail"]],"m":1}]}],"ch":1},{"id":"S12-error-defect","lo":"FL-1.2.3","k":"K2","topic":"basics","title":"Error, defect, failure and root cause","scenario":"The requirement for a savings app did not say how interest is rounded. A developer assumed it should be rounded down and coded it that way. A customer later noticed that their balance was RM 0.01 lower than the bank statement.","parts":[{"label":"(a)","q":"Define the terms error, defect and failure.","marks":3,"points":[{"t":"Error (mistake): a human action that produces an incorrect result","k":[["error","mistake"],["human","person","people","developer","action"]],"m":1},{"t":"Defect (fault/bug): an imperfection or deficiency in a work product (e.g. code) where it does not meet its requirements","k":[["defect","fault","bug"],["code","work product","imperfection","flaw","deficien","program","software"]],"m":1},{"t":"Failure: an event in which the system does not perform as required; a visible deviation of the actual result from the expected result","k":[["failure"],["visible","expected","deviat","event","observ","behavio","does not perform","not meet"]],"m":1}]},{"label":"(b)","q":"Identify the root cause, the error, the defect and the failure in the scenario.","marks":4,"points":[{"t":"Root cause: the ambiguous/incomplete requirement (lack of information about rounding)","k":[["root cause"],["ambigu","unclear","incomplete","requirement","did not say","missing","lack"]],"m":1},{"t":"Error: the developer's wrong assumption that interest is rounded down","k":[["error"],["assum","developer","misunderst","mistake"]],"m":1},{"t":"Defect: the rounding-down logic in the code","k":[["defect"],["code","round","logic","formula","calculation"]],"m":1},{"t":"Failure: the customer sees a balance RM 0.01 lower than expected","k":[["failure"],["balance","customer","0.01","lower","wrong","incorrect"]],"m":1}]},{"label":"(c)","q":"Why is root cause analysis useful?","marks":1,"points":[{"t":"Removing root causes prevents similar defects in future (process improvement, e.g. requirement guidelines, training)","k":[["prevent","future","similar","reduce","improve","avoid","recur"]],"m":1}]}],"ch":1},{"id":"S13-debugging","lo":"FL-1.1.2","k":"K2","topic":"basics","title":"Testing and debugging","scenario":"A tester runs a test on the login page and it fails.","parts":[{"label":"(a)","q":"Explain the difference between testing and debugging.","marks":2,"points":[{"t":"Testing triggers failures (dynamic) or finds defects directly (static)","k":[["test"],["failure","find defect","finds defect","detect","trigger","reveal","show"]],"m":1},{"t":"Debugging finds, analyses and removes the causes of failures (defects)","k":[["debug"],["fix","remov","cause","analy","eliminat","correct","locat"]],"m":1}]},{"label":"(b)","q":"Describe the typical debugging steps after this failure, and the testing that follows the fix.","marks":4,"points":[{"t":"Reproduce the failure","k":[["reproduc"]],"m":1},{"t":"Diagnose: find the root cause / locate the defect","k":[["diagnos","root cause","locat","find the cause","identify the cause"]],"m":1},{"t":"Fix the cause","k":[["fix","correct","remov","repair"]],"m":1},{"t":"Confirmation testing to check the fix, plus regression testing to check for side effects","k":[["confirmation","retest","regression"]],"m":1}]}],"ch":1},{"id":"S14-objectives","lo":"FL-1.1.1","k":"K1","topic":"basics","title":"Test objectives","scenario":"","parts":[{"label":"(a)","q":"List FIVE typical objectives of testing.","marks":5,"points":[{"t":"Evaluate work products (requirements, user stories, design, code)","k":[["evaluat","work product","review"]],"m":1},{"t":"Trigger failures and find defects","k":[["failure","defect","bug"]],"m":1},{"t":"Ensure required coverage of the test object","k":[["coverage"]],"m":1},{"t":"Reduce the level of risk of inadequate software quality","k":[["risk"]],"m":1},{"t":"Verify whether specified requirements (incl. contractual, legal, regulatory) are fulfilled","k":[["verif","requirement","contract","legal","regulat","compliance"]],"m":1},{"t":"Validate that the test object works as users and other stakeholders expect","k":[["validat","user","stakeholder","expectation"]],"m":1},{"t":"Build confidence in the quality of the test object","k":[["confidence"]],"m":1},{"t":"Provide information to stakeholders to allow informed decisions","k":[["decision","inform"]],"m":1}]},{"label":"(b)","q":"Why can test objectives differ between projects?","marks":1,"points":[{"t":"They depend on the context: test level, work product, risks, SDLC, business context","k":[["context","level","risk","business","depend","sdlc","work product"]],"m":1}]}],"ch":1},{"id":"S15-qa","lo":"FL-1.2.2","k":"K1","topic":"basics","title":"Testing and quality assurance","scenario":"","parts":[{"label":"(a)","q":"Compare quality assurance (QA) with testing / quality control (QC).","marks":4,"points":[{"t":"QA is process-oriented","k":[["qa","quality assurance"],["process"]],"m":1},{"t":"QA is preventive: a good process leads to a good product","k":[["prevent","good process"]],"m":1},{"t":"Testing is a form of quality control: product-oriented","k":[["product"]],"m":1},{"t":"QC/testing is corrective: finds problems in the product so they can be fixed","k":[["correct","fix","detect","find"]],"m":1}]},{"label":"(b)","q":"How are test results used by QA and by QC?","marks":2,"points":[{"t":"QA: test results give feedback on how well the development and test processes perform","k":[["process"]],"m":1},{"t":"QC: test results are used to fix defects / judge product quality","k":[["fix","defect","product"]],"m":1}]}],"ch":1},{"id":"S16-principles","lo":"FL-1.3.1","k":"K2","topic":"basics","title":"The seven testing principles","scenario":"","parts":[{"label":"(a)","q":"List the seven testing principles.","marks":7,"points":[{"t":"1. Testing shows the presence, not the absence of defects","k":[["presence","absence of defects"]],"m":1},{"t":"2. Exhaustive testing is impossible","k":[["exhaustive","test everything","complete testing"]],"m":1},{"t":"3. Early testing saves time and money","k":[["early"]],"m":1},{"t":"4. Defects cluster together","k":[["cluster"]],"m":1},{"t":"5. Tests wear out","k":[["wear","pesticide"]],"m":1},{"t":"6. Testing is context dependent","k":[["context"]],"m":1},{"t":"7. Absence-of-defects fallacy","k":[["fallacy","absence-of-defects","absence of defect","no bugs","bug-free","bug free","usable"]],"m":1}]},{"label":"(b)","q":"Name the principle shown by this situation: the same regression tests have run unchanged for two years and no longer find new defects.","marks":1,"points":[{"t":"Tests wear out","k":[["wear","pesticide"]],"m":1}]},{"label":"(c)","q":"Name the principle shown by this situation: 80% of the defects were found in the payment module.","marks":1,"points":[{"t":"Defects cluster together","k":[["cluster"]],"m":1}]},{"label":"(d)","q":"Name the principle shown by this situation: the app passed all its tests, but users refused to use it.","marks":1,"points":[{"t":"Absence-of-defects fallacy","k":[["fallacy","absence","no bugs","bug free","bug-free"]],"m":1}]}],"ch":1},{"id":"S17-skills-team","lo":"FL-1.5.1","k":"K2","topic":"skills","title":"Skills and the whole-team approach","scenario":"","parts":[{"label":"(a)","q":"Give FOUR generic skills that are important for testers.","marks":4,"points":[{"t":"Testing knowledge (e.g. test techniques)","k":[["testing knowledge","knowledge of testing","test technique","technique"]],"m":1},{"t":"Thoroughness, carefulness, curiosity, attention to detail, being methodical","k":[["thorough","careful","curio","detail","methodical","systematic"]],"m":1},{"t":"Good communication, active listening, being a team player","k":[["communicat","listen","team"]],"m":1},{"t":"Analytical and critical thinking, creativity","k":[["analytic","critical","creativ"]],"m":1},{"t":"Technical knowledge (e.g. tools)","k":[["technical","tool"]],"m":1},{"t":"Domain knowledge (to understand and talk to users/business representatives)","k":[["domain","business knowledge"]],"m":1}]},{"label":"(b)","q":"Give TWO advantages of the whole-team approach.","marks":2,"points":[{"t":"Everyone is responsible for quality (shared responsibility)","k":[["everyone","responsib","shared","whole team"],["quality","responsib"]],"m":1},{"t":"Improves communication and collaboration (shared workspace)","k":[["communicat","collaborat","interaction","cooperat"]],"m":1},{"t":"Creates synergy: the team's different skill sets are used together","k":[["synerg","skill"]],"m":1}]}],"ch":1},{"id":"S18-independence","lo":"FL-1.5.3","k":"K2","topic":"skills","title":"Independence of testing","scenario":"Your company must decide who should test a new safety-critical module.","parts":[{"label":"(a)","q":"List the levels of test independence from lowest to highest.","marks":2,"points":[{"t":"Author (no independence) → peers from the same team (some) → testers outside the author's team but in the organisation (high) → testers outside the organisation (very high)","order":[["author","own","developer"],["peer","colleague","same team","team member"],["test team","independent test","tester","within the organi","inside the organi","outside the team"],["outside the organi","external","outsourc","third party","third-party"]],"m":2}]},{"label":"(b)","q":"Give TWO benefits of independent testing.","marks":2,"points":[{"t":"Independent testers find different kinds of failures/defects (different perspective, background, biases)","k":[["different","perspective","bias","background","fresh"]],"m":1},{"t":"They can verify, challenge or disprove assumptions made by stakeholders during specification and implementation","k":[["challenge","assumption","question","disprove","verify"]],"m":1}]},{"label":"(c)","q":"Give TWO drawbacks of independent testing.","marks":2,"points":[{"t":"Isolation from the development team: lack of collaboration, communication problems or an adversarial relationship","k":[["isolat","communicat","collaborat","adversar","conflict","relationship"]],"m":1},{"t":"Developers may lose a sense of responsibility for quality","k":[["responsib","quality awareness","lose"]],"m":1},{"t":"Testers may be seen as a bottleneck or blamed for delays","k":[["bottleneck","delay","blame"]],"m":1},{"t":"Testers may lack important information/knowledge about the test object","k":[["lack","knowledge","information","understand"]],"m":1}]}],"ch":1},{"id":"C2-sdlc","lo":"FL-2.1.1","k":"K2","topic":"sdlc","title":"SDLC models and testing","scenario":"Your company builds a hospital scheduling system with a V-model, and a food-delivery app with Scrum.","parts":[{"label":"(a)","q":"Name the three categories of software development lifecycle (SDLC) models.","marks":3,"points":[{"t":"Sequential development models (e.g. V-model, waterfall)","k":[["sequential","waterfall","v-model","v model"]],"m":1},{"t":"Iterative development models","k":[["iterativ","spiral"]],"m":1},{"t":"Incremental development models","k":[["increment"]],"m":1}]},{"label":"(b)","q":"List FOUR aspects of testing that are affected by the choice of SDLC model.","marks":4,"points":[{"t":"Scope and timing of test activities (e.g. test levels and test types)","k":[["scope","timing","test level","test type"]],"m":1},{"t":"Level of detail of test documentation","k":[["documentation"]],"m":1},{"t":"Choice of test techniques and test approach","k":[["technique","approach"]],"m":1},{"t":"Extent (scope) of test automation","k":[["automat"]],"m":1},{"t":"Role and tasks of a tester","k":[["role","task","tester"]],"m":1}]},{"label":"(c)","q":"How does testing differ in the iterative-incremental (Scrum) project compared with the sequential one?","marks":2,"points":[{"t":"Test levels overlap; each increment/feature is tested at several test levels in every iteration","k":[["overlap","each iteration","every iteration","per iteration","each increment","every increment","per increment","each sprint","every sprint","short cycle"]],"m":1},{"t":"Continuous integration and regression testing with a high degree of test automation","k":[["continuous","regression","automat","ci"]],"m":1}]}],"ch":2},{"id":"C2-good-practice","lo":"FL-2.1.2","k":"K1","topic":"sdlc","title":"Good testing practices in any SDLC","scenario":"","parts":[{"label":"(a)","q":"List FOUR good testing practices that apply whatever SDLC model is used.","marks":4,"points":[{"t":"For every development activity there is a corresponding test activity","k":[["every development activity","each development activity","corresponding test","development activity"]],"m":1},{"t":"Each test level has its own specific test objectives, avoiding gaps and redundancy","k":[["objective","gap","redundan","overlap"]],"m":1},{"t":"Test analysis and design start during the corresponding development phase (start testing early)","k":[["early","parallel","start test"]],"m":1},{"t":"Testers are involved early, e.g. in reviewing requirements, design documents and user stories","k":[["involve","review","tester"]],"m":1},{"t":"Adapt the SDLC model to the project and product characteristics","k":[["adapt","tailor","characteristic"]],"m":1}]}],"ch":2},{"id":"C2-test-first","lo":"FL-2.1.3","k":"K1","topic":"sdlc","title":"Test-first approaches","scenario":"Your team wants tests to drive development instead of being written after the code.","parts":[{"label":"(a)","q":"Name the THREE test-first approaches described in the syllabus.","marks":3,"points":[{"t":"Test-driven development (TDD)","k":[["tdd","test driven","test-driven"]],"m":1},{"t":"Acceptance test-driven development (ATDD)","k":[["atdd","acceptance test driven","acceptance test-driven"]],"m":1},{"t":"Behaviour-driven development (BDD)","k":[["bdd","behavio"]],"m":1}]},{"label":"(b)","q":"Describe the three steps of the TDD cycle, in order.","marks":3,"points":[{"t":"1. Write a test that fails (red)","k":[["fail","red"]],"m":1},{"t":"2. Write just enough code so the test passes (green)","k":[["pass","green"]],"m":1},{"t":"3. Refactor the code while all tests keep passing","k":[["refactor","blue","improve the code","clean"]],"m":1}]},{"label":"(c)","q":"How does ATDD derive its tests, and in what format are BDD test cases usually written?","marks":2,"points":[{"t":"ATDD: tests derived from the acceptance criteria (of user stories), in the stakeholders' domain language","k":[["acceptance criteri"]],"m":1},{"t":"BDD: simple natural language in the Given / When / Then format","k":[["given"],["when","then"]],"m":1}]}],"ch":2},{"id":"C2-devops","lo":"FL-2.1.4","k":"K2","topic":"sdlc","title":"DevOps and testing","scenario":"Your organisation is moving to DevOps with a CI/CD delivery pipeline.","parts":[{"label":"(a)","q":"What is DevOps?","marks":1,"points":[{"t":"An organisational approach that creates synergies between development (including testing) and operations; needs a cultural change","k":[["development","dev"],["operation","ops"]],"m":1}]},{"label":"(b)","q":"Give THREE benefits of DevOps for testing.","marks":3,"points":[{"t":"Fast feedback on code quality and on whether changes affect existing code","k":[["feedback"]],"m":1},{"t":"Promotes shift-left: developers deliver high-quality code with component tests and static analysis","k":[["shift","static analysis","component test","early"]],"m":1},{"t":"Automated processes such as CI/CD help to set up stable test environments","k":[["ci","cd","continuous","pipeline","environment"]],"m":1},{"t":"More attention to non-functional quality characteristics (e.g. performance, reliability)","k":[["non-functional","non functional","nonfunctional","performance","reliab"]],"m":1},{"t":"Automation in the pipeline reduces the need for repetitive manual testing","k":[["less manual","reduce","manual"]],"m":1},{"t":"Risk of regression is minimised by the scale and range of automated regression tests","k":[["regression"]],"m":1}]},{"label":"(c)","q":"Give TWO risks or challenges of DevOps for testing.","marks":2,"points":[{"t":"The DevOps delivery pipeline must be defined and established","k":[["pipeline","delivery chain","define","establish"]],"m":1},{"t":"CI/CD tools must be introduced and maintained","k":[["tool","maintain"]],"m":1},{"t":"Test automation needs additional resources and can be difficult to set up and maintain","k":[["resource","cost","difficult","effort","set up","setup"]],"m":1},{"t":"Manual testing, especially from the user's perspective, is still needed","k":[["manual","user"]],"m":1}]}],"ch":2},{"id":"C2-shift-left","lo":"FL-2.1.5","k":"K2","topic":"sdlc","title":"Shift-left","scenario":"Your test manager says: “From the next project, we shift left.”","parts":[{"label":"(a)","q":"What does shift-left mean?","marks":1,"points":[{"t":"Testing and QA are performed earlier in the SDLC (early testing), without neglecting testing later","k":[["earl","sooner","before"]],"m":1}]},{"label":"(b)","q":"List FOUR good practices for achieving shift-left.","marks":4,"points":[{"t":"Review the specification from a testing perspective","k":[["review"]],"m":1},{"t":"Write test cases before the code is written, and run the code in a test harness during implementation","k":[["before the code","before code","before writing","test first","test-first","tdd","harness","before"]],"m":1},{"t":"Use continuous integration / continuous delivery for fast feedback (automated component tests)","k":[["continuous","ci","cd","feedback"]],"m":1},{"t":"Complete static analysis of the source code before dynamic testing","k":[["static analys"]],"m":1},{"t":"Start non-functional testing at the component test level where possible","k":[["non-functional","non functional","nonfunctional","performance"]],"m":1}]},{"label":"(c)","q":"What is a trade-off of shift-left?","marks":1,"points":[{"t":"Extra effort/cost early in the process (e.g. training), expected to save cost later; stakeholders must buy in","k":[["cost","effort","training","stakeholder","time","invest"]],"m":1}]}],"ch":2},{"id":"C2-retro","lo":"FL-2.1.6","k":"K2","topic":"sdlc","title":"Retrospectives","scenario":"","parts":[{"label":"(a)","q":"When are retrospectives held, and who takes part?","marks":2,"points":[{"t":"At the end of a project, an iteration or a release milestone, or when needed","k":[["end","milestone","iteration","sprint","release","when needed","when required"]],"m":1},{"t":"Testers, developers, architects, product owner, business analysts","k":[["tester","developer","team","product owner","analyst","architect"]],"m":1}]},{"label":"(b)","q":"What questions are discussed in a retrospective?","marks":3,"points":[{"t":"What was successful and should be kept?","k":[["success","went well","keep","retain","good"]],"m":1},{"t":"What was not successful and could be improved?","k":[["not success","improv","went wrong","problem","bad"]],"m":1},{"t":"How can the improvements be incorporated and kept in future?","k":[["incorporat","implement","future","action"]],"m":1},{"t":"What risks and pitfalls are foreseeable?","k":[["risk","pitfall"]],"m":1}]},{"label":"(c)","q":"Give TWO benefits of retrospectives for testing.","marks":2,"points":[{"t":"Increased test effectiveness / efficiency","k":[["effective","efficien"]],"m":1},{"t":"Increased quality of testware","k":[["testware"]],"m":1},{"t":"Team bonding and learning","k":[["bond","learn","team"]],"m":1},{"t":"Improved quality of the test basis (e.g. requirements)","k":[["test basis","requirement"]],"m":1},{"t":"Better cooperation between development and testing","k":[["cooperat","collaborat","relationship"]],"m":1}]}],"ch":2},{"id":"C2-levels","lo":"FL-2.2.1","k":"K2","topic":"levels","title":"The test levels","scenario":"","parts":[{"label":"(a)","q":"List the FIVE test levels in the order they are normally performed.","marks":6,"points":[{"t":"Component (unit) testing","k":[["=component test","unit test","module test"]],"m":1},{"t":"Component integration testing","k":[["component integration"]],"m":1},{"t":"System testing","k":[["=system test"]],"m":1},{"t":"System integration testing","k":[["system integration"]],"m":1},{"t":"Acceptance testing","k":[["acceptance"]],"m":1},{"t":"Correct order: component → component integration → system → system integration → acceptance","order":[["=component test","unit test","module test"],["component integration"],["=system test"],["system integration"],["acceptance"]],"m":1}]},{"label":"(b)","q":"Test levels are distinguished by a set of attributes. List THREE.","marks":3,"points":[{"t":"Test objectives","k":[["objective"]],"m":1},{"t":"Test basis","k":[["test basis","basis"]],"m":1},{"t":"Test objects","k":[["test object"]],"m":1},{"t":"Typical defects and failures","k":[["defect","failure"]],"m":1},{"t":"Approach and responsibilities","k":[["approach","responsib","strateg"]],"m":1}]}],"ch":2},{"id":"C2-component","lo":"FL-2.2.1","k":"K2","topic":"levels","title":"Component testing","scenario":"A developer has just written the `calculateInterest()` class for a banking app.","parts":[{"label":"(a)","q":"What does component testing focus on?","marks":1,"points":[{"t":"Individual components (units/modules/classes) tested in isolation","k":[["isolat","individual","separate","single","on its own"]],"m":1}]},{"label":"(b)","q":"Name TWO items of test basis for component testing.","marks":2,"points":[{"t":"Detailed design / component specification","k":[["design","specification"]],"m":1},{"t":"Program code","k":[["code"]],"m":1},{"t":"Data model / class model","k":[["data model","class model","model"]],"m":1}]},{"label":"(c)","q":"Name TWO typical defects found in component testing.","marks":2,"points":[{"t":"Incorrect functionality (not as described in the design)","k":[["functional","functionality"]],"m":1},{"t":"Data flow problems","k":[["data flow"]],"m":1},{"t":"Faulty code and logic","k":[["code","logic"]],"m":1},{"t":"Calculation defects","k":[["calculat"]],"m":1},{"t":"Missing or wrongly chosen program paths (forgotten special cases)","k":[["path","special case"]],"m":1}]},{"label":"(d)","q":"Who usually performs component testing, and what support is needed to run it?","marks":2,"points":[{"t":"Usually developers, in the development environment","k":[["developer"]],"m":1},{"t":"Test harness / unit test framework with drivers and stubs (mocks)","k":[["harness","framework","driver","stub","mock"]],"m":1}]}],"ch":2},{"id":"C2-integration","lo":"FL-2.2.1","k":"K2","topic":"levels","title":"Integration testing","scenario":"An online shop's checkout calls an inventory service, and the shop also connects to an external payment gateway.","parts":[{"label":"(a)","q":"Explain the difference between component integration testing and system integration testing.","marks":2,"points":[{"t":"Component integration testing: interfaces and interactions between components (after component testing), often by developers","k":[["component"],["interface","interaction","between"]],"m":1},{"t":"System integration testing: interfaces and interactions with other systems and external services (after system testing), e.g. the payment gateway","k":[["system integration","other system","external","third","microservice","gateway"]],"m":1}]},{"label":"(b)","q":"Name TWO typical defects found by integration testing.","marks":2,"points":[{"t":"Incorrect or missing data, incorrect data encryption","k":[["missing data","incorrect data","wrong data","encrypt","data"]],"m":1},{"t":"Incorrectly adapted or incompatible interfaces","k":[["interface"]],"m":1},{"t":"Failures in communication between components/systems","k":[["communicat"]],"m":1},{"t":"Incorrect assumptions about meaning, units or limits of the data passed","k":[["unit","limit","meaning","assumption"]],"m":1},{"t":"Incorrect sequence or timing of interface calls","k":[["sequence","timing","order"]],"m":1},{"t":"Inconsistent message structures; non-compliance with security rules","k":[["message","security"]],"m":1}]},{"label":"(c)","q":"In top-down integration, where does testing start, and what is needed to replace components that are not yet integrated?","marks":2,"points":[{"t":"Starts with the top component that calls others (but is not called itself)","k":[["top","highest","upper","main","calls other","calling"]],"m":1},{"t":"Needs stubs for the lower components not yet integrated","k":[["stub"]],"m":1}]},{"label":"(d)","q":"In bottom-up integration, where does testing start, and what is needed to simulate higher-level components?","marks":2,"points":[{"t":"Starts with elementary (lowest-level) components that call no others","k":[["elementary","lowest","bottom","lower","do not call","don't call","leaf","base"]],"m":1},{"t":"Needs drivers to simulate the higher-level components","k":[["driver"]],"m":1}]},{"label":"(e)","q":"Why is big-bang integration risky?","marks":1,"points":[{"t":"Everything is integrated at once, so failures appear together and defects are very hard to locate and fix (time lost waiting)","k":[["once","together","hard","difficult","locate","isolat","wait"]],"m":1}]}],"ch":2},{"id":"C2-system","lo":"FL-2.2.1","k":"K2","topic":"levels","title":"System testing","scenario":"","parts":[{"label":"(a)","q":"What does system testing focus on?","marks":2,"points":[{"t":"The overall behaviour and capabilities of the whole system: does it meet the specified requirements?","k":[["whole","entire","overall","complete system","as a whole","requirement"]],"m":1},{"t":"Functional end-to-end tasks and non-functional quality characteristics","k":[["end-to-end","end to end","non-functional","non functional","nonfunctional"]],"m":1}]},{"label":"(b)","q":"Name THREE items of test basis for system testing.","marks":3,"points":[{"t":"Functional and non-functional requirements specifications","k":[["requirement","specification"]],"m":1},{"t":"Use cases, epics and user stories","k":[["use case","epic","user stor"]],"m":1},{"t":"Risk analysis reports","k":[["risk"]],"m":1},{"t":"Models of system behaviour","k":[["model"]],"m":1},{"t":"Documentation and user manuals","k":[["manual","documentation"]],"m":1}]},{"label":"(c)","q":"What should the system test environment be like, and who usually does system testing?","marks":2,"points":[{"t":"As close as possible to the production environment","k":[["production","real","live","operational","similar"]],"m":1},{"t":"Usually independent testers / an independent test team","k":[["independent","test team","tester"]],"m":1}]}],"ch":2},{"id":"C2-acceptance","lo":"FL-2.2.1","k":"K2","topic":"levels","title":"Forms of acceptance testing","scenario":"A bank is about to accept a new mobile banking system from its supplier.","parts":[{"label":"(a)","q":"Name the FIVE forms of acceptance testing.","marks":5,"points":[{"t":"User acceptance testing (UAT)","k":[["user acceptance","uat"]],"m":1},{"t":"Operational acceptance testing (OAT)","k":[["operational","oat"]],"m":1},{"t":"Contractual acceptance testing","k":[["contract"]],"m":1},{"t":"Regulatory acceptance testing","k":[["regulat","legal"]],"m":1},{"t":"Alpha and beta testing","k":[["alpha","beta"]],"m":1}]},{"label":"(b)","q":"The bank's IT operations tea
