/td><td>X<\/td><td><\/td><\/tr><tr><td>Sell Item<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table>"},{"id":"ASTQB-3-28","source":"ASTQB Sample Exam #3, Q28","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"You have been given the following requirement:\n\nA user must log in to the system with a valid username and password. If they fail to enter the correct combination three times, they will receive an error and will have to wait 10 minutes before trying again. The test terminates when the user successfully logs in.\n\nHow many test cases are needed to provide 100% valid transitions coverage?","stemAfter":null,"table":null,"options":[{"text":"1","correct":true,"why":"Is correct. Per the diagram below, only one test is needed: Login, Fail, Fail, Fail =3, Wait, Login, Home. If you were required to exit after the Wait, a second test would be required but the question doesn’t indicate that an exit is required."},{"text":"2","correct":false,"why":"Is not correct."},{"text":"4","correct":false,"why":"Is not correct."},{"text":"5","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"","explanationTable":"<div class=\"diag\"><svg role=\"img\" aria-label=\"state transition diagram\" style=\"width:282px;max-width:100%;min-width:214px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 282 153\"><defs/><g><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"7.5\" y=\"67\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"33.9473\" x=\"15.5264\" y=\"91.729\">Login<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"80.8906\" x=\"192.5\" y=\"11\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"70.8906\" x=\"197.5\" y=\"35.729\">Home page<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"87.3906\" x=\"189.5\" y=\"104\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"77.3906\" x=\"194.5\" y=\"128.729\">Wait 10 mins<\/text><g id=\"ASTQB-3-28-link_L_L\"><path d=\"M18.3,66.98 C12.04,49.93 16.77,32 32.5,32 C48.23,32 55.028,44.2976 48.768,61.3476 \" fill=\"none\" id=\"ASTQB-3-28-L-to-L\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"46.7,66.98,53.5568,59.9101,48.4233,62.2864,46.047,57.1528,46.7,66.98\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"41.7363\" x=\"12\" y=\"23.625\">Fail &lt; 3<\/text><\/g><g id=\"ASTQB-3-28-link_L_H\"><path d=\"M57.84,80.13 C91.38,70.67 146.4455,55.1395 186.5955,43.8095 \" fill=\"none\" id=\"ASTQB-3-28-L-to-H\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"192.37,42.18,182.6219,40.7746,187.5579,43.5379,184.7946,48.4739,192.37,42.18\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"48.1699\" x=\"99.5\" y=\"49.625\">Success<\/text><\/g><g id=\"ASTQB-3-28-link_L_W\"><path d=\"M57.84,91.54 C90.55,97.63 143.3316,107.4706 183.4616,114.9506 \" fill=\"none\" id=\"ASTQB-3-28-L-to-W\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"189.36,116.05,181.2453,110.4686,184.4447,115.1338,179.7794,118.3331,189.36,116.05\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"70.1777\" x=\"88.5\" y=\"94.625\">3 failed tries<\/text><\/g><g id=\"ASTQB-3-28-link_W_L\"><path d=\"M189.24,136.1 C159.74,142.28 120.12,146.21 87.5,134 C73.07,128.6 64.1039,121.7295 54.4039,111.6195 \" fill=\"none\" id=\"ASTQB-3-28-W-to-L\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"50.25,107.29,53.5946,116.5536,53.7116,110.8979,59.3673,111.015,50.25,107.29\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"54.2227\" x=\"96.5\" y=\"130.625\">Wait over<\/text><\/g><\/g><\/svg><\/div>"},{"id":"ASTQB-3-29","source":"ASTQB Sample Exam #3, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"You are creating test cases for the following story, applying the ATDD approach.\n\nAs a hotel owner\nI want to reserve all the rooms on a floor before moving to the next floor\nSo I can maximize the efficiency of the housekeeping staff\n\nYou have decided to apply equivalence partitioning to this requirement and have identified the following partitions for the occupancy of a floor:\n\n0 | 1 - floor full | overbooked\n\nYou also want to be sure that the software is usable by the staff and that it performs quickly in determining which floors have availability.\n\nGiven this information, what should be the priority order for the tests you will design?","stemAfter":null,"table":null,"options":[{"text":"0, 1-floor full, overbooked, usability, performance","correct":true,"why":"Is correct. This tests the valid scenarios first, then invalid (overbooked), then the non-functional tests."},{"text":"Performance, 1-floor full, usability, overbooked, 0","correct":false,"why":"Is not correct."},{"text":"Usability, performance, overbooked, 0, 1-floor full","correct":false,"why":"Is not correct."},{"text":"Overbooked, 0, 1-floor full, performance, usability","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-1","source":"ASTQB Sample Exam #4, Q1","chapter":1,"lo":"FL-1.2.2","k":"K1","stem":"In what way does root cause analysis contribute to quality assurance?","stemAfter":null,"table":null,"options":[{"text":"Helps to better identify and correct the root cause of defects","correct":true,"why":"Is correct. Root cause analysis can determine common causes of issues. Addressing these common causes by process improvement can increase quality."},{"text":"Outlines how development teams can code faster","correct":false,"why":"Is incorrect because root cause analysis will not make the developers code faster, better maybe, not faster."},{"text":"Specifies the desired root causes to be achieved by other teams","correct":false,"why":"Is incorrect because root causes generally are not good things that should be transferred between teams."},{"text":"Contributes to the justification of future project funding","correct":false,"why":"Is not correct because it will not improve funding."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-2","source":"ASTQB Sample Exam #4, Q2","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"You are working in an Agile team where the testers are being accused of slowing down the process because of the time system testing is taking. Which of the following would be an approach that would better spread the skills of the team to complete the tasks?","stemAfter":null,"table":null,"options":[{"text":"Whole Team","correct":true,"why":"Is correct. The whole team approach would support the developers helping with the testing tasks rather than waiting for the testers to complete all the testing."},{"text":"Team Split","correct":false,"why":"Is not correct."},{"text":"Behavior-Driven Development","correct":false,"why":"Is not correct."},{"text":"Waterfall","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-3","source":"ASTQB Sample Exam #4, Q3","chapter":1,"lo":"FL-1.1.2","k":"K2","stem":"Which of the following is an example of debugging?","stemAfter":null,"table":null,"options":[{"text":"A tester finds a defect and reports it","correct":false,"why":"Is not correct."},{"text":"A tester retests a fix from the developer and finds a regression","correct":false,"why":"Is not correct."},{"text":"A developer finds and fixes a defect","correct":true,"why":"Is correct. Debugging is what the developer does to identify the cause of the defect, analyze it and fix it."},{"text":"A developer performs unit testing","correct":false,"why":"May involve debugging, if the developer finds a defect, but the act of unit testing is not the same as debugging."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-4","source":"ASTQB Sample Exam #4, Q4","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"Which of the following is a true statement about exhaustive testing?","stemAfter":null,"table":null,"options":[{"text":"It is a form of stress testing","correct":false,"why":"Is not correct."},{"text":"It is not feasible except in the case of trivial software","correct":true,"why":"Is correct. Exhaustive testing, all combinations of inputs and preconditions, is not feasible unless the software is trivially simple. Otherwise, it would take too long and might not even be possible."},{"text":"It is commonly done with test automation","correct":false,"why":"Is not correct."},{"text":"It is normally the responsibility of the developer during unit testing","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-5","source":"ASTQB Sample Exam #4, Q5","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"If you need to provide a report showing test case execution coverage of the requirements, what do you need to track?","stemAfter":null,"table":null,"options":[{"text":"Traceability between the test cases and the requirements","correct":true,"why":"Is correct. In order to show the test execution coverage of the requirements you will need traceability between the requirements and the test cases. As the test cases are executed this traceability can be used to record tests executed against the requirements."},{"text":"Coverage of the risk items by test case","correct":false,"why":"Is not correct because it’s looking for requirements coverage, not risk coverage."},{"text":"Traceability between the requirements and the risk items","correct":false,"why":"Is not correct because it’s looking for test execution, not risk items."},{"text":"Coverage of the requirements by the test cases that have been designed","correct":false,"why":"Is not correct because it’s looking for test cases that have been executed, not just designed."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-6","source":"ASTQB Sample Exam #4, Q6","chapter":1,"lo":"FL-1.4.5","k":"K2","stem":"Who normally writes the test plan for a project?","stemAfter":null,"table":null,"options":[{"text":"The project manager","correct":false,"why":"“The project manager”, “The product owner” and “The tester” may contribute to the test plan, but the overall responsibility belongs to the test manager."},{"text":"The product owner","correct":false,"why":"“The project manager”, “The product owner” and “The tester” may contribute to the test plan, but the overall responsibility belongs to the test manager."},{"text":"The test manager","correct":true,"why":"Is correct. Writing and updating the test plan is normally the responsibility of the test manager."},{"text":"The tester","correct":false,"why":"“The project manager”, “The product owner” and “The tester” may contribute to the test plan, but the overall responsibility belongs to the test manager."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-7","source":"ASTQB Sample Exam #4, Q7","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Your team has conducted a quality risk analysis and has determined the likelihood, impact and mitigation plan for each identified risk. This information should be captured in what work product?","stemAfter":null,"table":null,"options":[{"text":"Test strategy","correct":false,"why":"Is not correct."},{"text":"Test plan","correct":false,"why":"Is not correct."},{"text":"Risk register","correct":true,"why":"Is correct, per the syllabus. This information should be recorded in the risk register. The risk register should be referenced in the test plan for the project."},{"text":"Risk plan","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-8","source":"ASTQB Sample Exam #4, Q8","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"You are working with a junior tester who has been given a user story to test. They have created only one positive path test for the story. You know there are more areas that should be tested for this story, including negative scenarios.\n\nWhich of the following generic skills do they appear to be lacking?","stemAfter":null,"table":null,"options":[{"text":"Communication","correct":false,"why":"Is not correct because there is no indication that they are not communicating effectively."},{"text":"Curiosity","correct":false,"why":"Is not correct, although if they were more curious, they might have done more investigation."},{"text":"Confidence","correct":false,"why":"Is not correct because it doesn’t appear that confidence is a factor, rather that they just aren’t approaching the test creation with much creativity."},{"text":"Creativity","correct":true,"why":"Is correct. It appears they are lacking in creativity in designing test scenarios."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-9","source":"ASTQB Sample Exam #4, Q9","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following is an example of a good testing practice?","stemAfter":null,"table":null,"options":[{"text":"Different test levels should have specific test objectives","correct":true,"why":"Is correct. This is a good testing practice."},{"text":"Testers should have development experience","correct":false,"why":"Is not a requirement for many testers."},{"text":"Developers should determine the order of test execution in the test procedures","correct":false,"why":"Is not correct because this should be determined by the testers based on priority, risk, availability, etc."},{"text":"Test design should begin when the code is complete to avoid changes","correct":false,"why":"Is not correct because test design should start during code design and implementation."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-10","source":"ASTQB Sample Exam #4, Q10","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which development approach captures the requirements in a simple test case format?","stemAfter":null,"table":null,"options":[{"text":"TDD","correct":false,"why":"Is not correct."},{"text":"BDD","correct":true,"why":"Is correct. Behavior-driven development uses the given/when/then format to define the test cases. Those are then used as the requirements to develop the code."},{"text":"ATDD","correct":false,"why":"Is not correct."},{"text":"TBD","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-11","source":"ASTQB Sample Exam #4, Q11","chapter":2,"lo":"FL-2.2.2","k":"K2","stem":"Usability testing is an example of which type of testing?","stemAfter":null,"table":null,"options":[{"text":"Functional","correct":false,"why":"Is not correct."},{"text":"Non-functional","correct":true,"why":"Is correct. Usability is one of the non-functional test types according to ISO 25010."},{"text":"Structural","correct":false,"why":"Is not correct."},{"text":"Change-related","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-12","source":"ASTQB Sample Exam #4, Q12","chapter":2,"lo":"FL-2.2.3","k":"K2","stem":"You have been receiving daily builds from the developers. Even though they are documenting the fixes they are including in each build, you are finding that the fixes either aren’t in the build or are not working. What type of testing is best suited for finding these issues?","stemAfter":null,"table":null,"options":[{"text":"Unit testing","correct":false,"why":"Is not correct because this would be conducted by the developer as they fix the issues. While it might catch a fix that doesn’t work, it’s not likely to catch the check-in/build process that is excluding the fix from the build."},{"text":"System testing","correct":false,"why":"Is not correct because system testing will take longer to pinpoint this problem and may result in more troubleshooting time when the problem is discovered again."},{"text":"Confirmation testing","correct":true,"why":"Is correct. Confirmation testing will determine if a fix is present in a build and if it actually fixes the defect it is supposed to fix."},{"text":"Regression testing","correct":false,"why":"Is not correct because this is the testing that is done to see if there have been any unintended changes in the software’s behavior."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-13","source":"ASTQB Sample Exam #4, Q13","chapter":2,"lo":"FL-2.1.6","k":"K2","stem":"Your team has just completed a retrospective. They have discussed what was successful and should be retained, and they discussed what improvements are needed. What else do they need to discuss in order to recognize process improvements?","stemAfter":null,"table":null,"options":[{"text":"When will the accepted changes be made","correct":true,"why":"Is correct. It’s great to gather the information, but in order for change to really be made, it has to be planned for implementation in future sprints/releases/projects."},{"text":"Who is to blame for the shortcomings of the project","correct":false,"why":"Is not correct because retrospectives are not about blaming."},{"text":"How much money was spent that could have been saved","correct":false,"why":"Is not part of a retrospective, although this information may be gathered by the project manager."},{"text":"Why changes were not made earlier in the project","correct":false,"why":"Is also tending toward blaming but is something that should be considered as it may impact the ability to implement future changes."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-14","source":"ASTQB Sample Exam #4, Q14","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Your organization has decided to implement DevOps. One of the biggest concerns from the operations people is that there have been ongoing performance issues in production. How will implementing DevOps and CI/CD help with this problem?","stemAfter":null,"table":null,"options":[{"text":"It won’t - the problem needs to be addressed during design","correct":false,"why":"Is not correct. The problem probably does need to be addressed during design, but it needs to be tested throughout the pipeline."},{"text":"Performance testing can be integrated into the CI/CD pipeline to test it incrementally and repeatedly throughout development","correct":true,"why":"Is correct. With a CI/CD implementation, performance testing can be implemented throughout the pipeline, starting with the unit testing and continuing through to the fully developed product. CI/CD will also help ensure that the delivery is into the proper environments that can support the various types of testing."},{"text":"Performance testing will be the main focus of the system integration testing, after the code has been delivered to the test environment","correct":false,"why":"Is not correct because testing performance only in SIT doesn’t leverage the capabilities of the testing pipeline."},{"text":"Performance testing experts will be used to conduct the performance testing in an isolated environment which is developed using Infrastructure as Code","correct":false,"why":"Is not correct because performance testing can be conducted early and often through the pipeline, although a final test in an isolated environment may be needed as well."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-15","source":"ASTQB Sample Exam #4, Q15","chapter":3,"lo":"FL-3.1.1","k":"K1","stem":"Which of the following techniques is a form of static testing?","stemAfter":null,"table":null,"options":[{"text":"Error guessing","correct":false,"why":"“Error guessing”, “Automated regression testing” and “Providing inputs and examining the resulting outputs” are all forms of dynamic testing."},{"text":"Automated regression testing","correct":false,"why":"“Error guessing”, “Automated regression testing” and “Providing inputs and examining the resulting outputs” are all forms of dynamic testing."},{"text":"Providing inputs and examining the resulting outputs","correct":false,"why":"“Error guessing”, “Automated regression testing” and “Providing inputs and examining the resulting outputs” are all forms of dynamic testing."},{"text":"Code review","correct":true,"why":"Is correct, per syllabus."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-16","source":"ASTQB Sample Exam #4, Q16","chapter":3,"lo":"FL-3.2.5","k":"K1","stem":"You are frequently asked to participate in reviews of requirements. Unfortunately, you usually receive the document to be reviewed the night before the review meeting will be held. This is resulting in your not doing a thorough review and having to work significant overtime to get the review done.\nWhat review success factor is missing from this process?","stemAfter":null,"table":null,"options":[{"text":"Management support for the overall review process","correct":false,"why":"Is not correct but might be an issue given that this is a repeated problem and could indicate that the schedules are not realistic."},{"text":"Reviewing only small chunks at a time","correct":false,"why":"Is not correct because there’s no indication that the work product is too big, just that it’s being delivered too late."},{"text":"Training for the proper performance in the meetings","correct":false,"why":"Is not correct because the problem is not with the meetings."},{"text":"Allowing adequate time to conduct the review","correct":true,"why":"Is correct. The reviewers are not being given adequate time to conduct the review."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-17","source":"ASTQB Sample Exam #4, Q17","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"What is the main difference between static and dynamic testing?","stemAfter":null,"table":null,"options":[{"text":"Static testing is performed by developers; dynamic testing is performed by testers","correct":false,"why":"Is not correct because both types of testing can be done by both developers and testers."},{"text":"Manual test cases are used for dynamic testing; automated tests are used for static testing","correct":false,"why":"Is not correct because manual and automated tests can be used for dynamic testing."},{"text":"Static testing must be executed before dynamic testing","correct":false,"why":"Is not correct because static testing can occur at any time although it is usually done before dynamic testing."},{"text":"Dynamic testing requires executing the software; the software is not executed during static testing","correct":true,"why":"Is correct. Dynamic testing is done while the software is actually running whereas static testing depends on examining the software while it is not running."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-18","source":"ASTQB Sample Exam #4, Q18","chapter":3,"lo":"FL-3.2.4","k":"K2","stem":"If a review session is led by the author of the work product, what type of review is it?","stemAfter":null,"table":null,"options":[{"text":"Ad hoc","correct":false,"why":"Is not correct as this is not normally an organized session."},{"text":"Walkthrough","correct":true,"why":"Is correct. In a walkthrough, the author normally leads the review session."},{"text":"Inspection","correct":false,"why":"Is not correct because an inspection is normally led by the facilitator (moderator)."},{"text":"Audit","correct":false,"why":"Is not correct because an audit is usually led by a third party."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-19","source":"ASTQB Sample Exam #4, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"If test cases are derived from looking at the code, what type of test technique is being used?","stemAfter":null,"table":null,"options":[{"text":"Black-box","correct":false,"why":"“Black-box”, “Specification-based” and “Behavior-based” are all black-box and use the specifications or requirements for the test design."},{"text":"White-box","correct":true,"why":"Is correct."},{"text":"Specification-based","correct":false,"why":"“Black-box”, “Specification-based” and “Behavior-based” are all black-box and use the specifications or requirements for the test design."},{"text":"Behavior-based","correct":false,"why":"“Black-box”, “Specification-based” and “Behavior-based” are all black-box and use the specifications or requirements for the test design."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-20","source":"ASTQB Sample Exam #4, Q20","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"How is statement coverage determined?","stemAfter":null,"table":null,"options":[{"text":"Number of test decision points divided by the number of test cases","correct":false,"why":"“Number of test decision points divided by the number of test cases”, “Number of branches tested divided by the total number of executable statements” and “Number of possible test case outcomes divided by the total number of function points” are not valid measures."},{"text":"Number of branches tested divided by the total number of executable statements","correct":false,"why":"“Number of test decision points divided by the number of test cases”, “Number of branches tested divided by the total number of executable statements” and “Number of possible test case outcomes divided by the total number of function points” are not valid measures."},{"text":"Number of possible test case outcomes divided by the total number of function points","correct":false,"why":"“Number of test decision points divided by the number of test cases”, “Number of branches tested divided by the total number of executable statements” and “Number of possible test case outcomes divided by the total number of function points” are not valid measures."},{"text":"Number of executable statements tested divided by the total number of executable statements","correct":true,"why":"Is correct, per syllabus as each tested statement is considered to be exercised."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-21","source":"ASTQB Sample Exam #4, Q21","chapter":4,"lo":"FL-4.3.3","k":"K2","stem":"You are working on a project with very tight deadlines. The code is being developed but is not yet executable. What type of testing could you apply that would help find defects now?","stemAfter":null,"table":null,"options":[{"text":"Black-box","correct":false,"why":"“Black-box” and “Experience-based” are not correct because nothing can be executed yet."},{"text":"White-box","correct":true,"why":"Is correct. You have code that can be structurally reviewed for items such as the proper handling of branching."},{"text":"Experience-based","correct":false,"why":"“Black-box” and “Experience-based” are not correct because nothing can be executed yet."},{"text":"Factor-based","correct":false,"why":"Is not correct because it’s not a type of testing."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-22","source":"ASTQB Sample Exam #4, Q22","chapter":4,"lo":"FL-4.4.1","k":"K2","stem":"If you are using error guessing to target your testing, which type of testing are you doing?","stemAfter":null,"table":null,"options":[{"text":"Specification-based","correct":false,"why":"Is not correct."},{"text":"Structure-based","correct":false,"why":"Is not correct."},{"text":"Experience-based","correct":true,"why":"Is correct. This is an experience-based technique."},{"text":"Reference-based","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-23","source":"ASTQB Sample Exam #4, Q23","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"When exploratory testing is conducted using time-boxing and test charters, what is it called?","stemAfter":null,"table":null,"options":[{"text":"Schedule-based testing","correct":false,"why":"Is not correct. Exploratory doesn’t usually comply to schedules but rather allows the tester to explore and learn about the software. Coverage is difficult to assess which is one of the reasons it is difficult to match the time spent to the amount accomplished."},{"text":"Session-based testing","correct":true,"why":"Is correct. This is often called session-based testing and may use session sheets."},{"text":"Risk-based testing","correct":false,"why":"Is not correct. This may be one of the forms of risk-based testing, but it is not entirely RBT."},{"text":"Formal chartering","correct":false,"why":"Is not correct as this is not actually a testing term."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-24","source":"ASTQB Sample Exam #4, Q24","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"You are writing some acceptance criteria for a story. You have decided to make a list of all the likely inputs to the code and the expected outputs based on those inputs. What format are you using?","stemAfter":null,"table":null,"options":[{"text":"IPO chart","correct":false,"why":"Is not correct because, although you are tracking the inputs and outputs, you are not tracking the processing."},{"text":"Acceptance-based","correct":false,"why":"Is not correct because this is not a recognized format."},{"text":"Rules-oriented","correct":true,"why":"Is correct per the syllabus. This is a rules-oriented format."},{"text":"Behavior-driven","correct":false,"why":"Is not correct because the given/when/then format is referred to as scenario-oriented."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-25","source":"ASTQB Sample Exam #4, Q25","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"You are testing a banking application that allows a customer to withdraw 20, 100 or 500 dollars in a single transaction. The values are chosen from a drop-down list and no other values may be entered. How many equivalence partitions need to be tested to achieve 100% equivalence partition coverage?","stemAfter":null,"table":null,"options":[{"text":"1","correct":false,"why":"Is not correct."},{"text":"2","correct":false,"why":"Is not correct."},{"text":"3","correct":false,"why":"Is not correct."},{"text":"4","correct":true,"why":"Is correct. The values to be tested are 20, 100, 500 and no selection."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-26","source":"ASTQB Sample Exam #4, Q26","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"You are testing a scale system that determines shipping rates for a regional web-based auto parts distributor. Due to regulations, shipments cannot exceed 100 lbs. You want to include boundary value analysis as part of your black-box test design.\n\nHow many tests will you need to execute to achieve 100% two-value boundary value analysis?","stemAfter":null,"table":"<table class=\"qt\"><tr><th>Weight<\/th><th>0 to 10 lbs.<\/th><th>11 to 25 lbs.<\/th><th>26 to 50 lbs.<\/th><th>51 lbs. to 100<\/th><\/tr><tr><td>Shipping Cost<\/td><td>$5.00<\/td><td>$7.50<\/td><td>$12.00<\/td><td>$17.00<\/td><\/tr><\/table>","options":[{"text":"4","correct":false,"why":"Is not correct."},{"text":"8","correct":false,"why":"Is not correct."},{"text":"10","correct":true,"why":"Is correct. 2 per valid weight range plus one for a negative weight and one for a weight exceeding 100 lbs (-1, 0, 10, 11, 25, 26, 50, 51, 100, 101)."},{"text":"12","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-27","source":"ASTQB Sample Exam #4, Q27","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"Which of the following is the correct decision table for the following pseudocode for ordering a hamburger? Note: if you add or delete items from the basic burger, you no longer get the basic burger.","stemAfter":null,"table":"<pre class=\"code\">Start\nSelect basic burger\nIf customer adds items\n    While items to be added\n        Ask customer which item\n        Add item\n    End while\nEndif\nIf customer deletes items\n    While items to be deleted\n        Ask customer which item\n        Delete item\n    End while\nEndif\nIf customer wants fries\n    Add fries to order\nEndif\nComplete order\nEnd<\/pre>","options":[{"text":"","correct":false,"why":"Is not correct because it assumes you can’t add and delete items from a burger.","table":"<table class=\"qt\"><tr><th>Test #<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td>Conditions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Add items<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>Delete items<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>Add fries<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><\/tr><tr><td>Results<\/td><td><\/td><td><\/td><td><\/td><td><\/td> <td><\/td><td><\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>Added items<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Fries<\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/table>"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-28","source":"ASTQB Sample Exam #4, Q28","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"You are testing an e-commerce transaction that has the following states and transitions:\n\n1. Login (invalid) > Login\n2. Login > Search\n3. Search > Search\n4. Search > Shopping Cart\n5. Shopping Cart > Search\n6. Shopping Cart > Checkout\n7. Checkout > Search\n8. Checkout > Logout\n\nFor a state diagram, how many transitions should be shown?","stemAfter":null,"table":null,"options":[{"text":"4","correct":false,"why":"Is not correct as this is only checking one transition from each state."},{"text":"6","correct":false,"why":"Is not correct because this is probably excluding login > login and search > search."},{"text":"8","correct":true,"why":"Is correct. There are 8 transitions that should be shown in the state diagram as explained in the question."},{"text":"16","correct":false,"why":"Is not correct because it is checking the invalid transitions as well and those would be included in a state table, not a state diagram. These are:\nLogin (invalid) > Login\nLogin > Search\nLogin > Shopping Cart (invalid transition)\nLogin > Checkout (invalid transition)\nSearch > Login (invalid transition)\nSearch > Search\nSearch > Shopping Cart\nSearch > Checkout (invalid transition)\nShopping Cart > Login (invalid transition)\nShopping Cart > Search\nShopping Cart > Shopping Cart (invalid transition)\nShopping Cart > Checkout\nCheckout > Login (invalid transition)\nCheckout > Search\nCheckout > Shopping Cart (invalid transition)\nCheckout > Logout"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ASTQB-4-29","source":"ASTQB Sample Exam #4, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"You are creating test cases for the following story, applying the ATDD approach.\n\nAs a hotel owner\nI want to reserve all the rooms on a floor before moving to the next floor\nSo I can maximize the efficiency of the housekeeping staff\n\nYou have decided to apply boundary value analysis to this requirement and have identified the following partitions for the occupancy of a floor:\n\n0 | 1 - floor full | overbooked\n\nYou also want to be sure that the software is usable by the staff and that it performs quickly in determining which floors have availability.\nYou have designed the following test cases:\n\n1. Test with 1 occupant on the floor\n2. Test with the floor full and ensure the next floor is made available for bookings\n3. Test with 0 occupants on the floor and ensure that floor is only available when lower floors are fully booked\n4. Test the usability to ensure hotel staff will find the software usable\n5. Test for response time when the system is at average load and the hotel is 80% occupied\nWhat are you missing?","stemAfter":null,"table":null,"options":[{"text":"A test with a floor partially occupied but not fully occupied","correct":false,"why":"Is covered by testing with one occupant."},{"text":"A test for performance","correct":false,"why":"“A test for performance” and “A test for usability” are covered."},{"text":"A test for trying to assign someone to a floor that is full","correct":true,"why":"Is correct. The test that is missing is to try to see if you can allocate someone to a floor that is already fully booked. This is a negative test and should result in an error."},{"text":"A test for usability","correct":false,"why":"“A test for performance” and “A test for usability” are covered."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-2","source":"GTB Sample Exam A, Q2","chapter":1,"lo":"FL-1.1.2","k":"K2","stem":"What is the main difference between testing and debugging?","stemAfter":null,"table":null,"options":[{"text":"Testing can trigger failures or find defects, while debugging analyzes the causes of a failure and removes defects.","correct":true,"why":"CORRECT – Testing and debugging are separate activities. Testing can trigger failures or find defects. Debugging includes, in particular, reproducing a failure, finding and analyzing the causing defects, and removing them (cf. CTFL Syllabus V4.0.2, Section 1.1.2)."},{"text":"Testing verifies requirements, while debugging verifies design.","correct":false,"why":"FALSE – Testing and debugging are not limited to requirements review and design."},{"text":"Testing is the process of executing software, while debugging is the process of analyzing software.","correct":false,"why":"FALSE – Testing is not limited to executing software; it also includes static testing and other test activities. Debugging includes not only analysis but also finding and removing defects."},{"text":"Testing is the process of defect prevention, while debugging is the process of defect elimination.","correct":false,"why":"FALSE – Testing does not remove defects. Testing can trigger failures or find defects; debugging analyzes and removes the defects."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-5","source":"GTB Sample Exam A, Q5","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Which of the following statements BEST describes how value is added by establishing and maintaining traceability between the test base and the testware?","stemAfter":null,"table":null,"options":[{"text":"Maintenance testing can be fully automated on the basis of changes to the original requirements.","correct":false,"why":"FALSE – Traceability allows requirements to be linked to test cases (see CTFL Syllabus V4.0.2, Section 1.4.4, 3rd paragraph), but it does not help automate test cases."},{"text":"Whether or not the targeted coverage has been achieved can be more efficiently determined.","correct":true,"why":"CORRECT – If test cases are linked to requirements, the addition of a new test case (with traceability) can determine whether previously uncovered requirements or parts of requirements are covered by the new test case (see CTFL Syllabus V4.0.2, Section 1.4.4, 1st bullet)."},{"text":"The test management role can determine which testers found the defects with the highest severity.","correct":false,"why":"FALSE – The traceability between test base and test ware does not provide information about which testers have identified the high severity defects. One could determine this through evaluations in the defect management tool if necessary, but in terms of the syllabus, it is never about evaluating individuals."},{"text":"Code areas that may be affected by side effects of a change can be targeted through regression testing.","correct":false,"why":"FALSE – Good traceability can support impact analysis for changes. However, the statement refers to affected code areas and possible side effects of a change. This is not the direct value of traceability between the test basis and testware as described in Section 1.4.4."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-6","source":"GTB Sample Exam A, Q6","chapter":1,"lo":"FL-1.4.5","k":"K2","stem":"Which of the following statements BEST describes the differences between testing roles?","stemAfter":null,"table":null,"options":[{"text":"The testing role executes test cases, the test management role plans and monitors the testing activities and reports the deviation to all testers.","correct":false,"why":"FALSE – Reporting deviations is assigned to the testing role and not to the test management role. (See also CTFL Syllabus V4.0.2, Section 1.4.5; 3rd paragraph; last sentence: \"The testing role focuses primarily on the activities of test analysis, test design, test implementation, and test execution.\" Test execution \"(...) reporting of the deviation based on the observed failure effects (see Section 1.4.1))."},{"text":"The testing role performs test analysis and test design activities, creates and executes test cases, and the test management role coordinates testing resources and reports to stakeholders.","correct":true,"why":"CORRECT – because it describes the main tasks of each role in testing in a meaningful way. The testing role executes test cases, creates and designs test cases, performs test analysis and design activities, and reports defects; the Test Management role coordinates test resources and reports to stakeholders. (See CTFL Syllabus V4.0.2, Section 1.4.5, 2nd + 3rd par)."},{"text":"The testing role decides the tests to be automated and prioritizes test cases, and the test management role analyzes risks and prioritizes tests.","correct":false,"why":"FALSE – because it confuses the roles of testing. The role of testing does not solely prioritize test cases and does not alone decide which tests to automate."},{"text":"The testing role performs static and dynamic component testing, and the test management role performs system testing and acceptance testing.","correct":false,"why":"FALSE – because it oversimplifies the types of tests that each role can perform. The testing role is not limited to component testing. The test management role monitors the tests, it does not execute the test. Further, there is no restriction on specific levels of testing."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-9","source":"GTB Sample Exam A, Q9","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following statements BEST describes a good practice for testing that applies to all software development lifecycles?","stemAfter":null,"table":null,"options":[{"text":"Testing should be performed only after development is complete.","correct":false,"why":"FALSE – Testing should NOT be done after development is complete, as this can lead to late discovery of bugs and increase the cost of fixing bugs (cf. CTFL Syllabus V4.0.2, Section 2.1.2, 3rd bullet point)."},{"text":"Testing should be performed under the leadership of development.","correct":false,"why":"FALSE – An independent testing perspective should be considered; testing is not exclusively a development task (cf. CTFL Syllabus V4.0.2, Sections 2.1.2 and 1.4.5, 2nd paragraph, last sentence)."},{"text":"Testing should start early in the development process.","correct":true,"why":"CORRECT – Testing should begin early in the development process to detect defects as early as possible and minimize the cost of fixing defects (cf. CTFL Syllabus V4.0.2, Section 2.1.2, 3rd bullet point, and Section 1.3)."},{"text":"Testing should be performed in a development test environment.","correct":false,"why":"FALSE – Testing should not be performed in a development test environment as this may not identify all problems that may occur on other environments. Testing should be performed in a representative test environment (see CTFL Syllabus V4.0.2, Section 2.1.5, last bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-20","source":"GTB Sample Exam A, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"You are testing the software for an unattended American gas pump. After lifting the nozzle and selecting the desired grade of fuel, the customer enters the desired amount of fuel in gallons using a keypad. The input field allows numeric values with one decimal place. Between 0.1 and 50.0 gallons can be dispensed per fill-up.\nWhich of the following answers represents a minimum set of input values that covers all valid and invalid equivalence partitions for the fuel quantity?","stemAfter":null,"table":null,"options":[{"text":"0.0; 20.0; 60.0","correct":true,"why":"CORRECT – This list of input values defines exactly one test case per equivalence class (see CTFL Syllabus V4.0.2, Section 4.2.1, 5th paragraph)."},{"text":"0.0; 0.1; 50.0","correct":false,"why":"FALSE – This list of input values does not cover invalidly exceeding the 50.0 gallon maximum allowed (see CTFL Syllabus V4.0.2, Section 4.2.1, 5th paragraph)."},{"text":"0.0; 0.1; 50.0; 70.0","correct":false,"why":"FALSE – This set of input values represents two tests for the valid equivalence class, which is not the minimum of one test (see CTFL Syllabus V4.0.2, Section 4.2.1, 5th paragraph)."},{"text":"-0.1; 0.0; 0.1; 49.9; 50.0; 50.1","correct":false,"why":"FALSE – This list contains several values from the same equivalence partitions and is oriented more toward boundary values. It is therefore not a minimum set for covering the equivalence partitions."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are three relevant equivalence partitions for the numeric input value range:\n- one invalid partition for quantities below the minimum quantity: < 0.1 gallons, e.g., 0.0\n- one valid partition for allowed quantities: 0.1 to 50.0 gallons, e.g., 20.0\n- one invalid partition for quantities above the maximum quantity: > 50.0 gallons, e.g., 60.0\nTherefore, answer “0.0; 20.0; 60.0” covers the minimum required set with exactly one value per equivalence partition."},{"id":"GTB-A-21","source":"GTB Sample Exam A, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"You are testing an e-commerce system that sells bulk food items such as spices, flour, and other items. The units in which the items are sold are either grams or kilograms. Regardless of the units, the smallest valid order quantity is 0.5 units (e.g., half a gram of cardamom pods) and the largest valid order quantity is 25.0 units (e.g., 25 kilograms of sugar). The order quantity can be incremented in 0.1 units.\nWhich of the following answers contains exactly the minimum set of input values that completely covers the coverage elements of 2-value boundary value analysis for the order quantity?","stemAfter":null,"table":null,"options":[{"text":"0.3; 24.9; 25.2","correct":false,"why":"FALSE – These values cover the individual equivalence classes, but not their boundary values (see CTFL Syllabus V4.0.2, Sections 4.2.1 and 4.2.2)."},{"text":"0.4; 0.5; 0.6; 24.9; 25.0; 25.1","correct":false,"why":"FALSE – These input values would be correct if the 3-value method were used. The four boundaries of the 2-value method (see answer “0.4; 0.5; 25.0; 25.1”) are included in this set of input values, but the 2-value method was explicitly asked for (see CTFL Syllabus V4.0.2, Section 4.2.2, 5th paragraph)."},{"text":"0.4; 0.5; 25.0; 25.1","correct":true,"why":"CORRECT – This set of input values covers the four boundaries selected by using the 2-value method (see CTFL Syllabus V4.0.2, Section 4.2.2, 4th paragraph)."},{"text":"0.5; 0.6; 24.9; 25.0","correct":false,"why":"FALSE – These four values are all in the valid equivalence partition. The adjacent values from the invalid equivalence partitions are missing, namely 0.4 and 25.1 (cf. CTFL Syllabus V4.0.2, Section 4.2.2, 4th paragraph)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are three equivalence classes whose boundaries are shown as follows:\n- Invalid and too low (0.4 and below)\n- Valid (0.5 to 25.0)\n- Invalid and too high (25.1 and higher)\nThe 2-value boundary value analysis (see CTFL Syllabus V4.0.2, Section 4.2.2, 4th paragraph) defines two cover elements for each limit value of an ordered class, the boundary value and its closest neighbor belonging to the adjacent class. So here 0.5 (limit value) and 0.4 (adjacent class) and 25.0 and 25.1."},{"id":"GTB-A-22","source":"GTB Sample Exam A, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"Newly hired employees of a company can agree on individual goals with their managers and supervisors, the achievement of which is linked to their bonus. However, this bonus is only paid to them if they have been employed by the company for more than one year.\nThis situation can be illustrated in a decision table:","stemAfter":"Which of the following test cases describes a valid and feasible condition combination with a technically correct expected action that is missing from the decision table above?","table":"<table class=\"qt\"><tr><th>Test Case-ID<\/th><th><\/th><th>T1<\/th><th>T2<\/th><th>T3<\/th><th>T4<\/th><th>T5<\/th><\/tr><tr><td>Condition1<\/td><td>Employment longer than one year?<\/td><td>YES<\/td><td>NO<\/td><td>NO<\/td><td>YES<\/td><td>NO<\/td><\/tr><tr><td>Condition2<\/td><td>Goal agreed?<\/td><td>NO<\/td><td>NO<\/td><td>YES<\/td><td>YES<\/td><td>YES<\/td><\/tr><tr><td>Condition3<\/td><td>Goal achieved?<\/td><td>NO<\/td><td>NO<\/td><td>YES<\/td><td>YES<\/td><td>NO<\/td><\/tr><tr><td>Action<\/td><td>Payment of the bonus?<\/td><td>NO<\/td><td>NO<\/td><td>NO<\/td><td>YES<\/td><td>NO<\/td><\/tr><\/table>","options":[{"text":"Condition1 = YES, Condition2 = NO, Condition3 = YES, Action = NO","correct":false,"why":"FALSE – The combination of conditions is an infeasible combination, because if no goal has been agreed, then the goal that has not been agreed cannot be achieved. Therefore, it is not a valid scenario that occurs in practice (see CTFL Syllabus V4.0.2, Section 4.2.3, Paragraph 4)."},{"text":"Condition1 = YES, Condition2 = YES, Condition3 = NO, Action = YES","correct":false,"why":"FALSE – The combination of conditions is a valid, occurring situation, but the action is technically incorrect. Since the objective was not achieved, no bonus should be made (see CTFL Syllabus V4.0.2, Section 4.2.3, 2nd paragraph)."},{"text":"Condition1 = NO, Condition2 = NO, Condition3 = YES, Action = NO","correct":false,"why":"FALSE – The combination of conditions is an infeasible combination because if no objective was agreed, then the unagreed objective cannot be achieved. Therefore, it is not a valid scenario that occurs in practice (see CTFL Syllabus V4.0.2, Section 4.2.3, 4th paragraph) (see answer “Condition1 = YES, Condition2 = NO, Condition3 = YES, Action = NO”)."},{"text":"Condition1 = YES, Condition2 = YES, Condition3 = NO, Action = NO","correct":true,"why":"CORRECT – The test case describes the technically correct situation (counterpart to answer “Condition1 = YES, Condition2 = YES, Condition3 = NO, Action = YES”) that failure to achieve the agreed target results in non-payment of the bonus if the employee is employed for more than one year. This situation may occur in practice, but is not included in the decision table (see CTFL Syllabus V4.0.2, Section 4.2.3, 2nd paragraph)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-A-23","source":"GTB Sample Exam A, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"Which of the following statements about the state transition diagram and test case table below is true?","stemAfter":null,"table":"<div class=\"diag\"><svg role=\"img\" aria-label=\"state transition diagram\" style=\"width:238px;max-width:100%;min-width:181px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 238 285\"><defs/><g><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"77.3486\" x=\"79.66\" y=\"7\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"67.3486\" x=\"84.66\" y=\"31.729\">TV Off (S1)<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"115.4282\" x=\"8.66\" y=\"123\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"105.4282\" x=\"13.66\" y=\"147.729\">TV Stand By (S2)<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"86.5845\" x=\"94.66\" y=\"239\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"76.5845\" x=\"99.66\" y=\"263.729\">TV Play (S3)<\/text><g id=\"GTB-A-23-link_S1_S2\"><path d=\"M79.53,35.82 C56.86,42.61 30.02,54.97 16.16,77 C6,93.15 15.4852,106.4638 31.3052,119.0538 \" fill=\"none\" id=\"GTB-A-23-S1-to-S2\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"36,122.79,31.4487,114.0558,32.0877,119.6765,26.4671,120.3155,36,122.79\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"57.7852\" x=\"17.16\" y=\"89.625\">Power ON<\/text><\/g><g id=\"GTB-A-23-link_S2_S1\"><path d=\"M74.89,122.86 C84.5,101.79 97.3694,73.5786 106.9694,52.5386 \" fill=\"none\" id=\"GTB-A-23-S2-to-S1\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"109.46,47.08,102.085,53.6075,107.3845,51.6289,109.3631,56.9284,109.46,47.08\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"57.627\" x=\"97.16\" y=\"89.625\">Power Off<\/text><\/g><g id=\"GTB-A-23-link_S2_S3\"><path d=\"M57.57,163.09 C52.8,176.71 49.27,195.01 57.16,209 C65.39,223.6 74.611,231.5546 89.121,239.1946 \" fill=\"none\" id=\"GTB-A-23-S2-to-S3\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"94.43,241.99,88.33,234.2576,90.0058,239.6605,84.6029,241.3363,94.43,241.99\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"36.1289\" x=\"58.16\" y=\"205.625\">RC On<\/text><\/g><g id=\"GTB-A-23-link_S3_S2\"><path d=\"M126.99,238.78 C119.33,225.76 108.84,208.21 99.16,193 C92.88,183.13 89.028,177.2988 82.938,168.3588 \" fill=\"none\" id=\"GTB-A-23-S3-to-S2\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"79.56,163.4,81.3211,173.0901,82.375,167.5323,87.9328,168.5862,79.56,163.4\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"37.9219\" x=\"110.16\" y=\"205.625\">RC Off<\/text><\/g><g id=\"GTB-A-23-link_S3_S1\"><path d=\"M146.87,238.78 C160.92,204.9 184.92,132.87 163.16,77 C158.72,65.59 154.5283,59.4265 146.1183,51.1965 \" fill=\"none\" id=\"GTB-A-23-S3-to-S1\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"141.83,47,145.4648,56.1536,145.4036,50.4971,151.0601,50.4359,141.83,47\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"57.627\" x=\"173.16\" y=\"147.625\">Power Off<\/text><\/g><\/g><\/svg><\/div><p>Test case table:<\/p><table class=\"qt\"><tr><th>Test case<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td>Initial state<\/td><td>S1<\/td><td>S2<\/td><td>S2<\/td><td>S3<\/td><td>S3<\/td><\/tr><tr><td>Input<\/td><td>Power On<\/td><td>Power Off<\/td><td>RC On<\/td><td>RC Off<\/td><td>Power Off<\/td><\/tr><tr><td>Final state<\/td><td>S2<\/td><td>S1<\/td><td>S3<\/td><td>S2<\/td><td>S1<\/td><\/tr><\/table>","options":[{"text":"The test cases attempt to execute all valid and invalid transitions, achieving 100% coverage of all transitions.","correct":false,"why":"FALSE – because no invalid transitions, such as S1->S3, are executed."},{"text":"The test cases execute all valid transitions in the state transition diagram. This achieves 100% 0-switch coverage.","correct":true,"why":"CORRECT – because all 5 valid transitions are performed."},{"text":"The test cases execute only some of the valid transitions in the state transition diagram. Therefore, the 0-switch coverage is less than 100%.","correct":false,"why":"FALSE – because all valid transitions are executed (see “The test cases execute all valid transitions in the state transition diagram. This achieves 100% 0-switch coverage.”)."},{"text":"Test Case 2 is not required for 100% 0-switch coverage, since state S1 is already covered by Test Case 5.","correct":false,"why":"FALSE – because the 0-switch overlap is not a matter of overlapping states, but of overlapping transitions."}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"The proposed test cases cover exactly all five possible valid transitions in the given state transition diagram (S1-> S2, S2-> S1, S2-> S3, S3-> S2, S3-> S1)."},{"id":"GTB-A-24","source":"GTB Sample Exam A, Q24","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"Which of the following describes statement coverage?","stemAfter":null,"table":null,"options":[{"text":"It is a metric for calculating and measuring the percentage of test cases executed.","correct":false,"why":"FALSE – Statement coverage measures the percentage of statements executed (covered) by test cases and is not related to the number of test cases executed (see CTFL syllabus V4.0.2, Section 4.3.1, paragraph 1)."},{"text":"It is a metric that indicates the percentage of statements in the code that have been executed by test cases.","correct":true,"why":"CORRECT – Statement testing aims to execute statements in code through test cases until acceptable statement coverage is achieved. Statement coverage is measured as the number of statements executed by test cases divided by the total number of executable statements in the test object, expressed as a percentage (see CTFL Syllabus V4.0.2, Section 4.3.1, Paragraph 1)."},{"text":"It is a metric for measuring the number of statements in the code executed by test cases that did not reveal a failure.","correct":false,"why":"FALSE – Statement coverage measures only executed instructions, regardless of whether or not any failures or defects were determined with them (see CTFL Syllabus V4.0.2, Section 4.3.1, 1st and 2nd paragraphs)."},{"text":"It is a metric that provides true/false confirmation that all statements are covered by executed test cases.","correct":false,"why":"FALSE – Statement coverage is a metric that gives percentages and does not make a true/false statement (see CTFL Syllabus V4.0.2, Section 4.3.1, Paragraph 1). A true/false statement could be determined for the test objective of percent statement coverage, e.g., 100% statement coverage, but not for the statement coverage itself."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-1","source":"GTB Sample Exam B, Q1","chapter":1,"lo":"FL-1.2.1","k":"K2","stem":"Which of the following best describes why testing is necessary in the software development lifecycle?","stemAfter":null,"table":null,"options":[{"text":"Dynamic testing is the only way to evaluate the quality of a test object.","correct":false,"why":"FALSE – While dynamic testing is an important means of quality evaluation, it is not the only means. There are also other means such as code reviews and inspections."},{"text":"Testing ensures that users understand and comprehend the needs of the developers.","correct":false,"why":"FALSE – This statement does not make sense. Users do not need to be able to understand the needs of developers. Rather, testing ensures that the needs of users are taken into account during the development cycle (see Section 1.2.1, 3rd paragraph)."},{"text":"Testing is carried out exclusively to meet regulatory standards.","correct":false,"why":"FALSE – Although testing can help meet regulatory requirements, the CTFL 4.0 syllabus highlights that testing also fulfills other important aspects, such as assessing quality and supporting release decision making in the SDLC."},{"text":"Testing helps identify defects, which improves the quality of the test object.","correct":true,"why":"CORRECT – The CTFL 4.0 syllabus explains that testing identifies defects that can be resolved by debugging, which implicitly contributes to a higher quality of the test object."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-2","source":"GTB Sample Exam B, Q2","chapter":1,"lo":"FL-1.2.2","k":"K1","stem":"What is the difference between testing and quality assurance?","stemAfter":null,"table":null,"options":[{"text":"Testing is a process-oriented, preventive approach, while quality assurance is a product-oriented, corrective approach.","correct":false,"why":"FALSE – This statement is wrong because, according to the syllabus text, testing is described as a product-oriented, corrective approach that focuses on activities that support the achievement of an appropriate level of quality. In contrast, quality assurance is a process-oriented, preventive approach that focuses on implementing and improving processes (see CTFL syllabus V4.0, section 1.2.2, 2nd paragraph, 1st sentence)."},{"text":"Quality assurance is process-oriented and aims to improve the process, while testing aims for appropriate quality through product-oriented measures.","correct":true,"why":"CORRECT – This statement is correct and consistent with the syllabus text, which indicates that testing focuses on helping to achieve an adequate level of quality through product-oriented activities, while quality assurance is process-oriented and focuses on implementing and improving processes (see CTFL syllabus V4.0, section 1.2.2, 2nd paragraph)."},{"text":"Testing and quality assurance are identical and can be used synonymously.","correct":false,"why":"FALSE – This statement is false because the syllabus text explicitly states that testing and quality assurance are not the same, even though the terms are often used synonymously. Testing is product- and defect-correction-oriented, while quality assurance is process-oriented and preventive (see CTFL syllabus V4.0, section 1.2.2, 1st paragraph)."},{"text":"Quality assurance only refers to the test process, while testing encompasses the entire development process.","correct":false,"why":"FALSE – This statement is false because, according to the Syllabus text, quality assurance refers to both the development and test processes and is the responsibility of all project participants, while testing is a form of quality control that is product-oriented and corrective (see CTFL syllabus V4.0, section 1.2.2, 3rd paragraph, last sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-3","source":"GTB Sample Exam B, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"A tester has been testing software applications on mobile devices for a period of 5 years. Over this extended period, the tester has not modified the existing test cases or created any new test cases. With newer versions of the mobile platform, more failures have been reported by users. Which principle of testing did the tester not consider?","stemAfter":null,"table":null,"options":[{"text":"Testing depends on the context","correct":false,"why":"FALSE – Testing depends on the context, whether manual or automated (see [CTFL 4.0], Section 1.3; 6th principle). However, this does not change the fact that, as described above, fewer errors are being uncovered."},{"text":"Complete testing is not possible","correct":false,"why":"FALSE – Complete testing is, except in trivial cases, impossible, no matter how much effort is invested in testing (see [CTFL 4.0], Section 1.3; 2nd principle). However, this does not result in fewer errors being uncovered, as described above."},{"text":"Tests wear out","correct":true,"why":"CORRECT – The principle \"Tests wear out\" (see [CTFL 4.0], Section 1.3, 5th principle) states that repeating unchanged tests becomes increasingly ineffective in finding defects (\"Repetitions have no effectiveness\"). To find new defects, existing tests and test data must be modified, and new tests must be created."},{"text":"Defects cluster together","correct":false,"why":"FALSE – In general, defects often occur in clusters in few components (see [CTFL 4.0], Section 1.3; 4th principle). However, this is not related to the fact that, as described above, fewer defects are being uncovered."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-6","source":"GTB Sample Exam B, Q6","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Consider the following testing activities:\n1. Selecting regression tests\n2. Evaluating completeness of test execution\n3. Identifying which user stories have open defect reports\n4. Evaluating whether the number of tests for each requirement is consistent with the level of product risk\nConsider the following ways traceability can help testing:\nA. Improve understandability of test status reports to include status of test basis items\nB. Make testing activities auditable\nC. Provide information to assess process quality\nD. Analyze the impact of changes\nWhich of the following best matches the testing activity with how traceability can assist that activity?","stemAfter":null,"table":null,"options":[{"text":"1D, 2B, 3C, 4A","correct":false,"why":"FALSE"},{"text":"1B, 2D, 3A, 4C","correct":false,"why":"FALSE"},{"text":"1D, 2C, 3A, 4B","correct":false,"why":"FALSE"},{"text":"1D, 2B, 3A, 4C","correct":true,"why":"CORRECT"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Traceability assists with:\n• Selecting regression tests in terms of analyzing the impact of changes (1D).\n• Evaluating completeness of test execution which makes testing auditable (2B).\n• Identifying which user stories have open defect reports which improves understandability of test status reports to include status of test basis items (3A).\n• Evaluating whether the number of tests for each requirement is consistent with the level of product risk which provides information to assess test process quality (i.e., alignment of test effort with risk) (4C)."},{"id":"GTB-B-7","source":"GTB Sample Exam B, Q7","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"You are part of a test team involved in the development of a helicopter control system. Recently, an experienced helicopter pilot was hired as a tester for the test team.\nWhat positive effects are the new tester's general competencies LIKELY to have on the test team?","stemAfter":null,"table":null,"options":[{"text":"The application of 3-value boundary value analysis for a more thorough test design in system testing.","correct":false,"why":"FALSE – The ability to use test techniques such as the 3-value boundary value analysis belongs to the category of \"test knowledge\" (see first bullet point). It is not clear from the question that the new tester has dedicated test knowledge."},{"text":"Inconsistencies and ambiguities in the technical requirements are effectively revealed.","correct":true,"why":"CORRECT – Domain knowledge that can be used to understand and communicate with end-users and business representatives is one of the generic skills required by testers. Domain knowledge that the new tester brings to the table according to the question is certainly helpful when it comes to effectively detecting inconsistencies and inaccuracies. This knowledge falls into the category \"knowledge in the application domain\" (see 6th bullet point) A tester with experience as a pilot is effective in reviewing requirements."},{"text":"The use of a tool for automating state-transition testing.","correct":false,"why":"FALSE – The ability to use a tool for automated state-transition testing belongs to the category \"test knowledge\" (see first bullet point). It is not clear from the question that the new tester has dedicated test knowledge."},{"text":"Test results are communicated more constructively and defensively to the developers.","correct":false,"why":"FALSE – A more constructive and defensive communication of test results belongs to the category \"good communication skills\" (see third bullet point). It is not clear from the question that the new tester has good communication skills."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-14","source":"GTB Sample Exam B, Q14","chapter":2,"lo":"FL-2.3.1","k":"K2","stem":"Which of the following decisions should NOT trigger maintenance testing?","stemAfter":null,"table":null,"options":[{"text":"The decision to test the maintainability of the software.","correct":true,"why":"CORRECT – Maintainability is a quality attribute that does not depend on code execution ([CTFL 4.0], Section 3.1.3, 1st paragraph, 5th bullet point). Therefore, it is NOT a trigger for maintenance testing, which is performed as dynamic testing in response to changes in the code or environment (see [CTFL 4.0], Section 2.3, 3rd paragraph including bullet points)."},{"text":"The decision to test the system after migrating to a new operating platform.","correct":false,"why":"FALSE – This is a trigger for maintenance testing (see [CTFL 4.0], Section 2.3, 3rd paragraph, 2nd bullet point). After a platform migration, it is important to verify the functionality and interoperability of the software."},{"text":"The decision to test the recoverability of archived data after decommissioning.","correct":false,"why":"FALSE – This is a trigger for maintenance testing (see [CTFL 4.0], Section 2.3, 3rd paragraph, 3rd bullet point). It is relevant to ensure that archived data can be properly restored."},{"text":"The decision to test after applying a \"hotfix\" to the production version.","correct":false,"why":"FALSE – This is a trigger for maintenance testing (see [CTFL 4.0], Section 2.3, 3rd paragraph, 1st bullet point). After a hotfix, it is important to verify the impact on existing functionality."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-15","source":"GTB Sample Exam B, Q15","chapter":3,"lo":"FL-3.1.2","k":"K2","stem":"Which of the following statements BEST describes the use of static testing?","stemAfter":null,"table":null,"options":[{"text":"Static testing can uncover defects that cannot be found by dynamic tests.","correct":true,"why":"CORRECT – because there are defects that can only be detected through static tests (see [CTFL 4.0], Section 3.1.2, 1st paragraph, last sentence)."},{"text":"Defects in the code can be more efficiently found by dynamic tests than by static tests.","correct":false,"why":"FALSE – Static tests can uncover defects more efficiently, i.e., earlier and usually with fewer resources, than dynamic tests (see [CTFL 4.0], Section 3.1.2, 4th paragraph, 1st sentence)."},{"text":"Static testing can only be performed in a late phase of the SDLC.","correct":false,"why":"FALSE – Static testing can be employed in the early phases of the SDLC (see [CTFL 4.0], Section 3.1.2, 2nd paragraph, 3rd sentence)."},{"text":"To make static testing as efficient as possible, as few stakeholders as possible should be involved.","correct":false,"why":"FALSE – One advantage of static tests, especially reviews, is the improvement of communication and mutual understanding among stakeholders. Therefore, a large number of stakeholders should be involved in static tests (see [CTFL 4.0], Section 3.1.2, 2nd paragraph, last sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-B-23","source":"GTB Sample Exam B, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"Given the following state transition diagram for the software of a battery charger:","stemAfter":"Which of the following test cases includes both valid and invalid transitions?","table":"<div class=\"diag\"><svg role=\"img\" aria-label=\"state transition diagram\" style=\"width:245px;max-width:100%;min-width:186px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 245 432\"><defs/><g><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"60.8003\" x=\"68.5\" y=\"86\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"50.8003\" x=\"73.5\" y=\"110.729\">Standby<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"7\" y=\"186\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"19.5635\" x=\"22.2183\" y=\"210.729\">Off<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"147.1094\" x=\"92.5\" y=\"186\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"137.1094\" x=\"97.5\" y=\"210.729\">Maintenance charging<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"66.1514\" x=\"133\" y=\"286\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"56.1514\" x=\"138\" y=\"310.729\">Charging<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"99\" y=\"386\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"25.7842\" x=\"111.1079\" y=\"410.729\">Low<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"184\" y=\"386\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"28.4692\" x=\"194.7654\" y=\"410.729\">High<\/text><ellipse cx=\"99\" cy=\"16\" fill=\"#222222\" rx=\"10\" ry=\"10\" style=\"stroke:#222222;stroke-width:1;\"/><g id=\"GTB-B-23-link_*start*_SB\"><path d=\"M99,26.09 C99,40.14 99,61.45 99,79.96 \" fill=\"none\" id=\"GTB-B-23-*start*-to-SB\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"99,85.96,103,76.96,99,80.96,95,76.96,99,85.96\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_SB_OFF\"><path d=\"M75.37,126.36 C60.48,143.54 46.0945,163.1441 37.5045,180.3141 \" fill=\"none\" id=\"GTB-B-23-SB-to-OFF\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"34.82,185.68,42.4241,179.4208,37.0571,181.2084,35.2695,175.8414,34.82,185.68\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_OFF_SB\"><path d=\"M56.21,185.68 C71.28,168.51 85.7095,148.9277 94.1295,131.7477 \" fill=\"none\" id=\"GTB-B-23-OFF-to-SB\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"96.77,126.36,89.2174,132.6812,94.5695,130.8498,96.401,136.2019,96.77,126.36\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_SB_MC\"><path d=\"M101.84,126.36 C110.45,143.54 123.5905,163.9758 138.4705,181.1458 \" fill=\"none\" id=\"GTB-B-23-SB-to-MC\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"142.4,185.68,139.5286,176.259,139.1254,181.9015,133.483,181.4983,142.4,185.68\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_MC_SB\"><path d=\"M163.79,185.68 C155.38,168.51 142.2781,148.0493 127.1981,130.8693 \" fill=\"none\" id=\"GTB-B-23-MC-to-SB\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"123.24,126.36,126.1709,135.7626,126.5384,130.1177,132.1833,130.4852,123.24,126.36\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_MC_CH\"><path d=\"M155.6,226.36 C152.46,243.54 151.3906,262.6079 154.5306,279.7779 \" fill=\"none\" id=\"GTB-B-23-MC-to-CH\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"155.61,285.68,157.9257,276.1073,154.7105,280.7616,150.0562,277.5464,155.61,285.68\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_CH_MC\"><path d=\"M177,285.68 C180.33,268.51 181.4684,249.431 178.1484,232.251 \" fill=\"none\" id=\"GTB-B-23-CH-to-MC\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"177.01,226.36,174.7903,235.9555,177.9587,231.2692,182.645,234.4376,177.01,226.36\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_CH_LOW\"><path d=\"M147.31,326.36 C136.8,343.54 127.5288,362.6826 123.3188,379.8526 \" fill=\"none\" id=\"GTB-B-23-CH-to-LOW\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"121.89,385.68,127.9182,377.8915,123.0807,380.8238,120.1483,375.9864,121.89,385.68\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_LOW_CH\"><path d=\"M143.28,385.68 C153.97,368.51 163.2965,349.3807 167.3365,332.2007 \" fill=\"none\" id=\"GTB-B-23-LOW-to-CH\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"168.71,326.36,162.756,334.2054,167.5654,331.2272,170.5436,336.0367,168.71,326.36\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_CH_HIGH\"><path d=\"M164.1,326.36 C168.5,343.54 176.2809,363.4152 186.9609,380.5852 \" fill=\"none\" id=\"GTB-B-23-CH-to-HIGH\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"190.13,385.68,188.773,375.9251,187.4891,381.4343,181.9799,380.1505,190.13,385.68\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"GTB-B-23-link_HIGH_CH\"><path d=\"M211.52,385.68 C207.32,368.51 199.5781,348.6103 188.7081,331.4303 \" fill=\"none\" id=\"GTB-B-23-HIGH-to-CH\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"185.5,326.36,186.9319,336.1042,188.1734,330.5853,193.6923,331.8268,185.5,326.36\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><\/g><\/svg><\/div><p>(Transitions in the diagram are not labelled with events.)<\/p>","options":[{"text":"Start → Standby → Off → Standby → Maintenance charging → Standby","correct":false,"why":"FALSE – This test case only executes valid transitions as it traverses the states according to the diagram."},{"text":"Start → Standby → Maintenance charging → Charging → High → Charging","correct":false,"why":"FALSE – This test case only executes valid transitions as it traverses the states according to the diagram."},{"text":"Start → Standby → Maintenance charging → Charging → Low → Charging","correct":false,"why":"FALSE – This test case only executes valid transitions as it traverses the states according to
