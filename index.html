erformed in \"Test realization\" (see [CTFL 4.0], section 1.4.1, Test realization) ."},{"text":"Analyze the \"lessons learned\" for process improvement","correct":false,"why":"FALSE – this activity is performed in \"Test completion\" (see [CTFL 4.0], section 1.4.1, Test completion)."},{"text":"Evaluate the test basis in terms of testability","correct":true,"why":"CORRECT – this activity is performed in \"Test Analysis\" (see [CTFL 4.0], section 1.4.1: \"Test analysis involves analyzing the test base to identify testable characteristics ...\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-4","source":"GTB Sample Exam F, Q4","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"In general according to the Pareto principle, an above-average number of defects are often found in a few areas of a system. The corresponding failures often result in the system being unusable.\nWhich of the following principles of testing does this describe?","stemAfter":null,"table":null,"options":[{"text":"Testing is context dependent.","correct":false,"why":"FALSE – this principle simply states that testing is practiced differently in different contexts (see [CTFL4.0], section 1.3). Here, however, differences are not discussed at all, only the common aspects."},{"text":"Defects cluster together.","correct":true,"why":"CORRECT – because this principle states that a small number of components of a system typically contain most of the defects (see [CTFL4.0], section 1.3. 4th bullet point). Thats how it is described in the question."},{"text":"Tests wear out.","correct":false,"why":"FALSE – this principle states that after repeated tests, tests become increasingly ineffective at detecting new defects (see [CTFL4.0], section 1.3). However, this case is not described here at all. Instead, it is just a matter of ensuring that the principle that defects occur frequently also applies if they are repeated often. One principle of testing does not cancel out another."},{"text":"Absence of defects fallacy.","correct":false,"why":"FALSE – because this principle focuses on the fact that even a thoroughly verified system with all defects corrected may still not meet user expectations (see [CTFL4.0], section 1.3). However, the question is about the scenario that there are still numerous errors. This means that the basis for the fallacy does not exist at all."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-5","source":"GTB Sample Exam F, Q5","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"Which of the following general competencies is particularly important for passing on discovered failures to the affected developers?","stemAfter":null,"table":null,"options":[{"text":"Test knowledge","correct":false,"why":"FALSE – Testing knowledge is necessary to increase the effectiveness of testing, e.g. through the use of test procedures – see bullet point 1."},{"text":"Critical thinking","correct":false,"why":"FALSE – Critical thinking, analytical thinking is important to increase the effectiveness of testing, e.g. to question assumptions – see bullet point 4."},{"text":"Care","correct":false,"why":"FALSE – Care, thoroughness or attention to detail are important in order to detect defects, especially if they are difficult to detect – see bullet point 2."},{"text":"Communication skills","correct":true,"why":"CORRECT – Communication skills are important for the effective dissemination of information to stakeholders (see [CTFL 4.0], section 1.5.1, bullet point 3) The importance of communication skills is emphasized in the paragraph following the bullets."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-6","source":"GTB Sample Exam F, Q6","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Match the correct description from A to D:\nA. A set of test cases or test scripts to be executed in a particular test cycle.\nB. A sequence of instructions for the execution of a test.\nC. Contains the expected results.\nD. The documentation of a goal and the agenda of a test session.\nto its corresponding test resource (test work results) 1 to 4:\n1. test suite.\n2. test case.\n3. test script.\n4. test charter.","stemAfter":null,"table":null,"options":[{"text":"1A, 2C, 3B, 4D","correct":true,"why":"CORRECT – see above."},{"text":"1D, 2B, 3A, 4C","correct":false,"why":"FALSE – see above."},{"text":"1A, 2C, 3D, 4B","correct":false,"why":"FALSE – see above."},{"text":"1D, 2C, 3B, 4A","correct":false,"why":"FALSE – see above."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Test suite: A set of test scripts or test procedures to be executed in a particular test run. according to the glossary, where \"test procedures\" can be replaced by \"test scripts\" according to the glossary (\"See Also\" for test procedure or synonyms) (1A).\nTest case: according to the glossary: a set of preconditions, inputs, actions (if applicable), expected results and postconditions developed on the basis of test conditions. (2C). Test script: according to the glossary: a sequence of instructions for performing a test. (3B). Test charter: \"The documentation of an objective and agenda for a test session.\" According to the glossary and syllabus: The documentation of test activities in the context of session-based exploratory testing. (4D)."},{"id":"GTB-F-7","source":"GTB Sample Exam F, Q7","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Which of the following is the BEST example of how traceability between test basis, test assets, test results and defects supports testing?","stemAfter":null,"table":null,"options":[{"text":"Conducting an impact analysis provides information about the quality of the system under test.","correct":false,"why":"FALSE – Performing the impact analysis does NOT provide information about the quality of the system under testing, only (as the name suggests) the impact of changes. Change impact analysis helps in selecting appropriate test cases for execution after changes. Only then can the actual quality of the system be assessed (see [CTFL 4.0], section 2.2.3, under “Regression Test”)."},{"text":"The analysis of traceability between test cases and test results provides information about the completeness of test cases.","correct":false,"why":"FALSE – Contrary to the content of this answer option, traceability between requirements and test cases provides information about the completeness of test cases, in this case in relation to the coverage of requirements (see [CTFL 4.0], section 1.4.4, indent 1)."},{"text":"The analysis of traceability by conducting an impact analysis helps in selecting appropriate test cases for regression testing.","correct":true,"why":"CORRECT – Performing a change impact analysis BEST helps in selecting appropriate test cases for regression testing by showing which parts of the test object are affected by the change and which test cases need to be re-run (see [CTFL 4.0], section 1.4.4 – and section 2.2.3, “Regression Test” section)."},{"text":"Analyzing the traceability between the requirements and the test cases helps in analyzing the residual risks.","correct":false,"why":"FALSE – Analyzing traceability between requirements and test cases helps evaluate whether requirements are covered by test cases. The assessment of residual risks is independent of this and can be done through the traceability of test results on risks (see [CTFL 4.0], section 1.4.4, bullet points 1 and 2)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-8","source":"GTB Sample Exam F, Q8","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following statements is an advantage of the whole-team approach?","stemAfter":null,"table":null,"options":[{"text":"Each team member can take on any task they wish.","correct":false,"why":"FALSE – Each team member can perform any task **that they can**, not that they want to. The Whole Team approach requires that team members have the necessary skills to complete the tasks that serve the project goal (see [CTFL 4.0], section 1.5.2, paragraph 2: “…each team member who has the required competencies…”."},{"text":"Every team member is responsible for quality.","correct":true,"why":"CORRECT – The whole-team approach promotes shared responsibility for quality by ensuring that everyone in the team sees quality assurance as part of their role and participates in testing activities (see [CTFL4.0], section 1.5.2, 2nd paragraph, end of sentence 1)."},{"text":"Each team member works separately on their own task.","correct":false,"why":"FALSE – Each team member works **closely with other team members**, not separately. The Whole Team approach improves communication and interaction within the team by having team members share a common workspace (physical or virtual, see [CTFL 4.0], section 1.5.2, paragraph 3)."},{"text":"Each team member has a fixed role and a defined responsibility.","correct":false,"why":"FALSE – Each team member has no **fixed role and responsibility**, but can flexibly take on different tasks. The whole-team approach makes it possible to use and expand the various competencies within the team by allowing team members to learn from and support each other (see [CTFL 4.0], section 1.5.2, paragraph 3)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-10","source":"GTB Sample Exam F, Q10","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following is a good testing practice that applies to all software development life cycles (SDLC)?","stemAfter":null,"table":null,"options":[{"text":"Testers must accompany developers, especially in software development activities for which there are no associated testing activities.","correct":false,"why":"FALSE – for every software development activity there is a corresponding testing activity (see [CTFL 4.0], section 2.1.2, 1st bullet point)."},{"text":"Testers should define different test objectives for each test level to customize the scope and depth of testing.","correct":true,"why":"CORRECT – This is one of the good textual practices described in the syllabus text (see [CTFL 4.0], section 2.1.2, 2nd bullet point). This is a good testing practice that applies to all software development lifecycles, as it allows testers or the test team to tailor testing activities to the specific needs and risks of each testing stage."},{"text":"Testers should only start the test analysis and test design once the requirements and specifications are completely implemented.","correct":false,"why":"FALSE – “Testers will be involved in the review of work products as soon as drafts of this documentation are available…” to follow the principle of early testing (see [CTFL 4.0], section 2.1.2, 4th bullet point)."},{"text":"Testers should not perform reviews of work results in order to focus on test execution.","correct":false,"why":"FALSE – Testers should perform reviews of work results to support the shift-left approach and avoid errors (see [CTFL 4.0], section 2.1.2, 4th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-11","source":"GTB Sample Exam F, Q11","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following test-first approaches uses the given/if/then format to express the desired response of an application?","stemAfter":null,"table":null,"options":[{"text":"Test-driven application (TDD)","correct":false,"why":"FALSE – TDD guides coding through test cases that are necessarily written in a natural language form (see [CTFL 4.0], section 2.1.3, paragraph on TDD)."},{"text":"Acceptance test-driven development (ATDD)","correct":false,"why":"FALSE – ATDD derives tests from acceptance criteria that do not necessarily use the given/if/then format (see [CTFL 4.0], section 2.1.3, ATDD paragraph)."},{"text":"Behavior-driven development (BDD)","correct":true,"why":"CORRECT – as this is one of the characteristics of BDD as described in the syllabus text (see [CTFL 4.0], section 2.1.3, paragraph about the BDD). This is a test-first approach that uses the given/if/then format to express the desired response of an application. BDD is a method that describes and verifies the behavior of the software from the stakeholder's perspective using natural language scenarios."},{"text":"Continuous Integration / Continuous Delivery (CI/CD)","correct":false,"why":"FALSE – CI/CD are technical practices (see [CTFL 4.0], section 2.1.4, 1st paragraph, 2nd sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-12","source":"GTB Sample Exam F, Q12","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Which of the following are benefits of DevOps?","stemAfter":null,"table":null,"options":[{"text":"Faster product release and faster time to market","correct":true,"why":"CORRECT – Faster product release and faster time to market is an advantage of DevOps because it enables the entire team to collaborate and deliver new features and stable software quickly (see [CTFL 4.0], section 2.1.4 2nd paragraph, 1st bullet point and 1st Paragraph, last sentence)."},{"text":"Fast feedback by focusing exclusively on functional testing","correct":false,"why":"FALSE – This is not a benefit of DevOps, the opposite is true. DevOps increases the focus on non-functional quality characteristics (see [CTFL 4.0], section 2.1.4, 2nd paragraph, 4th bullet point)."},{"text":"Shift-Left can minimize the number of regression tests","correct":false,"why":"FALSE – It is not the number of regression tests that is minimized but rather the risk that is minimized through the automated regression (see [CTFL 4.0], section 2.1.4, 2nd paragraph, 6th bullet point)."},{"text":"Cost-effective implementation of the test automation framework.","correct":false,"why":"FALSE – This is not a benefit of DevOps. Setting up a test automation framework always requires investment in tools, infrastructure, skills and maintenance (see [CTFL 4.0], section 2.1.4, 3rd paragraph, 3rd bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-15","source":"GTB Sample Exam F, Q15","chapter":3,"lo":"FL-3.1.1","k":"K1","stem":"Which of the following list of work products can NOT be checked with a static testing technique?","stemAfter":null,"table":null,"options":[{"text":"Test cases and executable test scripts","correct":false,"why":"FALSE – Test cases and test scripts are work results that can be checked by a static test (review or static analysis) (see [CTFL 4.0], section 3.1.1, 1st paragraph)."},{"text":"Requirements specification and acceptance criteria","correct":false,"why":"FALSE – Requirements specifications and acceptance criteria are work products that can be checked by a static test (review or static analysis) (see [CTFL 4.0], Section 3.1.1, 1st paragraph)."},{"text":"Proprietary third-party executable code","correct":true,"why":"CORRECT – Third-party executable code, e.g. operating system software, database software, frameworks that are legally protected, may not be tested with a static test (see [CTFL 4.0], section 3.1.1, 3rd paragraph). Therefore, the correct answer is: Third-party executable code."},{"text":"Project documentation and models","correct":false,"why":"FALSE – Project documentation and models are work results that can be checked through a static test (review or static analysis) (see [CTFL 4.0], section 3.1.1, 1st paragraph)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-16","source":"GTB Sample Exam F, Q16","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Which of the following statements applies to the differences between static and dynamic testing?","stemAfter":null,"table":null,"options":[{"text":"During static testing, failures are found","correct":false,"why":"FALSE – Defects are found through dynamic tests (see [CTFL 4.0], section 3.1.3.; 1st paragraph; 2nd bullet point)"},{"text":"Static testing measures inadequate software performance","correct":false,"why":"FALSE – The software must be running to measure performance (see [CTFL 4.0], section 2.2.2, last paragraph, 2nd sentence (“…check whether a non-functional condition is fulfilled when executing the function…”), if the software is executed during the test, acts it is dynamic testing (see [CTFL 4.0], section 3.1.3.; 1st paragraph; 4th bullet point)."},{"text":"The exclusive goal of static testing is to detect defects as early as possible","correct":false,"why":"FALSE – The goal of both static and dynamic testing is to detect defects as early as possible (see [CTFL 4.0], section 1.3., paragraph 3 “Early testing saves…”)."},{"text":"A lack of coverage of critical safety requirements can be revealed during static testing","correct":true,"why":"CORRECT – This is an example of a gap in traceability or test base coverage that is more easily found in static testing (see [CTFL 4.0], section 3.1.3., Typical defects; 7th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-17","source":"GTB Sample Exam F, Q17","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"Which of the following statements about formal reviews (e.g. inspections) is TRUE?","stemAfter":null,"table":null,"options":[{"text":"The technical review is led by the author","correct":false,"why":"FALSE – A technical review is led by a moderator (see [CTFL 4.0], section 3.2.4, section 3, bullet point 3 “Technical Review”)."},{"text":"The review process consists of several activities, such as planning, communication and analysis, troubleshooting and reporting.","correct":true,"why":"CORRECT – There are several activities during a formal review. Formal reviews follow a structured and systematic process consisting of several activities such as: Planning, review start (“kick-off”), individual review, review session, communication and analysis, remediation and reporting. These activities are intended to ensure that the review is effective and efficient (see [CTFL 4.0], section 3.2.2, paragraph “Activities of the review process”)."},{"text":"Work products to be reviewed are distributed during the review meeting","correct":false,"why":"FALSE – The work results to be reviewed should be distributed as early as possible (see [CTFL 4.0], section 3.2.2, 2nd bullet point)."},{"text":"Defects found during the review are not reported since they are found during dynamic testing anyway","correct":false,"why":"FALSE – Defects found during a review should be reported. The defects found during a review are often those that cannot be found or are difficult to find in dynamic tests, such as logical, conceptual or design defects (see [CTFL 4.0], section 3.2.2, 5th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-19","source":"GTB Sample Exam F, Q19","chapter":4,"lo":"FL-4.1.1","k":"K1","stem":"Which of the following statements describes an advantage of black box testing over white box testing?","stemAfter":null,"table":null,"options":[{"text":"Black box test techniques can check the internal structure and processing of the test object.","correct":false,"why":"FALSE – Black box test techniques are based on an analysis of the specified behavior of the test object without knowledge of the internal structure - the answer describes white box testing procedures (see [CTFL 4.0], section 4.1, paragraph White Box Testing Procedures)."},{"text":"Black box test techniques can be created regardless of the implementation of the software.","correct":true,"why":"CORRECT – This is an advantage of black box test techniques that is described in the syllabus text (see [CTFL 4.0], section 4.1.1). Black box test techniques can be carried out regardless of the implementation of the software. This means that the tester does not need any knowledge of the source code or the internal structure of the software Black box test techniques are therefore suitable for checking e.g. the functionality, usability and performance of the software from the end user's perspective."},{"text":"Black box test techniques better utilize the knowledge and experience of the testers.","correct":false,"why":"FALSE – Experience-based testing approach effectively utilize the knowledge and experience of testers to design and implement test cases (see [CTFL 4.0], section 4.1, Experience-based Testing paragraph)."},{"text":"Black box testing techniques can be performed without adjustment even though the required behavior of the test object has changed.","correct":false,"why":"FALSE – the opposite is true: since black box testing procedures are based on an analysis of the specified behavior, the test cases must be adjusted as soon as the specified behavior changes (see [CTFL 4.0], section 4.1, section Black Box Testing)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-20","source":"GTB Sample Exam F, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"A fitness app measures the number of steps taken daily and provides feedback to motivate the user to stay fit.\nThe feedback for different step counts should be as follows:\n• Up to and including 1000: Couch Potato!\n• Over 1000, up to and including 2000: Get moving!\n• Over 2000, up to and including 4000: On the right track!\n• Over 4000, up to and including 6000: Well done!\n• Over 6000: Super!\nWhich of the following groups of test input values would provide the HIGHEST coverage of equivalence classes?","stemAfter":null,"table":null,"options":[{"text":"0, 1000, 2000, 3000, 4000","correct":false,"why":"0 (1), 1000 (1), 2000 (2), 3000 (3), 4000 (3) – 3 classes (out of 5) = 60% coverage."},{"text":"1000, 2001, 4000, 4001, 6000","correct":false,"why":"1000 (1), 2001 (3), 4000 (3), 4001 (4), 6000 (4) – 3 classes (out of 5) = 60% coverage."},{"text":"123, 2345, 3456, 4567, 5678","correct":false,"why":"123 (1), 2345 (3), 3456 (3), 4567 (4), 5678 (4) – 3 classes (out of 5) = 60% coverage."},{"text":"666, 999, 2222, 5555, 6666","correct":true,"why":"666 (1), 999 (1), 2222 (3), 5555 (4), 6666 (5) – 4 classes (out of 5) = 80% coverage. Therefore, this option is CORRECT."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The following five valid equivalence partitions can be formed (see [CTFL 4.0], Section 4.2.1):\n1) 0 - 1000 - Couch Potato!\n2) 1001 - 2000 - Get moving!\n3) 2001 - 4000 - On the right track!\n4) 4001 - 6000 - Well done!\n5) 6000 - MaxInt - Super!\nTherefore, the groups of test input values cover the following classes:"},{"id":"GTB-F-26","source":"GTB Sample Exam F, Q26","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"What is the purpose of a test charter in session-based exploratory testing?","stemAfter":null,"table":null,"options":[{"text":"The test charter specifies the test objectives for the test session.","correct":true,"why":"CORRECT – as this is the purpose of a test charter described in the syllabus text (see [CTFL 4.0], section 4.4.2, 2nd paragraph, 3rd sentence). The test charter defines the test objectives for the test session. A test charter is a statement of test objectives and possible test ideas on how to test."},{"text":"The test charter documents the steps taken and the findings made.","correct":false,"why":"FALSE – The test session sheets document the steps taken and the findings made (see [CTFL 4.0], section 4.4.2, 2nd paragraph, last sentence)."},{"text":"The test charter is often formulated in the form of questions.","correct":false,"why":"FALSE – While questions can be part of a test charter (e.g. to clarify certain aspects), this is not absolutely necessary. The main function of the test charter is to define the objectives and scope of the test session, whether this is done in the form of questions or not. (see [CTFL 4.0], Section 4.4.3"},{"text":"The test charter evaluates the test results after the test session.","correct":false,"why":"FALSE – The test results are discussed in the debriefing, but not evaluated by the test charter (see [CTFL 4.0], section 4.4.2, 2nd paragraph, 4th sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-27","source":"GTB Sample Exam F, Q27","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"Which of the following statements is MOST LIKELY an advantage of checklist-based testing?","stemAfter":null,"table":null,"options":[{"text":"It enables high repeatability of the tests.","correct":false,"why":"FALSE – since the testers can choose different ways to work through the test conditions of the checklists, an identical repetition is unlikely and therefore this is not an advantage of checklist-based testing (see [CTFL 4.0], section 4.4.3, 4th paragraph, last sentence)."},{"text":"It provides a structured approach to testing without requiring detailed test cases.","correct":false,"why":"FALSE – checklist-based testing does not require detailed test cases but is often formulated in the form of questions based on experience and knowledge etc. (see [CTFL 4.0], section 4.4.3, 1st paragraph, 2nd sentence & 2nd paragraph, 1st sentence)."},{"text":"It covers all requirements for the test object.","correct":false,"why":"FALSE – because checklist-based testing does not cover all requirements, but only those contained in the checklist. The checklist may be incomplete or outdated (see [CTFL 4.0], section 4.4.3, 2nd paragraph, 1st & 2nd sentence)."},{"text":"It supports functional and non-functional testing.","correct":true,"why":"CORRECT – Checklists can support different types of tests including non-functional tests (see [CTFL 4.0], section 4.4.3, 2nd paragraph, 3rd sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""}]</script>
<script>
"use strict";
/* ================= data ================= */
const Q = JSON.parse(document.getElementById("qdata").textContent);
const BYID = Object.create(null); Q.forEach(q => BYID[q.id] = q);
const CH = {1: "Fundamentals of Testing", 2: "Testing Throughout the SDLC", 3: "Static Testing", 4: "Test Analysis and Design"};
const PER_CH = 5, PER_PAGE = 20, LETTERS = "ABCDEFGH";
const POOL = {1: [], 2: [], 3: [], 4: []}; Q.forEach(q => POOL[q.chapter].push(q.id));

/* ================= storage (all wrapped) ================= */
const KS = "swe3043.ctfl.stats.v1", KM = "swe3043.ctfl.marathon.v1", KP = "swe3043.ctfl.prefs.v1";
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
function blankStats() { return {seen: {}, q: {}, ch: {1: {c: 0, a: 0}, 2: {c: 0, a: 0}, 3: {c: 0, a: 0}, 4: {c: 0, a: 0}}}; }
let STATS = load(KS, null) || blankStats();
if (!STATS.seen || !STATS.q || !STATS.ch) STATS = blankStats();
let PREFS = Object.assign({mode: "practice", chapters: [1, 2, 3, 4], shuffle: true, weak: false}, load(KP, {}));

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(c, a) { return a ? Math.round(100 * c / a) : 0; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800); }
function chList(chs) { return "Ch " + chs.slice().sort().join(", "); }

/* ================= paper construction ================= */
function optPerm(q) { const idx = q.options.map((_, i) => i); return q.lockOrder ? idx : shuffle(idx); }

function weakWeight(id) {
  const s = STATS.q[id]; if (!s || !s.w) return 0;
  return s.w * 2 + (s.last === 0 ? 3 : 0) + Math.max(0, s.w - (s.a - s.w)) ;
}
function weightedPick(ids, n, wf) {
  const pool = ids.map(id => ({id, w: wf(id)})).filter(x => x.w > 0), out = [];
  while (out.length < n && pool.length) {
    const tot = pool.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot, k = 0;
    while (k < pool.length - 1 && (r -= pool[k].w) > 0) k++;
    out.push(pool[k].id); pool.splice(k, 1);
  }
  return out;
}
function drawChapter(ch, weak) {
  const ids = POOL[ch]; let picked = [];
  if (weak) picked = weightedPick(ids, PER_CH, weakWeight);
  const rest = ids.filter(id => !picked.includes(id));
  const unseen = shuffle(rest.filter(id => !STATS.seen[id])), seen = shuffle(rest.filter(id => STATS.seen[id]));
  for (const id of unseen.concat(seen)) { if (picked.length >= PER_CH) break; picked.push(id); }
  return picked;
}
function orderIds(groups, shuffleOn) {
  // groups: {ch: [ids]} ; returns {ids, blocks}
  const chs = Object.keys(groups).map(Number).sort();
  if (shuffleOn) return shuffle(chs.flatMap(c => groups[c]));
  return chs.flatMap(c => shuffle(groups[c]));
}
function newPaper(kind, settings, ids) {
  const p = {kind, settings: Object.assign({}, settings), ids, perm: {}, ans: {}, marks: {}, page: 0, finished: false, created: Date.now()};
  ids.forEach(id => p.perm[id] = optPerm(BYID[id]));
  return p;
}
function makePractice(s) {
  const g = {}; s.chapters.forEach(c => g[c] = drawChapter(c, s.weak));
  return newPaper("practice", s, orderIds(g, s.shuffle));
}
function makeMarathon(s) {
  const g = {}; s.chapters.forEach(c => g[c] = POOL[c].slice());
  return newPaper("marathon", s, orderIds(g, s.shuffle));
}
function makeRetry(prev, ids) {
  const s = Object.assign({}, prev.settings);
  return newPaper("retry", s, ids.slice());
}

/* ================= state ================= */
let P = null;           // current paper
let VIEW = "cover";
function persist() { if (P && P.kind === "marathon") { if (P.finished) del(KM); else save(KM, P); } }
function answeredCount(p) { return Object.keys(p.marks).length; }
function scoreOf(p) { return Object.values(p.marks).filter(Boolean).length; }
function pagesOf(p) { return p.kind === "marathon" ? Math.max(1, Math.ceil(p.ids.length / PER_PAGE)) : 1; }
function pageIds(p) { if (p.kind !== "marathon") return p.ids; const s = p.page * PER_PAGE; return p.ids.slice(s, s + PER_PAGE); }

function record(id, ok) {
  const q = BYID[id], s = STATS.q[id] || (STATS.q[id] = {a: 0, w: 0, last: null});
  s.a++; if (!ok) s.w++; s.last = ok ? 1 : 0;
  STATS.seen[id] = 1;
  const c = STATS.ch[q.chapter]; c.a++; if (ok) c.c++;
  save(KS, STATS);
}

/* ================= pen drawing ================= */
function jit(n) { return (Math.random() * 2 - 1) * n; }
function circlePath(cx, cy, rx, ry) {
  // two slightly different loops, start/end overlapping, like a quick pen circle
  const pts = [], turns = 1.12, steps = 28, a0 = -2.2 + jit(.3);
  for (let i = 0; i <= steps; i++) {
    const t = a0 + (i / steps) * Math.PI * 2 * turns;
    const k = 1 + jit(.05) + (i / steps) * 0.08;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]);
  }
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length - 1; i += 2) d += " Q" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1) + " " + pts[i + 1][0].toFixed(1) + " " + pts[i + 1][1].toFixed(1);
  return d;
}
function penCircle(color, animate) {
  const d1 = circlePath(18, 17, 14 + jit(1), 12 + jit(1));
  return `<svg class="pen ${color}${animate ? " draw" : ""}" viewBox="0 0 36 34" aria-hidden="true"><path d="${d1}" stroke-width="1.7" style="--len:120"/></svg>`;
}
function tickSvg(animate) {
  const x0 = 8 + jit(3), y0 = 82 + jit(4), x1 = 94 + jit(3), y1 = 10 + jit(4);
  const mx = (x0 + x1) / 2 + jit(6) - 4, my = (y0 + y1) / 2 + jit(6) + 6;
  return `<svg class="tick${animate ? " draw" : ""}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}" style="--len:160"/></svg>`;
}

/* ================= COVER ================= */
function chapterStat(ch) {
  const c = STATS.ch[ch], seen = POOL[ch].filter(id => STATS.seen[id]).length;
  const acc = c.a ? `${pct(c.c, c.a)}% all-time (${c.c}/${c.a})` : "not attempted yet";
  return `${POOL[ch].length} questions · ${seen} seen · ${acc}`;
}
function savedMarathon() { const m = load(KM, null); return m && m.ids && m.ids.every(id => BYID[id]) && !m.finished ? m : null; }
function weakAvail(chs) { return chs.reduce((n, c) => n + POOL[c].filter(id => weakWeight(id) > 0).length, 0); }

function renderCover() {
  VIEW = "cover";
  const s = PREFS, m = savedMarathon();
  const chs = s.chapters.slice().sort();
  let live;
  if (!chs.length) live = "Tick at least one chapter to set a paper.";
  else if (s.mode === "practice") {
    const n = chs.length * PER_CH;
    live = `This paper will contain ${n} questions (${PER_CH} per chapter).`;
    if (s.weak) { const w = weakAvail(chs); live += w ? ` Weighted toward your ${w} previously missed question${w === 1 ? "" : "s"}.` : " (No missed questions on record yet, so the draw is normal.)"; }
  } else {
    const n = chs.reduce((t, c) => t + POOL[c].length, 0);
    live = `Marathon: ${n} questions from ${chList(chs)}.`;
  }
  const allOn = chs.length === 4;
  const chk = c => `<label class="chk"><input type="checkbox" data-ch="${c}" ${chs.includes(c) ? "checked" : ""}><span class="ct">Ch ${c} ${esc(CH[c])}<span class="stat">${chapterStat(c)}</span></span></label>`;
  $("#app").innerHTML = `
  <div class="sheet cover"><div class="sheet-body">
    <div class="cover-top"><span>SUNWAY UNIVERSITY</span><span>CTFL v4.0 · Ch 1–4</span></div>
    <h1>SWE3043 SOFTWARE TESTING — MCQ PRACTICE</h1>
    <p class="sub">ISTQB® Certified Tester Foundation Level v4.0 · Sample questions</p>
    <hr class="rule">
    <div class="meta"><b>Question bank:</b><span>${Q.length} questions (ISTQB A–D, ASTQB #3–#4, GTB A, B, C, E, F)</span>
      <b>Marking:</b><span>1 mark per question, marked as you answer</span></div>
    <div class="instr-h">INSTRUCTIONS TO CANDIDATES</div>
    ${m ? `<div class="resume"><div><b>Unfinished marathon saved</b></div>
        <button class="box" id="resume">Resume marathon (${answeredCount(m)}/${m.ids.length} answered)</button>
        <div class="small">${chList(m.settings.chapters)} · page ${m.page + 1} of ${pagesOf(m)} · <button class="linkbtn" id="discard">discard</button></div></div>` : ""}
    <ol class="instr">
      <li><span class="lbl">Choose the type of paper.</span>
        <div class="radios">
          <label class="radio ${s.mode === "practice" ? "on" : ""}"><input type="radio" name="mode" value="practice" ${s.mode === "practice" ? "checked" : ""}><span class="rt"><b>Practice paper</b><span>${PER_CH} random questions per selected chapter</span></span></label>
          <label class="radio ${s.mode === "marathon" ? "on" : ""}"><input type="radio" name="mode" value="marathon" ${s.mode === "marathon" ? "checked" : ""}><span class="rt"><b>Marathon</b><span>Every question from the selected chapters, ${PER_PAGE} per page, saved as you go</span></span></label>
        </div></li>
      <li><span class="lbl">Select the chapters to be examined.</span>
        <label class="chk all"><input type="checkbox" id="allch" ${allOn ? "checked" : ""}><span class="ct"><b>Select all chapters</b></span></label>
        ${[1, 2, 3, 4].map(chk).join("")}</li>
      <li><span class="lbl">Options.</span>
        <label class="chk"><input type="checkbox" id="shuf" ${s.shuffle ? "checked" : ""}><span class="ct">Shuffle question order<span class="stat">Off: questions grouped by chapter, random order within each chapter</span></span></label>
        <label class="chk ${s.mode === "marathon" ? "dis" : ""}"><input type="checkbox" id="weak" ${s.weak && s.mode === "practice" ? "checked" : ""} ${s.mode === "marathon" ? "disabled" : ""}><span class="ct">Focus on my weak questions<span class="stat">${s.mode === "marathon" ? "Practice paper only" : "Bias the draw toward questions you have got wrong before"}</span></span></label>
        <div style="margin-top:8px"><button class="smallbox" id="reset">Reset seen questions</button> <span class="muted" style="font-size:14px">${Object.keys(STATS.seen).length} of ${Q.length} seen</span></div></li>
      <li><span class="lbl">Answer every question. Answers cannot be changed once given.</span></li>
    </ol>
    <div class="live" id="live">${esc(live)}</div>
    ${m && s.mode === "marathon" ? `<p class="warn" style="text-align:center">Starting a new marathon will replace the saved one.</p>` : ""}
    <div class="start-wrap"><button class="box" id="start" ${chs.length ? "" : "disabled"}>START</button></div>
  </div><div class="pageno">Cover page</div></div>`;
  window.scrollTo(0, 0);

  document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => { PREFS.mode = r.value; savePrefs(); renderCover(); });
  document.querySelectorAll("input[data-ch]").forEach(cb => cb.onchange = () => {
    const c = +cb.dataset.ch; PREFS.chapters = cb.checked ? [...new Set(PREFS.chapters.concat(c))] : PREFS.chapters.filter(x => x !== c);
    savePrefs(); renderCover();
  });
  $("#allch").onchange = e => { PREFS.chapters = e.target.checked ? [1, 2, 3, 4] : []; savePrefs(); renderCover(); };
  $("#shuf").onchange = e => { PREFS.shuffle = e.target.checked; savePrefs(); renderCover(); };
  $("#weak").onchange = e => { PREFS.weak = e.target.checked; savePrefs(); renderCover(); };
  const rb = $("#reset");
  rb.onclick = () => {
    if (rb.dataset.armed) { STATS.seen = {}; save(KS, STATS); toast("Seen questions cleared"); renderCover(); return; }
    rb.dataset.armed = 1; rb.textContent = "Tap again to confirm reset"; setTimeout(() => { if (rb.isConnected) { delete rb.dataset.armed; rb.textContent = "Reset seen questions"; } }, 3500);
  };
  $("#start").onclick = startFromCover;
  if (m) {
    $("#resume").onclick = () => { P = m; openPaper(); };
    const dc = $("#discard");
    dc.onclick = () => {
      if (dc.dataset.armed) { del(KM); toast("Saved marathon discarded"); renderCover(); return; }
      dc.dataset.armed = 1; dc.textContent = "tap again to discard";
    };
  }
}
function savePrefs() { save(KP, PREFS); }
function startFromCover() {
  const s = {chapters: PREFS.chapters.slice().sort(), shuffle: !!PREFS.shuffle, weak: PREFS.mode === "practice" && !!PREFS.weak};
  if (!s.chapters.length) return;
  P = PREFS.mode === "marathon" ? makeMarathon(s) : makePractice(s);
  if (P.kind === "marathon") persist();
  openPaper();
}

/* ================= PAPER ================= */
function openPaper() {
  renderPaper(); window.scrollTo(0, 0);
}
function progressText() {
  const n = P.ids.length, a = answeredCount(P), sc = scoreOf(P);
  return P.kind === "marathon" ? `Answered ${a}/${n} · Score ${sc} · ${pct(sc, a)}%` : `Answered ${a}/${n} · Score ${sc}`;
}
function qNumber(id) { return P.ids.indexOf(id) + 1; }
function displayOpts(id) { const q = BYID[id]; return P.perm[id].map((oi, k) => ({oi, L: LETTERS[k], o: q.options[oi]})); }
function lettersFor(id, ois) { const perm = P.perm[id]; return ois.map(oi => LETTERS[perm.indexOf(oi)]).sort(); }
function correctOis(id) { return BYID[id].options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0); }

function tableHtml(h) { return h ? `<div class="qtable">${h}</div>` : ""; }
function stemHtml(q) {
  let h = `<div class="stem">${esc(q.stem)}${q.selectCount === 2 ? ` <span class="sel2">(Select TWO)</span>` : ""}</div>`;
  if (q.table) h += `<div class="blank"></div>${tableHtml(q.table)}${q.diagramConverted ? `<div class="dnote">diagram converted to table</div>` : ""}`;
  if (q.stemAfter) h += `<div class="stem2" style="margin-top:1em">${esc(q.stemAfter)}</div>`;
  return h;
}
function questionRow(id, animate) {
  const q = BYID[id], n = qNumber(id), done = id in P.marks, chosen = P.ans[id] || [];
  const corr = correctOis(id), wrong = done && !P.marks[id];
  const opts = displayOpts(id).map(({oi, L, o}) => {
    let marks = "";
    if (chosen.includes(oi)) marks += penCircle("blue", animate);
    if (wrong && corr.includes(oi)) marks += penCircle("red", animate);
    return `<div class="opt${done ? " locked" : ""}" data-id="${id}" data-oi="${oi}" role="button" tabindex="${done ? -1 : 0}" aria-label="Option ${L}">
      <span class="L">${L}.${marks}</span><span class="T">${esc(o.text)}${o.table ? tableHtml(o.table) : ""}</span></div>`;
  }).join("");
  return `<tr class="qrow" id="r-${id}"><td class="num">${n}</td><td class="q">${stemHtml(q)}<div class="opts">${opts}</div></td><td class="ab" id="ab-${id}">${answerBox(id, animate)}</td></tr>`;
}
function answerBox(id, animate) {
  const q = BYID[id], done = id in P.marks, chosen = P.ans[id] || [];
  if (!done) {
    if (q.selectCount === 2) {
      const ls = lettersFor(id, chosen).join(" ");
      return `<div class="ab-inner"><div class="abw">${ls ? `<span class="mine">${ls}</span>` : ""}
        <button class="submit2" data-submit="${id}" ${chosen.length === 2 ? "" : "disabled"}>Submit</button>
        <div class="pend">${chosen.length}/2</div></div></div>`;
    }
    return `<div class="ab-inner"></div>`;
  }
  const mine = lettersFor(id, chosen).join(""), ok = P.marks[id];
  if (ok) return `<div class="ab-inner"><div class="abw"><span class="mine">${mine}</span></div>${tickSvg(animate)}</div>`;
  const fix = lettersFor(id, correctOis(id)).join("");
  return `<div class="ab-inner"><div class="abw"><span class="mine">${mine}</span><span class="x">✗</span><span class="fix">${fix}!</span></div></div>`;
}
function noteRow(id) {
  const q = BYID[id];
  const rows = displayOpts(id).map(({L, o}) => `<div class="ow${o.correct ? " ok" : ""}"><span class="ol">${L}${o.correct ? " ✓" : ""}</span>
    <span class="ot">${o.text ? esc(o.text) : (o.table ? "(table shown in the question)" : "")}</span><span class="wy">${esc(o.why)}</span></div>`).join("");
  const ex = q.explanation ? `<div class="ex">${esc(q.explanation)}</div>` : "";
  const exT = q.explanationTable ? `${q.explanation ? "" : '<div class="ex"></div>'}${tableHtml(q.explanationTable)}` : "";
  return `<tr class="note" id="n-${id}"><td class="nl" style="border-top:0"></td><td colspan="2"><div class="note">
    <div class="nh">Marker's note</div>${rows}${ex}${exT}
    <div class="src">${esc(q.lo)} · ${esc(q.k)} · ${esc(q.source)}${q.diagramConverted ? " · diagram converted to table" : ""}</div></div></td></tr>`;
}
function chapRow(ch) { return `<tr class="chap"><td colspan="3">Chapter ${ch} – ${esc(CH[ch])}</td></tr>`; }

function renderPaper() {
  VIEW = "paper";
  const ids = pageIds(P), pages = pagesOf(P), n = P.ids.length, grouped = !P.settings.shuffle;
  let body = "", lastCh = null;
  if (grouped && P.kind === "marathon" && P.page > 0) { lastCh = BYID[P.ids[P.page * PER_PAGE - 1]].chapter; }
  for (const id of ids) {
    const ch = BYID[id].chapter;
    if (grouped && ch !== lastCh) { body += chapRow(ch); lastCh = ch; }
    body += questionRow(id, false);
    if (id in P.marks) body += noteRow(id);
  }
  const lastPage = P.page === pages - 1;
  const title = P.kind === "marathon" ? `Marathon · ${chList(P.settings.chapters)}` : P.kind === "retry" ? "Retry paper · questions answered wrongly" : `Practice paper · ${chList(P.settings.chapters)}`;
  $("#app").innerHTML = `
  <div class="sticky" id="sticky"><span class="prog" id="prog">${progressText()}</span><button class="linkbtn" id="tocover">Cover page</button></div>
  <div class="sheet"><div class="sheet-body">
    <div class="paper-title">SWE3043 SOFTWARE TESTING<br><span style="font-weight:400;font-size:15px">${esc(title)}</span></div>
    <div class="hdrbox">Answer all ${n} multiple choice questions. 1 mark for each question, total ${n} marks.</div>
    <table class="paper"><colgroup><col class="c-num"><col><col class="c-ab"></colgroup>
      <tr><td class="hl" colspan="2">Write your answer in the answer box.</td><td class="abh">Answer<br>Box</td></tr>
      ${body}
    </table>
    ${lastPage ? `<div class="endp">~ END OF PAPER ~</div>` : ""}
    <div id="tail">${tailHtml()}</div>
  </div><div class="pageno">Page ${P.page + 1} of ${pages}</div></div>`;
  wirePaper();
}
function tailHtml() {
  const pages = pagesOf(P), lastPage = P.page === pages - 1, all = answeredCount(P) === P.ids.length;
  let h = "";
  if (P.kind === "marathon") {
    h += `<div class="pnav"><button class="box" id="prev" ${P.page === 0 ? "disabled" : ""}>‹ Previous page</button>
      <span>Page ${P.page + 1} of ${pages}</span><button class="box" id="next" ${lastPage ? "disabled" : ""}>Next page ›</button></div>`;
    if (!P.finished && !all) h += `<div class="finish-wrap"><button class="box" id="finish">Finish now</button></div>`;
  }
  if (P.finished || all) h += resultsHtml();
  else if (lastPage && P.kind !== "marathon") h += `<p class="pending-note">Results appear here once every question is answered.</p>`;
  return h;
}
function refreshTail() { $("#tail").innerHTML = tailHtml(); wireTail(); }

function wirePaper() {
  $("#tocover").onclick = () => { persist(); goCover(); };
  const tbl = document.querySelector("table.paper");
  tbl.addEventListener("click", e => {
    const sb = e.target.closest("[data-submit]");
    if (sb) { submitTwo(sb.dataset.submit); return; }
    if (e.target.closest(".qtable") && !e.target.closest(".opt .T")) return;
    const op = e.target.closest(".opt"); if (op) choose(op.dataset.id, +op.dataset.oi);
  });
  tbl.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("opt")) { e.preventDefault(); choose(e.target.dataset.id, +e.target.dataset.oi); }
  });
  wireTail();
}
function wireTail() {
  const pv = $("#prev"), nx = $("#next"), fn = $("#finish");
  if (pv) pv.onclick = () => { P.page--; persist(); renderPaper(); window.scrollTo(0, 0); };
  if (nx) nx.onclick = () => { P.page++; persist(); renderPaper(); window.scrollTo(0, 0); };
  if (fn) fn.onclick = () => {
    if (!fn.dataset.armed) { fn.dataset.armed = 1; fn.textContent = answeredCount(P) ? "Tap again to finish and see results" : "Answer at least one question first"; if (!answeredCount(P)) delete fn.dataset.armed; return; }
    P.finished = true; persist(); refreshTail(); const r = $("#results"); if (r) r.scrollIntoView({behavior: "smooth"});
  };
  const rw = $("#retry"), np = $("#newp"), bc = $("#back");
  if (rw) rw.onclick = () => { const w = wrongIds(); if (!w.length) return; P = makeRetry(P, w); renderPaper(); window.scrollTo(0, 0); };
  if (np) np.onclick = () => { const s = P.settings; P = (P.kind === "marathon") ? makeMarathon(s) : makePractice(s); if (P.kind === "marathon") persist(); renderPaper(); window.scrollTo(0, 0); };
  if (bc) bc.onclick = () => goCover();
}
function goCover() { persist(); renderCover(); }

function choose(id, oi) {
  if (P.finished || id in P.marks) return;
  const q = BYID[id];
  if (q.selectCount === 2) {
    const cur = P.ans[id] || [];
    if (cur.includes(oi)) P.ans[id] = cur.filter(x => x !== oi);
    else if (cur.length < 2) P.ans[id] = cur.concat(oi);
    else { toast("Two letters circled — submit or un-circle one"); return; }
    persist(); updateRow(id, true); return;
  }
  P.ans[id] = [oi]; mark(id);
}
function submitTwo(id) { if ((P.ans[id] || []).length === 2 && !(id in P.marks)) mark(id); }
function mark(id) {
  const chosen = (P.ans[id] || []).slice().sort(), corr = correctOis(id).slice().sort();
  const ok = chosen.length === corr.length && chosen.every((x, i) => x === corr[i]);
  P.marks[id] = ok; record(id, ok); persist();
  updateRow(id, true);
  $("#prog").textContent = progressText();
  if (answeredCount(P) === P.ids.length || P.kind === "marathon") refreshTail();
}
function updateRow(id, animate) {
  const old = document.getElementById("r-" + id); if (!old) return;
  const tmp = document.createElement("tbody");
  tmp.innerHTML = questionRow(id, animate) + (id in P.marks ? noteRow(id) : "");
  const oldNote = document.getElementById("n-" + id); if (oldNote) oldNote.remove();
  const frag = document.createDocumentFragment(); while (tmp.firstChild) frag.appendChild(tmp.firstChild);
  old.replaceWith(frag);
  // no re-animation for circles chosen earlier on a select-two row
}

/* ================= RESULTS ================= */
function wrongIds() { return P.ids.filter(id => id in P.marks && !P.marks[id]); }
function resultsHtml() {
  const n = P.ids.length, a = answeredCount(P), sc = scoreOf(P), early = a < n;
  const total = early ? `${sc} / ${a} answered (of ${n})` : `${sc} / ${n}`;
  const chs = [...new Set(P.ids.map(id => BYID[id].chapter))].sort();
  const chRows = chs.map(c => {
    const ids = P.ids.filter(id => BYID[id].chapter === c && id in P.marks), ok = ids.filter(id => P.marks[id]).length;
    return `<tr><td>Ch ${c}</td><td class="n">${ok} / ${ids.length}</td><td class="n">${ids.length ? pct(ok, ids.length) + "%" : "–"}</td></tr>`;
  }).join("");
  let lo = "";
  if (P.kind === "marathon") {
    const m = {};
    P.ids.filter(id => id in P.marks).forEach(id => { const k = BYID[id].lo; (m[k] = m[k] || {c: 0, a: 0}).a++; if (P.marks[id]) m[k].c++; });
    const list = Object.entries(m).sort((x, y) => (x[1].c / x[1].a) - (y[1].c / y[1].a) || y[1].a - x[1].a || x[0].localeCompare(y[0]));
    lo = `<div class="rh">Weakest learning objectives</div><table class="rt"><tr><th>LO</th><th>Correct / Attempted</th></tr>${list.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v.c} / ${v.a}</td></tr>`).join("")}</table>`;
  }
  const wr = wrongIds();
  const wl = wr.length ? wr.map(id => {
    const q = BYID[id], d = displayOpts(id), mine = P.ans[id] || [], corr = correctOis(id);
    const fmt = ois => ois.map(oi => { const x = d.find(z => z.oi === oi); return `${x.L}. ${esc(x.o.text || "(table option)")}`; }).join("<br>");
    return `<details class="wrong"><summary>Q${qNumber(id)} · ${esc(q.lo)} — ${esc(q.stem.slice(0, 80))}${q.stem.length > 80 ? "…" : ""}</summary><div class="wb">
      <div class="ln">${stemHtml(q)}</div>
      <div class="ln">${d.map(x => `<div>${x.L}. ${esc(x.o.text)}${x.o.table ? tableHtml(x.o.table) : ""}</div>`).join("")}</div>
      <div class="ln"><span class="lab">Your answer:</span><br>${fmt(mine.slice().sort((a, b) => P.perm[id].indexOf(a) - P.perm[id].indexOf(b)))}</div>
      <div class="ln"><span class="lab">Correct answer:</span><br>${fmt(corr.slice().sort((a, b) => P.perm[id].indexOf(a) - P.perm[id].indexOf(b)))}</div>
      <table class="paper" style="margin-top:8px"><colgroup><col class="c-num"><col><col class="c-ab"></colgroup>${noteRow(id).replace(/id="n-[^"]+"/, "")}</table>
    </div></details>`;
  }).join("") : `<p style="text-align:center">No wrong answers. Well done.</p>`;
  return `<div class="results" id="results"><h2>RESULTS</h2><div class="total">${total}</div>
    <table class="rt"><tr><th>Chapter</th><th>Score</th><th>%</th></tr>${chRows}</table>
    ${lo}
    <div class="rh">Questions answered wrongly (${wr.length})</div>${wl}
    <div class="btns">${wr.length ? `<button class="box" id="retry">Retry wrong answers</button>` : ""}
      <button class="box" id="newp">New paper, same settings</button><button class="box" id="back">Back to cover page</button></div></div>`;
}

/* ================= test hooks ================= */
window.__ctfl = {Q, POOL, makePractice, makeMarathon, optPerm, get paper() { return P; }, set paper(v) { P = v; }, renderPaper, renderCover, choose, submitTwo, STATS: () => STATS};

renderCover();
</script>
<script>
try { if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e) {}
</script>
