<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9e9e9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CTFL MCQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SWE3043 Software Testing — MCQ Practice</title>
<style>
:root{
  --ink:#111; --pen:#1d3fb8; --red:#c8191e; --rule:#000; --note:#fffbe6; --muted:#555;
  --hand:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;
  --ab:78px; --num:34px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light only}
body{margin:0;background:#e6e6e6;color:var(--ink);
  font-family:Calibri,Carlito,"Segoe UI",Arial,"Helvetica Neue",sans-serif;font-size:17px;line-height:1.38}
button{font:inherit;color:inherit}
.sheet{background:#fff;max-width:820px;margin:22px auto 40px;padding:44px 52px 28px;
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 28px rgba(0,0,0,.12);min-height:calc(100vh - 62px);
  display:flex;flex-direction:column}
.sheet-body{flex:1}
.pageno{text-align:center;font-size:13px;color:#333;margin-top:28px}
@media (max-width:640px){
  body{font-size:16.5px}
  .sheet{margin:0;padding:22px 12px 18px;box-shadow:none;min-height:100vh}
  :root{--ab:72px;--num:28px}
}
/* ---------- cover ---------- */
.cover-top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.02em;margin-bottom:26px}
.cover h1{font-size:23px;text-align:center;margin:8px 0 4px;letter-spacing:.02em;line-height:1.25}
.cover .sub{text-align:center;margin:0 0 4px;font-size:15px}
.cover .rule{border:0;border-top:1.5px solid #000;margin:18px 0 18px}
.cover .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:15px;max-width:460px;margin:0 auto 6px}
.cover .meta b{font-weight:700}
.instr-h{text-align:center;font-weight:700;letter-spacing:.06em;margin:22px 0 12px;text-decoration:underline;text-underline-offset:3px}
.instr{margin:0;padding-left:1.4em}
.instr>li{margin:0 0 16px}
.instr .lbl{font-weight:700;display:block;margin-bottom:6px}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid #000;padding:9px 11px;cursor:pointer;min-height:44px}
.radio input{margin-top:4px;width:18px;height:18px;accent-color:#000;flex:none}
.radio .rt b{display:block}
.radio .rt span{font-size:14.5px;color:var(--muted)}
.radio.on{box-shadow:inset 0 0 0 1px #000}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;cursor:pointer;min-height:40px}
.chk input{width:19px;height:19px;margin-top:2px;accent-color:#000;flex:none}
.chk .ct{flex:1}
.chk .stat{display:block;font-size:14px;color:var(--muted)}
.chk.all{border-bottom:1px dashed #999;margin-bottom:4px;padding-bottom:8px}
.chk.dis{opacity:.45;cursor:not-allowed}
.live{border-top:1px solid #000;border-bottom:1px solid #000;padding:9px 4px;margin:18px 0 16px;font-style:italic;text-align:center}
.resume{border:1.5px dashed #000;padding:12px;margin:0 0 14px;text-align:center}
.resume button.box{margin-top:8px}
.resume .small{font-size:14px;color:var(--muted);margin-top:6px}
.linkbtn{background:none;border:0;padding:2px 4px;text-decoration:underline;cursor:pointer;font-size:14px;color:#333}
.box{display:inline-block;border:1.5px solid #000;background:#fff;padding:10px 22px;cursor:pointer;font-weight:700;letter-spacing:.04em;min-height:44px}
.box:active{background:#f0f0f0}
.box[disabled]{opacity:.4;cursor:not-allowed}
.start-wrap{text-align:center;margin:6px 0 4px}
.start-wrap .box{font-size:19px;padding:12px 56px;border-width:2px}
.smallbox{border:1px solid #000;background:#fff;padding:6px 12px;font-size:14.5px;cursor:pointer;min-height:36px}
.muted{color:var(--muted)}
.warn{font-size:14px;color:#8a1010;margin-top:6px}
/* ---------- paper ---------- */
.sticky{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #000;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-size:15px;
  box-shadow:0 2px 4px rgba(0,0,0,.08)}
.sticky .prog{font-weight:700}
.sheetwrap{max-width:820px;margin:0 auto}
@media (min-width:641px){.sticky{max-width:820px;margin:0 auto}}
.paper-title{text-align:center;font-weight:700;font-size:18px;margin:0 0 12px}
.hdrbox{border:1px solid #000;font-style:italic;padding:6px 10px;margin:0 0 10px;text-align:center}
table.paper{width:100%;border-collapse:collapse;table-layout:fixed}
table.paper td{border:1px solid var(--rule);vertical-align:top}
table.paper td.hl{border:0;border-bottom:1px solid #000;padding:0 6px 4px 0;vertical-align:bottom}
table.paper td.abh{text-align:center;font-size:15.5px;line-height:1.25;padding:6px 2px;border-bottom:1px solid #000}
col.c-num{width:var(--num)} col.c-ab{width:var(--ab)}
td.num{text-align:center;padding:8px 2px}
td.q{padding:8px 10px 12px;overflow:hidden}
td.ab{position:relative;padding:0;text-align:center}
tr.chap td{font-weight:700;padding:7px 10px;background:#fff;font-size:16.5px}
.stem{white-space:pre-line}
.stem+.qtable,.qtable+.stem2{margin-top:1em}
.blank{height:1em}
.stem2{white-space:pre-line}
.sel2{font-weight:700}
.qtable{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.2em 0}
.qtable table,.note table{border-collapse:collapse;margin:.2em 0;font-size:.93em;width:max-content}
.qtable th,.qtable td,.note th,.note td{max-width:15em}
.qtable th,.qtable td,.note th,.note td{border:1px solid #000;padding:3px 7px;text-align:left;vertical-align:top}
.qtable th,.note th{font-weight:700}
.qtable p,.note p{margin:.6em 0 .3em}
pre.code{font-family:Consolas,Menlo,"Courier New",monospace;font-size:14px;margin:.3em 0;white-space:pre;line-height:1.3}
.dnote{font-size:13px;font-style:italic;color:var(--muted);margin-top:2px}
.opts{margin-top:1em}
.opt{display:grid;grid-template-columns:2.1em 1fr;align-items:start;padding:5px 4px 5px 0;margin:0 -4px 0 0;cursor:pointer;
  border-radius:3px;-webkit-tap-highlight-color:rgba(29,63,184,.12);min-height:34px}
.opt:hover{background:#f6f8ff}
.opt.locked{cursor:default}
.opt.locked:hover{background:none}
.opt .L{position:relative;display:inline-block;justify-self:start;padding-left:2px}
.opt .T{white-space:pre-line;min-width:0}
.opt .T .qtable{margin-top:.2em}
.pen{position:absolute;left:-9px;top:-7px;width:38px;height:36px;pointer-events:none;overflow:visible}
.pen path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pen.blue path{stroke:var(--pen)}
.pen.red path{stroke:var(--red)}
.draw path{stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200);animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hand{font-family:var(--hand);color:var(--pen);font-size:34px;line-height:1;letter-spacing:.02em}
.ab-inner{position:relative;min-height:100%;padding:44px 2px 8px}
.abw{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 3px;padding:0 2px}
.abw .mine{font-family:var(--hand);color:var(--pen);font-size:30px;line-height:1.1}
.abw .x{font-family:var(--hand);color:var(--red);font-size:20px;line-height:1.1}
.abw .fix{font-family:var(--hand);color:var(--red);font-size:26px;line-height:1.1;white-space:nowrap}
.tick{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tick path{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round}
.abw .submit2,.abw .pend{flex-basis:100%;text-align:center}
.submit2{font-family:var(--hand);font-size:17px;color:var(--pen);border:1.5px solid var(--pen);background:#fff;
  padding:3px 6px;margin-top:6px;cursor:pointer;border-radius:2px 6px 3px 5px;transform:rotate(-2deg)}
.submit2[disabled]{opacity:.35;cursor:not-allowed}
.pend{font-size:12.5px;color:var(--muted);margin-top:4px}
tr.note td{background:var(--note);font-size:15px;line-height:1.36;padding:10px 12px}
tr.note td.nl{background:#fff}
.note .nh{font-weight:700;font-style:italic;margin-bottom:6px;font-family:var(--hand);color:var(--red);font-size:16px}
.note .ow{display:grid;grid-template-columns:2.2em 1fr;gap:0 2px;margin:0 0 8px}
.note .ow .ol{font-weight:700}
.note .ow.ok .ol{color:#0a6b2a}
.note .ow .ot{font-weight:700;white-space:pre-line}
.note .ow .wy{grid-column:2;white-space:pre-line;color:#222}
.note .ex{white-space:pre-line;margin:8px 0 6px;border-top:1px dotted #b9a64a;padding-top:8px}
.note .src{font-size:13.5px;color:#4a4a4a;margin-top:6px}
.endp{text-align:center;font-weight:700;margin:26px 0 8px;letter-spacing:.08em}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.pnav .box{padding:9px 14px;font-size:15px}
.finish-wrap{text-align:center;margin-top:14px}
.pending-note{text-align:center;font-style:italic;color:var(--muted);margin:10px 0}
/* ---------- results ---------- */
.results{margin-top:18px;border-top:1.5px solid #000;padding-top:14px}
.results h2{font-size:19px;text-align:center;margin:0 0 6px;letter-spacing:.04em}
.total{text-align:center;font-size:26px;font-family:var(--hand);color:var(--red);margin:6px 0 14px}
table.rt{border-collapse:collapse;margin:8px auto 16px;min-width:260px;font-size:15.5px}
table.rt th,table.rt td{border:1px solid #000;padding:5px 12px;text-align:left}
table.rt td.n{text-align:right}
.rh{font-weight:700;margin:16px 0 6px}
details.wrong{border:1px solid #000;margin:0 0 8px;background:#fff}
details.wrong summary{cursor:pointer;padding:8px 10px;list-style-position:inside;font-size:15.5px}
details.wrong .wb{padding:4px 12px 12px;border-top:1px dashed #999;font-size:15px}
.wb .ln{margin:6px 0}
.wb .lab{font-weight:700}
.btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin:18px auto 4px;max-width:360px}
.btns .box{text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script type="application/json" id="qdata">[{"id":"ISTQB-A-1","source":"ISTQB Sample Exam A, Q1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which of the following statements describe a valid test objective?","stemAfter":null,"table":null,"options":[{"text":"To prove that there are no unfixed defects in the system under test","correct":false,"why":"Is not correct. It is impossible to prove that there are no defects anymore in the system under test. See testing principle 1"},{"text":"To prove that there will be no failures after the implementation of the system into production","correct":false,"why":"Is not correct. See testing principle 7"},{"text":"To reduce the risk level of the test object and to build confidence in the quality level","correct":true,"why":"Is correct. Testing finds defects and failures which reduces the level of risk and at the same time gives more confidence in the quality level of the test object"},{"text":"To verify that there are no untested combinations of inputs","correct":false,"why":"Is not correct. It is impossible to test all combinations of inputs (see testing principle 2)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-2","source":"ISTQB Sample Exam A, Q2","chapter":1,"lo":"FL-1.2.1","k":"K2","stem":"Which of the following options shows an example of test activities that contribute to success?","stemAfter":null,"table":null,"options":[{"text":"Having testers involved during various software development lifecycle (SDLC) activities will help to detect defects in work products","correct":true,"why":"Is correct. It is important that testers are involved from the beginning of the software development lifecycle (SDLC). It will increase understanding of design decisions and will detect defects early."},{"text":"Testers try not to disturb the developers while coding, so that the developers write better code","correct":false,"why":"Is not correct. Both developers and testers will have more understanding of each other's work products and how to test the code"},{"text":"Testers collaborating with end users help to improve the quality of defect reports during component integration and system testing","correct":false,"why":"Is not correct. End users will not help the testers in increasing the quality of defect reports; also, users usually do not participate in low-level testing levels like integration testing"},{"text":"Certified testers will design much better test cases than non-certified testers","correct":false,"why":"Is not correct. Being certified does not automatically mean that the tester will be better in test design"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-3","source":"ISTQB Sample Exam A, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"You have been assigned as a tester to a team producing a new system incrementally. You have noticed that no changes have been made to the existing regression test cases for several iterations and no new regression defects were identified. Your manager is happy, but you are not. Which testing principle explains your skepticism?","stemAfter":null,"table":null,"options":[{"text":"Tests wear out","correct":true,"why":"Is correct. This principle means that if the same tests are repeated over and over again, eventually these tests no longer find any new defects. This is probably why the tests all passed in this release as well"},{"text":"Absence-of-defects fallacy","correct":false,"why":"Is not correct. This principle says about the mistaken belief that just finding and fixing a large number of defects will ensure the success of a system"},{"text":"Defects cluster together","correct":false,"why":"Is not correct. This principle says that a small number of components usually contain most of the defects"},{"text":"Exhaustive testing is impossible","correct":false,"why":"Is not correct. This principle states that testing all combinations of inputs and preconditions is not feasible"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-4","source":"ISTQB Sample Exam A, Q4","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"You work in a team that develops a mobile application for food ordering. In the current iteration the team decided to implement the payment functionality.\nWhich of the following activities is a part of test analysis?","stemAfter":null,"table":null,"options":[{"text":"Estimating that testing the integration with the payment service will take 8 person-days","correct":false,"why":"Is not correct. Estimating the test effort is part of test planning"},{"text":"Deciding that the team should test if it is possible to properly share payment between many users","correct":true,"why":"Is correct. This is an example of defining test conditions which is a part of test analysis"},{"text":"Using boundary value analysis (BVA) to derive the test data for the test cases that check the correct payment processing for the minimum allowed amount to be paid","correct":false,"why":"Is not correct. Using test techniques to derive coverage items is a part of test design"},{"text":"Analyzing the discrepancy between the actual result and expected result after executing a test case that checks the process of payment with a credit card, and reporting a defect","correct":false,"why":"Is not correct. Reporting defects found during dynamic testing is a part of test execution"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-5","source":"ISTQB Sample Exam A, Q5","chapter":1,"lo":"FL-1.4.2","k":"K2","stem":"Which of the following factors have a SIGNIFICANT influence on the test approach?\n\ni. The SDLC\nii. The number of defects detected in previous projects\niii. The identified product risks\niv. New regulatory requirements forcing formal white-box testing\nv. The test environment setup","stemAfter":null,"table":null,"options":[{"text":"i, ii have significant influence","correct":false,"why":"Is not correct"},{"text":"i, iii, iv have significant influence","correct":true,"why":"Is correct"},{"text":"ii, iv, v have significant influence","correct":false,"why":"Is not correct"},{"text":"iii, v have significant influence","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"i. Is true. The SDLC has an influence on the test approach\nii. Is false. The number of defects detected in previous projects may have some influence, but this is not as significant as i, iii and iv\niii. Is true. The identified product risks are one of the most important factors influencing the test approach\niv. Is true. Regulatory requirements are important factors influencing the test approach\nv. Is false. The test environment has no significant influence on the test approach"},{"id":"ISTQB-A-6","source":"ISTQB Sample Exam A, Q6","chapter":1,"lo":"FL-1.4.5","k":"K2","stem":"Which TWO of the following tasks belong MAINLY to a testing role?","stemAfter":null,"table":null,"options":[{"text":"Configure test environments","correct":true,"why":"Is correct. This is done by the testers"},{"text":"Maintain the product backlog","correct":false,"why":"Is not correct. The product backlog is built and maintained by the product owner"},{"text":"Design solutions to new requirements","correct":false,"why":"Is not correct. This is done by the development team"},{"text":"Create the test plan","correct":false,"why":"Is not correct. This is a managerial role"},{"text":"Analyze the test basis","correct":true,"why":"Is correct. This is done by the testers since its technical task done as part of a test analysis."}],"selectCount":2,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-7","source":"ISTQB Sample Exam A, Q7","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"Which of the following skills (i-v) are the MOST important skills of a tester?\n\ni. Having domain knowledge\nii. Creating a product vision\niii. Being a good team player\niv. Planning and organizing the work of the team\nv. Critical thinking","stemAfter":null,"table":null,"options":[{"text":"ii and iv are important","correct":false,"why":"Is not correct"},{"text":"i, iii and v are important","correct":true,"why":"Is correct"},{"text":"i, ii and v are important","correct":false,"why":"Is not correct"},{"text":"iii and iv are important","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"i. Is true. Having domain knowledge is an important tester skill\nii. Is false. This is a task of the business analyst together with the business representative\niii. Is true. Being a good team player is an important skill\niv. Is false. Planning and organizing the work of the team is a task of the test manager or, mostly in an Agile software development project, the whole team and not just the tester\nv. Is true. Critical thinking is one of the most important skills of testers"},{"id":"ISTQB-A-8","source":"ISTQB Sample Exam A, Q8","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"How is the whole team approach present in the interactions between testers and business representatives?","stemAfter":null,"table":null,"options":[{"text":"Business representatives decide on test automation approaches","correct":false,"why":"Is not correct. The test automation approach is defined by testers with the help of developers and business representatives"},{"text":"Testers help business representatives to define a test strategy","correct":false,"why":"Is not correct. The test strategy is decided in collaboration with the developers"},{"text":"Business representatives are not part of the whole team approach","correct":false,"why":"Is not correct. Testers, developers, and business representatives are part of the whole team approach"},{"text":"Testers help business representatives to create suitable acceptance tests","correct":true,"why":"Is correct. Testers will work closely with business representatives to ensure that the desired quality levels are achieved. This includes supporting and collaborating with them to help them create suitable acceptance tests"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-9","source":"ISTQB Sample Exam A, Q9","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Consider the following rule: “for every SDLC activity there is a corresponding test activity”. In which SDLC models does this rule hold?","stemAfter":null,"table":null,"options":[{"text":"Only in sequential development models","correct":false,"why":"Is not correct"},{"text":"Only in iterative development models","correct":false,"why":"Is not correct"},{"text":"Only in iterative and incremental development models","correct":false,"why":"Is not correct"},{"text":"In sequential, incremental, and iterative development models","correct":true,"why":"Is correct. This rule holds for all SDLC models"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-10","source":"ISTQB Sample Exam A, Q10","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following statements BEST describes the acceptance test-driven development (ATDD) approach?","stemAfter":null,"table":null,"options":[{"text":"In ATDD, acceptance criteria are typically created based on the given/when/then format","correct":false,"why":"Is not correct. It is more often used in behavior-driven development (BDD)"},{"text":"In ATDD, test cases are mainly created at component testing and are code-oriented","correct":false,"why":"Is not correct. It is the description of test-driven development (TDD)"},{"text":"In ATDD, tests are created, based on acceptance criteria to drive the development of the related software","correct":true,"why":"Is correct. In acceptance test-driven development (ATDD) tests are written from acceptance criteria as part of the design process"},{"text":"in ATDD, tests are based on the desired behavior of the software, which makes it easier for team members to understand them","correct":false,"why":"Is not correct. It is used in BDD"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-11","source":"ISTQB Sample Exam A, Q11","chapter":2,"lo":"FL-2.1.5","k":"K2","stem":"Which of the following is NOT an example of the shift-left approach?","stemAfter":null,"table":null,"options":[{"text":"Reviewing the user requirements before they are formally accepted by the stakeholders","correct":false,"why":"Is not correct. Early review is an example of the shift-left approach"},{"text":"Writing a component test before the corresponding code is written","correct":false,"why":"Is not correct. TDD is an example of the shift-left approach"},{"text":"Executing a performance efficiency test for a component during component testing","correct":false,"why":"Is not correct. Early non-functional testing is an example of the shift-left approach"},{"text":"Writing a test script before setting up the configuration management process","correct":true,"why":"Is correct. Test scripts should be subject to configuration management, so it makes no sense to create the test scripts before this process is set up"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-12","source":"ISTQB Sample Exam A, Q12","chapter":2,"lo":"FL-2.1.6","k":"K2","stem":"Which of the arguments below would you use to convince your manager to organize retrospectives at the end of each release cycle?","stemAfter":null,"table":null,"options":[{"text":"Retrospectives are very popular these days and clients would appreciate it if we added them to our processes","correct":false,"why":"Is not correct. Retrospectives are more useful for identifying improvement opportunities and have little importance for clients"},{"text":"Organizing retrospectives will save the organization money because without them end user representatives do not provide immediate feedback about the product","correct":false,"why":"Is not correct. Retrospectives are not aimed to collect feedback about the product, but about the process. Additionally, retrospectives are internal activity for the team and should not include end user representatives"},{"text":"Process weaknesses identified during the retrospective can be analyzed and serve as a to do list for the organization’s continuous process improvement program","correct":true,"why":"Is correct. Regularly conducted retrospectives, when appropriate follow up activities occur, are critical to continual improvement of development and testing"},{"text":"Retrospectives embrace five values including courage and respect, which are crucial to maintain continuous improvement in the organization","correct":false,"why":"Is not correct. Courage and respect are values of Extreme Programming and are not closely related to retrospectives"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-13","source":"ISTQB Sample Exam A, Q13","chapter":2,"lo":"FL-2.2.1","k":"K2","stem":"Which types of failures (1-4) fit which test levels (A-D) BEST?\n\n1. Failures in system behavior as it deviates from the user’s business needs\n2. Failures in communication between components\n3. Failures in logic in the code\n4. Failures in not correctly implemented business rules\n\nA. Component testing\nB. Component integration testing\nC. System testing\nD. Acceptance testing","stemAfter":null,"table":null,"options":[{"text":"1D, 2B, 3A, 4C","correct":true,"why":"Is correct"},{"text":"1D, 2B, 3C, 4A","correct":false,"why":"Is not correct"},{"text":"1B, 2A, 3D, 4C","correct":false,"why":"Is not correct"},{"text":"1C, 2B, 3A, 4D","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering:\n• The test basis for acceptance testing is the user’s business needs (1D)\n• Communication between components is tested during component integration testing (2B)\n• Failures in logic can be found during component testing (3A)\n• Business rules are the test basis for system testing (4C)"},{"id":"ISTQB-A-14","source":"ISTQB Sample Exam A, Q14","chapter":2,"lo":"FL-2.2.3","k":"K2","stem":"You are testing a user story with three acceptance criteria: AC1, AC2 and AC3. AC1 is covered by test case TC1, AC2 by TC2, and AC3 by TC3. The test execution history had three test runs on three consecutive versions of the software as follows:","stemAfter":"Tests are repeated once you are informed that all defects found in the test run are corrected and a new version of the software is available.\nWhich of the above tests are executed as regression tests?","table":"<table class=\"qt\"><tr><th><\/th><th>Execution 1<\/th><th>Execution 2<\/th><th>Execution 3<\/th><\/tr><tr><td>TC1<\/td><td>(1) Failed<\/td><td>(4) Passed<\/td><td>(7) Passed<\/td><\/tr><tr><td>TC2<\/td><td>(2) Passed<\/td><td>(5) Failed<\/td><td>(8) Passed<\/td><\/tr><tr><td>TC3<\/td><td>(3) Failed<\/td><td>(6) Failed<\/td><td>(9) Passed<\/td><\/tr><\/table>","options":[{"text":"Only 4, 7, 8, 9","correct":false,"why":"Is not correct"},{"text":"Only 5, 7","correct":true,"why":"Is correct"},{"text":"Only 4, 6, 8, 9","correct":false,"why":"Is not correct"},{"text":"Only 5, 6","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Because TC1 and TC3 failed in Execution 1 (i.e., test (1) and test (3)), test (4) and test (6) are confirmation tests.\nBecause TC2 and TC3 failed in Execution 2 (i.e., tests (5) and (6)), test (8) and test (9) are also confirmation tests.\nTC2 passed in Execution 1 (i.e., test (2)), so test (5) is a regression test. TC1 passed in the Execution 2 (i.e., test (4)), so test (7) is also a regression test."},{"id":"ISTQB-A-15","source":"ISTQB Sample Exam A, Q15","chapter":3,"lo":"FL-3.1.2","k":"K2","stem":"Which of the following is NOT a benefit of static testing?","stemAfter":null,"table":null,"options":[{"text":"Having less expensive defect management due to the ease of detecting defects later in the SDLC","correct":true,"why":"Is correct. Defect management is no less expensive. Finding and fixing defects later in the SDLC is more costly"},{"text":"Fixing defects found during static testing is generally much less expensive than fixing defects found during dynamic testing","correct":false,"why":"Is not correct. This is a benefit of static testing"},{"text":"Finding coding defects that might not have been found by only performing dynamic testing","correct":false,"why":"Is not correct. This is a benefit of static testing"},{"text":"Detecting gaps and inconsistencies in requirements","correct":false,"why":"Is not correct. This is a benefit of static testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-16","source":"ISTQB Sample Exam A, Q16","chapter":3,"lo":"FL-3.2.1","k":"K1","stem":"Which of the following is a benefit of early and frequent feedback?","stemAfter":null,"table":null,"options":[{"text":"It improves the test process for future projects","correct":false,"why":"Is not correct. Feedback can improve the test process, but if one only wants to improve future projects, the feedback does not need to come early or frequently"},{"text":"It forces customers to prioritize their requirements based on agreed risks","correct":false,"why":"Is not correct. Feedback is not used to prioritize requirements"},{"text":"It provides a measure for the quality of changes","correct":false,"why":"Is not correct. There is no one, recommended way to measure quality of changes. Also, this is not one of the benefits of early feedback that are mentioned in section 3.2.1"},{"text":"It helps avoid requirements misunderstandings","correct":true,"why":"Is correct. Early and frequent feedback can prevent misunderstandings about requirements"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-17","source":"ISTQB Sample Exam A, Q17","chapter":3,"lo":"FL-3.2.4","k":"K2","stem":"The reviews being used in your organization have the following attributes:\n• There is the role of a scribe\n• The main purpose is to evaluate quality\n• The meeting is led by the author of the work product\n• There is individual preparation\n• A review report is produced\nWhich of the following review types is MOST likely being used?","stemAfter":null,"table":null,"options":[{"text":"Informal review","correct":false,"why":"Is not correct"},{"text":"Walkthrough","correct":true,"why":"Is correct"},{"text":"Technical review","correct":false,"why":"Is not correct"},{"text":"Inspection","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering the attributes:\n• Specified for walkthroughs, technical reviews, and inspections; thus, the reviews being performed cannot be informal reviews\n• The purpose of evaluating quality is one of the most important objectives of a walkthrough\n• This is not allowed for inspections and is typically not done in technical reviews. A moderator is needed in walkthroughs and is allowed for informal reviews\n• All types of reviews can include individual preparation (even informal reviews)\n• All types of reviews can produce a review report, although informal reviews do not require documentation"},{"id":"ISTQB-A-18","source":"ISTQB Sample Exam A, Q18","chapter":3,"lo":"FL-3.2.5","k":"K1","stem":"Which of these statements is NOT a factor that contributes to successful reviews?","stemAfter":null,"table":null,"options":[{"text":"Participants should dedicate adequate time for the review","correct":false,"why":"Is not correct. Adequate time for individuals is a success factor"},{"text":"Splitting large work products into small parts to make the required effort less intense","correct":false,"why":"Is not correct. Splitting work products into small adequate parts is a success factor"},{"text":"Participants should avoid behaviors that might indicate boredom, exasperation, or hostility to other participants","correct":false,"why":"Is not correct. Avoiding behaviors that might indicate boredom, exasperation, etc. is a success factor"},{"text":"Failures found should be acknowledged, appreciated, and handled objectively","correct":true,"why":"Is correct. During reviews one can find defects, not failures"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-19","source":"ISTQB Sample Exam A, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"Which of the following is a characteristic of experience-based test techniques?","stemAfter":null,"table":null,"options":[{"text":"Test cases are created based on detailed design information","correct":false,"why":"Is not correct. This is a common characteristic of white-box test techniques. Test conditions, test cases, and test data are derived from a test basis that may include code, software architecture, detailed design, or any other source of information regarding the structure of the software."},{"text":"Items tested within the interface code section are used to measure coverage","correct":false,"why":"Is not correct. This is a common characteristic of white-box test techniques. Coverage is measured based on the items tested within a selected structure and the test technique applied to the test basis"},{"text":"The test techniques heavily rely on the tester’s knowledge of the software and the business domain","correct":true,"why":"Is correct. This is a common characteristic of experience-based test techniques. This knowledge and experience include expected use of the software, its environment, likely defects, and the distribution of those defects is used to define tests"},{"text":"The test cases are used to identify deviations from the requirements","correct":false,"why":"Is not correct. This is a common characteristic of black-box test techniques. Test cases may be used to detect gaps within requirements and the implementation of the requirements, as well as deviations from the requirements"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-20","source":"ISTQB Sample Exam A, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"You are testing a simplified apartment search form which has only two search criteria:\n• floor (with three possible options: ground floor; first floor; second or higher floor)\n• garden type (with three possible options: no garden; small garden; large garden)\nEach of the apartment on the ground floor has a garden, apartments on higher floors don’t. The form has a built-in validation mechanism that will not allow you to use the search criteria which violate this rule.\n\nEach test has two input values: floor and garden type. You want to apply equivalence partitioning (EP) to cover each floor and each garden type in your tests.\n\nWhat is the minimal number of test cases to achieve 100% EP coverage for valid partitions?","stemAfter":null,"table":null,"options":[{"text":"3","correct":false,"why":"Is not correct"},{"text":"4","correct":true,"why":"Is correct"},{"text":"5","correct":false,"why":"Is not correct"},{"text":"6","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The situation presented in the question is described in the syllabus as “each choice” coverage.\n\n“Small garden” and “large garden” can go only with “ground floor”, so we need two test cases with “ground floor” which cover these two “garden type” partitions.\nWe need two more test cases to cover the two other “floor” partitions. The remaining ”garden type” partition of “no garden” is covered by these tests. We need a total of four test cases:\nTC1 (ground floor, small garden)\nTC2 (ground floor, large garden)\nTC3 (first floor, no garden)\nTC4 (second or higher floor, no garden)"},{"id":"ISTQB-A-21","source":"ISTQB Sample Exam A, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"You are testing a system that calculates the final course grade for a given student.\nThe final grade is assigned based on the final result, according to the following rules:\n• 0 – 50 points: failed\n• 51 – 60 points: fair\n• 61 – 70 points: satisfactory\n• 71 – 80 points: good\n• 81 – 90 points: very good\n• 91 – 100 points: excellent\nYou have prepared the following set of test cases:","stemAfter":"What is the 2-value boundary value analysis (BVA) coverage for the final result that is achieved with the existing test cases?","table":"<table class=\"qt\"><tr><th><\/th><th>Final result<\/th><th>Final grade<\/th><\/tr><tr><td>TC1<\/td><td>91<\/td><td>excellent<\/td><\/tr><tr><td>TC2<\/td><td>50<\/td><td>failed<\/td><\/tr><tr><td>TC3<\/td><td>81<\/td><td>very good<\/td><\/tr><tr><td>TC4<\/td><td>60<\/td><td>fair<\/td><\/tr><tr><td>TC5<\/td><td>70<\/td><td>satisfactory<\/td><\/tr><tr><td>TC6<\/td><td>80<\/td><td>good<\/td><\/tr><\/table>","options":[{"text":"50%","correct":true,"why":"Is correct"},{"text":"60%","correct":false,"why":"Is not correct"},{"text":"33.3%","correct":false,"why":"Is not correct"},{"text":"100%","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are 12 boundary values for the final result values: 0, 50, 51, 60, 61, 70, 71, 80, 81, 90, 91, and 100.\nThe test cases cover six of them (TC1 – 91, TC2 – 50, TC3 – 81, TC4 – 60, TC5 – 70 and TC7 – 51).\nTherefore, the test cases cover 6/12 = 50%."},{"id":"ISTQB-A-22","source":"ISTQB Sample Exam A, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"Your favorite bicycle daily rental store has just introduced a new Customer Relationship Management system and asked you, one of their most loyal members, to test it.\nThe implemented features are as follows:\n• Anyone can rent a bicycle, but members receive a 20% discount\n• However, if the return deadline is missed, the discount is no longer available\n• After 15 rentals, members get a gift: a T-Shirt\nDecision table describing the implemented features looks as follows:","stemAfter":"Based ONLY on the feature description of the Customer Relationship Management system, which of the above rules describes an impossible situation?","table":"<table class=\"qt\"><tr><th>Conditions<\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>R5<\/th><th>R6<\/th><th>R7<\/th><th>R8<\/th><\/tr><tr><td>Being a member<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>Missed deadline<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>T<\/td><\/tr><tr><td>15th rental<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><\/tr><tr><td>Actions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20% discount<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Gift T-Shirt<\/td><td><\/td><td><\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><\/tr><\/table>","options":[{"text":"R4","correct":false,"why":"Is not correct. A member without a missed deadline can get a discount and a gift T-Shirt after 15 bicycle rentals"},{"text":"R2","correct":false,"why":"Is not correct. A member without a missed deadline can get a discount but no gift T-Shirt until they rented a bicycle 15 times"},{"text":"R6","correct":false,"why":"Is not correct. Non-members cannot get a discount, even if they did not miss a deadline yet"},{"text":"R8","correct":true,"why":"Is correct. No discount as a non-member that has also missed a deadline, but only members can receive a gift T-Shirt. Hence, the action is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-23","source":"ISTQB Sample Exam A, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"You test a system whose lifecycle is modeled by the state transition diagram shown below. The system starts in the INIT state and ends its operation in the OFF state.","stemAfter":"What is the MINIMAL number of test cases to achieve valid transitions coverage?","table":"<table class=\"qt\"><tr><th>From state<\/th><th>Event<\/th><th>To state<\/th><\/tr><tr><td>INIT<\/td><td>test<\/td><td>DEBUG MODE<\/td><\/tr><tr><td>INIT<\/td><td>run<\/td><td>IN OPERATION<\/td><\/tr><tr><td>IN OPERATION<\/td><td>error<\/td><td>DEBUG MODE<\/td><\/tr><tr><td>IN OPERATION<\/td><td>pause<\/td><td>ON HOLD<\/td><\/tr><tr><td>ON HOLD<\/td><td>resume<\/td><td>IN OPERATION<\/td><\/tr><tr><td>DEBUG MODE<\/td><td>done<\/td><td>OFF<\/td><\/tr><tr><td>ON HOLD<\/td><td>done<\/td><td>OFF<\/td><\/tr><\/table>","options":[{"text":"4","correct":false,"why":"Is not correct"},{"text":"2","correct":false,"why":"Is not correct"},{"text":"7","correct":false,"why":"Is not correct"},{"text":"3","correct":true,"why":"Is correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"“test” and “error” transitions cannot occur in one test case. Neither can both “done” transitions.\nThis means we need at least three test cases to achieve transition coverage. For example:\nTC1: test, done\nTC2: run, error, done\nTC3: run, pause, resume, pause, done"},{"id":"ISTQB-A-24","source":"ISTQB Sample Exam A, Q24","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"Your test suite achieved 100% statement coverage. What is the consequence of this fact?","stemAfter":null,"table":null,"options":[{"text":"Each instruction in the code that contains a defect has been executed at least once","correct":true,"why":"Is correct. Since 100% statement coverage is achieved, every statement, including the ones with defects, must have been executed and evaluated at least once"},{"text":"Any test suite containing more test cases than your test suite will also achieve 100% statement coverage","correct":false,"why":"Is not correct. Coverage depends on what is tested, not on the number of test cases. For example, for code “if (x==0) y=1”, one test case (x=0) achieves 100% statement coverage, but two test cases (x=1) and (x=2) together achieve only 50% statement coverage"},{"text":"Each path in the code has been executed at least once","correct":false,"why":"Is not correct. If there is a loop in the code there may be an infinite number of possible paths, so it is not possible to execute all the possible paths in the code"},{"text":"Every combination of input values has been tested at least once","correct":false,"why":"Is not correct. Exhaustive testing is not possible (see the seven testing principles section in the syllabus). For example, for code “input x; print x” any single test with arbitrary x achieves 100% statement coverage, but covers one input value"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-25","source":"ISTQB Sample Exam A, Q25","chapter":4,"lo":"FL-4.3.3","k":"K2","stem":"Which of the following is NOT true for white-box testing?","stemAfter":null,"table":null,"options":[{"text":"During white-box testing the entire software implementation is considered","correct":false,"why":"Is not correct. The fundamental strength of white-box test techniques is that the entire software implementation is taken into account during testing"},{"text":"White-box coverage metrics can help identify additional tests to increase code coverage","correct":false,"why":"Is not correct. White-box coverage measures provide an objective measure of coverage and provide the necessary information to allow additional tests to be generated to increase this coverage"},{"text":"White-box test techniques can be used in static testing","correct":false,"why":"Is not correct. White-box test techniques can be used to perform reviews (static testing)"},{"text":"White-box testing can help identify gaps in requirements implementation","correct":true,"why":"Is correct. This is the weakness of the white-box test techniques. They are not able to identify the missing implementation, because they are based solely on the test object structure, not on the requirements specification"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-26","source":"ISTQB Sample Exam A, Q26","chapter":4,"lo":"FL-4.4.1","k":"K2","stem":"Which of the following BEST describes the concept behind error guessing?","stemAfter":null,"table":null,"options":[{"text":"Error guessing involves using your knowledge and experience of defects found in the past and typical errors made by developers","correct":true,"why":"Is correct. The basic concept behind error guessing is that the tester tries to guess what errors may have been made by the developer and what defects may be in the test object based on past experience (and sometimes checklists)"},{"text":"Error guessing involves using your personal experience of development and the errors you made as a developer","correct":false,"why":"Is not correct. Although a tester who used to be a developer may use their personal experience to help them when performing error guessing, the test technique is not based on prior knowledge of development"},{"text":"Error guessing requires you to imagine that you are the user of the test object and to guess errors the user could make interacting with it","correct":false,"why":"Is not correct. Error guessing is not a usability technique for guessing how users may fail to interact with the test object"},{"text":"Error guessing requires you to rapidly duplicate the development task to identify the sort of errors a developer might make","correct":false,"why":"Is not correct. Duplicating the development task has several flaws that make it impractical, such as the tester having equivalent skills to the developer and the time involved to perform the development. It is not error guessing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-27","source":"ISTQB Sample Exam A, Q27","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"In your project there has been a delay in the release of a brand-new application and test execution started late, but you have very detailed domain knowledge and good analytical skills. The full list of requirements has not yet been shared with the team, but management is asking for some test results to be presented.\n\nWhich test technique fits BEST in this situation?","stemAfter":null,"table":null,"options":[{"text":"Checklist-based testing","correct":false,"why":"Is not correct. This is a new product. You probably do not have a checklist yet and test conditions might not be known due to missing requirements"},{"text":"Error guessing","correct":false,"why":"Is not correct. This is a new product. You probably do not have enough information to make correct error guesses"},{"text":"Exploratory testing","correct":true,"why":"Is correct. Exploratory testing is most useful when there are few known specifications and/or there is a pressing timeline for testing"},{"text":"Branch testing","correct":false,"why":"Is not correct. Branch testing is time-consuming, and your management is asking about some test results now. Also, branch testing does not involve domain knowledge"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-28","source":"ISTQB Sample Exam A, Q28","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"Which of the following BEST describes the way acceptance criteria can be documented?","stemAfter":null,"table":null,"options":[{"text":"Performing retrospectives to determine the actual needs of the stakeholders regarding a given user story","correct":false,"why":"Is not correct. Retrospectives are used to capture lessons learned and to improve the development and testing process, not to document the acceptance criteria"},{"text":"Using the given/when/then format to describe an example test condition related to a given user story","correct":true,"why":"Is correct. This is the standard way to document acceptance criteria"},{"text":"Using verbal communication to reduce the risk of misunderstanding the acceptance criteria by others","correct":false,"why":"Is not correct. Verbal communication does not allow to physically document the acceptance criteria as part of a user story (”card” aspect in the 3C’s model)"},{"text":"Documenting risks related to a given user story in a test plan to facilitate the risk-based testing of a given user story","correct":false,"why":"Is not correct. Acceptance criteria are related to a user story, not a test plan. Also, acceptance criteria are the conditions that have to be fulfilled to decide if the user story is complete. Risks are not such conditions"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-29","source":"ISTQB Sample Exam A, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"Consider the following user story:\nAs an Editor\nI want to review content before it is published\nso that I can ensure the grammar is correct and its acceptance criteria:\n• The user can log in to the content management system with \"Editor\" role\n• The editor can view existing content pages\n• The editor can edit the page content\n• The editor can add markup comments\n• The editor can save changes\n• The editor can reassign to the \"content owner\" role to make updates\nWhich of the following is the BEST example of an ATDD test for this user story?","stemAfter":null,"table":null,"options":[{"text":"Test if the editor can save the document after edit the page content","correct":true,"why":"Is correct. This test covers two acceptance criteria: one about editing the document and one about saving changes"},{"text":"Test if the content owner can log in and make updates to the content","correct":false,"why":"Is not correct. Acceptance criteria cover the editor activities, not the content owner activities"},{"text":"Test if the editor can schedule the edited content for publication","correct":false,"why":"Is not correct. Scheduling the edited content for publication may be a nice feature, but it is not covered by the acceptance criteria"},{"text":"Test if the editor can reassign to another editor to make updates","correct":false,"why":"Is not correct. Acceptance criteria state about reassigning from an editor to the content owner, not to another editor"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A1","source":"ISTQB Sample Exam A, QA1","chapter":1,"lo":"FL-1.1.2","k":"K2","stem":"You were given a task to analyze and fix causes of failures in a new system to be released.\n\nWhich activity are you performing?","stemAfter":null,"table":null,"options":[{"text":"Debugging","correct":true,"why":"Is correct. Debugging is the process of finding, analyzing, and removing the causes of failures in a component or system"},{"text":"Software testing","correct":false,"why":"Is not correct. Testing is the process concerned with planning, preparation and evaluation of a component or system and related work products to determine that they satisfy specified requirements, to demonstrate that they are fit for purpose and to detect defects. It is not related to fixing causes of failures"},{"text":"Requirement elicitation","correct":false,"why":"Is not correct. Requirement elicitation is the process of gathering, capturing, and consolidating requirements from available sources. It is not related to fixing causes of failures"},{"text":"Defect management","correct":false,"why":"Is not correct. Defect management is the process of recognizing, recording, classifying, investigating, resolving, and disposing of defects. It is not related to fixing causes of failures"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A2","source":"ISTQB Sample Exam A, QA2","chapter":1,"lo":"FL-1.2.2","k":"K1","stem":"In many software organizations the test department is called the Quality Assurance (QA) department. Is this sentence correct or not and why?","stemAfter":null,"table":null,"options":[{"text":"It is correct. Testing and QA mean exactly the same thing","correct":false,"why":"Is not correct"},{"text":"It is correct. These names can be used interchangeably because both testing and QA focus their activities on the same quality issues","correct":false,"why":"Is not correct"},{"text":"It is not correct. Testing is something more; testing includes all activities with regard to quality. QA focuses on quality-related processes","correct":false,"why":"Is not correct"},{"text":"It is not correct. QA is focused on quality-related processes while testing concentrates on demonstrating that a component or system is fit for purpose and to detect defects","correct":true,"why":"Is correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering:\nTesting and quality assurance are not the same. Testing is the process consisting of all software development lifecycle (SDLC) activities, both static and dynamic, concerned with planning, preparation and evaluation of a component or system and related work products to determine that they satisfy specified requirements, to demonstrate that they are fit for purpose and to detect defects. Quality assurance is focused on establishing, introducing, monitoring, improving, and adhering to the quality-related processes."},{"id":"ISTQB-A-A3","source":"ISTQB Sample Exam A, QA3","chapter":1,"lo":"FL-1.2.3","k":"K2","stem":"A phone ringing in a neighboring cubicle distracts a programmer causing him to improperly program the logic that checks the upper boundary of an input variable. Later, during system testing, a tester notices that this input field accepts invalid input values.\n\nWhich of the following correctly describes an incorrectly coded upper bound?","stemAfter":null,"table":null,"options":[{"text":"The root cause","correct":false,"why":"Is not correct. The root cause is the distraction that the programmer experienced while programming"},{"text":"A failure","correct":false,"why":"Is not correct. Accepting invalid inputs is a failure"},{"text":"An error","correct":false,"why":"Is not correct. The error in thinking that put the defect in the code"},{"text":"A defect","correct":true,"why":"Is correct. The problem in the code is a defect"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A4","source":"ISTQB Sample Exam A, QA4","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Consider the following testware.","stemAfter":"Which test activity produces this testware as an output?","table":"<table class=\"qt\"><tr><th>Test Charter #04.018<\/th><th>Session time: 1h<\/th><\/tr><tr><td>Explore:<\/td><td>Registration page<\/td><\/tr><tr><td>With:<\/td><td>Different sets of incorrect input data<\/td><\/tr><tr><td>To discover:<\/td><td>Defects related to accepting the registration process with the incorrect input<\/td><\/tr><\/table>","options":[{"text":"Test planning","correct":false,"why":"Is not correct"},{"text":"Test monitoring and test control","correct":false,"why":"Is not correct"},{"text":"Test analysis","correct":false,"why":"Is not correct"},{"text":"Test design","correct":true,"why":"Is correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The testware under consideration is a test charter Test charters are the output from test design"},{"id":"ISTQB-A-A5","source":"ISTQB Sample Exam A, QA5","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Which of the following is the BEST example of how traceability supports testing?","stemAfter":null,"table":null,"options":[{"text":"Performing the impact analysis of a change will give information about the completion of the tests","correct":false,"why":"Is not correct. Performing the impact analysis will not give information about completeness of tests. Analyzing the impact analysis of changes will help to select the right test cases for execution"},{"text":"Analyzing the traceability between test cases and test results will give information about the estimated level of residual risk","correct":false,"why":"Is not correct. Traceability does not give information about the estimated level of residual risk if the test cases are not traced back to risks"},{"text":"Performing the impact analysis of a change will help selecting the right test cases for regression testing","correct":true,"why":"Is correct. Performing the impact analysis of the changes helps in selecting the test cases for the regression test"},{"text":"Analyzing the traceability between the test basis, the test objects and the test cases will help in selecting test data to achieve the assumed coverage of the test object","correct":false,"why":"Is not correct. Analyzing the traceability between the test basis, test objects and test cases does not help in selecting test data to achieve the assumed coverage of the test object. Selecting test data is more related to test analysis and test implementation, not traceability"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A6","source":"ISTQB Sample Exam A, QA6","chapter":1,"lo":"FL-1.5.3","k":"K2","stem":"Which of the following BEST explains a benefit of independence of testing?","stemAfter":null,"table":null,"options":[{"text":"The use of an independent test team allows project management to assign responsibility for the quality of the final deliverable to the test team","correct":false,"why":"Is not correct. Quality should be the responsibility of everyone working on the project and not the sole responsibility of the test team"},{"text":"If a test team external to the organization can be afforded, then there are distinct benefits in terms of this external team not being so easily swayed by the delivery concerns of project management and the need to meet strict delivery deadlines","correct":false,"why":"Is not correct. First, it is not a benefit if an external test team does not meet delivery deadlines, and second, there is no reason to believe that external test teams will feel they do not have to meet strict delivery deadlines"},{"text":"An independent test team can work separately from the developers, need not be distracted with project requirement changes, and can restrict communication with the developers to defect reporting through the defect management system","correct":false,"why":"Is not correct. It is bad practice for the test team to work in complete isolation, and we would expect an external test team to be concerned with changing project requirements and communicating well with developers"},{"text":"When specifications contain ambiguities and inconsistencies, assumptions are made on their interpretation, and an independent tester can be useful in questioning those assumptions and the interpretation made by the developer","correct":true,"why":"Is correct. Specifications are never perfect, meaning that assumptions will have to be made by the developer. An independent tester is useful in that they can challenge and verify the assumptions and subsequent interpretation made by the developer"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A7","source":"ISTQB Sample Exam A, QA7","chapter":2,"lo":"FL-2.1.1","k":"K2","stem":"You are working as a tester in the team that follows the V-model. Which of the following activities CAN be performed in the initial phases of the SDLC?","stemAfter":null,"table":null,"options":[{"text":"Dynamic test execution","correct":false,"why":"Is not correct. The executable code is usually created in the later phases, so dynamic test execution cannot be performed early in the SDLC"},{"text":"Static testing","correct":true,"why":"Is correct. In sequential development models, in the initial phases, testers participate in requirement reviews, which is a form of static testing."},{"text":"Test planning","correct":true,"why":"Is correct. Test planning could be performed early in the SDLC before the test project begins together with test analysis and test design."},{"text":"Acceptance test execution","correct":false,"why":"Is not correct. Acceptance test execution can be performed when there is a working product. In sequential SDLC models the working product is usually delivered later in the SDLC"},{"text":"Maintenance testing","correct":false,"why":"Is not correct. Maintenance testing when there is a working and deployed product, which is not done in the early phases of any SDLC."}],"selectCount":2,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A8","source":"ISTQB Sample Exam A, QA8","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Which of the following are advantages of DevOps?\n\ni. Faster product release and faster time to market\nii. Increases the need for repetitive manual testing\niii. Constant availability of executable software\niv. Reduction in the number of regression tests associated with code refactoring\nv. Setting up the test automation framework is inexpensive since everything is automated","stemAfter":null,"table":null,"options":[{"text":"i, ii, iv are advantages","correct":false,"why":"Is not correct"},{"text":"iii, v are advantages","correct":false,"why":"Is not correct"},{"text":"i, iii are advantages","correct":true,"why":"It is correct"},{"text":"ii, iv, v are advantages","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Consider:\ni. Is true. Faster product release and faster time to market is an advantage of DevOps\nii. Is false. Typically, we need less effort for manual tests because of the use of test automation\niii. Is true. Constant availability of executable software is an advantage\niv. Is false. More regression tests are needed\nv. Is false. Not everything is automated and setting up a test automation framework is expensive"},{"id":"ISTQB-A-A9","source":"ISTQB Sample Exam A, QA9","chapter":2,"lo":"FL-2.2.2","k":"K2","stem":"You work as a tester on a project on a mobile application for food ordering for one of your clients. The client sent you a list of requirements. One of them, with high priority, says\n\n“The order must be processed in less than 10 seconds in 95% of the cases”.\n\nYou created a set of test cases in which a number of random orders were made, the processing time measured, and the test results were checked against the requirements.\n\nWhat test type did you perform?","stemAfter":null,"table":null,"options":[{"text":"Functional, because the test cases cover the user’s business requirement for the system","correct":false,"why":"Is not correct. The fact that the requirement about the system’s performance comes directly from the client and that the performance is important from the business point of view (i.e., high priority) does not make these tests functional, because they do not check “what” the system does, but “how” (i.e., how fast the orders are processed)"},{"text":"Non-functional, because they measure the system’s performance","correct":true,"why":"Is correct. This is an example of testing for performance efficiency, a type of non-functional testing"},{"text":"Functional, because the test cases interact with the user interface","correct":false,"why":"Is not correct. From the scenario, we do not know if interacting with the user interface is a part of the test conditions. But even if we did, the main test objective of these tests is to check the performance, not the usability"},{"text":"White-box, because we need to know the internal structure of the program to measure the order processing time","correct":false,"why":"Is not correct. We do not need to know the internal structure of the code to perform the performance efficiency testing. One can execute performance efficiency tests without structural knowledge"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A10","source":"ISTQB Sample Exam A, QA10","chapter":2,"lo":"FL-2.3.1","k":"K2","stem":"Your organization’s test strategy suggests that once a system is going to be retired, data migration shall be tested. As part of what test type is this testing MOST likely to be performed?","stemAfter":null,"table":null,"options":[{"text":"Maintenance testing","correct":true,"why":"Is correct. When a system is retired, this can require testing of data migration, which is a form of maintenance testing"},{"text":"Regression testing","correct":false,"why":"Is not correct. Regression testing verifies whether a fix accidentally affected the behavior of other parts of the code, but now we are talking about data migration to a new system"},{"text":"Reliability testing","correct":false,"why":"Is not correct. Portability testing focuses on transferring the system to another environment"},{"text":"Integration testing","correct":false,"why":"Is not correct. Integration testing focuses on interactions between components and/or systems, not on data migration. Also, it is not a test type, but a test level."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A11","source":"ISTQB Sample Exam A, QA11","chapter":3,"lo":"FL-3.1.1","k":"K1","stem":"The following is a list of the work products produced in the SDLC.\n\ni. Business requirements\nii. Schedule\niii. Test budget\niv. Third-party executable code\nv. User stories and their acceptance criteria\n\nWhich of them can be reviewed?","stemAfter":null,"table":null,"options":[{"text":"i and iv can be reviewed","correct":false,"why":"Is not correct"},{"text":"i, ii, iii and iv can be reviewed","correct":false,"why":"Is not correct"},{"text":"i, ii, iii, and v can be reviewed","correct":true,"why":"It is correct"},{"text":"iii, iv, v can be reviewed","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Only third-party executable code cannot be reviewed."},{"id":"ISTQB-A-A12","source":"ISTQB Sample Exam A, QA12","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Decide which of the following statements (i-v) are true for static testing.\ni. Abnormal external behaviors are easier to identify with this testing\nii. Discrepancies from a coding standard are easier to find with this testing\niii. It identifies failures caused by defects when the software is run\niv. Its test objective is to identify defects as early as possible\nv. Missing coverage for critical security requirements is easier to find and fix","stemAfter":null,"table":null,"options":[{"text":"i, iv, v are true for static testing","correct":false,"why":"Is not correct"},{"text":"i, iii, iv are true for static testing","correct":false,"why":"Is not correct"},{"text":"ii, iii are true for static testing","correct":false,"why":"Is not correct"},{"text":"ii, iv, v are true for static testing","correct":true,"why":"Is correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Consider:\ni. These behaviors are easily detectable while the software is running.\nHence, dynamic testing shall be used to identify them\nii. This is an example of deviations from standards, which is a typical defect that is easier found with static testing\niii. If the software is executed during the test, it is dynamic testing\niv. Identifying defects as early as possible is the test objective of both static testing and dynamic testing\nv. This is an example of gaps in the test basis traceability or coverage, which is a typical defect that is easier found with static testing"},{"id":"ISTQB-A-A13","source":"ISTQB Sample Exam A, QA13","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"Which of the following statements about formal reviews is TRUE?","stemAfter":null,"table":null,"options":[{"text":"Some reviews do not require more than one role","correct":false,"why":"Is not correct. In all types of reviews there is more than one role, even in informal ones"},{"text":"The review process has several activities","correct":true,"why":"Is correct. There are several activities during the formal review process"},{"text":"Documentation to be reviewed is not distributed before the review meeting, with the exception of the work product for specific review types","correct":false,"why":"Is not correct. Documentation to be reviewed should be distributed as early as possible"},{"text":"Defects found during the review are not reported since they are not found by dynamic testing","correct":false,"why":"Is not correct. Defects found during the review should be reported"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A14","source":"ISTQB Sample Exam A, QA14","chapter":3,"lo":"FL-3.2.3","k":"K1","stem":"What task may management take on during a formal review?","stemAfter":null,"table":null,"options":[{"text":"Taking overall responsibility for the review","correct":false,"why":"Is not correct. This is the task of the review leader"},{"text":"Deciding what is to be reviewed","correct":true,"why":"Is correct. This is the task of the management in a formal review"},{"text":"Ensuring the effective running of review meetings, and moderating, if necessary","correct":false,"why":"Is not correct. This is the task of the moderator"},{"text":"Recording review information such as review decisions","correct":false,"why":"Is not correct. This is the task of the scribe"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A15","source":"ISTQB Sample Exam A, QA15","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A wine storage system uses a control device that measures the wine cell temperature T (measured in °C, rounded to the nearest degree) and alarms the user if it deviates from the optimal value of 12, according to the following rules:\n• if T = 12, the system says, “optimal temperature”\n• if T < 12, the system says, “temperature is too low!”\n• if T > 12, the system says, “temperature is too high!”\nYou want to use the 3-point boundary value analysis (BVA) to verify the behavior of the control device. A test input is a temperature in °C provided by the device.\n\nWhat is the MINIMAL set of test inputs that achieves 100% of the desired coverage?","stemAfter":null,"table":null,"options":[{"text":"11, 12, 13","correct":false,"why":"Is not correct"},{"text":"10, 12, 14","correct":false,"why":"Is not correct"},{"text":"10, 11, 12, 13, 14","correct":true,"why":"Is correct"},{"text":"10, 11, 13, 14","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are three equivalence partitions: {..., 10, 11}, {12}, and {13, 14, ...}. The boundary values are 11, 12 and 13. In the three-point boundary value analysis for each boundary, we need to test the boundary and both its neighbors, so:\n• for 11 we test 10, 11, 12\n• for 12 we test 11, 12, 13\n• for 13 we test 12, 13, 14\nAltogether we need to test 10, 11, 12, 13, and 14"},{"id":"ISTQB-A-A16","source":"ISTQB Sample Exam A, QA16","chapter":4,"lo":"FL-4.3.2","k":"K2","stem":"Which of the following statements about branch testing is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"If a program includes only unconditional branches, then 100% branch coverage can be achieved without executing any test cases","correct":false,"why":"Is not correct. In this case one test case is still needed since there is at least one (unconditional) branch to be covered"},{"text":"If the test cases exercise all unconditional branches in the code, then 100% branch coverage is achieved","correct":false,"why":"Is not correct. Covering only unconditional branches does not imply covering all conditional branches"},{"text":"If 100% statement coverage is achieved, then 100% branch coverage is also achieved","correct":false,"why":"Is not correct. 100% branch coverage implies 100% statement coverage, not otherwise. For example, for an IF decision without the ELSE, one test is enough to achieve 100% statement coverage, but it only achieves 50% branch coverage"},{"text":"If 100% branch coverage is achieved, then all decision outcomes in each decision statement in the code are exercised","correct":true,"why":"Is correct. Each decision outcome corresponds to a conditional branch, so 100% branch coverage implies 100% coverage of the decision outcomes"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A17","source":"ISTQB Sample Exam A, QA17","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"You are testing a mobile application that allows customers to access and manage their bank accounts. You are running a test suite that involves evaluating each screen, and each field on each screen, against a general list of user interface best practices derived from a popular book on the topic that maximizes usability for such applications. Which of the following options BEST categorizes the test technique you are using?","stemAfter":null,"table":null,"options":[{"text":"Black-box","correct":false,"why":"Is not correct. The book provides general guidance, and is not a formal requirements document, a specification, or a set of use cases, user stories, or business processes"},{"text":"Exploratory","correct":false,"why":"Is not correct. While you could consider the list as a set of test charters, it more closely resembles the list of test conditions to be checked"},{"text":"Checklist-based","correct":true,"why":"Is correct. The list of user interface best practices is the list of test conditions to be systematically checked"},{"text":"Error guessing","correct":false,"why":"Is not correct. The tests are not focused on failures that could occur, but rather on knowledge about what is important for the user, in terms of usability"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A18","source":"ISTQB Sample Exam A, QA18","chapter":4,"lo":"FL-4.5.1","k":"K2","stem":"Which of the following BEST describe the collaborative approach to user story writing?","stemAfter":null,"table":null,"options":[{"text":"User stories are created by testers and developers and then accepted by business representatives","correct":false,"why":"Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created by business representatives, developers, and testers together","correct":true,"why":"Is correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created by business representatives and verified by developers and testers","correct":false,"why":"Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created in a way that they are independent, negotiable, valuable, estimable, small, and testable","correct":false,"why":"Is not correct. This is the list of properties that each user story should have, not the description of the collaboration-based approach"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-1","source":"ISTQB Sample Exam B, Q1","chapter":1,"lo":"FL-1.2.1","k":"K2","stem":"Which of the following is an example of why testing is necessary?","stemAfter":null,"table":null,"options":[{"text":"Dynamic testing increases quality by causing test objects to fail in ways that could never be achieved by the users","correct":false,"why":"Is not correct. It is often possible to use dynamic testing to cause a test object to fail in ways that could never be achieved by the users, such as by using fault injection. However, if the failure can never occur with real end users, then identifying it is not especially valuable as testing is ultimately aimed at improving the work product for the end users. Spending time testing for failures that cannot occur with real users is not an efficient use of a tester’s time"},{"text":"Static testing is used by developers to identify failures in their code earlier than can be achieved through dynamic testing","correct":false,"why":"Is not correct. Static testing in the form of static analysis is used by developers to identify defects in their code earlier than can be achieved through dynamic testing. Note, however, that static testing (and static analysis) is used to detect defects, not failures, which are found by dynamic testing. Thus it is the use of the term ‘failures’ that makes this an incorrect option"},{"text":"Static analysis provides evidence to customers that the elements of the system that provide no outputs are fit for release","correct":false,"why":"Is not correct. Static analysis directly detects defects in code, and this is normally information for the developer, not the customer."},{"text":"Reviews increase the quality of requirements specifications and lead to fewer changes being needed in derived work products","correct":true,"why":"Is correct. Reviews are a form of static testing that can be applied from the very start of the software development lifecycle and are used to find defects that can be removed before subsequent development activities waste effort on faulty requirements. If the defects are not detected and removed early on, then when the defect is found in derived work products, such as the design and code, the requirements will need to be changed."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-2","source":"ISTQB Sample Exam B, Q2","chapter":1,"lo":"FL-1.2.2","k":"K1","stem":"Which of the following statements about quality assurance (QA) and/or quality control (QC) is correct?","stemAfter":null,"table":null,"options":[{"text":"QA is performed as part of testing","correct":false,"why":"Is not correct. QA concentrates on proc
