by testers?","stemAfter":null,"table":null,"options":[{"text":"Component testing","correct":false,"why":"Is not correct. Component testing (also called unit testing) involves testing individual components in isolation and is mostly verification against a specification, rather than validation against user needs. However, this testing is not normally performed by testers, as developers usually carry out this testing in their development environment"},{"text":"Component integration testing","correct":false,"why":"Is not correct. Component integration testing involves testing the interfaces and interactions between components and is mostly verification against a specification, rather than validation against user needs. However, this testing is not normally performed by testers, as developers usually carry out this testing"},{"text":"System integration testing","correct":false,"why":"Is not correct. System integration testing examines the interfaces with other systems and external services and is mostly verification against a specification, rather than validation against user needs. This type of testing is also most often performed by testers"},{"text":"Acceptance testing","correct":true,"why":"Is correct. Acceptance testing focuses on validating that the system meets the user's business needs and is ready for deployment. Ideally, this testing is carried out by the end users"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-14","source":"ISTQB Sample Exam C, Q14","chapter":2,"lo":"FL-2.2.3","k":"K2","stem":"The navigation system software has been updated due to it suggesting routes that break traffic laws, such as driving the wrong way down one-way streets. Which of the following BEST describes the testing that will be performed?","stemAfter":null,"table":null,"options":[{"text":"Only confirmation testing","correct":false,"why":"Is not correct. Confirmation testing to check that the updates have resulted in a correct implementation is necessary, however, it would then be sensible to perform regression testing to ensure that no defects have been introduced or uncovered in unchanged areas of the system"},{"text":"Confirmation testing then regression testing","correct":true,"why":"Is correct. Confirmation testing will check that the updates have resulted in a correct implementation, and then regression testing will be used to ensure that no defects have been introduced or uncovered in unchanged areas of the system"},{"text":"Only regression testing","correct":false,"why":"Is not correct. Regression testing should be used to ensure that no defects have been introduced or uncovered in unchanged areas of the system when the update was made, however it is also necessary to perform confirmation testing that will check that the updates have resulted in a correct implementation"},{"text":"Regression testing then confirmation testing","correct":false,"why":"Is not correct. Confirmation testing will check that the updates have resulted in a correct implementation, and regression testing will be used to ensure that no defects have been introduced or uncovered in unchanged areas of the system. However, when performed (i.e., when an update needs to be tested), confirmation testing precedes regression testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-15","source":"ISTQB Sample Exam C, Q15","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Given the following example defects:\ni. Two different parts of the design specification disagree due to the complexity of the design\nii. A response time is too long and so makes users lose patience\niii. A path in the code cannot be reached during execution\niv. A variable is declared but never subsequently used in the program\nv. The amount of memory needed by the program to generate a report is too high\nWhich of the following BEST identifies example defects that could be found by static testing (rather than dynamic testing)?","stemAfter":null,"table":null,"options":[{"text":"ii, v","correct":false,"why":"Is not correct"},{"text":"iii, v","correct":false,"why":"Is not correct"},{"text":"i, ii, iv","correct":false,"why":"Is not correct"},{"text":"i, iii, iv","correct":true,"why":"Is correct. The correct match for static testing is i, iii, and iv"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed example defects:\ni. Two different parts of the design specification disagree due to the complexity of the design – this is an example of a specification defect, which includes inconsistencies, ambiguities, contradictions, omissions, inaccuracies, and duplications, which can most easily be found by static testing\nii. A response time is too long and so makes users lose patience – this is an example of a response time defect, which can only be detected in practice by executing the program and measuring the response time, which can most easily be found by dynamic testing\niii. A path in the code cannot be reached during execution - this is an example of a coding defect, which includes variables with undefined values, undeclared variables, duplicated or unreachable code, and excessive code complexity, which can most easily be found by static testing\niv. A variable is declared but never subsequently used in the program - this is an example of a coding defect, which includes variables with undefined values, undeclared variables, duplicated or unreachable code, and excessive code complexity, which can most easily be found by static testing\nv. The amount of memory needed by the program to generate a report is too high – this is an example of a performance defect, which can only be detected in practice by executing the program and measuring the memory used, which can most easily be found by dynamic testing"},{"id":"ISTQB-C-16","source":"ISTQB Sample Exam C, Q16","chapter":3,"lo":"FL-3.2.1","k":"K1","stem":"Which of the following is a benefit of early and frequent stakeholder feedback?","stemAfter":null,"table":null,"options":[{"text":"Changes to requirements are understood and implemented earlier","correct":true,"why":"Is correct. Obtaining feedback from stakeholders early and often in the software development process can be highly beneficial. It facilitates early communication of potential quality issues, can prevent misunderstandings about requirements, and ensures that any changes in stakeholder requirements are understood and implemented sooner"},{"text":"It ensures business stakeholders understand user requirements","correct":false,"why":"Is not correct. The feedback is from stakeholders, so providing feedback is unlikely to improve their understanding of their own user requirements"},{"text":"It allows product owners to change their requirements as often as they want","correct":false,"why":"Is not correct. Obtaining feedback from stakeholders early and often in the software development process can be highly beneficial. It facilitates early communication of potential quality issues, can prevent misunderstandings about requirements, and ensures that any changes in stakeholder requirements are understood and implemented sooner. However, because changes in requirements can be understood and implemented sooner, it does not mean that unlimited changes to requirements are encouraged"},{"text":"End users are told which requirements will not be implemented prior to release","correct":false,"why":"Is not correct. The feedback is from stakeholders and does not cover communication to them. Communications with end users could include telling them about which requirements will not be implemented prior to release, but ideally this should not happen at all"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-17","source":"ISTQB Sample Exam C, Q17","chapter":3,"lo":"FL-3.2.4","k":"K2","stem":"Given the following review types:\n1. Technical review\n2. Informal review\n3. Inspection\n4. Walkthrough\nAnd the following descriptions:\nA. Includes objectives such as gaining consensus, generating new ideas, and motivating authors to improve\nB. Includes objectives such as educating reviewers, gaining consensus, generating new ideas and detecting potential defects\nC. The main objective is detecting potential defects and it requires metrics collection to support process improvement\nD. The main objective is detecting potential defects and it generates no formal documented output\nWhich of the following BEST matches the review types and the descriptions?","stemAfter":null,"table":null,"options":[{"text":"1A, 2B, 3C, 4D","correct":false,"why":"Is not correct"},{"text":"1A, 2D, 3C, 4B","correct":true,"why":"Is correct."},{"text":"1B, 2C, 3D, 4A","correct":false,"why":"Is not correct"},{"text":"1C, 2D, 3A, 4B","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed review types:\n1. Technical review - This type of review is performed by technically qualified reviewers and led by a moderator. The objectives are to gain consensus and make decisions on technical problems while also evaluating quality and building confidence in the work product, generating new ideas, motivating and enabling authors to improve, and detecting anomalies\n2. Informal review - The main objective is to detect anomalies. The process is not defined and does not require formal documented output\n3. Inspection - This is the most formal review type, and it follows the complete generic review process. The primary objective is to find the most anomalies, and other objectives include evaluating quality and building confidence in the work product, motivating and enabling authors to improve, and collecting metrics that can be used to enhance the software development lifecycle (SDLC), including the inspection process. The author cannot act as the review leader or scribe\n4. Walkthrough - Led by the author, this type of review serves various objectives such as evaluating quality and building confidence in the work product, educating reviewers, gaining consensus, generating new ideas, motivating and enabling authors to improve, and detecting anomalies. Reviewers might perform an individual review before the walkthrough, but this is not mandatory\nA. Includes objectives such as gaining consensus, generating new ideas, and motivating authors to improve\nB. Includes objectives such as educating reviewers, gaining consensus, generating new ideas and detecting anomalies\nC. The main objective is detecting anomalies and it requires metrics collection to support process improvement\nD. The main objective is detecting anomalies and it generates no formal documented output"},{"id":"ISTQB-C-18","source":"ISTQB Sample Exam C, Q18","chapter":3,"lo":"FL-3.2.5","k":"K1","stem":"Which of the following is a factor that contributes to a successful review?","stemAfter":null,"table":null,"options":[{"text":"Ensure management participate as reviewers","correct":false,"why":"Is not correct. To ensure successful reviews, it is important to secure management's support for the review process. However that does not mean that they should participate as reviewers"},{"text":"Split large work products into smaller parts","correct":true,"why":"Is correct. To ensure successful reviews, it's important to break the work product into parts that are small enough to be reviewed in a reasonable timescale to prevent reviewers from losing focus during individual reviews or review meetings"},{"text":"Set reviewer evaluation as an objective","correct":false,"why":"Is not correct. To ensure successful reviews, it's important to clearly define objectives and measurable exit criteria, without evaluating participants"},{"text":"Plan to cover one document per review","correct":false,"why":"Is not correct. To ensure successful reviews, it's important to break down the review into smaller chunks to prevent reviewers from losing focus during individual reviews or review meetings. So you should not plan to cover one document per review"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-19","source":"ISTQB Sample Exam C, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"What is the MAIN difference between black-box test techniques and experience-based test techniques?","stemAfter":null,"table":null,"options":[{"text":"The test object","correct":false,"why":"Is not correct. In most cases both black-box test techniques and experience-based test techniques can be used for the same test objects"},{"text":"The test level at which the test technique is used","correct":false,"why":"Is not correct. Both black-box test techniques and experience-based test techniques can be used at all test levels"},{"text":"The test basis","correct":true,"why":"Is correct. Black-box test techniques (also known as specification-based techniques) are based on an analysis of the specified behavior of the test object without reference to its internal structure. So, the test basis is usually a specification. Experience-based test techniques effectively use the knowledge and experience of testers for the design and implementation of test cases. This means that the tester, when designing tests, may not use the specification at all"},{"text":"The software development lifecycle (SDLC) in which the test technique can be used","correct":false,"why":"Is not correct. Experience-based test techniques can detect defects that may be missed using black-box (and white-box) test techniques. Hence, experience-based test techniques are complementary to black-box test techniques and white-box test techniques and both black-box test techniques and experience-based test techniques can be used in all SDLCs"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-20","source":"ISTQB Sample Exam C, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"You are testing a PIN validator, which accepts valid PINs and rejects invalid PINs. A PIN is a sequence of digits. A PIN is valid if it consists of four digits, which are not all the same digit. You have identified the following valid equivalence partitions:\nVariable: PIN code length\n• The partition “length correct”\n- four-digit PINs\n• The partition “length incorrect”\n- PINs with length other than 4\nVariable: Number of different digits\n• The partition “number of different digits correct”\n- PINs with at least two different digits\n• The partition “number of different digits incorrect” - PINs with all digits being the same\nWhich of the following is the BEST set of input test data to cover the identified equivalence partitions?","stemAfter":null,"table":null,"options":[{"text":"12, 1111, 1234, 12345","correct":true,"why":"Is correct.\n• Value “12” covers “length incorrect, too few digits”\n• Value “1111” covers “length correct” and “number of different digits incorrect\n• Value “1234” again covers “length correct” and “number of different digits correct”\n• Value “12345” covers “length incorrect, too many digits”"},{"text":"1, 123, 1111, 1234","correct":false,"why":"Is not correct. All partitions are covered, however it only covers the lower side of “length incorrect”"},{"text":"11, 12, 1111, 12345","correct":false,"why":"Is not correct. There are no value covering “correct PIN”"},{"text":"123, 1222, 12345","correct":false,"why":"Is not correct. There are no value covering “number of different digits”"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-21","source":"ISTQB Sample Exam C, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A developer was asked to implement the following business rule:\nINPUT: value (integer number)\nIF (value ≤ 100 OR value ≥ 200) THEN write “value incorrect”\nELSE write “value OK”\nYou design the test cases using 2-value boundary value analysis.\nWhich of the following sets of test inputs achieves the greatest coverage?","stemAfter":null,"table":null,"options":[{"text":"100, 150, 200, 201","correct":false,"why":"Is not correct. Only 100 and 200 are valid coverage items for 2-value BVA, so we achieve 50% coverage"},{"text":"99, 100, 200, 201","correct":false,"why":"Is not correct. Only 100 and 200 are valid coverage items for 2-value BVA, so we achieve 50% coverage"},{"text":"98, 99, 100, 101","correct":false,"why":"Is not correct. Only 100 and 101 are valid coverage items for 2-value BVA, so we achieve 50% coverage"},{"text":"101, 150, 199, 200","correct":true,"why":"Is correct. 101, 199 and 200 are valid coverage items for 2-value BVA, so we achieve 75% coverage"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The equivalence partitions are: {…, 99, 100}, {101, 102, …, 198, 199}, {200, 201, …}.\nThus, there are 4 boundary values, which are: 100, 101, 199 and 200. In 2-value BVA, for each boundary value there are two coverage items (the boundary value and its closest neighbor belonging to the adjacent partition). As the closest neighbors are also boundary values in the adjacent partition, then there are just four coverage items."},{"id":"ISTQB-C-22","source":"ISTQB Sample Exam C, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"You are working on a project to develop a system to analyze driving test results. You have been asked to design test cases based on the following decision table.","stemAfter":"What test data will show that there are contradictory rules in the decision table?","table":"<table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><\/tr><tr><td>C1: First attempt at the exam?<\/td><td>-<\/td><td>-<\/td><td>F<\/td><\/tr><tr><td>C2: Theoretical exam passed?<\/td><td>T<\/td><td>F<\/td><td>-<\/td><\/tr><tr><td>C3: Practical exam passed?<\/td><td>T<\/td><td>-<\/td><td>F<\/td><\/tr><tr><td>Issue a driving license?<\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>Request additional driving lessons?<\/td><td><\/td><td><\/td><td>X<\/td><\/tr><tr><td>Request to take the exam again?<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/table>","options":[{"text":"C1 = T, C2 = T, C3 = F","correct":false,"why":"Is not correct. The combination (T, T, F) does not match any rule. This is an example of omission, not a contradiction"},{"text":"C1 = T, C2 = F, C3 = T","correct":false,"why":"Is not correct. The combination (T, F, T) matches only one column, R2, so there is no contradiction"},{"text":"C1 = T, C2 = T, C3 = T and C1 = F, C2 = T, C3 = T","correct":false,"why":"Is not correct. Both combinations (T, T, T) and (F, T, T) match only one column, R1, so there is no contradiction"},{"text":"C1 = F, C2 = F, C3 = F","correct":true,"why":"Is correct. The combination (F, F, F) matches both R2 and R3, but R2 and R3 have different actions, so this shows a contradiction between R2 and R3."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-23","source":"ISTQB Sample Exam C, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"You are designing test cases based on the following state transition diagram:","stemAfter":"What is the MINIMUM number of test cases required to achieve 100% valid transitions coverage?","table":"<table class=\"qt\"><tr><th>From state<\/th><th>Event<\/th><th>To state<\/th><\/tr><tr><td>START<\/td><td>Room request<\/td><td>REQUESTING<\/td><\/tr><tr><td>REQUESTING<\/td><td>Not available<\/td><td>WAITING LIST<\/td><\/tr><tr><td>REQUESTING<\/td><td>Available<\/td><td>CONFIRMED<\/td><\/tr><tr><td>WAITING LIST<\/td><td>Available<\/td><td>CONFIRMED<\/td><\/tr><tr><td>WAITING LIST<\/td><td>Cancel<\/td><td>END<\/td><\/tr><tr><td>CONFIRMED<\/td><td>Pay<\/td><td>END<\/td><\/tr><\/table>","options":[{"text":"3","correct":true,"why":"Is correct"},{"text":"2","correct":false,"why":"Is not correct"},{"text":"5","correct":false,"why":"Is not correct"},{"text":"6","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"The following three transitions:\n“REQUESTING -> CONFIRMED”\n“WAITING LIST -> CONFIRMED”\n“WAITING LIST -> END”\ncannot appear in the same test case, which suggests that at least three test cases are required. All the other transitions can appear in combination with one or more of these three transitions, so we need a minimum of three test cases. In fact, only three sequences are possible:\nTC1: START (Room request) → REQUESTING (Available) → CONFIRMED (Pay) → END\nTC2: START (Room request) → REQUESTING (Not available) → WAITING LIST (Available) → CONFIRMED (Pay) → END TC3: START (Room request) → REQUESTING (Not available) → WAITING LIST (Cancel) → END"},{"id":"ISTQB-C-24","source":"ISTQB Sample Exam C, Q24","chapter":4,"lo":"FL-4.3.2","k":"K2","stem":"You want to apply branch testing to the code represented by the following control flow graph.","stemAfter":"How many coverage items do you need to test?","table":"<table class=\"qt\"><tr><th>From node<\/th><th>To node<\/th><\/tr><tr><td>1 (entry)<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>6<\/td><\/tr><tr><td>5<\/td><td>7 (exit)<\/td><\/tr><tr><td>6<\/td><td>7 (exit)<\/td><\/tr><\/table><p>(Nodes are unlabeled in the original graph; numbers were added top to bottom. Node 3 sits on the left and forms a loop with node 2.)<\/p>","options":[{"text":"2","correct":false,"why":"Is not correct"},{"text":"4","correct":false,"why":"Is not correct"},{"text":"8","correct":true,"why":"Is correct"},{"text":"7","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"In branch testing the coverage items are branches, which are represented by the edges of a control flow graph. There are 8 edges in the control flow graph."},{"id":"ISTQB-C-25","source":"ISTQB Sample Exam C, Q25","chapter":4,"lo":"FL-4.3.3","k":"K2","stem":"How can white-box testing be useful in support of black-box testing?","stemAfter":null,"table":null,"options":[{"text":"White-box coverage measures can help testers evaluate black-box tests in terms of the code coverage achieved by these black-box tests","correct":true,"why":"Is correct. Performing only black-box testing does not provide a measure of actual code coverage. White-box coverage measures provide an objective measurement of coverage and provide the necessary information to allow additional tests to be generated to increase this coverage, and subsequently increase confidence in the code"},{"text":"White-box coverage analysis can help testers identify unreachable fragments of the source code","correct":false,"why":"Is not correct. This statement is correct, but it has nothing to do with black-box testing"},{"text":"Branch testing subsumes black-box test techniques, so achieving full branch coverage guarantees achieving full coverage of any black-box technique","correct":false,"why":"Is not correct. In general there are no relationships between white-box test techniques and black-box test techniques"},{"text":"White-box test techniques can provide coverage items for black-box techniques","correct":false,"why":"Is not correct. White-box test techniques are used to design tests based on the test object itself, while black-box test techniques are used to design tests based on the specification. Therefore, there is no relation between coverage items derived from these two types of test techniques"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-26","source":"ISTQB Sample Exam C, Q26","chapter":4,"lo":"FL-4.4.1","k":"K2","stem":"Consider the following list:\n• Correct input not accepted\n• Incorrect input accepted\n• Wrong output format\n• Division by zero\nWhat test technique is MOST PROBABLY used by the tester who uses this list when performing testing?","stemAfter":null,"table":null,"options":[{"text":"Exploratory testing","correct":false,"why":"Is not correct. Exploratory testing uses test charters, not a list of possible defects/failures. Although exploratory testing can incorporate the use of other test techniques, in this case a fault attack is the most likely option"},{"text":"Fault attack","correct":true,"why":"Is correct. This is a list of possible failures. Fault attacks are a methodical approach to the implementation of error guessing and require the tester to create or acquire a list of possible errors, defects and failures, and to design tests that will identify defects associated with the errors, expose the defects, or cause the failures"},{"text":"Checklist-based testing","correct":false,"why":"Is not correct. The tester is using a checklist of items to support their testing. Both error guessing and checklist-based testing use such lists, however, the list here is of possible failures, not test conditions, and so the MOST PROBABLE test technique is fault attack, which focuses on errors, defects and failures"},{"text":"Boundary value analysis","correct":false,"why":"Is not correct. BVA is based on an analysis of boundary values of equivalence partitions. The above list does not mention equivalence partitions or their boundaries"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-27","source":"ISTQB Sample Exam C, Q27","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"Which of the following BEST describes how using checklist-based testing can result in increased coverage?","stemAfter":null,"table":null,"options":[{"text":"Checklist items can be defined at a sufficiently low level of detail, so the tester can implement and execute detailed test cases based on these items","correct":false,"why":"Is not correct. Although it is true that the tester can implement and execute detailed test cases based on the checklist, it does not explain how this would result in increased coverage"},{"text":"Checklists can be automated, so each time an automated test execution covers the checklist items, it results in additional coverage","correct":false,"why":"Is not correct. Checklist items should not be automated. But even if they are, the automated test scripts always execute the tests in the same way, which usually does not result in increased coverage"},{"text":"Each checklist item should be tested separately and independently, so the elements cover different areas of the software","correct":false,"why":"Is not correct. It is true that each checklist item should be tested separately and independently. But this impacts the test execution order and does not impact the achieved coverage, and so does not result in increased coverage"},{"text":"Two testers designing and executing tests based on the same high-level checklist items will typically perform the testing in slightly different ways","correct":true,"why":"Is correct. If the checklists are high-level, some variability in the actual testing is likely to occur, resulting in potentially greater coverage but less repeatability. If two testers follow a checklist of high-level items, each of them may use different test data, test steps, etc. This way, one tester will probably cover some areas not covered by the other tester and this will result in increased coverage"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-28","source":"ISTQB Sample Exam C, Q28","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"Which of the following provides the BEST example of a scenario-oriented acceptance criterion?","stemAfter":null,"table":null,"options":[{"text":"The application must allow users to delete their account and all associated data upon request","correct":false,"why":"Is not correct. This acceptance criterion describes what rules or regulations the system must adhere to (in this case, the right to be forgotten). This is an example of a rule-oriented acceptance criterion"},{"text":"When a customer adds an item to their cart and proceeds to checkout, they should be prompted to log in or create an account if they haven’t already done so","correct":true,"why":"Is correct. This acceptance criterion describes an example scenario that must be realized by the system. This is an example of a scenario-oriented acceptance criterion"},{"text":"IF (contain(product(23).Name, cart.products())) THEN return FALSE","correct":false,"why":"Is not correct. This sentence looks more like a line of code that implements some business rule. Acceptance criteria should be written in collaboration with business representatives, and therefore should be written in language they understand. This sentence will most likely be unintelligible to these stakeholders"},{"text":"The website must comply with the ICT Accessibility 508 Standards and ensure that all content is accessible to users with disabilities","correct":false,"why":"Is not correct. This acceptance criterion describes what rules or regulations the system must adhere to and how compliance will be ensured. Therefore, this is an example of a rule-oriented acceptance criterion, not a scenario-based acceptance criterion"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-29","source":"ISTQB Sample Exam C, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"You are using acceptance test-driven development and designing test cases based on the following user story:\nAs a Regular or Special user, I want to be able to use my electronic floor card, to access specific floors.\nAcceptance Criteria:\nAC1: Regular users have access to floors 1 to 3\nAC2: Floor 4 is only accessible to Special users\nAC3: Special users have all the access rights of Regular users\nWhich test case is the MOST reasonable one to test AC3?","stemAfter":null,"table":null,"options":[{"text":"Check that a Regular user can access floors 1 and 3","correct":false,"why":"Is not correct. We want to check that Special users have the rights of Regular users, so we need to test access rights for a Special user, not for a Regular user"},{"text":"Check that a Regular user cannot access floor 4","correct":false,"why":"Is not correct. We want to check that Special users have the rights of Regular users, so we need to test access rights for a Special user, not for a Regular user"},{"text":"Check that a Special user can access floor 5","correct":false,"why":"Is not correct. There is no floor 5 described in the acceptance criteria. The test cases should not extend the scope of the user story. But even if we would like to perform negative testing, this test is not directly related to AC3"},{"text":"Check that a Special user can access floors 1, 2 and 3","correct":true,"why":"Is correct. This is the way we can check if a Special user can access floors which are accessible to a Regular user"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-1","source":"ISTQB Sample Exam D, Q1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which of the following is a typical test objective?","stemAfter":null,"table":null,"options":[{"text":"Finding and fixing defects in the test object","correct":false,"why":"Is not correct. Finding and fixing defects in the test object is not a typical test objective as although identifying defects is an objective of testing, fixing defects is not a test activity"},{"text":"Maintaining effective communications with developers","correct":false,"why":"Is not correct. Maintaining effective communications with developers is not a typical test objective although it is useful in achieving other objectives of testing, such as providing stakeholders with information that enables them to make informed decisions. It is not a primary reason for performing testing"},{"text":"Validating that legal requirements have been met","correct":false,"why":"Is not correct. Validating that legal requirements have been met is not a typical test objective because validation is concerned with checking whether the system meets users’ and other stakeholders’ needs in its operational environment. Checking that legal requirements have been met is a form of verification"},{"text":"Building confidence in the quality of the test object","correct":true,"why":"Is correct. Building confidence in the quality of the test object is achieved by executing tests that passed"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-2","source":"ISTQB Sample Exam D, Q2","chapter":1,"lo":"FL-1.2.3","k":"K2","stem":"A designer documents a design for a user interface that does not suitably address disabled users because the designer is tired. The programmer implements the user interface in line with the design but as they are working under severe time pressure, they do not include suitable exception handling in their program code for bonus calculations. When the operational system is used, complaints are made by some disabled users about the interface and the company is subsequently fined by the relevant regulatory authority. No one notices that bonus calculations are sometimes incorrect.\nWhich of the following statements is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"The miscalculation of bonuses is a defect that occasionally occurs","correct":false,"why":"Is not correct. The miscalculation of bonuses is a failure by the system, not a defect"},{"text":"The fine received for failing to address some disabled users is a failure","correct":false,"why":"Is not correct. The system not suitably supporting disabled users is a failure which eventually results in a fine, but the fine itself is not a failure (it appears to be the correct functioning of the regulatory system)"},{"text":"The programmer working under severe time pressure is a root cause","correct":true,"why":"Is correct. The error is made by the programmer and this mistake is caused by them working under severe time pressure, which is the root cause of the subsequent defect"},{"text":"The design of the user interface includes a designer error","correct":false,"why":"Is not correct. The poor design of the user interface, which does not suitably address disabled users, is a design defect caused by the designer error. Thus the design of the user interface includes a design defect not a designer error"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-3","source":"ISTQB Sample Exam D, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"Test conditions are being used by testers to generate test cases and execute tests. Even though the test conditions remain the same, the test cases are varied each time. Which of the following ‘principles of testing’ is being addressed through the variation of test cases?","stemAfter":null,"table":null,"options":[{"text":"Tests wear out","correct":true,"why":"Is correct. The ‘tests wear out’ principle is concerned with the idea that repeating identical tests on unaltered code is unlikely to uncover novel defects and therefore, modifying tests may be essential. By using test conditions to generate new tests each time, the tests will not be identical and the risk of the tests wearing out is reduced"},{"text":"Absence-of-defects fallacy","correct":false,"why":"Is not correct. The ‘absence-of-defects fallacy’ principle is concerned with ensuring that users’ needs are fulfilled even if lots of testing is done and no defects are found (i.e., validation is also necessary). The use of test conditions to generate test cases and execute tests does not directly address this concern"},{"text":"Early testing saves time and money","correct":false,"why":"Is not correct. The ‘early testing saves time and money’ principle is concerned with fixing defects early on to prevent the occurrence of subsequent defects in derived work products, thereby reducing costs and the likelihood of failures. This is typically addressed by starting testing (both static and dynamic) as early as possible, but this is not addressed by using test conditions to generate test cases and execute tests"},{"text":"Defects cluster together","correct":false,"why":"Is not correct. The ‘Defects cluster together’ principle is concerned with the distribution of defects in a system, which typically follows a Pareto distribution. The use of test conditions to generate test cases and execute tests does not address this concern, which is typically addressed by risk-based testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-4","source":"ISTQB Sample Exam D, Q4","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Given the following test tasks:\n1. Derive test cases from test conditions\n2. Identify reusable testware\n3. Organize test cases into test procedures\n4. Evaluate the test basis and the test object\nAnd the following test activities:\nA. Test analysis\nB. Test design\nC. Test implementation\nD. Test completion\nWhich of the following BEST matches the tasks with the activities?","stemAfter":null,"table":null,"options":[{"text":"1B, 2A, 3D, 4C","correct":false,"why":"Is not correct"},{"text":"1B, 2D, 3C, 4A","correct":true,"why":"Is correct. The CORRECT match is: 1B, 2D, 3C, 4A"},{"text":"1C, 2A, 3B, 4D","correct":false,"why":"Is not correct"},{"text":"1C, 2D, 3A, 4B","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed test activities and their tasks:\nA. Test analysis - To identify the features that require testing, the test basis is analyzed and defined as test conditions, which are then prioritized along with related risks. During this test analysis, defects in the test basis are typically uncovered, and the test object's testability may also be assessed. (Task 4)\nB. Test design - Involves using test conditions to create test cases and other necessary testware, such as test data requirements and test charters for exploratory testing. (Task 1)\nC. Test implementation - Test procedures, such as manual and automated test scripts, are created from test cases and may be assembled into test suites. Test procedures are prioritized and arranged in a test execution schedule. (Task 3)\nD. Test completion - Occurs at project milestones, such as release, end of iteration or end of test level. Testware is identified and archived or handed to the appropriate teams for reuse, the test environment is shut down, and the test activities are analyzed for lessons learned and future improvements. (Task 2)"},{"id":"ISTQB-D-5","source":"ISTQB Sample Exam D, Q5","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Given the following testware:\ni. Test completion report\nii. Data held in a database used for test inputs and expected results\niii. The list of elements needed to build the test environment\niv. Documented sequences of test cases in execution order\nv. Test cases\nWhich of the following BEST shows the testware produced as a result of performing test implementation?","stemAfter":null,"table":null,"options":[{"text":"ii, iv","correct":true,"why":"Is correct. Items ii and iv in the list are produced as a result of test implementation"},{"text":"iii, v","correct":false,"why":"Is not correct"},{"text":"i, ii, v","correct":false,"why":"Is not correct"},{"text":"i, iii, iv","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed testware, and the test activity that produces it:\ni. The test completion report is an output of test completion\nii. Data held in a database used for inputs and expected results is the test data - output of test implementation\niii. The list of elements needed to build the test environment is the test environment requirements - output of test design\niv. Documented sequences of test cases in execution order are the test procedures - output of test implementation\nv. Test cases - output of test design\nTest implementation produces the following outputs: test procedures (iv), automated test scripts, test suites, test data (ii), test execution schedule, and test environment elements such as stubs, drivers, simulators, and service virtualizations."},{"id":"ISTQB-D-6","source":"ISTQB Sample Exam D, Q6","chapter":1,"lo":"FL-1.4.5","k":"K2","stem":"Which of the following is MOST likely to describe a task performed by someone in a test management role?","stemAfter":null,"table":null,"options":[{"text":"Evaluate the test basis and the test object","correct":false,"why":"Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Evaluating the test basis for defects and the test object for testability are tasks performed as part of test analysis, so it is likely they are tasks performed by the testing role"},{"text":"Define test environment requirements","correct":false,"why":"Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Defining the test environment requirements is a task performed as part of test design, so it is likely to be a task performed by the testing role"},{"text":"Assess testability of the test object","correct":false,"why":"Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Assessing the testability of a test object is a task performed as part of test analysis, so it is likely to be a task performed by the testing role"},{"text":"Create the test completion report","correct":true,"why":"Is correct. The test management role primarily involves activities related to test planning, test monitoring and test control, and test completion."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Thus, creating the test completion report, which is the prime output from the test completion, is likely to be a task performed by the test management role"},{"id":"ISTQB-D-7","source":"ISTQB Sample Exam D, Q7","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following is an advantage of the whole team approach?","stemAfter":null,"table":null,"options":[{"text":"Improved communication between team members","correct":true,"why":"Is correct. The whole team approach promotes robust communication and collaboration between the team members"},{"text":"Decreased individual accountability for quality","correct":false,"why":"Is not correct. While the whole team approach prioritizes collective accountability for quality, each individual team member is still equally accountable for quality"},{"text":"Faster deployment of deliverables to the end users","correct":false,"why":"Is not correct. The whole team approach is about how the team works together, with the aim of higher quality deliverables, but it does not necessarily result in faster deployment to end users"},{"text":"Reduced collaboration with external business users","correct":false,"why":"Is not correct. When using the whole team approach, testers work with business representatives to create acceptance tests. There is no suggestion that the approach will reduce collaboration with external business users"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-8","source":"ISTQB Sample Exam D, Q8","chapter":1,"lo":"FL-1.5.3","k":"K2","stem":"Given the following benefits and drawbacks of the independence of testing:\ni. The testers work in a different location from the developers\nii. Testers question the assumptions programmers make while writing code\niii. A confrontational dynamic has been established between testers and developers\niv. Developers have convinced themselves that testers are mostly accountable for quality\nv. Testers have different biases than those held by the developers\nWhich are MOST likely to be considered benefits?","stemAfter":null,"table":null,"options":[{"text":"i, iv","correct":false,"why":"Is not correct"},{"text":"ii, v","correct":true,"why":"Is correct. The list entries showing benefits are ii and v"},{"text":"i, iii, iv","correct":false,"why":"Is not correct"},{"text":"ii, iii, v","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed benefits and drawbacks of the independence of testing:\ni. Ideally, we want close collaboration between testers and developers, which is not increased by isolation. Thus, this is a disadvantage\nii. Testers and developers have varied backgrounds, technical viewpoints, and potential biases, allowing testers to usefully challenge assumptions made by stakeholders during system specification and implementation. Thus, this is an advantage\niii. The main disadvantage of independence of testing is that testers may become isolated from the development team, leading to communication problems, a lack of collaboration, and potentially an adversarial relationship, with testers being blamed for delays and bottlenecks in the release process. Thus, this is a disadvantage\niv. One of the disadvantages of independence of testing is that testers may become isolated from the development team, leading to developers feeling less accountable for quality. Thus, this is a disadvantage\nv. The primary benefit of independence of testing is that testers are more likely to identify different types of failures and defects compared to developers, due to their varied backgrounds, technical viewpoints, and potential biases, including cognitive bias"},{"id":"ISTQB-D-9","source":"ISTQB Sample Exam D, Q9","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following is a good testing practice that applies to all software development lifecycles?","stemAfter":null,"table":null,"options":[{"text":"Each test level has specific and distinct test objectives","correct":true,"why":"Is correct. Each test level has specific and distinct test objectives as a different form of test object (e.g., single component and complete system) is tested at each test level and overlapping test objectives would lead to unnecessary duplication"},{"text":"Test implementation and execution for a given test level should start during the corresponding development phase","correct":false,"why":"Is not correct. Test analysis and test design for a given test level should start during the corresponding development phase to facilitate early testing (e.g., acceptance test analysis and test design should begin during requirements analysis). Test implementation will generally start later, and test execution will start during the test level"},{"text":"Testers should start test design as soon as drafts of the relevant work products become available","correct":false,"why":"Is not correct. Test design for a given test level should start during the corresponding development phase to facilitate early testing, however test design (e.g., test case generation) needs to be based on an agreed test basis, not an early draft, otherwise significant test effort may be wasted on creating test cases for a design that later changes"},{"text":"Every dynamic testing activity has a corresponding static testing activity","correct":false,"why":"Is not correct. Quality control applies to all development activities, meaning that every software development activity has a corresponding test activity. However, the same symmetry does not apply to dynamic testing and static testing. There are some static testing activities (e.g., static analysis) for which there is no obvious corresponding dynamic testing activity"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-10","source":"ISTQB Sample Exam D, Q10","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following is an example of a test-first approach to development?","stemAfter":null,"table":null,"options":[{"text":"Behavior-Driven Development","correct":true,"why":"Is correct. Behavior-Driven Development (BDD) is a well-known example of a test-first approach to development"},{"text":"Test Level Driven Development","correct":false,"why":"Is not correct. Test Level Driven Development is not a correct example of a test-first approach to development"},{"text":"Function-Driven Development","correct":false,"why":"Is not correct. Function-Driven Development is not a correct example of a test-first approach to development"},{"text":"Performance-Driven Development","correct":false,"why":"Is not correct. Performance-Driven Development is not a correct example of a test-first approach to development"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-11","source":"ISTQB Sample Exam D, Q11","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Which of the following is MOST likely to be a challenge encountered when implementing DevOps?","stemAfter":null,"table":null,"options":[{"text":"Making sure that non-functional quality characteristics are not overlooked","correct":false,"why":"Is not correct. DevOps generally increases the visibility of non-functional quality characteristics, such as performance and reliability"},{"text":"Managing continuously changing test environments","correct":false,"why":"Is not correct. Automated processes like continuous integration/continuous delivery (CI/CD) used in DevOps facilitate stable test environments"},{"text":"The need for more manual testers with suitable experience","correct":false,"why":"Is not correct. Automated processes like CI/CD used in DevOps generally reduce the need for manual testing"},{"text":"Setting up the test automation as part of the delivery pipeline","correct":true,"why":"Is correct. DevOps implementation can pose several risks and challenges, including the need to define and set up the delivery pipeline, introduce and maintain CI/CD tools, and establish and maintain test automation"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-12","source":"ISTQB Sample Exam D, Q12","chapter":2,"lo":"FL-2.1.6","k":"K2","stem":"Which of the following BEST describes retrospectives?","stemAfter":null,"table":null,"options":[{"text":"Retrospectives allow team members to identify other team members who did not fully contribute to achieving quality as required by the whole team approach","correct":false,"why":"Is not correct. The benefits of retrospectives include team bonding and learning from sharing issues, and better collaboration between developers and testers through reviewing and improving working practices. Calling out individuals who a team member may feel did not fully contribute to achieving quality as required by the whole team approach will not contribute to this team bonding and collaboration"},{"text":"Retrospectives give testers an opportunity to identify activities that were successful so that these are retained when potential improvements are made in the future","correct":true,"why":"Is correct. During the retrospective, the group discusses what aspects of the project were successful and should be retained, as well as areas that could be improved, and how to do so"},{"text":"Retrospectives are where agile team members are allowed to voice their concerns about management and customers in a blameless environment","correct":false,"why":"Is not correct. The benefits of retrospectives are based on increased effectiveness and efficiency through process improvements; they are not an opportunity to let off steam and criticize management and customers. Also, the test results are recorded, usually in the test completion report, so anything said in the meeting could be read by other stakeholders"},{"text":"Retrospectives give agile team members a forum where they focus on discussing the plan and technical decisions for the next iteration","correct":false,"why":"Is not correct. Retrospectives are meetings that are typically held at the end of an iteration where team members will focus on discussing quality-related issues that have occurred in the current iteration. They are not used for making plans or technical decisions for the next iteration; this would be done in the iteration planning meeting at the start of the next iteration"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-13","source":"ISTQB Sample Exam D, Q13","chapter":2,"lo":"FL-2.2.2","k":"K2","stem":"Which of the following tests is MOST likely to be performed as part of functional testing?","stemAfter":null,"table":null,"options":[{"text":"The test checks that the sort function puts the elements of the list or array in ascending order","correct":true,"why":"Is correct. Checking that the sort function puts the elements of the list or array in ascending order is evaluating the functional correctness of the sort function, which is part of functional testing"},{"text":"The test checks whether the sort function completes sorting within one second of starting","correct":false,"why":"Is not correct. Assessing whether the sort function meets its non-functional requirement to complete within one second is part of testing its performance efficiency, which is part of non-functional testing"},{"text":"The test checks how easily the sort function can be changed from sorting ascending to sorting descending","correct":false,"why":"Is not correct. Evaluating the ease with which the sort function can be modified from sorting ascending to sorting descending is testing its modifiability, a form of non-functional maintainability testing, which is part of non-functional testing"},{"text":"The test checks that the sort function still functions correctly when moved from a 32-bit to a 64-bit architecture","correct":false,"why":"Is not correct. Assessing that the sort function still functions correctly when moved from a 32-bit to a 64-bit architecture is testing its adaptability, a form of portability testing, which is part of non-functional testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-14","source":"ISTQB Sample Exam D, Q14","chapter":2,"lo":"FL-2.3.1","k":"K2","stem":"Which of the following is MOST likely to be a trigger that leads to maintenance testing of a currency exchange system?","stemAfter":null,"table":null,"options":[{"text":"The developers reported that changing the currency exchange system was difficult and the testers decided to check if this was true","correct":false,"why":"Is not correct. Assuming that testers could check the ease of changing the currency exchange system then it would be done by maintainability testing rather than maintenance testing, so this is not a trigger for maintenance testing"},{"text":"The refund option of the currency exchange system was removed as it did not always repay the correct amount to customers","correct":true,"why":"Is correct. A system modification (such as a fix or enhancement) is an example of a trigger for maintenance testing. The removal of the refund option of the currency exchange system was a fix that would lead to maintenance testing"},{"text":"The agile team has started developing a user story that adds a new customer loyalty feature to the currency exchange system","correct":false,"why":"Is not correct. If the agile team has started developing a user story that adds a new customer loyalty feature to the currency exchange system, then this will result in them testing the new feature, and then they would perform regression testing. No maintenance testing is required in this situation"},{"text":"The language support option of the currency exchange system was used to enable both English and local language currency transactions","correct":false,"why":"Is not correct. Reconfiguration of the currency exchange system to support both the local language and English currency transactions is not a system modification, a change to the operational environment, or a system retirement, which are the three triggers for maintenance testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-15","source":"ISTQB Sample Exam D, Q15","chapter":3,"lo":"FL-3.1.1","k":"K1","stem":"Which of the following CANNOT be examined by static testing?","stemAfter":null,"table":null,"options":[{"text":"Contract","correct":false,"why":"Is not correct. Most work products can be examined using some form of static testing, and a contract must be interpretable by humans and so could be reviewed, which is a form of static testing"},{"text":"Test plan","correct":false,"why":"Is not correct. Most work products can be examined using some form of static testing, and a test plan must be interpretable by humans and so could be reviewed, which is a form of static testing"},{"text":"Encrypted code","correct":true,"why":"Is correct. Most work products can be examined using some form of static testing; however it is not suitable for work products that are too complex for human interpretation and should not be analyzed by tools, and encrypted code is too complex for humans and if it is properly encrypted it will not be analyzable by most tools"},{"text":"Test charter","correct":false,"why":"Is not correct. Most work products can be examined using some form of static testing, and a test charter must be interpretable by humans and so could be reviewed, which is a form of static testing"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-16","source":"ISTQB Sample Exam D, Q16","chapter":3,"lo":"FL-3.1.2","k":"K2","stem":"Which of the following statements about the value of static testing is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"The defect types found by static testing are different from the defect types that can be found by dynamic testing","correct":false,"why":"Is not correct"},{"text":"Dynamic testing can detect the defect types that can be found by static testing plus some additional defect types","correct":false,"why":"Is not correct"},{"text":"Dynamic testing can identify some of the defects that can be found by static testing but not all of them","correct":true,"why":"Is correct"},{"text":"Static testing can identify the defect types that can be found by dynamic testing as well as some extra defect types","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Some defect types that can only be detected by static testing, such as unreachable code, design patterns not implemented as desired and defects in non-executable work products. Some defect types that can be found by both static testing and dynamic testing, such as a programming defect that can be observed by a reviewer in a code review and which causes an observable failure during dynamic testing. And some defect types that can only be detected by dynamic testing, such as performance issues or memory issues that can only be observed when executing the code or system."},{"id":"ISTQB-D-17","source":"ISTQB Sample Exam D, Q17","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"Given the following descriptions of review activities:\n1. Detected anomalies are deliberated upon, and determinations are reached regarding their status, ownership, and any further steps needed\n2. Defects are recorded, and any needed updates are addressed prior to the acceptance of the work product\n3. Reviewers employ techniques to come up with suggestions and questions about the work product and to spot anomalies\n4. The objective of the review and its schedule are established to ensure a focused and efficient review\n5. Participants are provided with access to the item being reviewed\nWhich of the following is the CORRECT sequence in the review process of the activities that correspond to the descriptions?","stemAfter":null,"table":null,"options":[{"text":"4 – 3 – 5 – 2 – 1","correct":false,"why":"Is not correct"},{"text":"4 – 5 – 3 – 1 – 2","correct":true,"why":"Is correct. The correct sequence of activities is: 4 – 5 – 3 – 1 – 2"},{"text":"5 – 4 – 1 – 3 – 2","correct":false,"why":"Is not correct"},{"text":"5 – 4 – 3 – 2 – 1","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The five listed descriptions and the corresponding review process activities are:\n1. This describes part of the ‘communication and analysis’ activity\n2. This describes part of the ‘fixing and reporting’ activity\n3. This describes part of the ‘individual review’ activity\n4. This describes part of the ‘planning’ activity\n5. This describes part of the ‘review initiation’ activity\nThe generic review process from ISO/IEC 20246, which is outlined in the syllabus, comprises the following activities in this logical order:\n• Planning (4)\n• Review initiation (5)\n• Individual review (3)\n• Communication and analysis (1)\n• Fixing and reporting (2)"},{"id":"ISTQB-D-18","source":"ISTQB Sample Exam D, Q18","chapter":3,"lo":"FL-3.2.3","k":"K1","stem":"Which participant in the review process is responsible for ensuring that the review meetings run effectively and that everyone at the meetings can voice their opinions freely?","stemAfter":null,"table":null,"options":[{"text":"Manager","correct":false,"why":"Is not correct. The manager is responsible for deciding what needs to be reviewed and allocating resources, such as staff and time, for the review"},{"text":"Moderator","correct":true,"why":"Is correct. The moderator (or facilitator) is responsible for ensuring that the review meetings run effectively, including managing time, mediating discussions, and creating a safe environment where everyone can voice their opinions freely"},{"text":"Chairperson","correct":false,"why":"Is not correct. The chairperson is not a recognized role in reviews"},{"text":"Review Leader","correct":false,"why":"Is not correct. The review leader is responsible for overseeing the review process, such as selecting the review team members, scheduling review meetings, and ensuring that the review is completed successfully"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-19","source":"ISTQB Sample Exam D, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"You perform system testing of an e-commerce web application and are provided with the following requirement:\nREQ 05-017. If the total cost of purchases exceeds $100, the customer gets a 5% discount on subsequent purchases. Otherwise, the customer does not receive a discount.\nWhich test techniques will be MOST helpful in designing test cases based on this requirement?","stemAfter":null,"table":null,"options":[{"text":"White-box test techniques","correct":false,"why":"Is not correct. The document does not refer to the test object’s internal structure but specifies the desired behavior of the test object. Therefore, white-box test techniques will not be helpful in designing test cases"},{"text":"Black-box test techniques","correct":true,"why":"Is correct. The document is a requirement that specifies the desired behavior of the test object. Therefore, the most suitable test techniques in this case are the black-box test techniques (e.g., Boundary Value Analysis or Decision Table Testing)"},{"text":"Experience-based test techniques","correct":false,"why":"Is not correct. Although experience-based test techniques can be used to design test cases based on this document, black-box test techniques will be more suitable. The document describes a precise business rule and, in addition, wording like \"exceeds $100\" suggests the existence of important equivalence partition boundaries that should be tested using black-box test techniques like Boundary Value Analysis"},{"text":"Risk-based test techniques","correct":false,"why":"Is not correct. Risk-based test techniques are not a recognized type of test technique"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-20","source":"ISTQB Sample Exam D, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"The system for selling cinema tickets calculates the discount type based on the client’s birth year (BY) and on the current year (CY) as follows:\nLet D be the difference between CY and BY, that is, D = CY – BY\n• If D < 0\nthen print the error message “birth year cannot be greater than current year”\n• If 0 ≤ D < 18\nthen apply the student discount\n• If 18 ≤ D < 65\nthen apply no discount\n• If D ≥ 65\nthen apply the pensioner discount\nYour test suite already contains two test cases:\n• BY = 1990,\nCY = 2020,\nexpected result: no discount\n• BY = 2030,\nCY = 2029,\nexpected result: print the error message\nWhich of the following test data sets should be added to achieve full valid equivalence partitioning coverage for the discount type?","stemAfter":null,"table":null,"options":[{"text":"BY = 2001, CY = 2065","correct":false,"why":"Is not correct. CY – BY = 64, so these inputs correspond to the already covered “no discount” partition"},{"text":"BY = 1900, CY = 1965","correct":true,"why":"Is correct. CY – BY = 65, so these inputs correspond to a partition that is not yet covered (“pensioner discount”)"},{"text":"BY = 1965, CY = 1900","correct":false,"why":"Is not correct. CY – BY = –65, so these inputs correspond to the already covered “error message” partition"},{"text":"BY = 2011, CY = 2029","correct":false,"why":"Is not correct. CY – BY = 18, so these inputs correspond to the already covered “no discount” partition"},{"text":"BY = 2000, CY = 2000","correct":true,"why":"Is correct. CY – BY = 0, so these inputs correspond to a partition that is not yet covered (“student discount”)"}],"selectCount":2,"lockOrder":false,"diagramConverted":false,"explanation":"There are two equivalence partitions that are not yet covered, which correspond to “student discount” and “pensioner discount”."},{"id":"ISTQB-D-21","source":"ISTQB Sample Exam D, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"You are testing a temperature control system for a horticultural cold storage facility. The system receives the temperature (in full degrees Celsius) as the input. If the temperature is between 0 and 2 degrees inclusive, the system displays the message “temperature OK”. For lower temperatures, the system displays the message \"temperature too low\" and for higher temperatures it displays the message “temperature too high”.\nUsing two-value boundary value analysis, which of the following sets of test inputs provides the highest level of boundary value coverage?","stemAfter":null,"table":null,"options":[{"text":"–1, 3","correct":false,"why":"Is not correct"},{"text":"0, 2","correct":false,"why":"Is not correct"},{"text":"–1, 0, 2, 3","correct":true,"why":"Is correct. The correct option is: –1, 0, 2, 3"},{"text":"–2, 0, 2, 4","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are three equivalence partitions: {…, –2, –1}, {0, 1, 2}, {3, 4, …}. For 2-value BVA all the boundary values for all the equivalence partitions must be covered.\nThe boundary values are –1 (for the “temperature too low” partition), 0, 2 (for the “temperature OK” partition) and 3 (for the “temperature too high” partition)."},{"id":"ISTQB-D-22","source":"ISTQB Sample Exam D, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"You are designing test cases based on the following decision table.","stemAfter":"So far you have designed the following test cases:\n• TC1: 19-year-old, unregistered man with no experience;\nexpected result: category A\n• TC2: 65-year-old, unregistered woman with 5 years of experience; expected result: category B\n• TC3: 66-year-old, registered man with no experience;\nexpected result: category C\n• TC4: 65-year-old, registered woman with 4 years of experience;\nexpected result: category D\nWhich of the following test cases, when added to the existing set of test cases, will increase the decision table coverage?","table":"<table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>R5<\/th><th>R6<\/th><th>R7<\/th><\/tr><tr><td>C1: Age<\/td><td>0-18<\/td><td>19-65<\/td><td>19-65<\/td><td>&gt;65<\/td><td>0-18<\/td><td>19-65<\/td><td>&gt;65<\/td><\/tr><tr><td>C2: Experience<\/td><td>-<\/td><td>0-4<\/td><td>&gt;4<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>C3: Registered?<\/td><td>NO<\/td><td>NO<\/td><td>NO<\/td><td>NO<\/td><td>YES<\/td><td>YES<\/td><td>YES<\/td><\/tr><tr><td>Category<\/td><td>A<\/td><td>A<\/td><td>B<\/td><td>B<\/td><td>B<\/td><td>D<\/td><td>C<\/td><\/tr><\/table>","options":[{"text":"66-year-old, unregistered man with no experience; expected result: category B","correct":true,"why":"Is correct. The conditions “66-year-old”, “unregistered” and “no experience” match rule R4, which is not covered by the existing test cases, so after adding this test case, the decision table coverage will increase"},{"text":"55-year-old, unregistered woman with 2 years of experience; expected result: category A","correct":false,"why":"Is not correct. The conditions “55-year-old”, “unregistered” and “2 years of experience” match rule R2, already covered by TC1. So adding this test case will not increase the coverage"},{"text":"19-year-old, registered woman with 5 years of experience; expected result: category D","correct":false,"why":"Is not correct. The conditions “19-year-old”, “registered” and “5 years of experience” match rule R6, already covered by TC4. So adding this test case will not increase the coverage"},{"text":"No additional test case can increase the already achieved decision table coverage","correct":false,"why":"Is not correct. The existing test cases cover only 4 out of 7 columns of the decision table. The coverage can be increased by adding test cases that cover yet uncovered columns, that is, R1, R4 and R5"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Test cases TC1, TC2, TC3 and TC4 cover, respectively, rules R2, R3, R7 and R6 in the decision table."},{"id":"ISTQB-D-23","source":"ISTQB Sample Exam D, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"You are applying state transition testing to the hotel room reservation system modeled by the following state transition table, with 4 states and 5 different events:","stemAfter":"Assuming all test cases start in the ‘Requesting’ state, which of the following test cases, represented as sequences of events, achieves the highest valid transitions coverage?","table":"<table class=\"qt\"><tr><th><\/th><th colspan=\"5\">Events<\/th><\/tr><tr><th>State<\/th><th>Available<\/th><th>NotAvailable<\/th><th>ChangeRoom<\/th><th>Cancel<\/th><th>Pay<\/th><\/tr><tr><td>S1: Requesting<\/td><td>S2<\/td><td>S3<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>S2: Confirmed<\/td><td><\/td><td><\/td><td>S1<\/td><td>S4<\/td><td>S4<\/td><\/tr><tr><td>S3: Waiting list<\/td><td>S2<\/td><td><\/td><td><\/td><td>S4<\/td><td><\/td><\/tr><tr><td>S4: End<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table>","options":[{"text":"NotAvailable, Available, ChangeRoom, NotAvailable, Cancel","correct":false,"why":"Is not correct. This sequence of five events covers 4 different valid transitions (both “NotAvailable” events correspond to the same transition between S1 and S3). This test case covers 4 out of 7 valid transitions"},{"text":"Available, ChangeRoom, NotAvailable, Available, Pay","correct":true,"why":"Is correct. This sequence of five events covers 5 different transitions (the first “Available” event corresponds to a transition between S1 and S2, and the second “Available” event corresponds to a transition between S3 and S2, so two different transitions are covered). This test case covers 5 out of 7 valid transitions and achieves the highest valid transitions coverage"},{"text":"Available, ChangeRoom, Available, ChangeRoom, NotAvailable","correct":false,"why":"Is not correct. This sequence of five events covers 3 different transitions (both “Available” events correspond to the same transition from S1 to S2; both “ChangeRoom” events correspond to the same transition from S2 to S1). This test case covers 3 out of 7 valid transitions"},{"text":"NotAvailable, Cancel, ChangeRoom, Available, Pay","correct":false,"why":"Is not correct. This sequence of five events does not represent a feasible test case, because after “Cancel” the system ends up in the End state and no further valid transitions can be executed"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-24","source":"ISTQB Sample Exam D, Q24","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"Your test suite S for a program P achieves 100% statement coverage. It consists of three test cases, each of which achieves 50% statement coverage.\nWhich of the following statements is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"Executing S will cause all possible failures in P","correct":false,"why":"Is not correct. A statement with a defect, when executed, does not have to cause a failure. For example, a statement x := y / z will cause a failure only when z equals 0"},{"text":"S achieves 100% branch coverage for P","correct":false,"why":"Is not correct. 100% statement coverage does not guarantee 100% branch coverage. For example, a test case with x=0 for the code\n1. IF (x=0) THEN\n2. A;\n3. ENDIF achieves 100% statement coverage but does not cover the branch from 1 to 3"},{"text":"Every executable statement in P containing a defect has been run at least once during the execution of S","correct":true,"why":"Is correct. 100% statement coverage means that each executable statement was executed at least once"},{"text":"After removing one test case from S, the remaining two test cases will still achieve 100% statement coverage","correct":false,"why":"Is not correct. The removed test case may provide coverage of some statements that are not covered by either of the other two test cases, in which case the remaining two test cases together will not achieve 100% statement coverage"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-25","source":"ISTQB Sample Exam D, Q25","chapter":4,"lo":"FL-4.3.3","k":"K2","stem":"Why does white-box testing facilitate defect detection even when the software specification is vague, outdated or incomplete?","stemAfter":null,"table":null,"options":[{"text":"Test cases are designed based on the structure of the test object rather than the specification","correct":true,"why":"Is correct. A fundamental strength that all white-box test techniques share is that the entire software implementation is taken into account during testing, which facilitates defect detection even when the software specification is vague, outdated or incomplete. This means white-box testing can find defects such as an extra feature added to the code (either accidentally or deliberately) that is not supposed to be there, which black-box testing cannot detect"},{"text":"For each white-box test technique the coverage can be well-defined and easily measured","correct":false,"why":"Is not correct. The fact that the coverage can be precisely defined is not the right reason. The achieved level of coverage would have much more impact than the possibility to measure the coverage"},{"text":"White-box test techniques are very well designed to detect omissions in the requirements","correct":false,"why":"Is not correct. If the software does not implement one or more requirements, white-box testing is unlikely to detect the resulting defects of omission"},{"text":"White-box test techniques can be used in both static testing and dynamic testing","correct":false,"why":"Is not correct. While this is true, this is not the right answer, because there is no connection between the capability to be used in both static testing and dynamic testing and the claim that white-box testing facilitates defect detection with poor specifications"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-26","source":"ISTQB Sample Exam D, Q26","chapter":4,"lo":"FL-4.4.1","k":"K2","stem":"Which of the following is NOT anticipated by the tester while applying error guessing?","stemAfter":null,"table":null,"options":[{"text":"The developer misunderstood the formula in the user story for calculating the interest","correct":false,"why":"Is not correct. This is an example of anticipating the developer’s error"},{"text":"The developer wrote “FA = A*(1+IR^N)” instead of “FA = A*(1+IR)^N” in the source code","correct":false,"why":"Is not correct. This is an example of anticipating the defect"},{"text":"The developer missed the seminar on new compound interest rate legislation","correct":true,"why":"Is correct. This is an example of a potential root cause of a defect, which is neither an error, defect nor failure, and difficult for the tester to anticipate"},{"text":"The accuracy of the interest calculated by the system is not precise enough","correct":false,"why":"Is not correct. This is an example of anticipating a failure, perhaps based on experience of previous systems in this application domain"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Error guessing is about anticipating the errors, defects and failures based on the tester’s knowledge."},{"id":"ISTQB-D-27","source":"ISTQB Sample Exam D, Q27","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"Which of the following is true about exploratory testing?","stemAfter":null,"table":null,"options":[{"text":"Test cases are designed before the exploratory testing session starts","correct":false,"why":"Is not correct. In exploratory testing, test cases are usually created during the exploratory testing session, alongside test analysis, test implementation and test execution"},{"text":"The tester can perform test execution, but cannot perform test design","correct":false,"why":"Is not correct. In exploratory testing, tests are simultaneously designed, executed, and evaluated while the tester learns about the test object"},{"text":"Exploratory testing results are good predictors of the number of remaining defects","correct":false,"why":"Is not correct. Exploratory test results depend heavily on the tester’s experience. So, even if the test results of exploratory testing can be used as a predictor of risk and used to assess whether there will be fewer or more defects, compared to the previous exploratory testing session, they are not a good example of reliable defect prediction models that can predict the number of remaining defects"},{"text":"During exploratory testing the tester may use black-box test techniques","correct":true,"why":"Is correct. During exploratory testing, the testers can use any test techniques that they find useful"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-D-28","source":"ISTQB Sample Exam D, Q28","chapter":4,"lo":"FL-4.5.1","k":"K2","stem":"Which collaborative user story writing practice enables the team to achieve a collective understanding of what needs to be delivered?","stemAfter":null,"table":null,"options":[{"text":"Planning poker, so that a team can achieve consensus on the effort needed to implement a user story","correct":false,"why":"Is not correct. Planning poker can estimate effort for a user story that is already written. It does not help in understanding what should be delivered"},{"text":"Reviews, so that a team can detect inconsistencies and contradictions in a user story","correct":false,"why":"Is not correct. Reviews are not a collaborative user story writing practice"},{"text":"Iteration planning, so that user stories with the highest business value for a customer can be prioritized for implementati
