 the diagram."},{"text":"Start → Standby → Off → Standby → Charging → Low → Charging","correct":true,"why":"CORRECT – In this test case, the invalid transition from \"Standby\" to \"Charging\" is executed. Therefore, this test case is the one that includes an invalid transition alongside valid transitions."}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"The state transition diagram shows 10 valid transitions. The transition from \"Off\" to \"High,\" executed by test case D, is not included in the state diagram and is therefore an invalid transition (see [CTFL 4.0], Section 4.2.4):"},{"id":"GTB-B-29","source":"GTB Sample Exam B, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"Please consider the following User Story:\n\"As a coach of a football team, I want to be able to retrieve the eligibility list for a match day in DFBNET so that I can assign the squad for the next match day.\"\nWhich test case is BEST suited for acceptance test-driven development of the User Story?","stemAfter":null,"table":null,"options":[{"text":"Login as a coach into DFBNET;\nselect the upcoming match days for my team;\ndownload the eligibility lists.","correct":false,"why":"FALSE – NOT SUITABLE - because the User Story will not be accurately represented. In this test case, a list of match days is retrieved, and for each of these match days, the eligibility lists are loaded. However, this is not required or specified in the User Story. The User Story only demands the eligibility list for one match day to be loaded."},{"text":"GIVEN: I am logged in as a coach in DFBNET with my coach ID\nAND\nGIVEN: I have selected the next match day,\nWHEN I select \"load eligibility list\",\nTHEN a list of eligible players for the next match day is displayed to me","correct":true,"why":"CORRECT – MOST SUITABLE - In this test case, after logging in as a coach, the eligibility list for the next match day is loaded and displayed. This aligns with the specification of the User Story. This option is the most suitable as it clearly defines the specific steps for accepting the functionality and integrates the acceptance criteria directly into the test case."},{"text":"Login as team manager;\nselect the next match day;\nload eligibility list; remove players who are not eligible to play.","correct":false,"why":"FALSE – NOT SUITABLE - The User Story clearly specifies that the coach wants to view the eligibility list for one match day to assemble their team. There is no mention of a team manager."},{"text":"GIVEN: I have selected the next match days for my team\nWHEN I select a match day\nAND\nWHEN I load the eligibility list for this match day,\nTHEN all eligible players for this match day should be displayed to me.","correct":false,"why":"FALSE – NOT SUITABLE - While this test case appropriately tests the functionality specified in the User Story, it does not consider that the user is logged in as a coach in the DFBNET. Since the requested functionality is explicitly tailored to the role of the coach, this test case is not the best suited for accepting the User Story."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-C-7","source":"GTB Sample Exam C, Q7","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"What is a typical advantage of the whole-team approach in Agile projects?","stemAfter":null,"table":null,"options":[{"text":"The team works without dedicated testers.","correct":false,"why":"FALSE – In the whole-team approach, testers play a vital role by sharing their testing expertise with the team and guiding product development. They collaborate with other team members to achieve the desired quality levels and work with business representatives to create acceptance tests. Testers also partner with developers to determine the optimal test strategy and automation approaches."},{"text":"Improved team dynamics.","correct":true,"why":"CORRECT – By leveraging the diverse skill sets of each team member most effectively, the whole-team approach fosters superior team dynamics, promotes robust communication and collaboration, and generates a synergistic effect that benefits the entire project (see [CTFL 4.0.2], Section 1.5.2, ‘’The whole-team approach improves team dynamics, (...)\")."},{"text":"Only business representatives are responsible for testing.","correct":false,"why":"FALSE – The whole-team approach does not mean that only business representatives are responsible for testing. Instead, testers, developers, and business representatives collaborate, and responsibility for quality is shared across the whole team (see [CTFL 4.0.2], section 1.5.2)."},{"text":"Teams are enlarged by adding additional roles.","correct":false,"why":"FALSE – There is no specific guidance on the optimum size of teams using the whole-team approach, and there is no suggestion that larger teams are better."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-C-13","source":"GTB Sample Exam C, Q13","chapter":2,"lo":"FL-2.2.1","k":"K2","stem":"At which test level are validation and demonstrating readiness for deployment the main focus, and the tests should ideally be performed by the intended users?","stemAfter":null,"table":null,"options":[{"text":"Component testing","correct":false,"why":"FALSE – Component testing (also called unit testing) involves testing individual components in isolation and is mostly verification against a specification, rather than validation against user needs. However, this testing is not normally performed by testers, as developers usually carry out this testing in their development environment."},{"text":"Component integration testing","correct":false,"why":"FALSE – Component integration testing involves testing the interfaces and interactions between components and is mostly verification against a specification, rather than validation against user needs. However, this testing is not normally performed by testers, as developers usually carry out this testing."},{"text":"System integration testing","correct":false,"why":"FALSE – System integration testing examines the interfaces with other systems and external services and is mostly verification against a specification, rather than validation against user needs. This type of testing is also most often performed by testers."},{"text":"Acceptance testing","correct":true,"why":"CORRECT – Acceptance testing focuses on validation and demonstrating readiness for deployment, i.e., on determining whether the system satisfies the user’s business needs. Ideally, acceptance tests should be performed by the intended users (see [CTFL 4.0.2], section 2.2.1)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-C-20","source":"GTB Sample Exam C, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"A PIN validator accepts valid PINs and rejects invalid ones. Only inputs consisting of digits are considered.\nA PIN is valid if it consists of exactly four digits and at least two of them are different.\nWhich of the following data sets covers all relevant equivalence partitions?","stemAfter":null,"table":null,"options":[{"text":"112, 1111, 1234, 123456","correct":true,"why":"Is correct."},{"text":"1, 123, 1111, 1234","correct":false,"why":"Is not correct."},{"text":"12, 112, 1112, 11112","correct":false,"why":"Is not correct."},{"text":"1, 111, 1111, 11111","correct":false,"why":"Is not correct."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The source gives no written rationale for this question; the official answer key marks the correct option."},{"id":"GTB-E-1","source":"GTB Sample Exam E, Q1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which of the following statements describes a typical test objective?","stemAfter":null,"table":null,"options":[{"text":"The test begins shortly before test object is released in order to find defects that would prevent acceptance.","correct":false,"why":"FALSE – This statement describes a test objective that focuses on identifying defects shortly before release. According to [CTFL 4.0], one goal of testing is to find and fix defects before the system goes into production. However, it is not typical to start testing just before release; testing should be done throughout the development process to find and fix defects early (see [CTFL 4.0], Section 1.1.1, Section 1.3)."},{"text":"A validation, that the test object functions as expected by the various stakeholders.","correct":true,"why":"CORRECT – This is one of the typical objectives of testing (see [CTFL 4.0], Section 1.1.1, 9th bullet point). This test objective aims to ensure that the test object meets the requirements and expectations of the various stakeholders. It involves checking the functionality, usability, and other aspects of the test object to ensure that it serves its intended purpose."},{"text":"A demonstration, that all defects have been identified.","correct":false,"why":"FALSE – Contradicts Principle 2: \"Complete testing is impossible.\" (see [CTFL 4.0], Section 1.3) and the consequent derivation that it is not possible to prove that all defects have been found. Thus, this is not a typical test objective (see [CTFL 4.0], Section 1.1.1)."},{"text":"A demonstration, that the remaining defects will not have negative impacts.","correct":false,"why":"FALSE – To assess whether a defect causes a failure or not, the defect must be known. Demonstrating that the remaining defects do not cause failures implicitly means that all defects have been found. This contradicts (analogous to Option “A demonstration, that all defects have been identified.”) Principle 2 (see [CTFL 4.0], Section 1.3). Thus, this is not a typical test objective (see [CTFL 4.0], Section 1.1.1)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-3","source":"GTB Sample Exam E, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"A product owner says that your role as a tester on an Agile team is to catch all the bugs before the end of each iteration.\nWhich of the following is a testing principle that could be used to respond to this (false) statement?","stemAfter":null,"table":null,"options":[{"text":"Defect clustering","correct":false,"why":"FALSE – Defect clustering has to do with where defects are most likely to be found, not whether all of them can be found (see [CTFL 4.0], Section 1.3; 4th principle)."},{"text":"Testing shows the presence of defects","correct":true,"why":"CORRECT – Testing can show the presence of defects but cannot prove their absence, which makes it impossible to know if you have caught all the bugs. Further, the impossibility of exhaustive testing makes it impossible for you to catch all the bugs (see [CTFL 4.0], Section 1.3; 1st principle)."},{"text":"Absence of error fallacy","correct":false,"why":"FALSE – This principle says that you can find and remove many bugs but still release an unsuccessful software product, which is not what the product owner is asking you to ensure \" (see [CTFL 4.0], Section 1.3, 7th principle)"},{"text":"Root cause analysis","correct":false,"why":"FALSE – Root cause analysis is not a testing principle (see [CTFL 4.0], Section 1.3)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-4","source":"GTB Sample Exam E, Q4","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which of the following is an example of a task that can be carried out as part of the test implementation of the test process?","stemAfter":null,"table":null,"options":[{"text":"Analyzing a defect","correct":false,"why":"FALSE – Analyzing a defect is part of debugging, not testing (see [CTFL 4.0], Section 1.1.2, 2nd Paragraph)"},{"text":"Designing test data","correct":true,"why":"CORRECT – Is correct. Creating test data is a test implementation task (see [CTFL 4.0], Section 1.4.1, 6th Paragraph)"},{"text":"Assigning a version to a test item","correct":false,"why":"FALSE – While a tester may need to identify a test item’s version for results assigning a test item’s version is part of configuration management"},{"text":"Writing a user story","correct":false,"why":"FALSE – Writing a user story is not a testing activity and should be done by the product owner (see [CTFL 4.0], Section 3.1, 2nd Paragraph)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-5","source":"GTB Sample Exam E, Q5","chapter":1,"lo":"FL-1.4.2","k":"K2","stem":"Which of the following statements is an example of a technical factor that influences the testing process?","stemAfter":null,"table":null,"options":[{"text":"The software is a web application that must work on various browsers.","correct":true,"why":"CORRECT – This is an example of a technical factor that influences the testing process. Technical factors influencing the testing process include the type of software, product architecture, and technology used (see [CTFL 4.0], Section 1.4.2, 4th bullet point)."},{"text":"The software is intended for a financial services provider with strict security requirements.","correct":false,"why":"FALSE – This is not an example of a technical factor but rather an organizational aspect influencing the testing process, as the criticality of the test object, identified risks, market needs, and specific legal requirements can determine the test strategy, test procedures, test documentation, and reporting (see [CTFL 4.0], Section 1.4.2, 3rd bullet point)."},{"text":"The software is developed using an agile methodology that requires short iterations and frequent releases.","correct":false,"why":"FALSE – This is not an example of a technical factor but rather the software development life cycle factor influencing the testing process, as technological practices and development methods can determine the test strategy, test procedures, test automation, and test documentation (see [CTFL 4.0], Section 1.4.2, 7th bullet point)."},{"text":"The software is tested by a team with varying competencies and experiences.","correct":false,"why":"FALSE – This is not an example of a technical factor but rather the team member factor influencing the testing process, as competency, knowledge, experience level, availability, and training needs can determine the test strategy, test procedures, test automation, and test documentation (see [CTFL 4.0], Section 1.4.2, 2nd bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-7","source":"GTB Sample Exam E, Q7","chapter":1,"lo":"FL-1.5.3","k":"K2","stem":"During the discussion of a user story in an agile project, as a tester, you identify a contradiction in the interpretation of acceptance criteria of a user story between the Product Owner and the development team. You raise this contradiction.\nWhich of the following options describes an advantage of independent testing that becomes apparent in this situation?","stemAfter":null,"table":null,"options":[{"text":"Testers can recognize different types of failures and conditions.","correct":false,"why":"FALSE – Recognizing different types of failures and conditions is an advantage of independent testing (see [CTFL 4.0], Section 1.5.3, 3rd paragraph), but it is not utilized in this scenario. Here, the advantage lies in questioning assumptions and statements, especially from the testing perspective."},{"text":"Testers can take primary responsibility for quality.","correct":false,"why":"FALSE – Assuming primary responsibility for quality by independent testers is not an advantage but rather a disadvantage, as other stakeholders may lose their responsibility for quality (see [CTFL 4.0], Section 1.5.3, 4th paragraph)."},{"text":"Developers can trust that testers will ensure the desired quality of work results.","correct":false,"why":"FALSE – This does not describe an advantage of independent testing but rather a disadvantage (see [CTFL 4.0], Section 1.5.3, 4th paragraph, penultimate sentence: \"Developers may lose the sense of responsibility for quality\")."},{"text":"Testers can question assumptions made by stakeholders.","correct":true,"why":"CORRECT – Questioning and challenging assumptions made by stakeholders is an advantage of independent testing (see [CTFL 4.0], Section 1.5.3, 3rd paragraph). This advantage becomes evident in this scenario as the tester can highlight contradictions in the assumptions and achieve early clarification, thus potentially avoiding future missteps in development."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-8","source":"GTB Sample Exam E, Q8","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following options BEST describes the responsibilities arising from the agile Whole-Team approach?","stemAfter":null,"table":null,"options":[{"text":"Testers are responsible for developing unit tests and pass them on to developers for execution.","correct":false,"why":"FALSE – Depending on the skills of a team member, anyone can undertake this task. The task is not tied to a specific role (see [CTFL 4.0], Section 1.5.2, 2nd paragraph). Therefore, this statement is not applicable to the Whole-Team approach."},{"text":"Business representatives are tasked with selecting the tools that the development team should use.","correct":false,"why":"FALSE – The Whole-Team approach does not have a hierarchical approach but resolves tasks based on competencies and abilities each individual brings (see [CTFL 4.0], Section 1.5.2, 2nd paragraph). Thus, the team can also decide on tools, not individual roles."},{"text":"Testers are expected to create test cases collaboratively with business representatives and the development team.","correct":true,"why":"CORRECT – Testers support business representatives in defining suitable acceptance test cases (see [CTFL 4.0], Section 1.5.2, 3rd paragraph). The agile Whole-Team approach emphasizes collaboration and accountability of the entire team, including developers, testers, and business representatives."},{"text":"Developers are expected to test non-functional requirements (performance, usability, security, etc.).","correct":false,"why":"FALSE – Depending on the skills of team members, these tasks can be undertaken by any team member. The tasks are not tied to specific roles (see [CTFL 4.0], Section 1.5.2, 2nd paragraph). Therefore, this statement is not applicable to the Whole-Team approach."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-9","source":"GTB Sample Exam E, Q9","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following statements describes a good practice for testing in all Software lifecycle models (SDLC)?","stemAfter":null,"table":null,"options":[{"text":"Test activities for a testing phase begin during the corresponding development phase.","correct":true,"why":"CORRECT – Testing should start during development, for example, test analysis and test design, to detect and fix defects early (see [CTFL 4.0], Section 2.1.2, 3rd bullet point)."},{"text":"A testing phase in the software lifecycle model starts when the preceding testing phase is completed.","correct":false,"why":"FALSE – This describes an approach that applies only to a sequential model and even there is not necessarily a good practice (see [CTFL 4.0], Section 2.1)."},{"text":"Testing is considered as a separate phase. It begins when development is completed.","correct":false,"why":"FALSE – This describes the approach in the sequential waterfall model and is therefore not a good practice for all models (see [CTFL 4.0], Section 2.1)."},{"text":"Testing is added to development as an increment.","correct":false,"why":"FALSE – Testing itself is not an increment/additional step in development, but during development, there are increments that need to be tested (see [CTFL 4.0], Section 2.1.1)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-10","source":"GTB Sample Exam E, Q10","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following described development approaches does NOT define testing as a driver of software development?","stemAfter":null,"table":null,"options":[{"text":"Tests are created first. Then the code is written","correct":false,"why":"FALSE – This is a correct approach for test-driven development (see [CTFL 4.0], Section 2.1.3, 1st paragraph)."},{"text":"Test cases drive the coding","correct":false,"why":"FALSE – This is a correct approach for test-driven development, specifically the TDD example (see [CTFL 4.0], Section 2.1.3, 2nd paragraph, 1st bullet point)."},{"text":"The desired behavior of an application is defined by test cases","correct":false,"why":"FALSE – This is a correct approach for test-driven development, specifically the BDD example (see [CTFL 4.0], Section 2.1.3, 4th paragraph, 1st bullet point)."},{"text":"Tests are derived from acceptance criteria and partially automated","correct":true,"why":"CORRECT – This approach does not define test-driven development because in this statement, the test cases are designed and automated based on acceptance criteria, but not necessarily before development (see [CTFL 4.0], Section 2.1.3, 1st paragraph, 2nd sentence). The tests do not necessarily have an explicit influence on development, so it is not an effective approach."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-11","source":"GTB Sample Exam E, Q11","chapter":2,"lo":"FL-2.1.5","k":"K2","stem":"Which of the following statements BEST describes the Shift-Left approach in software development life cycle (SDLC) testing?","stemAfter":null,"table":null,"options":[{"text":"Test activities start as early as possible in the SDLC and are conducted in parallel with development activities.","correct":true,"why":"CORRECT – The Shift-Left approach implements the principle of early testing, where test activities begin as early as possible in the software development life cycle and are conducted in parallel with development activities (see [CTFL 4.0], Section 2.1.5, 1st paragraph)."},{"text":"Test activities start as late as possible in the SDLC and are conducted after the development activities.","correct":false,"why":"FALSE – Since the Shift-Left approach implements the principle of early testing, this option describes the opposite of Shift-Left and is therefore not a correct statement (see [CTFL 4.0], Section 2.1.5)."},{"text":"Test activities start in the middle of the SDLC and are conducted in parallel with development activities.","correct":false,"why":"FALSE – The Shift-Left approach implements the principle of early testing, where test activities begin as early as possible in the software development life cycle. This does not specify a time frame, so the \"middle of the software development life cycle\" is not a correct statement for the Shift-Left approach (see [CTFL 4.0], Section 2.1.5)."},{"text":"Test activities are distributed across multiple phases of the SDLC and conducted in each phase according to the maturity level of the product.","correct":false,"why":"FALSE – Since the Shift-Left approach does not prescribe that test activities be divided into multiple phases of the software development life cycle and conducted in each phase according to the maturity level of the product, this statement is not correct in relation to the Shift-Left approach (see [CTFL 4.0], Section 2.1.5)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-12","source":"GTB Sample Exam E, Q12","chapter":2,"lo":"FL-2.1.1","k":"K2","stem":"As a tester in a project following the iterative-incremental development model, which of the following statements should you consider to optimally integrate the testing activities?","stemAfter":null,"table":null,"options":[{"text":"You plan testing as a one-time activity once all increments of the product have been implemented.","correct":false,"why":"FALSE – This approach describes an (also poor) interpretation of the waterfall model, not an iterative-incremental approach."},{"text":"Static tests should only take place at the component testing level to find as many code-related fault conditions early as possible.","correct":false,"why":"FALSE – Static tests should generally be provided in every iteration at all testing levels, not just in component testing (see [CTFL 4.0], Section 2.1.1, 3rd paragraph: \"This implies that in each iteration, both static and dynamic tests can be performed at all test levels.\")."},{"text":"Since quick feedback on the quality of an increment is important, testers should ideally perform regression tests manually.","correct":false,"why":"FALSE – While it is correct that quick feedback is necessary for each increment, this suggests that regression tests should be automated rather than manually performed."},{"text":"Due to the delivery of new increments over various iterations, it is important to build comprehensive regression tests.","correct":true,"why":"CORRECT – In each iteration, a piece of new functionality is delivered, meaning that the amount of existing and already accepted functionality also grows from iteration to iteration. This necessitates comprehensive regression testing to mitigate regression risk (see [CTFL 4.0], Section 2.1.1, 3rd paragraph, last sentence: \"Frequent delivery of increments requires rapid feedback and extensive regression testing\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-13","source":"GTB Sample Exam E, Q13","chapter":2,"lo":"FL-2.2.1","k":"K2","stem":"A test case has the following characteristics:\n• It is based on interface specifications.\n• The focus is on finding failures in the interaction between components.\n• Both functional and structure-based tests are applied.\nIn which of the following test levels is this test case MOST LIKELY to be executed?","stemAfter":null,"table":null,"options":[{"text":"Component Integration Test","correct":true,"why":"CORRECT – The Component Integration Test focuses on testing interfaces and interactions between components (see [CTFL 4.0], Section 2.2.1, 2nd bullet point). It is based on interface specifications, and both functional and structure-based tests (White-Box testing) are relevant."},{"text":"Acceptance Test","correct":false,"why":"FALSE – The Acceptance Test focuses on validating the system and its suitability for use, thus emphasizing function and performance (see [CTFL 4.0], Section 2.2.1, 3rd bullet point). It is not based on interface specifications, and the test objectives are not aimed at internal communication."},{"text":"System Test","correct":false,"why":"FALSE – The System Test focuses on overall behavior and performance through functional and non-functional tests (see [CTFL 4.0], Section 2.2.1, 5th bullet point). It is not based on interface specifications, and the test objectives are not aimed at internal communication."},{"text":"Component Test","correct":false,"why":"FALSE – The Component Test focuses on testing isolated components (see [CTFL 4.0], Section 2.2.1, 1st bullet point). While it may involve specification-oriented and structure-based testing, the test objectives are not specifically oriented towards communication via interfaces."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-14","source":"GTB Sample Exam E, Q14","chapter":2,"lo":"FL-2.3.1","k":"K2","stem":"Which of the following options is NOT a trigger for maintenance and maintenance testing?","stemAfter":null,"table":null,"options":[{"text":"Decommissioning","correct":false,"why":"FALSE– Decommissioning is a trigger for maintenance and a maintenance test (see [CTFL 4.0], section 2.3.1, 3rd paragraph, 3rd bullet point)."},{"text":"Corrective changes or hotfixes","correct":false,"why":"FALSE – Corrective changes or hotfixes are also triggers for maintenance and maintenance testing as they involve bug fixes or urgent changes to the system (see [CTFL 4.0], section 2.3.1, 3. Paragraph; 1st bullet point)."},{"text":"Upgrades or migrations of the operating environment","correct":false,"why":"FALSE – Upgrades or migrations of the operating environment can also trigger maintenance and maintenance testing as they may require testing of the new environment as well as the changed software (see [CTFL 4.0], section 2.3.1, 3. Paragraph; 2nd bullet point)."},{"text":"Implementation of new features","correct":true,"why":"CORRECT – The implementation of new features is not a trigger for maintenance and maintenance testing as it is typically carried out in development activities and not in maintenance activities (see [CTFL 4.0], Chap. 2.1)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-15","source":"GTB Sample Exam E, Q15","chapter":3,"lo":"FL-3.1.2","k":"K2","stem":"Which of the following statements is MOST true about static testing?","stemAfter":null,"table":null,"options":[{"text":"Static testing is a cheap way to detect defects","correct":true,"why":"CORRECT – Defects found early are often much cheaper to remove than defects detected later in the lifecycle (see [CTFL 4.0], Section 3.1.2)."},{"text":"Static testing makes dynamic testing less challenging","correct":false,"why":"FALSE – Dynamic testing still has its challenging because they find other types of defects (see [CTFL 4.0], Section 3.1.2)."},{"text":"Static testing makes it possible to find run-time problems early in the lifecycle","correct":false,"why":"FALSE – This is dynamic testing (see Glossary)."},{"text":"When testing safety-critical system, static testing has less value because dynamic testing finds the defects better","correct":false,"why":"FALSE – Static testing is important for safety-critical computer systems (see [CTFL 4.0], Section 3.1.2)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-16","source":"GTB Sample Exam E, Q16","chapter":3,"lo":"FL-3.2.1","k":"K1","stem":"Which of the following statements does NOT describe an advantage of early and frequent stakeholder feedback?","stemAfter":null,"table":null,"options":[{"text":"Frequent stakeholder feedback helps to understand and implement changes to requirements earlier.","correct":false,"why":"FALSE – This is an advantage of early and frequent stakeholder feedback (see [CTFL 4.0], Section 3.2.1, 2nd paragraph: \"(...) changes to the requirements understood and implemented earlier.\")."},{"text":"Frequent stakeholder feedback helps the development team better understand what they are developing.","correct":false,"why":"FALSE – This is an advantage of early and frequent stakeholder feedback (see [CTFL 4.0], Section 3.2.1, 2nd paragraph: \"This helps the development team better understand what it is developing.\")."},{"text":"Frequent stakeholder feedback helps the development team focus on the features that bring the most value.","correct":false,"why":"FALSE – This is an advantage of early and frequent stakeholder feedback (see [CTFL 4.0], Section 3.2.1, 2nd paragraph: \"It allows them to focus on the features that bring the most value to the stakeholders.\")."},{"text":"Frequent stakeholder feedback can lead to misunderstandings about requirements.","correct":true,"why":"CORRECT – The statement is not an advantage according to the syllabus, as it negates the described benefit (see [CTFL 4.0], Section 3.2.1, 2nd paragraph: \"Frequent stakeholder feedback during the SDLC can prevent misunderstandings about requirements and ensure that changes to the requirements are understood and implemented earlier.\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-17","source":"GTB Sample Exam E, Q17","chapter":3,"lo":"FL-3.2.4","k":"K2","stem":"Which of the review types listed below is BEST suited when the review is to be conducted in accordance with the full general review process and with the aim of finding as many anomalies as possible?","stemAfter":null,"table":null,"options":[{"text":"Informal Review","correct":false,"why":"FALSE – An informal review does not use a defined process (see [CTFL 4.0], Section 3.2.4, 3rd paragraph, 1st bullet point)."},{"text":"Technical Review","correct":false,"why":"FALSE – The main goal of a technical review is consensus-building and decision-making regarding a technical issue. While a defined review process and anomaly detection are possible, they are not decisive factors for choosing this type of review (see [CTFL 4.0], Section 3.2.4, 3rd paragraph, 3rd bullet point)."},{"text":"Inspection","correct":true,"why":"CORRECT – Inspection utilizes the full general review process with the aim of uncovering as many anomalies or deviations as possible, among other objectives (see [CTFL 4.0], Section 3.2.4, 3rd paragraph, 4th bullet point)."},{"text":"Walkthrough","correct":false,"why":"FALSE – A walkthrough does not necessarily require a defined process, for example, individual review might be skipped. Additionally, a walkthrough pursues a variety of goals, including uncovering anomalies. However, maximizing the number of anomalies found is not its primary focus (see [CTFL 4.0], Section 3.2.4, 3rd paragraph, 2nd bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-18","source":"GTB Sample Exam E, Q18","chapter":3,"lo":"FL-3.2.5","k":"K1","stem":"During a phase of intense project overtime, an extensive system architecture specification is sent to various project participants, along with additional information and the announcement of a technical review in three days. The technical review was not originally scheduled. No further adjustments are made to the assigned tasks of the project participants who are to act as reviewers during the technical review. Based on the information provided, which of the following success factors for reviews is missing, based solely on the information given?","stemAfter":null,"table":null,"options":[{"text":"Appropriate type of review","correct":false,"why":"FALSE – Technical reviews are suitable for technical documents such as a system architecture, indicating an appropriate review type was chosen (see [CTFL 4.0], Section 3.2.5, 1st paragraph, 2nd bullet point)."},{"text":"Sufficient time for preparation","correct":true,"why":"CORRECT – Sufficient preparation time is an important success factor for reviews, but the project participants are already working overtime and have no additional time for an \"Individual Review\" since their assigned tasks are not reduced. In short: Adequate preparation time is not scheduled (see [CTFL 4.0], Section 3.2.5, 1st paragraph, 5th bullet point). Sufficient preparation time is crucial to ensure that the reviewers can thoroughly examine the system architecture specification and provide high-quality feedback. Without sufficient preparation time, the effectiveness of the review may be compromised."},{"text":"Setting clear goals and measurable end criteria","correct":false,"why":"FALSE – Setting clear goals and measurable end criteria is a valid success factor, but its absence cannot be inferred from the information provided in the stem. These could be provided in the \"further information\" (see [CTFL 4.0], Section 3.2.5, 1st paragraph, 1st bullet point)."},{"text":"Well-led review session","correct":false,"why":"FALSE – A well-led review session can be a success factor, but there is no reason to assume that the review session will not be well-led based on the provided information (see [CTFL 4.0], Section 3.2.5, 1st paragraph, 9th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-19","source":"GTB Sample Exam E, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"Before an iteration planning meeting, you analyze a User Story and its acceptance criteria. From this, you derive corresponding test cases to apply the principle of early testing.\nWhich test procedure or approach are you using?","stemAfter":null,"table":null,"options":[{"text":"White-Box-Testing","correct":false,"why":"FALSE – White-Box Testing (also known as structure-based testing) is based on an analysis of the internal structure and processing of the test object. Since the test cases depend on the design of the software, they can only be created after the design or implementation of the test object (see [CTFL 4.0], Section 4.1, 4th paragraph)."},{"text":"Black-Box-Testing","correct":true,"why":"CORRECT – Black-Box Testing (also known as specification-based testing) is based on an analysis of the specified behavior of the test object without knowledge of the internal structure. The specified behavior is defined in the User Story and acceptance criteria and can be analyzed accordingly (see [CTFL 4.0], Section 4.1, 3rd paragraph)."},{"text":"Experience-Based Testing","correct":false,"why":"FALSE – Experience-Based Testing uses the knowledge and experience of testers to design test cases (see [CTFL 4.0], Section 4.1, 5th paragraph). They use specifications only as a framework and not as a basis for test design (see [CTFL 4.0], Section 4.4)."},{"text":"Error Guessing","correct":false,"why":"FALSE – Error Guessing (Intuitive Test Case Generation) is an experience-based testing method based on the knowledge of testers (see also explanation for Option “Experience-Based Testing”)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-20","source":"GTB Sample Exam E, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"A daily radiation recorder for plants produces a sunshine score based on a combination of the number of hours a plant is exposed to the sun (below 3 hours, 3 to 6 hours or above 6 hours) and the average intensity of the sunshine (very low, low, medium, high).\nGiven the following test cases:","stemAfter":"What is the minimum number of additional test cases that are needed to ensure full coverage of ALL VALID INPUT equivalence partitions?","table":"<table class=\"qt\"><tr><th><\/th><th>Hours<\/th><th>Intensity<\/th><th>Score<\/th><\/tr><tr><td>T1<\/td><td>1.5<\/td><td>very low<\/td><td>10<\/td><\/tr><tr><td>T2<\/td><td>7.0<\/td><td>medium<\/td><td>60<\/td><\/tr><tr><td>T3<\/td><td>0.5<\/td><td>very low<\/td><td>10<\/td><\/tr><\/table>","options":[{"text":"1","correct":false,"why":"FALSE"},{"text":"2","correct":true,"why":"CORRECT"},{"text":"3","correct":false,"why":"FALSE"},{"text":"4","correct":false,"why":"FALSE"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The following valid input equivalence partitions can be identified:\n• Hours:\n1. Below 3 hours\n2. 3 to 6 hours\n3. Above 6 hours\n• Intensity:\n4. Very low\n5. Low\n6. Medium\n7. High\nThe given test cases cover the following valid input equivalence partitions:\nT1 1.5 (1) Very low (4)\nT2 7.0 (3) Medium (6)\nT3 0.5 (1) Very low (4)\nThus, the missing valid input equivalence partitions are: (2), (5) and (7). These can be covered by two test cases, as (2) can be combined with either (5) or (7)."},{"id":"GTB-E-21","source":"GTB Sample Exam E, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A smart home app measures the average temperature in the house over the previous week and provides feedback to the occupants on their environmental friendliness based on this temperature.\nThe feedback for different average temperature ranges (to the nearest °C) should be:\nUp to 10°C - Icy Cool!\n11°C to 15°C - Chilled Out!\n16°C to 19°C - Cool Man!\n20°C to 22°C - Too Warm!\nAbove 22°C - Hot & Sweaty!\nUsing BVA (only Min- and Max values), which of the following sets of test inputs provides the highest level of boundary coverage?","stemAfter":null,"table":null,"options":[{"text":"0°C, 11°C, 20°C, 22°C, 23°C","correct":false,"why":"FALSE – 4 out of 8 (11, 20 ,22 and 23)"},{"text":"9°C, 15°C, 19°C, 23°C, 100°C","correct":false,"why":"FALSE – 3 out of 8 (15, 19 and 23)"},{"text":"10°C, 16°C, 19°C, 22°C, 23°C","correct":true,"why":"CORRECT – 5 out of 8 (10, 16, 19, 22 and 23)"},{"text":"14°C, 15°C, 18°C, 19°C, 21°C 22°C","correct":false,"why":"FALSE – 3 out of 8 (15, 19 and 22)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"For the input equivalence partitions given, the above used boundary value technique yields the following 8 coverage items:\n10°C, 11°C, 15°C, 16°C, 19°C, 20°C, 22°C, 23°C.\nHence, the options have the following boundary value coverage:"},{"id":"GTB-E-22","source":"GTB Sample Exam E, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"A system for calculating penalties for speeding violations in traffic is specified with the following decision table:","stemAfter":"Based on the provided decision table and existing test cases:\nTC1: Speed = 65, School Zone = Yes\nTC2: Speed = 45, School Zone = Yes\nTC3: Speed = 50, School Zone = No\nTC4: Speed = 49, School Zone = No\n\nWhich of the rules in the decision table is not yet covered by a test case?","table":"<table class=\"qt\"><tr><th><\/th><th>Rules<\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><\/tr><tr><td>Conditions<\/td><td>Speed &gt; 50<\/td><td>Y<\/td><td>Y<\/td><td>N<\/td><td>N<\/td><\/tr><tr><td><\/td><td>School Zone<\/td><td>Y<\/td><td>N<\/td><td>Y<\/td><td>N<\/td><\/tr><tr><td>Actions<\/td><td>250 € fine<\/td><td>-<\/td><td>X<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td><\/td><td>License suspension<\/td><td>X<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr><\/table>","options":[{"text":"Rule 4","correct":false,"why":"FALSE – Rule 4 is covered by test cases 3 and 4."},{"text":"Rule 1","correct":false,"why":"FALSE – Rule 1 is covered by test case 1."},{"text":"Rule 2","correct":true,"why":"CORRECT – Rule 2 is not covered."},{"text":"Rule 3","correct":false,"why":"FALSE – Rule 3 is covered by test case 2."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Rule 2 is not covered because there is no test case for the inputs Speed > 50 = Yes and School Zone = No. A possible test case would be:\nTF5: Speed = 51, School Zone = No"},{"id":"GTB-E-23","source":"GTB Sample Exam E, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"Consider the following state transition diagram for a credit-card only, unattended gasoline pump:","stemAfter":"Assume that you want to develop the minimum number of tests to cover each transition in the state transition diagram. Assume further that each test must start at the beginning state, waiting for customer, and each test ends when a transition arrives at the beginning state.\n\nHow many tests do you need?","table":"<div class=\"diag\"><svg role=\"img\" aria-label=\"state transition diagram\" style=\"width:274px;max-width:100%;min-width:208px;height:auto\"\n viewBox=\"0.00 0.00 274.00 306.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"GTB-E-23-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(4 302)\">\n\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-4,4 -4,-302 270,-302 270,4 -4,4\"/>\n\n<g id=\"GTB-E-23-node1\" class=\"node\">\n\n<ellipse fill=\"black\" stroke=\"black\" cx=\"159.5\" cy=\"-284.5\" rx=\"13.5\" ry=\"13.5\"/>\n<\/g>\n\n<g id=\"GTB-E-23-node2\" class=\"node\">\n\n<path fill=\"#f1f1f1\" stroke=\"black\" d=\"M220,-240C220,-240 99,-240 99,-240 94.5,-240 90,-235.5 90,-231 90,-231 90,-222 90,-222 90,-217.5 94.5,-213 99,-213 99,-213 220,-213 220,-213 224.5,-213 229,-217.5 229,-222 229,-222 229,-231 229,-231 229,-235.5 224.5,-240 220,-240\"/>\n<text text-anchor=\"middle\" x=\"159.5\" y=\"-223.1\" font-family=\"Arial\" font-size=\"13.00\">Waiting for customer<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-edge1\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M159.5,-270.79C159.5,-263.92 159.5,-255.27 159.5,-247.52\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"161.95,-247.16 159.5,-240.16 157.05,-247.16 161.95,-247.16\"/>\n<\/g>\  text-anchor=\"middle\" x=\"129.5\" y=\"-81.1\" font-family=\"Arial\" font-size=\"13.00\">Waiting for pumping<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-edge5\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M78.87,-141.84C88.57,-131.05 102.63,-115.4 113.47,-103.34\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"115.34,-104.92 118.2,-98.08 111.7,-101.64 115.34,-104.92\"/>\n<text text-anchor=\"middle\" x=\"110.5\" y=\"-116.6\" font-family=\"Arial\" font-size=\"13.00\"> 4<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-edge6\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M134.27,-98.35C138.31,-109.69 144,-126.75 147.5,-142 152.44,-163.54 155.73,-188.7 157.59,-205.72\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"155.18,-206.23 158.35,-212.93 160.05,-205.71 155.18,-206.23\"/>\n<text text-anchor=\"middle\" x=\"158.5\" y=\"-152.1\" font-family=\"Arial\" font-size=\"13.00\"> 5<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-node5\" class=\"node\">\n\n<path fill=\"#f1f1f1\" stroke=\"black\" d=\"M208,-27C208,-27 157,-27 157,-27 152.5,-27 148,-22.5 148,-18 148,-18 148,-9 148,-9 148,-4.5 152.5,0 157,0 157,0 208,0 208,0 212.5,0 217,-4.5 217,-9 217,-9 217,-18 217,-18 217,-22.5 212.5,-27 208,-27\"/>\n<text text-anchor=\"middle\" x=\"182.5\" y=\"-10.1\" font-family=\"Arial\" font-size=\"13.00\">Pumping<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-edge7\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M139.22,-70.84C147.44,-60.15 159.31,-44.68 168.55,-32.66\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"170.52,-34.12 172.84,-27.08 166.63,-31.13 170.52,-34.12\"/>\n<text text-anchor=\"middle\" x=\"166.5\" y=\"-45.6\" font-family=\"Arial\" font-size=\"13.00\"> 6<\/text>\n<\/g>\n\n<g id=\"GTB-E-23-edge8\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M190.7,-27.36C197.25,-38.43 205.9,-55.1 209.5,-71 212.15,-82.7 211.51,-86.17 209.5,-98 201.61,-144.42 193.62,-154.97 174.5,-198 173.26,-200.8 171.84,-203.69 170.38,-206.51\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"168.12,-205.52 166.96,-212.85 172.44,-207.85 168.12,-205.52\"/>\n<text text-anchor=\"middle\" x=\"212.5\" y=\"-116.6\" font-family=\"Arial\" font-size=\"13.00\"> 7<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div><table class=\"qt legend\"><tr><th>Transition<\/th><th>Event [guard] / action<\/th><\/tr><tr><td>1<\/td><td>Insert credit card [invalid] / Error message<\/td><\/tr><tr><td>2<\/td><td>Insert credit card [valid] / Select grade message<\/td><\/tr><tr><td>3<\/td><td>Cancel or timeout / Goodbye message<\/td><\/tr><tr><td>4<\/td><td>Push grade button / Start pumping message<\/td><\/tr><tr><td>5<\/td><td>Cancel or timeout / Goodbye message<\/td><\/tr><tr><td>6<\/td><td>Customer pumps / Pumping started message<\/td><\/tr><tr><td>7<\/td><td>Customer finished / Print receipt<\/td><\/tr><\/table>","options":[{"text":"4","correct":true,"why":"CORRECT"},{"text":"7","correct":false,"why":"FALSE"},{"text":"1","correct":false,"why":"FALSE"},{"text":"Infinite","correct":false,"why":"FALSE"}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"Each transition must be traversed at least once. To do so, the first test can cover the happy path, a successful purchase, the next test cancels, or timeout from waiting for pumping, the next test cancels, or timeout from waiting for fuel type, and the last test the insertion of an invalid credit card. While the order is immaterial, fewer than four tests fail to cover one of the transitions inbound to waiting for customer or violates the rules about where a test starts or ends. More than four tests include tests that re-traverse already-covered transitions."},{"id":"GTB-E-24","source":"GTB Sample Exam E, Q24","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"Which of the following descriptions of statement coverage applies?","stemAfter":null,"table":null,"options":[{"text":"Statement coverage is a measure of the number of source code lines (excluding comments) that were executed during the test.","correct":false,"why":"FALSE – Statement coverage refers to the statements covered by tests. Since multiple statements can be in a single line of source code or a statement can span multiple lines, the number of source code lines is not a measure of statement coverage (see above)."},{"text":"Statement coverage is a measure of the percentage of instructions in the source code that were executed during the test.","correct":true,"why":"CORRECT – The percentage of statements is the proportion of executed statements in the test to all statements, that is, the number of statements executed by the test divided by the total number of statements, expressed as a percentage (see above)."},{"text":"Statement coverage is a measure of the percentage of source code lines (excluding comments) that were executed during the test.","correct":false,"why":"FALSE – Statement coverage does not refer to source code lines but to statements executed by tests, see also justification for “Statement coverage is a measure of the number of source code lines (excluding comments) that were executed during the test.”."},{"text":"Statement coverage is a measure of the number of instructions in the source code that were executed during the test.","correct":false,"why":"FALSE – Statement coverage does not refer to the absolute number of statements executed by the test suite, but to their proportion to all statements (see above)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Glossary \"Statement Coverage\": Coverage of executable statements (As of September 2023).\nSee [CTFL 4.0], Section 4.3.1, paragraph 1: Coverage is measured as the number of statements executed by the test cases divided by the total number of statements in the code and expressed as a percentage."},{"id":"GTB-E-25","source":"GTB Sample Exam E, Q25","chapter":4,"lo":"FL-4.3.3","k":"K2","stem":"Which of the following statements represents an added value of white-box testing?","stemAfter":null,"table":null,"options":[{"text":"White-box tests can provide metrics for coverage, such as statement coverage.","correct":true,"why":"CORRECT – White-box tests belong to the category of structure- and code-based testing methods and can therefore provide metrics for code-based metrics, such as statement coverage (see [CTFL 4.0], Section 4.3.3, 3rd paragraph and section 4.3.1)."},{"text":"White-box tests can verify if the code meets the acceptance criteria.","correct":false,"why":"FALSE – White-box tests belong to the category of structure-based testing methods and have the weakness that they cannot recognize the fulfillment of requirements (see [CTFL 4.0], Section 4.3.3., 1st paragraph). Acceptance criteria are a type of requirement. This is the strength of black-box tests, which belong to the specification-based testing methods."},{"text":"White-box tests can test compatibility with other systems.","correct":false,"why":"FALSE – White-box tests belong to the category of structure-based testing methods and focus on the internal structure of the test object (see [CTFL 4.0], Section 4.1, 4th paragraph). Compatibility, especially interoperability with other components or systems, is usually tested as part of an integration test."},{"text":"White-box tests can uncover all defects in the code.","correct":false,"why":"FALSE – White-box tests cannot uncover all defects in the code. For example, data-dependent defects are sometimes not detected (see [CTFL 4.0], Section 4.3.1, last paragraph: \"For example, defects that are data-dependent are not detected (e.g., division by zero, which only fails when the denominator is set to zero).\") as well as defects that lie on a specific, potentially unexecuted execution path (see [CTFL 4.0], Section 4.3.2, 3rd paragraph: \"However, executing a branch with a test case will not uncover defects in all cases. For example, defects that require the execution of a specific path in a code are not detected.\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-27","source":"GTB Sample Exam E, Q27","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"For which of the following situations is the use of exploratory testing BEST suited?","stemAfter":null,"table":null,"options":[{"text":"When time pressure requires the acceleration of already specified tests.","correct":false,"why":"FALSE – Exploratory testing can be useful when under time pressure, but it is not suitable for accelerating the execution of already specified tests. In exploratory testing, tests are designed, executed, and evaluated simultaneously, but no previously specified tests are conducted (see [CTFL 4.0], Section 4.4.2, paragraph 1)."},{"text":"When the system is being developed incrementally and no test charter is available.","correct":false,"why":"FALSE – Exploratory testing is independent of the SDLC, regardless of whether it is developed incrementally or sequentially. Exploratory testing should use a test charter (see [CTFL 4.0], Section 4.4.2)."},{"text":"When testers with sufficient knowledge of similar applications and technologies are available.","correct":true,"why":"CORRECT – Exploratory testing is useful when time pressure exists and/or specifications are inadequate. It is particularly effective when testers are experienced and have domain knowledge, and it can complement other testing approaches (see [CTFL 4.0], Section 4.4.2, paragraph 3)."},{"text":"When an extensive specification of the system is available for test analysis and design.","correct":false,"why":"FALSE – In this situation, specification-based testing methods would probably be more suitable for deriving test cases from the extensive specification. Exploratory testing is particularly suitable when there is no adequate specification available (see [CTFL 4.0], Section 4.4.2, paragraph 3, first sentence: \"Exploratory testing makes sense when there are few or inadequate specifications…\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-28","source":"GTB Sample Exam E, Q28","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"An agile development team has formulated the following user story: \"As a user, I want the volume of the electronic egg timer's alarm to be adjustable so that I can always hear it.\"\nWhich of the following acceptance criteria is BEST suited from a testing perspective for designing clear acceptance tests?","stemAfter":null,"table":null,"options":[{"text":"The volume is easy to adjust for every person, i.e., the adjustment buttons must have a usable size.","correct":false,"why":"FALSE – Acceptance criteria are considered as test conditions and should therefore support a check for correctness or adequacy without making implementation specifications (see [CTFL 4.0], Sections 4.5.2 and 2.2.2). This is not the case here, as firstly it is not specified how the volume control is to be operated, e.g., as a rotary knob or via buttons, and secondly, a \"usable size\" does not provide measurable values, e.g., as a reference to a standard."},{"text":"The tester can hear the alarm tone well even at the lowest level.","correct":false,"why":"FALSE – Acceptance criteria are considered as test conditions and should therefore support a check for correctness or adequacy (see [CTFL 4.0], Sections 4.5.2 and 2.2.2). This is not the case here, as firstly the tester's hearing is individual and thus not reliably applicable as a criterion of correctness, and secondly, a size of \"well audible\" does not provide a measurable value."},{"text":"The volume can be adjusted within a range of 40 to 80 decibels.","correct":true,"why":"CORRECT – Acceptance criteria are considered as test conditions and should therefore support a check for correctness or adequacy (see [CTFL 4.0], Sections 4.5.2 and 2.2.2). This is the case here, as the adjustment range is clearly defined, and the assigned volume is measurable (and corresponds to the general limits of \"quiet\" to \"loud\")."},{"text":"The volume adjustment works correctly in the best-selling models of this egg timer.","correct":false,"why":"FALSE – Acceptance criteria are considered as test conditions and should therefore support a check for correctness or adequacy (see [CTFL 4.0], Sections 4.5.2 and 2.2.2). This is not the case here, as firstly, in a new development, it is not clear which egg timers will be the best-selling ones, and secondly, the requirement \"correctly\" is not specified, what is meant by that (not testable, not measurable)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-E-29","source":"GTB Sample Exam E, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"Please consider the following user story:\n\"As a system administrator, I want to be able to monitor the server's performance to ensure that the system is running efficiently.\"\nWhich test case is BEST suited for an acceptance test-driven development of the user story?","stemAfter":null,"table":null,"options":[{"text":"1. Login as system administrator; select the server; check the server performance.\nGIVEN: I am logged in as a system administrator\nAND\nGIVEN: I have selected the server,\nWHEN I select \"Check server performance\",\nTHEN I am shown an overview of the server's performance.","correct":false,"why":"FALSE – NOT SUITABLE - Although this option includes the role of the system administrator and the action of checking the server performance, it lacks the specific action of performing a performance test."},{"text":"2. Login as user; perform a task; check the server performance.\nGIVEN: I am logged in as a user\nAND\nGIVEN: I have performed a task,\nWHEN I select \"Check server performance\",\nTHEN I am shown an overview of the server's performance.","correct":false,"why":"FALSE– NOT SUITABLE - This option does not include the role of the system administrator, which is a key aspect of the user story."},{"text":"3. Login as system administrator; select the server; perform a performance test.\nGIVEN: I am logged in as a system administrator\nAND\nGIVEN: I have selected the server,\nWHEN I select \"Perform performance test\",\nTHEN a performance test is performed and I receive an overview of the results.","correct":true,"why":"CORRECT – SUITABLE - This option includes both the role of the system administrator and the specific actions of selecting the server and performing a performance test, which corresponds to the user story."},{"text":"4. Login as system administrator; perform a performance test; check the server performance.\nGIVEN: I am logged in as a system administrator\nAND\nGIVEN: I have performed a performance test,\nWHEN I select \"Check server performance\",\nTHEN I am shown an overview of the server's performance.","correct":false,"why":"FALSE – NOT SUITABLE - Although this option includes the role of the system administrator and the action of checking the server performance, it lacks the specific action of selecting the server."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-1","source":"GTB Sample Exam F, Q1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which of the following statements does NOT describe a typical test objective?","stemAfter":null,"table":null,"options":[{"text":"Detect defects and triggering failures","correct":false,"why":"FALSE – a typical test objective (see [CTFL 4.0], section 1.1.1, bullet point 2)."},{"text":"Create confidence in the quality level of the test object","correct":false,"why":"FALSE – a typical test objective (see [CTFL 4.0], section 1.1.1, bullet point 8)."},{"text":"Reduce the risk of an inadequate testing environment","correct":true,"why":"CORRECT – not a typical test objective (see [CTFL 4.0], section 1.1.1). No test objective listed in the syllabus. Instead, bullet point describes the reduction of the risk of inadequate software quality."},{"text":"Meet contractual, legal or regulatory requirements","correct":false,"why":"FALSE – a typical test objective (see [CTFL 4.0], section 1.1.1, bullet point 6)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-3","source":"GTB Sample Exam F, Q3","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which of the following takes place during the “Test analysis” activity of the test process?","stemAfter":null,"table":null,"options":[{"text":"Identify the required infrastructure and tools","correct":false,"why":"FALSE – this activity is performed in \"Test design\" (see [CTFL 4.0], section 1.4.1, Test design).."},{"text":"Creating test suites based on the test script","correct":false,"why":"FALSE – this activity is performed in \"Test realization\" (see [CTFL 4.0], section 1.4.1, Test realization) ."},{"text":"Analyze the \"lessons learned\" for process improvement","correct":false,"why":"FALSE – this activity is performed in \"Test completion\" (see [CTFL 4.0], section 1.4.1, Test completion)."},{"text":"Evaluate the test basis in terms of testability","correct":true,"why":"CORRECT – this activity is performed in \"Test Analysis\" (see [CTFL 4.0], section 1.4.1: \"Test analysis involves analyzing the test base to identify testable characteristics ...\")."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-4","source":"GTB Sample Exam F, Q4","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"In general according to the Pareto principle, an above-average number of defects are often found in a few areas of a system. The corresponding failures often result in the system being unusable.\nWhich of the following principles of testing does this describe?","stemAfter":null,"table":null,"options":[{"text":"Testing is context dependent.","correct":false,"why":"FALSE – this principle simply states that testing is practiced differently in different contexts (see [CTFL4.0], section 1.3). Here, however, differences are not discussed at all, only the common aspects."},{"text":"Defects cluster together.","correct":true,"why":"CORRECT – because this principle states that a small number of components of a system typically contain most of the defects (see [CTFL4.0], section 1.3. 4th bullet point). Thats how it is described in the question."},{"text":"Tests wear out.","correct":false,"why":"FALSE – this principle states that after repeated tests, tests become increasingly ineffective at detecting new defects (see [CTFL4.0], section 1.3). However, this case is not described here at all. Instead, it is just a matter of ensuring that the principle that defects occur frequently also applies if they are repeated often. One principle of testing does not cancel out another."},{"text":"Absence of defects fallacy.","correct":false,"why":"FALSE – because this principle focuses on the fact that even a thoroughly verified system with all defects corrected may still not meet user expectations (see [CTFL4.0], section 1.3). However, the question is about the scenario that there are still numerous errors. This means that the basis for the fallacy does not exist at all."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-5","source":"GTB Sample Exam F, Q5","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"Which of the following general competencies is particularly important for passing on discovered failures to the affected developers?","stemAfter":null,"table":null,"options":[{"text":"Test knowledge","correct":false,"why":"FALSE – Testing knowledge is necessary to increase the effectiveness of testing, e.g. through the use of test procedures – see bullet point 1."},{"text":"Critical thinking","correct":false,"why":"FALSE – Critical thinking, analytical thinking is important to increase the effectiveness of testing, e.g. to question assumptions – see bullet point 4."},{"text":"Care","correct":false,"why":"FALSE – Care, thoroughness or attention to detail are important in order to detect defects, especially if they are difficult to detect – see bullet point 2."},{"text":"Communication skills","correct":true,"why":"CORRECT – Communication skills are important for the effective dissemination of information to stakeholders (see [CTFL 4.0], section 1.5.1, bullet point 3) The importance of communication skills is emphasized in the paragraph following the bullets."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-6","source":"GTB Sample Exam F, Q6","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Match the correct description from A to D:\nA. A set of test cases or test scripts to be executed in a particular test cycle.\nB. A sequence of instructions for the execution of a test.\nC. Contains the expected results.\nD. The documentation of a goal and the agenda of a test session.\nto its corresponding test resource (test work results) 1 to 4:\n1. test suite.\n2. test case.\n3. test script.\n4. test charter.","stemAfter":null,"table":null,"options":[{"text":"1A, 2C, 3B, 4D","correct":true,"why":"CORRECT – see above."},{"text":"1D, 2B, 3A, 4C","correct":false,"why":"FALSE – see above."},{"text":"1A, 2C, 3D, 4B","correct":false,"why":"FALSE – see above."},{"text":"1D, 2C, 3B, 4A","correct":false,"why":"FALSE – see above."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Test suite: A set of test scripts or test procedures to be executed in a particular test run. according to the glossary, where \"test procedures\" can be replaced by \"test scripts\" according to the glossary (\"See Also\" for test procedure or synonyms) (1A).\nTest case: according to the glossary: a set of preconditions, inputs, actions (if applicable), expected results and postconditions developed on the basis of test conditions. (2C). Test script: according to the glossary: a sequence of instructions for performing a test. (3B). Test charter: \"The documentation of an objective and agenda for a test session.\" According to the glossary and syllabus: The documentation of test activities in the context of session-based exploratory testing. (4D)."},{"id":"GTB-F-7","source":"GTB Sample Exam F, Q7","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Which of the following is the BEST example of how traceability between test basis, test assets, test results and defects supports testing?","stemAfter":null,"table":null,"options":[{"text":"Conducting an impact analysis provides information about the quality of the system under test.","correct":false,"why":"FALSE – Performing the impact analysis does NOT provide information about the quality of the system under testing, only (as the name suggests) the impact of changes. Change impact analysis helps in selecting appropriate test cases for execution after changes. Only then can the actual quality of the system be assessed (see [CTFL 4.0], section 2.2.3, under “Regression Test”)."},{"text":"The analysis of traceability between test cases and test results provides information about the completeness of test cases.","correct":false,"why":"FALSE – Contrary to the content of this answer option, traceability between requirements and test cases provides information about the completeness of test cases, in this case in relation to the coverage of requirements (see [CTFL 4.0], section 1.4.4, indent 1)."},{"text":"The analysis of traceability by conducting an impact analysis helps in selecting appropriate test cases for regression testing.","correct":true,"why":"CORRECT – Performing a change impact analysis BEST helps in selecting appropriate test cases for regression testing by showing which parts of the test object are affected by the change and which test cases need to be re-run (see [CTFL 4.0], section 1.4.4 – and section 2.2.3, “Regression Test” section)."},{"text":"Analyzing the traceability between the requirements and the test cases helps in analyzing the residual risks.","correct":false,"why":"FALSE – Analyzing traceability between requirements and test cases helps evaluate whether requirements are covered by test cases. The assessment of residual risks is independent of this and can be done through the traceability of test results on risks (see [CTFL 4.0], section 1.4.4, bullet points 1 and 2)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-8","source":"GTB Sample Exam F, Q8","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following statements is an advantage of the whole-team approach?","stemAfter":null,"table":null,"options":[{"text":"Each team member can take on any task they wish.","correct":false,"why":"FALSE – Each team member can perform any task **that they can**, not that they want to. The Whole Team approach requires that team members have the necessary skills to complete the tasks that serve the project goal (see [CTFL 4.0], section 1.5.2, paragraph 2: “…each team member who has the required competencies…”."},{"text":"Every team member is responsible for quality.","correct":true,"why":"CORRECT – The whole-team approach promotes shared responsibility for quality by ensuring that everyone in the team sees quality assurance as part of their role and participates in testing activities (see [CTFL4.0], section 1.5.2, 2nd paragraph, end of sentence 1)."},{"text":"Each team member works separately on their own task.","correct":false,"why":"FALSE – Each team member works **closely with other team members**, not separately. The Whole Team approach improves communication and interaction within the team by having team members share a common workspace (physical or virtual, see [CTFL 4.0], section 1.5.2, paragraph 3)."},{"text":"Each team member has a fixed role and a defined responsibility.","correct":false,"why":"FALSE – Each team member has no **fixed role and responsibility**, but can flexibly take on different tasks. The whole-team approach makes it possible to use and expand the various competencies within the team by allowing team members to learn from and support each other (see [CTFL 4.0], section 1.5.2, paragraph 3)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-10","source":"GTB Sample Exam F, Q10","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following is a good testing practice that applies to all software development life cycles (SDLC)?","stemAfter":null,"table":null,"options":[{"text":"Testers must accompany developers, especially in software development activities for which there are no associated testing activities.","correct":false,"why":"FALSE – for every software development activity there is a corresponding testing activity (see [CTFL 4.0], section 2.1.2, 1st bullet point)."},{"text":"Testers should define different test objectives for each test level to customize the scope and depth of testing.","correct":true,"why":"CORRECT – This is one of the good textual practices described in the syllabus text (see [CTFL 4.0], section 2.1.2, 2nd bullet point). This is a good testing practice that applies to all software development lifecycles, as it allows testers or the test team to tailor testing activities to the specific needs and risks of each testing stage."},{"text":"Testers should only start the test analysis and test design once the requirements and specifications are completely implemented.","correct":false,"why":"FALSE – “Testers will be involved in the review of work products as soon as drafts of this documentation are available…” to follow the principle of early testing (see [CTFL 4.0], section 2.1.2, 4th bullet point)."},{"text":"Testers should not perform reviews of work results in order to focus on test execution.","correct":false,"why":"FALSE – Testers should perform reviews of work results to support the shift-left approach and avoid errors (see [CTFL 4.0], section 2.1.2, 4th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-11","source":"GTB Sample Exam F, Q11","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following test-first approaches uses the given/if/then format to express the desired response of an application?","stemAfter":null,"table":null,"options":[{"text":"Test-driven application (TDD)","correct":false,"why":"FALSE – TDD guides coding through test cases that are necessarily written in a natural language form (see [CTFL 4.0], section 2.1.3, paragraph on TDD)."},{"text":"Acceptance test-driven development (ATDD)","correct":false,"why":"FALSE – ATDD derives tests from acceptance criteria that do not necessarily use the given/if/then format (see [CTFL 4.0], section 2.1.3, ATDD paragraph)."},{"text":"Behavior-driven development (BDD)","correct":true,"why":"CORRECT – as this is one of the characteristics of BDD as described in the syllabus text (see [CTFL 4.0], section 2.1.3, paragraph about the BDD). This is a test-first approach that uses the given/if/then format to express the desired response of an application. BDD is a method that describes and verifies the behavior of the software from the stakeholder's perspective using natural language scenarios."},{"text":"Continuous Integration / Continuous Delivery (CI/CD)","correct":false,"why":"FALSE – CI/CD are technical practices (see [CTFL 4.0], section 2.1.4, 1st paragraph, 2nd sentence)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-12","source":"GTB Sample Exam F, Q12","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Which of the following are benefits of DevOps?","stemAfter":null,"table":null,"options":[{"text":"Faster product release and faster time to market","correct":true,"why":"CORRECT – Faster product release and faster time to market is an advantage of DevOps because it enables the entire team to collaborate and deliver new features and stable software quickly (see [CTFL 4.0], section 2.1.4 2nd paragraph, 1st bullet point and 1st Paragraph, last sentence)."},{"text":"Fast feedback by focusing exclusively on functional testing","correct":false,"why":"FALSE – This is not a benefit of DevOps, the opposite is true. DevOps increases the focus on non-functional quality characteristics (see [CTFL 4.0], section 2.1.4, 2nd paragraph, 4th bullet point)."},{"text":"Shift-Left can minimize the number of regression tests","correct":false,"why":"FALSE – It is not the number of regression tests that is minimized but rather the risk that is minimized through the automated regression (see [CTFL 4.0], section 2.1.4, 2nd paragraph, 6th bullet point)."},{"text":"Cost-effective implementation of the test automation framework.","correct":false,"why":"FALSE – This is not a benefit of DevOps. Setting up a test automation framework always requires investment in tools, infrastructure, skills and maintenance (see [CTFL 4.0], section 2.1.4, 3rd paragraph, 3rd bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-15","source":"GTB Sample Exam F, Q15","chapter":3,"lo":"FL-3.1.1","k":"K1","stem":"Which of the following list of work products can NOT be checked with a static testing technique?","stemAfter":null,"table":null,"options":[{"text":"Test cases and executable test scripts","correct":false,"why":"FALSE – Test cases and test scripts are work results that can be checked by a static test (review or static analysis) (see [CTFL 4.0], section 3.1.1, 1st paragraph)."},{"text":"Requirements specification and acceptance criteria","correct":false,"why":"FALSE – Requirements specifications and acceptance criteria are work products that can be checked by a static test (review or static analysis) (see [CTFL 4.0], Section 3.1.1, 1st paragraph)."},{"text":"Proprietary third-party executable code","correct":true,"why":"CORRECT – Third-party executable code, e.g. operating system software, database software, frameworks that are legally protected, may not be tested with a static test (see [CTFL 4.0], section 3.1.1, 3rd paragraph). Therefore, the correct answer is: Third-party executable code."},{"text":"Project documentation and models","correct":false,"why":"FALSE – Project documentation and models are work results that can be checked through a static test (review or static analysis) (see [CTFL 4.0], section 3.1.1, 1st paragraph)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-16","source":"GTB Sample Exam F, Q16","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Which of the following statements applies to the differences between static and dynamic testing?","stemAfter":null,"table":null,"options":[{"text":"During static testing, failures are found","correct":false,"why":"FALSE – Defects are found through dynamic tests (see [CTFL 4.0], section 3.1.3.; 1st paragraph; 2nd bullet point)"},{"text":"Static testing measures inadequate software performance","correct":false,"why":"FALSE – The software must be running to measure performance (see [CTFL 4.0], section 2.2.2, last paragraph, 2nd sentence (“…check whether a non-functional condition is fulfilled when executing the function…”), if the software is executed during the test, acts it is dynamic testing (see [CTFL 4.0], section 3.1.3.; 1st paragraph; 4th bullet point)."},{"text":"The exclusive goal of static testing is to detect defects as early as possible","correct":false,"why":"FALSE – The goal of both static and dynamic testing is to detect defects as early as possible (see [CTFL 4.0], section 1.3., paragraph 3 “Early testing saves…”)."},{"text":"A lack of coverage of critical safety requirements can be revealed during static testing","correct":true,"why":"CORRECT – This is an example of a gap in traceability or test base coverage that is more easily found in static testing (see [CTFL 4.0], section 3.1.3., Typical defects; 7th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-17","source":"GTB Sample Exam F, Q17","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"Which of the following statements about formal reviews (e.g. inspections) is TRUE?","stemAfter":null,"table":null,"options":[{"text":"The technical review is led by the author","correct":false,"why":"FALSE – A technical review is led by a moderator (see [CTFL 4.0], section 3.2.4, section 3, bullet point 3 “Technical Review”)."},{"text":"The review process consists of several activities, such as planning, communication and analysis, troubleshooting and reporting.","correct":true,"why":"CORRECT – There are several activities during a formal review. Formal reviews follow a structured and systematic process consisting of several activities such as: Planning, review start (“kick-off”), individual review, review session, communication and analysis, remediation and reporting. These activities are intended to ensure that the review is effective and efficient (see [CTFL 4.0], section 3.2.2, paragraph “Activities of the review process”)."},{"text":"Work products to be reviewed are distributed during the review meeting","correct":false,"why":"FALSE – The work results to be reviewed should be distributed as early as possible (see [CTFL 4.0], section 3.2.2, 2nd bullet point)."},{"text":"Defects found during the review are not reported since they are found during dynamic testing anyway","correct":false,"why":"FALSE – Defects found during a review should be reported. The defects found during a review are often those that cannot be found or are difficult to find in dynamic tests, such as logical, conceptual or design defects (see [CTFL 4.0], section 3.2.2, 5th bullet point)."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"GTB-F-19","source":"GTB Sample Exam F, Q19","chapter":4,"lo":"FL-4.1.1","k":"K1","stem":"Which of the following statements describes an advantage of black box testing over white box testing?","stemAfter":null,"table":null,"options":[{"text":"Black box test techniques can check the internal structure and processing of the test object.","correct":false,"why":"FALSE – Black box test techniques are based on an analysis of the specified
