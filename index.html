n a formal review"},{"text":"Ensuring the effective running of review meetings, and moderating, if necessary","correct":false,"why":"Is not correct. This is the task of the moderator"},{"text":"Recording review information such as review decisions","correct":false,"why":"Is not correct. This is the task of the scribe"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A15","source":"ISTQB Sample Exam A, QA15","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"A wine storage system uses a control device that measures the wine cell temperature T (measured in °C, rounded to the nearest degree) and alarms the user if it deviates from the optimal value of 12, according to the following rules:\n• if T = 12, the system says, “optimal temperature”\n• if T < 12, the system says, “temperature is too low!”\n• if T > 12, the system says, “temperature is too high!”\nYou want to use the 3-point boundary value analysis (BVA) to verify the behavior of the control device. A test input is a temperature in °C provided by the device.\n\nWhat is the MINIMAL set of test inputs that achieves 100% of the desired coverage?","stemAfter":null,"table":null,"options":[{"text":"11, 12, 13","correct":false,"why":"Is not correct"},{"text":"10, 12, 14","correct":false,"why":"Is not correct"},{"text":"10, 11, 12, 13, 14","correct":true,"why":"Is correct"},{"text":"10, 11, 13, 14","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are three equivalence partitions: {..., 10, 11}, {12}, and {13, 14, ...}. The boundary values are 11, 12 and 13. In the three-point boundary value analysis for each boundary, we need to test the boundary and both its neighbors, so:\n• for 11 we test 10, 11, 12\n• for 12 we test 11, 12, 13\n• for 13 we test 12, 13, 14\nAltogether we need to test 10, 11, 12, 13, and 14"},{"id":"ISTQB-A-A16","source":"ISTQB Sample Exam A, QA16","chapter":4,"lo":"FL-4.3.2","k":"K2","stem":"Which of the following statements about branch testing is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"If a program includes only unconditional branches, then 100% branch coverage can be achieved without executing any test cases","correct":false,"why":"Is not correct. In this case one test case is still needed since there is at least one (unconditional) branch to be covered"},{"text":"If the test cases exercise all unconditional branches in the code, then 100% branch coverage is achieved","correct":false,"why":"Is not correct. Covering only unconditional branches does not imply covering all conditional branches"},{"text":"If 100% statement coverage is achieved, then 100% branch coverage is also achieved","correct":false,"why":"Is not correct. 100% branch coverage implies 100% statement coverage, not otherwise. For example, for an IF decision without the ELSE, one test is enough to achieve 100% statement coverage, but it only achieves 50% branch coverage"},{"text":"If 100% branch coverage is achieved, then all decision outcomes in each decision statement in the code are exercised","correct":true,"why":"Is correct. Each decision outcome corresponds to a conditional branch, so 100% branch coverage implies 100% coverage of the decision outcomes"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A17","source":"ISTQB Sample Exam A, QA17","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"You are testing a mobile application that allows customers to access and manage their bank accounts. You are running a test suite that involves evaluating each screen, and each field on each screen, against a general list of user interface best practices derived from a popular book on the topic that maximizes usability for such applications. Which of the following options BEST categorizes the test technique you are using?","stemAfter":null,"table":null,"options":[{"text":"Black-box","correct":false,"why":"Is not correct. The book provides general guidance, and is not a formal requirements document, a specification, or a set of use cases, user stories, or business processes"},{"text":"Exploratory","correct":false,"why":"Is not correct. While you could consider the list as a set of test charters, it more closely resembles the list of test conditions to be checked"},{"text":"Checklist-based","correct":true,"why":"Is correct. The list of user interface best practices is the list of test conditions to be systematically checked"},{"text":"Error guessing","correct":false,"why":"Is not correct. The tests are not focused on failures that could occur, but rather on knowledge about what is important for the user, in terms of usability"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-A-A18","source":"ISTQB Sample Exam A, QA18","chapter":4,"lo":"FL-4.5.1","k":"K2","stem":"Which of the following BEST describe the collaborative approach to user story writing?","stemAfter":null,"table":null,"options":[{"text":"User stories are created by testers and developers and then accepted by business representatives","correct":false,"why":"Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created by business representatives, developers, and testers together","correct":true,"why":"Is correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created by business representatives and verified by developers and testers","correct":false,"why":"Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision"},{"text":"User stories are created in a way that they are independent, negotiable, valuable, estimable, small, and testable","correct":false,"why":"Is not correct. This is the list of properties that each user story should have, not the description of the collaboration-based approach"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-1","source":"ISTQB Sample Exam B, Q1","chapter":1,"lo":"FL-1.2.1","k":"K2","stem":"Which of the following is an example of why testing is necessary?","stemAfter":null,"table":null,"options":[{"text":"Dynamic testing increases quality by causing test objects to fail in ways that could never be achieved by the users","correct":false,"why":"Is not correct. It is often possible to use dynamic testing to cause a test object to fail in ways that could never be achieved by the users, such as by using fault injection. However, if the failure can never occur with real end users, then identifying it is not especially valuable as testing is ultimately aimed at improving the work product for the end users. Spending time testing for failures that cannot occur with real users is not an efficient use of a tester’s time"},{"text":"Static testing is used by developers to identify failures in their code earlier than can be achieved through dynamic testing","correct":false,"why":"Is not correct. Static testing in the form of static analysis is used by developers to identify defects in their code earlier than can be achieved through dynamic testing. Note, however, that static testing (and static analysis) is used to detect defects, not failures, which are found by dynamic testing. Thus it is the use of the term ‘failures’ that makes this an incorrect option"},{"text":"Static analysis provides evidence to customers that the elements of the system that provide no outputs are fit for release","correct":false,"why":"Is not correct. Static analysis directly detects defects in code, and this is normally information for the developer, not the customer."},{"text":"Reviews increase the quality of requirements specifications and lead to fewer changes being needed in derived work products","correct":true,"why":"Is correct. Reviews are a form of static testing that can be applied from the very start of the software development lifecycle and are used to find defects that can be removed before subsequent development activities waste effort on faulty requirements. If the defects are not detected and removed early on, then when the defect is found in derived work products, such as the design and code, the requirements will need to be changed."}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-2","source":"ISTQB Sample Exam B, Q2","chapter":1,"lo":"FL-1.2.2","k":"K1","stem":"Which of the following statements about quality assurance (QA) and/or quality control (QC) is correct?","stemAfter":null,"table":null,"options":[{"text":"QA is performed as part of testing","correct":false,"why":"Is not correct. QA concentrates on process improvement and implementation, using a preventive approach to avoid errors and defects, while testing is a form of QC that is used to detect defects"},{"text":"Testing is performed as part of QC","correct":true,"why":"Is correct. QC aims to achieve appropriate levels of quality by focusing on identifying and correcting product defects. Testing is a significant part of QC and helps to uncover these defects"},{"text":"Testing is another term for QC","correct":false,"why":"Is not correct. Although testing is a significant part of QC and helps to uncover defects, other (non-testing) techniques utilized in QC include formal methods like model checking and proof of correctness, as well as simulation and prototyping"},{"text":"Testing is performed as part of QA","correct":false,"why":"Is not correct. QA concentrates on process improvement and implementation, using a preventive approach to avoid errors and defects, while testing is a form of QC that is used to detect defects"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-3","source":"ISTQB Sample Exam B, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"One of the ‘principles of testing’ states that exhaustive testing is impossible. Which of the following is an example of addressing this principle in practice?","stemAfter":null,"table":null,"options":[{"text":"Creating test cases that cover every possible specified output","correct":false,"why":"Is not correct. The principle states that it is not feasible to test everything except in trivial cases. Testing everything would require testing every possible variation of inputs in all different circumstances, which is generally infeasible as there will be a practically infinite number of possibilities. Testing every possible expected result will not address this problem as the relationship between inputs and expected results can be different for each test object. Sometimes there may be a practically infinite number of possible expected results (e.g., when there are several variables representing real numbers), whereas at other times there may be just two expected results, such as with a single variable that can be either true or false"},{"text":"Documenting all possible test input variations and prioritizing these based on importance","correct":false,"why":"Is not correct. The principle states that it is not feasible to test every possible variation of inputs in all different circumstances. This is because for non-trivial systems there is a practically infinite number."},{"text":"Starting testing as early as possible with reviews and other static testing approaches","correct":false,"why":"Is not correct. Starting testing as early as possible with reviews and other static testing approaches will not address the problem of there being too many possible test cases. The ‘early testing saves time and money’ principle is concerned with fixing defects early on to prevent the occurrence of subsequent defects in derived work products, thereby reducing costs and the likelihood of failures"},{"text":"Using equivalence partitioning and boundary value analysis to generate test cases","correct":true,"why":"Is correct. The use of equivalence partitioning and boundary value analysis to generate test cases is one way to address the principle as these test techniques provide a systematic way to derive a finite subset of all possible test cases"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The ‘exhaustive testing is impossible’ principle is concerned with the fact that it is not feasible to test every possible variation of inputs in all different circumstances, except in trivial cases. Instead, testing utilizes test techniques, test case prioritization, and risk-based testing to sample from the set of possibilities and focus test efforts.\nTherefore, in practice, documenting all possible input variations would be impractical as it would take an infinite length of time"},{"id":"ISTQB-B-4","source":"ISTQB Sample Exam B, Q4","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which test activity involves working with test data requirements, test conditions, test environment requirements and test cases?","stemAfter":null,"table":null,"options":[{"text":"Test design","correct":true,"why":"Is correct. Test design involves using test conditions to create test cases and other necessary testware, such as test data requirements and test charters for exploratory testing. Test environment requirements are also specified, including the necessary infrastructure and tools"},{"text":"Test execution","correct":false,"why":"Is not correct. Test execution involves executing test cases (as part of test procedures), however it does not directly cover the other testware mentioned in the question, such as test data requirements, test environment requirements and test conditions"},{"text":"Test analysis","correct":false,"why":"Is not correct. Test analysis is used to identify the features that require testing. The test basis is analyzed and defined as test conditions, which are then prioritized along with related risks. While this activity involves working with test conditions, it does not cover the other testware mentioned in the question, such as test data requirements, test environment requirements and test cases"},{"text":"Test implementation","correct":false,"why":"Is not correct. Test implementation includes the generation of test procedures, such as manual and automated test scripts, which are created from test cases and may be assembled into test suites. Test procedures are prioritized and arranged in a test execution schedule. Test data is created, and the test environment built, and its set up verified. While this activity involves explicitly working with test cases, and may use test data requirements and test environment requirements to create test data and the test environment, it does not cover test conditions"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-5","source":"ISTQB Sample Exam B, Q5","chapter":1,"lo":"FL-1.4.2","k":"K2","stem":"Which of the following is MOST likely to impact how testing is performed for a given test object?","stemAfter":null,"table":null,"options":[{"text":"The average level of experience of the organization’s marketing team","correct":false,"why":"Is not correct. The organization’s marketing team is unlikely to perform much testing (although in some organizations they may be involved with acceptance testing), so their average level of experience (most of which would be in marketing) is not likely to impact how testing is performed for a given test object"},{"text":"The knowledge of users that a new system is being developed for them","correct":false,"why":"Is not correct. The level of knowledge of users that a new system is being built for them is unlikely to affect how testing is performed. Any user involvement that could affect how testing is performed is more likely to be as a result of decisions made by the testers, customer and project manager"},{"text":"The number of years’ experience of the members of the test team","correct":true,"why":"Is correct. The number of years’ experience of the members of the performance efficiency testing team will help to determine the capabilities and knowledge (e.g., of different tools and defect types) that the team members will apply when they are testing"},{"text":"The end user’s organizational structure for a commercial music streaming application","correct":false,"why":"Is not correct. The organizational structure of the different end users (who may be varied) will change between users. So, it may not even be known when the application is being tested, and the end user’s organizational structure can thus have little effect on how the testing is performed"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-6","source":"ISTQB Sample Exam B, Q6","chapter":1,"lo":"FL-1.4.4","k":"K2","stem":"Which of the following statements is a CORRECT example of the value of traceability?","stemAfter":null,"table":null,"options":[{"text":"Traceability between the mitigated risks and test cases that passed provides a means of determining the level of residual risk","correct":false,"why":"Is not correct. Traceability between the mitigated risks and test cases that passed provides little information, because to be mitigated (by testing) the risks would need to have a corresponding test case that passed. To be able to assess residual risk, traceability between all risks and test results needs to be available, so that the risks that do not have a corresponding passing test can be identified as the residual risks"},{"text":"Traceability between user requirements and test results provides a means of measuring project progress against business goals","correct":true,"why":"Is correct. Traceability between user requirements and test results provides an indication of which user requirements have been tested and so provides a means of measuring project progress (in the context of testing) against business goals"},{"text":"Traceability between testers and test cases that failed provides a means of determining the skill level of the testers","correct":false,"why":"Is not correct. It is not clear that test cases that failed provide an indication of tester’s skills any more than test cases that passed. It would partly depend on the test objective (e.g., building confidence or causing failures). Also, such measurement of testers based on test cases that passed and failed can be counter-productive as it could cause the testers to optimize their testing based on that metric rather than the test objective"},{"text":"Traceability between the identified risks and written test conditions provides a means of determining which risks are worth testing","correct":false,"why":"Is not correct. Traceability between the identified risks and written test conditions provides a means of determining which further test conditions need to be written. Determining which risks are worth testing is part of risk management, and risk mitigation in particular"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-7","source":"ISTQB Sample Exam B, Q7","chapter":1,"lo":"FL-1.5.1","k":"K2","stem":"Which of the following is MOST likely to be an example of a tester using a generic skill when testing?","stemAfter":null,"table":null,"options":[{"text":"The tester’s deep knowledge of a variety of computer games meant that they got on well with one of the developers who was also into gaming","correct":false,"why":"Is not correct. Strong communication skills, active listening, and teamwork abilities enable a tester to interact effectively with all stakeholders, however a deep knowledge of a variety of computer games that allowed them to get on well with one developer is not an example of a generic skill useful to testers"},{"text":"The tester was a former pilot and was better able to understand the acceptance criteria for the helicopter control system","correct":true,"why":"Is correct. Domain knowledge that can be used to understand and communicate with end-users and business representatives is one of the generic skills required by testers. A tester with experience as a pilot would make them better able to appreciate the acceptance criteria for the helicopter control system"},{"text":"The tester previously worked as a programmer and used their skills in this area to better communicate with the business analysts","correct":false,"why":"Is not correct. Although programming skills could be considered as technical knowledge which can increase efficiency when utilizing some test tools, it is unlikely that these skills would improve their communication with business analysts"},{"text":"The tester was very careful not to make mistakes when they methodically generated test cases prior to starting their exploratory testing session","correct":false,"why":"Is not correct. Although thoroughness, attention to detail, curiosity, and a methodical approach to identifying hard-to-find defects are all useful generic skills for testers, it is doubtful they would be generating test cases prior to starting exploratory testing. This is because one of the main tenets of exploratory testing is that the test cases are generated during the testing, not scripted in advance"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-8","source":"ISTQB Sample Exam B, Q8","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following is an advantage of the whole-team approach?","stemAfter":null,"table":null,"options":[{"text":"It allows team members to take on any role at any time","correct":false,"why":"Is not correct. The whole-team approach allows any team member with the requisite skills and knowledge to undertake any task, however that does not mean that team members can take on any role at any time. Typically, they only take on roles in which they are competent, and there is no suggestion that every team member can do every role"},{"text":"It only needs a single team to support the complete development project","correct":false,"why":"Is not correct. The whole-team approach applies to how a single team (typically in Agile software development) works; it does not cover how multiple teams are supposed to work on larger projects, and it does not suggest that only one ‘whole’ team is needed for a complete project"},{"text":"It embeds business representatives alongside developers in the same team","correct":false,"why":"Is not correct. The whole-team approach does not expect every team member to be involved in every important decision. For instance, there is no need for the business representative (i.e., the Product Owner) to be involved in every technical decision that does not affect the business outcome and implementing such an approach would unnecessarily slow down the team’s progress"},{"text":"It generates a team synergy that benefits the entire project","correct":true,"why":"Is correct. By leveraging the diverse skill sets of each team member most effectively, the whole-team approach fosters superior team dynamics, promotes robust communication and collaboration, and generates a team synergy that benefits the entire project"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-9","source":"ISTQB Sample Exam B, Q9","chapter":2,"lo":"FL-2.1.1","k":"K2","stem":"Which of the following statements about the chosen software development lifecycle is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"If agile software development is used, automation of system tests replaces the need for regression testing","correct":false,"why":"Is not correct. In agile software development, deliverables are produced in each iteration, and the frequent delivery of increments necessitates extensive regression testing. Although some (or all) of this regression testing may be automated, the regression testing (automated or not) cannot be replaced by automation of system tests"},{"text":"If a sequential development model is used, then the dynamic testing is typically restricted to later in the lifecycle","correct":true,"why":"Is correct. If a sequential development model is used, then early in the software development lifecycle no code is available for execution, and so during this time static testing (e.g., reviews) is performed. Later in the lifecycle, when code is available for execution, dynamic testing is possible. Note, however, that preparation for dynamic testing will often occur early in any software development lifecycle"},{"text":"If an iterative development model is used, then component testing is typically performed manually by developers","correct":false,"why":"Is not correct. If an iterative development model, like agile software development, is used, then component tests may well be used for regression testing for each iteration. In which case, there is a strong argument for automating these component tests, which will have to be run frequently, and there is unlikely to be a strong argument for developers performing these component tests manually"},{"text":"If an incremental development model is used, then static testing is done in early increments and dynamic testing in later increments","correct":false,"why":"Is not correct. In most incremental development models, deliverables are produced in each increment, requiring both static testing and dynamic testing at all test levels for each increment delivered"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-10","source":"ISTQB Sample Exam B, Q10","chapter":2,"lo":"FL-2.1.2","k":"K1","stem":"Which of the following is a good testing practice that applies to all software development lifecycles?","stemAfter":null,"table":null,"options":[{"text":"Testers should review work products as part of the next development phase","correct":false,"why":"Is not correct. Testers should review work products as soon as drafts are available to enable early testing as part of a shift-left approach. If they waited until the next development phase, then unnecessary development (and test) work could be started on unreviewed, flawed work products"},{"text":"Testers should review work products as soon as drafts are available","correct":true,"why":"Is correct. Testers should review work products as soon as drafts are available to enable early testing as part of a shift-left approach"},{"text":"Testers should review work products before test analysis and test design begin","correct":false,"why":"Is not correct. Testers typically review work products that form the test basis as part of test analysis, not before test analysis and test design"},{"text":"Testers should review work products immediately after they are published","correct":false,"why":"Is not correct. Testers should review work products as soon as drafts are available to enable early testing as part of the shift-left approach. Waiting until they are published means that any defects that could be found by tester’s review will be in the published document"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-11","source":"ISTQB Sample Exam B, Q11","chapter":2,"lo":"FL-2.1.3","k":"K1","stem":"Which of the following is an example of a test-first approach to development?","stemAfter":null,"table":null,"options":[{"text":"Test-Driven Development","correct":true,"why":"Is correct. Test-Driven Development (TDD) is a well-known example of a test-first approach to development"},{"text":"Coverage-Driven Development","correct":false,"why":"Is not correct. Coverage-Driven Development is not a correct example of a test-first approach to development"},{"text":"Quality-Driven Development","correct":false,"why":"Is not correct. Quality-Driven Development is not a correct example of a test-first approach to development"},{"text":"Feature-Driven Development","correct":false,"why":"Is not correct. Feature-Driven Development is not an example of a test-first approach to development, but is, instead, an agile software development methodology based around delivering features (as opposed to user stories in Scrum)"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-12","source":"ISTQB Sample Exam B, Q12","chapter":2,"lo":"FL-2.1.4","k":"K2","stem":"Which of the following statements about DevOps is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"To speed up releases, continuous integration is used to encourage developers to submit code quickly without the need to complete component testing","correct":false,"why":"Is not correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests. This is largely provided through continuous integration, where the developers submit component (unit) tests with their new code, which must pass for the code to be admitted to the build. Therefore, developers do need to complete component testing"},{"text":"To be able to update and release systems on a more frequent basis, many automated regression tests are required to reduce the risk of regression","correct":true,"why":"Is correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests"},{"text":"To treat both developers and operations equally, the testers will allocate more effort to release testing by operations using a shift-right approach","correct":false,"why":"Is not correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests. Testers do not attempt to treat developers and operations equally by spending more time on release testing, although a shift-right approach to testing (testing in production) may well be used"},{"text":"To create increased synergy between testers, developers and operations, the testing must become fully automated with no manual testing","correct":false,"why":"Is not correct. Automated processes like continuous integration/continuous delivery (CI/CD) in DevOps facilitate stable test environments and reduce the need for manual testing, however, there is a risk of overlooking the importance of manual testing, especially from a user's perspective"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-13","source":"ISTQB Sample Exam B, Q13","chapter":2,"lo":"FL-2.2.1","k":"K2","stem":"Which of the following is MOST likely to be performed as part of system testing?","stemAfter":null,"table":null,"options":[{"text":"Security testing of a credit management system by an independent test team","correct":true,"why":"Is correct. System testing examines the behavior and capabilities of the complete system and covers non-functional testing of quality characteristics, which includes security testing. This type of testing is often performed by an independent test team based on system specifications"},{"text":"Testing the interface of a currency exchange system with an external banking system","correct":false,"why":"Is not correct. System integration testing examines the interfaces with other systems and external services"},{"text":"Beta testing of a remote learning system by courseware developers","correct":false,"why":"Is not correct. Beta testing is a type of acceptance testing performed at an external site by roles outside the development organization"},{"text":"Testing interactions between the user interface and database of a human resources system","correct":false,"why":"Is not correct. Component integration testing involves testing the (interfaces and) interactions between components of a system, such as the user interface and database"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-14","source":"ISTQB Sample Exam B, Q14","chapter":2,"lo":"FL-2.2.3","k":"K2","stem":"Which of the following statements is CORRECT?","stemAfter":null,"table":null,"options":[{"text":"Regression tests increase in number as the project progresses, whereas the number of confirmation tests decreases as the project progresses","correct":false,"why":"Is not correct. Regression tests increase in number as the project progresses, as new regression tests are typically required as changes are made to the system. Similarly, the number of confirmation tests also typically increases as the project progresses as new confirmation tests are needed for each fix made to a system"},{"text":"Regression tests are created and run when the test object is fixed, whereas confirmation tests are run whenever the test object is enhanced","correct":false,"why":"Is not correct. It is the other way round. Confirmation tests are created and run when the test object is fixed, and regression tests are (ideally) run whenever the test object is enhanced (changed)"},{"text":"Regression testing is concerned with checking that the operational environment remains unchanged, whereas confirmation testing is concerned with testing changes to the test object","correct":false,"why":"Is not correct. Confirmation testing verifies that a defect has been fixed correctly and so is concerned with testing changes to the test object. However, regression testing ensures that changes (including changes to the operational environment) do not have negative effects on unchanged software and so does not check that the operational environment remains unchanged"},{"text":"Regression testing is concerned with adverse effects in unchanged code, whereas confirmation testing is concerned with testing changed code","correct":true,"why":"Is correct. Regression testing ensures that changes do not have negative effects on unchanged software. Confirmation testing verifies that a defect has been fixed – and so is concerned with changed code"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-15","source":"ISTQB Sample Exam B, Q15","chapter":3,"lo":"FL-3.1.3","k":"K2","stem":"Which of the following is an example of a defect that can be found by static testing but NOT by dynamic testing?","stemAfter":null,"table":null,"options":[{"text":"Lack of usability provided through the user interface","correct":false,"why":"Is not correct. A lack of usability provided through the user interface can be detected through a review using a suitable checklist, but the lack of usability can also be identified by getting several typical users to dynamically test the user interface and provide feedback on its usability"},{"text":"Code with no path that reaches it","correct":true,"why":"Is correct. A code review can detect code that cannot be reached by any path, however dynamic tests can only exercise reachable code and cannot determine that code cannot be reached without running every possible combination of inputs and input states, which is impractical for real code"},{"text":"Poor response times for most of the expected users","correct":false,"why":"Is not correct. Poor response times for most of the expected users are difficult to determine without executing the code (i.e., by static testing), so in this situation dynamic testing could find a defect, but static testing is unlikely to find it"},{"text":"Required features that are not implemented in the code","correct":false,"why":"Is not correct. A review of the code by someone who is aware of the required features could detect that the required features had not been implemented in the code, and dynamic testing could also be used to determine that these required features had not been implemented"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-16","source":"ISTQB Sample Exam B, Q16","chapter":3,"lo":"FL-3.2.1","k":"K1","stem":"Which of the following is a benefit of early and frequent stakeholder feedback?","stemAfter":null,"table":null,"options":[{"text":"Managers are aware of which developers are less productive","correct":false,"why":"Is not correct. The feedback is from stakeholders (e.g., business representatives and end users), not from developers, so this feedback is not likely to inform managers which developers are more or less productive"},{"text":"It allows project managers to prioritize their stakeholder interactions","correct":false,"why":"Is not correct. Early and frequent feedback from stakeholders is not used by project managers to prioritize how they interact with the different stakeholders"},{"text":"It facilitates early communication of potential quality issues","correct":true,"why":"Is correct. Obtaining feedback from stakeholders early and often in the software development process can be highly beneficial as it facilitates early communication of potential quality issues, can prevent misunderstandings about requirements, and ensures that any changes in stakeholder requirements are understood and implemented sooner"},{"text":"End users better understand why the delivery of the work product is delayed","correct":false,"why":"Is not correct. Early and frequent feedback can prevent the development of a product that does not meet stakeholder needs, and results in costly rework and missed deadlines, so, ideally there should be no delay. Also, the feedback is from stakeholders (not to them), which includes the end users, so the end users providing feedback will not aid the end users’ understanding"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-17","source":"ISTQB Sample Exam B, Q17","chapter":3,"lo":"FL-3.2.2","k":"K2","stem":"Given the following task descriptions:\n1. The quality characteristics to be evaluated and the exit criteria are selected\n2. Everyone has access to the work product\n3. Anomalies are identified in the work product\n4. Anomalies are discussed\n\nAnd the following review activities\nA. Individual review\nB. Review initiation\nC. Planning\nD. Communication and analysis\nWhich of the following BEST matches the task descriptions and activities?","stemAfter":null,"table":null,"options":[{"text":"1B, 2C, 3D, 4A","correct":false,"why":"Is not correct"},{"text":"1B, 2D, 3C, 4A","correct":false,"why":"Is not correct"},{"text":"1C, 2A, 3B, 4D","correct":false,"why":"Is not correct"},{"text":"1C, 2B, 3A, 4D","correct":true,"why":"Is correct. The correct match is: 1C, 2B, 3A, 4D"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed task descriptions:\n1. The quality characteristics to be evaluated and the exit criteria are selected - (Planning (C): Defining the review scope, purpose, work product to be reviewed, quality characteristics to be evaluated, areas of focus, exit criteria, supporting information such as standards, effort, and timeframes.)\n2. Everyone has access to the work product - (Review initiation (B): Ensuring all participants have access to the work product and necessary resources, and clarifying their roles and responsibilities.)\n3. Anomalies are identified in the work product - (Individual review (A): Evaluating the work product's quality, identifying and logging anomalies, recommendations, and questions using review techniques like checklist-based reviewing and scenario-based reviewing.)\n4. Anomalies are analyzed and discussed - (Communication and analysis (D): Analyzing and discussing each anomaly, determining its status, ownership, and required actions, and making review decisions, normally in a meeting. This could include determining the need for a follow-up review.)"},{"id":"ISTQB-B-18","source":"ISTQB Sample Exam B, Q18","chapter":3,"lo":"FL-3.2.3","k":"K1","stem":"Given the following roles in reviews:\n1. Scribe\n2. Review leader\n3. Facilitator\n4. Manager\n\nAnd the following responsibilities in reviews:\nA. Ensures the effective running of review meetings and the setting up a safe review environment\nB. Records review information, such as decisions and new anomalies found during the review meeting\nC. Decides what is to be reviewed and provides resources, such as staff and time for the review\nD. Takes overall responsibility for the review such as organizing when and where the review will take place\nWhich of the following BEST matches the roles and responsibilities?","stemAfter":null,"table":null,"options":[{"text":"1A, 2B, 3D, 4C","correct":false,"why":"Is not correct"},{"text":"1A, 2C, 3B, 4D","correct":false,"why":"Is not correct"},{"text":"1B, 2D, 3A, 4C","correct":true,"why":"Is correct. The correct match is: 1B, 2D, 3A, 4C"},{"text":"1B, 2D, 3C, 4A","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed roles:\n1. Scribe (or Recorder) - responsible for gathering feedback from reviewers and documenting review information, such as decisions made, and any new anomalies identified during the review meeting. (Records review information, such as decisions and new anomalies found during the review meeting - B)\n2. Review Leader - responsible for overseeing the review process, such as selecting the review team members, scheduling review meetings, and ensuring that the review is completed successfully. (Takes overall responsibility for the review such as organizing when and where the review will take place - D)\n3. Facilitator (or Moderator) - responsible for ensuring that the review meetings run effectively, including managing time, mediating discussions, and creating a safe environment where everyone can voice their opinions freely. (Ensures the effective running of review meetings and the setting up of a safe review environment - A)\n4. Manager - responsible for deciding what needs to be reviewed and allocating resources, such as staff and time, for the review. (Decides what is to be reviewed and provides resources, such as staff and time for the review - C)"},{"id":"ISTQB-B-19","source":"ISTQB Sample Exam B, Q19","chapter":4,"lo":"FL-4.1.1","k":"K2","stem":"Which of the following statements BEST describes the difference between decision table testing and branch testing?","stemAfter":null,"table":null,"options":[{"text":"In decision table testing, the test cases are derived from the decision statements in the code. In branch testing, the test cases are derived from knowledge of the control flow of the test object.","correct":false,"why":"Is not correct. Decision table testing is a black-box test technique, not a white-box test technique – the test cases are not based on the decisions in the source code. In branch testing, the test cases are derived from knowledge of the control flow of the test object"},{"text":"In decision table testing, the test cases are derived from the specification that describes the business logic. In branch testing the test cases are based on anticipation of potential defects in the source code.","correct":false,"why":"Is not correct. Anticipation of potential defects is used in error guessing (an experience-based test technique), not in branch testing (a white-box test technique). In decision table testing, the test cases are derived from the specification that describes the business logic"},{"text":"In decision table testing, the test cases are derived from knowledge of the control flow of the test object. In branch testing, test cases are derived from the specification that describes the business logic.","correct":false,"why":"Is not correct. If a test case is based on the knowledge of the control flow of the test object, it is a white-box test technique. Decision table testing is typically based on an analysis of business logic, so it is a black-box test technique. In branch testing, test cases are not derived from the specification – this would make it a black-box test technique. Branch testing is a white-box test technique, where test cases are derived based on the source code structure"},{"text":"In decision table testing, the test cases are independent of how the software is implemented. In branch testing, test cases can be created only after the design or implementation of the code.","correct":true,"why":"Is correct. Decision table testing is a black-box test technique, so it is based on an analysis of the specified behavior of the test object without reference to its internal structure. Therefore, the test cases are independent of how the software is implemented. Branch testing is a white-box test technique, so test cases are based on an analysis of the test object’s internal structure and processing. As the test cases are dependent on how the software is designed and coded, they can only be created after the design or implementation of the test object"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-20","source":"ISTQB Sample Exam B, Q20","chapter":4,"lo":"FL-4.2.1","k":"K3","stem":"Customers of the TestWash car wash chain have cards with a record of the number of washes they have bought so far. The initial value is 0. After entering the car wash, the system increases the number on the card by one. This value represents the number of the current wash. Based on this number the system decides what discount the customer is entitled to.\nFor every tenth wash the system gives a 10% discount, and for every twentieth wash, the system gives a further 40% discount (i.e., a 50% discount in total).\nWhich of the following sets of input data (understood as the numbers of the current wash) achieves the highest equivalence partition coverage?","stemAfter":null,"table":null,"options":[{"text":"19, 20, 30","correct":true,"why":"Is correct. 19 covers the “no discount” partition, 20 covers the “50% discount” partition, and 30 covers the “10% discount” partition. These three values cover all three of the valid equivalence partitions"},{"text":"11, 12, 20","correct":false,"why":"Is not correct. 11 and 12 cover the “no discount” partition, while 20 covers the “50% discount” partition, so covering two of the three valid equivalence partitions"},{"text":"1, 10, 50","correct":false,"why":"Is not correct. 1 covers the “no discount” partition, while 10 and 50 cover the “10% discount” partition. The “50% discount” partition is not covered, so overall two of the three valid equivalence partitions are covered"},{"text":"10, 29, 30, 31","correct":false,"why":"Is not correct. 29 and 31 cover the “no discount” partition, while 10 and 30 cover the “10% discount” partition. The “50% discount” partition is not covered, so overall two of the three valid equivalence partitions are covered"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-21","source":"ISTQB Sample Exam B, Q21","chapter":4,"lo":"FL-4.2.2","k":"K3","stem":"You are testing a form that verifies the correctness of the length of the password given as input. The form accepts a password with the correct length and rejects a password that is too short or too long. The password length is correct if it has between 6 and 12 characters inclusive. Otherwise, it is considered incorrect.\nAt first, the form is empty (password length = 0). You apply boundary value analysis to the “password length” variable.\nYour set of test cases achieves 100% 2-value boundary value coverage. The team decided that due to the high risk of this component, test cases should be added to ensure 100% 3-value boundary value coverage.\nWhich additional password lengths should be tested to achieve this?","stemAfter":null,"table":null,"options":[{"text":"4, 5, 13, 14","correct":false,"why":"Is not correct"},{"text":"7, 11","correct":false,"why":"Is not correct"},{"text":"1, 5, 13","correct":false,"why":"Is not correct"},{"text":"1, 4, 7, 11, 14","correct":true,"why":"Is correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The domain for the password length has three equivalence partitions:\n• passwords too short {0, 1, …, 4, 5}\n• passwords OK {6, 7, …, 11, 12}\n• passwords too long {13, 14, …}\nTo achieve full coverage for 3-value BVA we need to test the following values:\n0, 1, 4, 5, 6, 7, 11, 12, 13, 14.\nSince 2-value BVA is already covered, this means that we have already tested the passwords of length:\n0, 5, 6, 12 and 13.\nThis means that the additional lengths that need to be covered to move from 2-value to 3-value are:\n1, 4, 7, 11 and 14."},{"id":"ISTQB-B-22","source":"ISTQB Sample Exam B, Q22","chapter":4,"lo":"FL-4.2.3","k":"K3","stem":"The following decision table contains the rules for determining the risk of atherosclerosis.","stemAfter":"What is the decision table coverage achieved by these test cases?","table":"<table class=\"qt\"><tr><th><\/th><th>Rule 1<\/th><th>Rule 2<\/th><th>Rule 3<\/th><th>Rule 4<\/th><th>Rule 5<\/th><\/tr><tr><td>Conditions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cholesterol (mg/dl)<\/td><td>≤124<\/td><td>≤ 124<\/td><td>125 – 200<\/td><td>125 – 200<\/td><td>≥ 201<\/td><\/tr><tr><td>Blood pressure (mm Hg)<\/td><td>≤ 140<\/td><td>&gt; 140<\/td><td>≤ 140<\/td><td>&gt; 140<\/td><td>–<\/td><\/tr><tr><td>Action<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk level<\/td><td>very low<\/td><td>low<\/td><td>medium<\/td><td>high<\/td><td>very high<\/td><\/tr><\/table><p>You designed the test cases with the following input data:<\/p><table class=\"qt\"><tr><th>Test case<\/th><th>Cholesterol<\/th><th>Blood pressure<\/th><\/tr><tr><td>TC1<\/td><td>125 mg/dl<\/td><td>141 mm Hg<\/td><\/tr><tr><td>TC2<\/td><td>200 mg/dl<\/td><td>201 mm Hg<\/td><\/tr><tr><td>TC3<\/td><td>124 mg/dl<\/td><td>201 mm Hg<\/td><\/tr><tr><td>TC4<\/td><td>109 mg/dl<\/td><td>200 mm Hg<\/td><\/tr><tr><td>TC5<\/td><td>201 mg/dl<\/td><td>140 mm Hg<\/td><\/tr><\/table>","options":[{"text":"40%","correct":false,"why":"Is not correct"},{"text":"60%","correct":true,"why":"Is correct"},{"text":"80%","correct":false,"why":"Is not correct"},{"text":"100%","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"There are five columns in the decision table. Each test case covers one of them.\nTC1 and TC2 both cover Rule 4\nTC3 and TC4 both cover Rule 2\nTC5 covers Rule 5\nSo, these five test cases cover three out of five columns, achieving a coverage of (3/5)*100% = 60%. Therefore, “60%” is the CORRECT option."},{"id":"ISTQB-B-23","source":"ISTQB Sample Exam B, Q23","chapter":4,"lo":"FL-4.2.4","k":"K3","stem":"A storage system can store up to three elements and is modeled by the following state transition diagram. The variable N represents the number of currently stored elements.","stemAfter":"Which of the following test cases, represented as sequences of events, achieves the highest level of valid transitions coverage?","table":"<div class=\"diag\"><svg role=\"img\" aria-label=\"state transition diagram\" style=\"width:303px;max-width:100%;min-width:230px;height:auto\"\n viewBox=\"0.00 0.00 303.00 127.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"ISTQB-B-23-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(4 123)\">\n\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-4,4 -4,-123 299,-123 299,4 -4,4\"/>\n\n<g id=\"ISTQB-B-23-node1\" class=\"node\">\n\n<ellipse fill=\"black\" stroke=\"black\" cx=\"13.5\" cy=\"-59.5\" rx=\"13.5\" ry=\"13.5\"/>\n<\/g>\n\n<g id=\"ISTQB-B-23-node2\" class=\"node\">\n\n<path fill=\"#f1f1f1\" stroke=\"black\" d=\"M165,-73C165,-73 103,-73 103,-73 98.5,-73 94,-68.5 94,-64 94,-64 94,-55 94,-55 94,-50.5 98.5,-46 103,-46 103,-46 165,-46 165,-46 169.5,-46 174,-50.5 174,-55 174,-55 174,-64 174,-64 174,-68.5 169.5,-73 165,-73\"/>\n<text text-anchor=\"middle\" x=\"134\" y=\"-56.1\" font-family=\"Arial\" font-size=\"13.00\">NOT FULL<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-edge1\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M27.18,-59.5C41.4,-59.5 65.27,-59.5 86.75,-59.5\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"86.93,-61.95 93.93,-59.5 86.93,-57.05 86.93,-61.95\"/>\n<text text-anchor=\"middle\" x=\"60.5\" y=\"-63.1\" font-family=\"Arial\" font-size=\"13.00\">E1<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-edge2\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M134,-73.5C116,-83.67 116,-105 134,-105 149.75,-105 151.72,-88.67 139.91,-77.77\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"141.11,-75.62 134,-73.5 138.24,-79.59 141.11,-75.62\"/>\n<text text-anchor=\"middle\" x=\"134\" y=\"-108.6\" font-family=\"Arial\" font-size=\"13.00\">E2<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-edge3\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M134,-45.5C116,-35.33 116,-14 134,-14 149.75,-14 151.72,-30.33 139.91,-41.23\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"138.24,-39.41 134,-45.5 141.11,-43.38 138.24,-39.41\"/>\n<text text-anchor=\"middle\" x=\"134\" y=\"-3.6\" font-family=\"Arial\" font-size=\"13.00\">E3<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-node3\" class=\"node\">\n\n<path fill=\"#f1f1f1\" stroke=\"black\" d=\"M286,-73C286,-73 250,-73 250,-73 245.5,-73 241,-68.5 241,-64 241,-64 241,-55 241,-55 241,-50.5 245.5,-46 250,-46 250,-46 286,-46 286,-46 290.5,-46 295,-50.5 295,-55 295,-55 295,-64 295,-64 295,-68.5 290.5,-73 286,-73\"/>\n<text text-anchor=\"middle\" x=\"268\" y=\"-56.1\" font-family=\"Arial\" font-size=\"13.00\">FULL<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-edge4\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M174.25,-59.5C193,-59.5 215.22,-59.5 233.21,-59.5\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"233.64,-61.95 240.64,-59.5 233.64,-57.05 233.64,-61.95\"/>\n<text text-anchor=\"middle\" x=\"207.5\" y=\"-63.1\" font-family=\"Arial\" font-size=\"13.00\">E4<\/text>\n<\/g>\n\n<g id=\"ISTQB-B-23-edge5\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M241.2,-45.96C233.33,-42.5 224.5,-39.26 216,-37.5 199.91,-34.18 182.29,-38.05 167.59,-43.42\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"166.69,-41.14 161.07,-45.97 168.48,-45.7 166.69,-41.14\"/>\n<text text-anchor=\"middle\" x=\"207.5\" y=\"-41.1\" font-family=\"Arial\" font-size=\"13.00\">E5<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div><table class=\"qt legend\"><tr><th>Transition<\/th><th>Event [guard] / action<\/th><\/tr><tr><td>E1<\/td><td>Add / N := 1<\/td><\/tr><tr><td>E2<\/td><td>Add [N &lt; 2] / N := N + 1<\/td><\/tr><tr><td>E3<\/td><td>Remove [N &gt; 0] / N := N – 1<\/td><\/tr><tr><td>E4<\/td><td>Add [N = 2] / N := N + 1<\/td><\/tr><tr><td>E5<\/td><td>Remove / N := N – 1<\/td><\/tr><\/table>","options":[{"text":"Add, Remove, Add, Add, Add","correct":false,"why":"Is not correct. Test “Add, Remove, Add, Add, Add” can be written as E1, E3, E3, E2, E4 (so covers 4 out of 5 valid transitions, achieving 80% valid transitions coverage)."},{"text":"Add, Add, Add, Add, Remove, Remove","correct":false,"why":"Is not correct. Test “Add, Add, Add, Add, Remove, Remove” is infeasible, because after the first three “Add” actions the system is in the FULL state and there is no valid transition going from FULL triggered by the “Add” event. After the first three transitions only 60% of valid transitions coverage is achieved."},{"text":"Add, Add, Add, Remove, Remove","correct":true,"why":"Is correct. Test “Add, Add, Add, Remove, Remove” can be written as E1, E2, E4, E5, E3 (so covers 5 out of 5 valid transitions, achieving 100% valid transitions coverage)."},{"text":"Add, Add, Add, Remove, Add","correct":false,"why":"Is not correct. Test “Add, Add, Add, Remove, Add” can be written as E1, E2, E4, E5, E4 (so covers 4 out of 5 valid transitions, achieving 80% valid transitions coverage)."}],"selectCount":1,"lockOrder":false,"diagramConverted":true,"explanation":"Let us refer to the transitions with E1, …, E5 as in the diagram. The variable N denotes the number of elements currently stored. Each “Add” event increases it by 1, and each “Remove” event decreases it by 1. Notice, that when the “Add” event occurs while being in the NOT FULL state, the state changes to FULL only if N=2. If N<2, the system stays in the NOT FULL state. If N=0, no “Remove” action is possible. Similarly, if N=3, no “Add” action is possible."},{"id":"ISTQB-B-24","source":"ISTQB Sample Exam B, Q24","chapter":4,"lo":"FL-4.3.1","k":"K2","stem":"You run two test cases, T1 and T2, on the same code. Test T1 achieved 40% statement coverage and test T2 achieved 65% statement coverage.\nWhich of the following sentences must be necessarily true?","stemAfter":null,"table":null,"options":[{"text":"The test suite composed of tests T1 and T2 achieves 105% statement coverage","correct":false,"why":"Is not correct. Coverage is always defined as the percentage of the covered elements. Therefore, it cannot exceed 100%"},{"text":"There exists at least one statement that must have been executed by both T1 and T2","correct":true,"why":"Is correct. If the statements executed by T1 and T2 were disjoint, the coverage of the test suite {T1, T2} would be 105%, which is impossible (see the option “The test suite composed of tests T1 and T2 achieves 105% statement coverage”). Therefore, at least 5% of executable statements must have been executed by both T1 and T2"},{"text":"At least 5% of the statements in the code that was tested are non-executable","correct":false,"why":"Is not correct. Statement coverage does not tell us anything about the number of non-executable statements in the code"},{"text":"The test suite composed of tests T1 and T2 achieves full branch coverage","correct":false,"why":"Is not correct. Even if a test suite achieves full statement coverage, this does not imply achieving full branch coverage"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-25","source":"ISTQB Sample Exam B, Q25","chapter":4,"lo":"FL-4.3.2","k":"K2","stem":"Let the branch coverage metric be defined as BCov = (X / Y) * 100%.\nWhat do X and Y represent in this formula?","stemAfter":null,"table":null,"options":[{"text":"X = number of decision outcomes exercised by the test cases \nY = total number of decision outcomes in the code","correct":false,"why":"Is not correct. A decision outcome is a conditional branch. For branch testing, X counts not only conditional, but also unconditional branches"},{"text":"X = number of conditional branches exercised by the test cases \nY = total number of branches in the code","correct":false,"why":"Is not correct. Branch coverage counts not only conditional, but also unconditional branches"},{"text":"X = number of branches exercised by the test cases \nY = total number of branches in the code","correct":true,"why":"Is correct. Branch coverage is measured as the number of branches exercised by the test cases divided by the total number of branches, and is expressed as a percentage"},{"text":"X = number of conditional branches exercised by the test cases \nY = total number of decision outcomes in the code","correct":false,"why":"Is not correct. Both X and Y count only conditional branches and do not take into account the unconditional branches"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Branch testing is a white-box test technique in which the coverage items are branches. A branch is a transfer of control between two nodes in the control flow graph, which shows the possible sequences in which source code statements are executed in the test object. Each transfer of control can be either unconditional (i.e., straight-line code) or conditional (i.e., a decision outcome). Coverage is measured as the number of branches exercised by the test cases divided by the total number of branches, and is expressed as a percentage."},{"id":"ISTQB-B-26","source":"ISTQB Sample Exam B, Q26","chapter":4,"lo":"FL-4.4.2","k":"K2","stem":"Which TWO of the following statements provide the BEST rationale for using exploratory testing?","stemAfter":null,"table":null,"options":[{"text":"Testers have not been allocated enough time for test design and test execution","correct":true,"why":"Is correct. Exploratory testing is useful when there are few or inadequate specifications or there is significant time pressure on the testing"},{"text":"The existing test strategy requires that testers use formal, black-box test techniques","correct":false,"why":"Is not correct. Exploratory testing is not a black-box test technique"},{"text":"The specification is written in a formal language that can be processed by a tool","correct":false,"why":"Is not correct. Exploratory testing is useful when the specifications are poorly written"},{"text":"Testers are the members of an agile team and have good programming skills","correct":false,"why":"Is not correct. Programming skills have nothing to do with exploratory testing in principle"},{"text":"Testers are experienced in the business domain and have good analytical skills","correct":true,"why":"Is correct. Exploratory testing will be more effective if the tester is experienced, has domain knowledge and has a high degree of essential skills, like analytical skills, curiosity and creativeness"}],"selectCount":2,"lockOrder":false,"diagramConverted":false,"explanation":"Exploratory testing is useful when there are few or inadequate specifications or there is significant time pressure on the testing. Exploratory testing is also useful to complement other more formal test techniques. Exploratory testing will be more effective if the tester is experienced, has domain knowledge and has a high degree of essential skills, like analytical skills, curiosity and creativeness."},{"id":"ISTQB-B-27","source":"ISTQB Sample Exam B, Q27","chapter":4,"lo":"FL-4.4.3","k":"K2","stem":"Which of the following BEST fits as an element of the checklist used in checklist-based testing?","stemAfter":null,"table":null,"options":[{"text":"“The developer made an error when implementing the code”","correct":false,"why":"Is not correct. Checklists should contain test conditions to be verified. This is an example of an error, not a test condition; even if the tester was able to deduce some potential test conditions from the examples of errors, this error description is too general"},{"text":"“The achieved statement coverage exceeds 85%”","correct":false,"why":"Is not correct. Checklists should not contain items that are better suited as exit criteria. This is an example of an exit criterion"},{"text":"“The program works correctly regarding functional and non-functional requirements”","correct":false,"why":"Is not correct. Checklists should not contain items that are too general. This is a very general item, which practically describes a test objective"},{"text":"“The error messages are written in language that the user can understand”","correct":true,"why":"Is correct. This is an example of a test condition that can be checked by a human"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-28","source":"ISTQB Sample Exam B, Q28","chapter":4,"lo":"FL-4.5.2","k":"K2","stem":"Consider the following acceptance criteria for a user story written from the perspective of an online store owner.\nGiven that the user is logged in and on the homepage,\nWhen the user clicks on the \"Add Item\" button,\nThen the \"Create Item\" form should appear,\nAnd the user should be able to input a name and price for the new item.\nIn what format is this acceptance criteria written?","stemAfter":null,"table":null,"options":[{"text":"Rule-oriented","correct":false,"why":"Is not correct. The rule-oriented format includes formats like bullet point verification lists or tabulated forms of input-output mappings, explicitly showing the rules to be followed. Given/When/Then is a scenario-oriented format because it describes a scenario to be verified"},{"text":"Scenario-oriented","correct":true,"why":"Is correct. This is a Given/When/Then format, which is scenario-oriented"},{"text":"Product-oriented","correct":false,"why":"Is not correct. There is no \"product-oriented\" format of acceptance criteria"},{"text":"Process-oriented","correct":false,"why":"Is not correct. There is no \"process-oriented\" format of acceptance criteria"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-B-29","source":"ISTQB Sample Exam B, Q29","chapter":4,"lo":"FL-4.5.3","k":"K3","stem":"Your team analyzes the following user story in order to define the acceptance criteria:\nAs a registered customer, I want to be able to view my previous orders on the company's website, so that I can keep track of my purchases.\nWhich of the following test cases will NOT be relevant for this user story?","stemAfter":null,"table":null,"options":[{"text":"Input: the customer logs into their account on the website and clicks the “see order history” button\nExpected result: the system shows a list of all the customer’s previous orders, including the date, order number, and total cost","correct":false,"why":"Is not correct. The test case is related to viewing previous orders in the order history"},{"text":"Input: the customer clicks on an order from the order list\nExpected result: the system displays the individual items purchased, along with their prices and quantities","correct":false,"why":"Is not correct. The test case is related to viewing previous orders"},{"text":"Input: the customer clicks “Sort ascending” button on the order history screen\nExpected result: the system shows the order history sorted by order number in ascending order","correct":false,"why":"Is not correct. The test case is related to viewing previous orders in the order history"},{"text":"Input: an unregistered customer registers as a new customer with a valid e-mail address that does not already exist in the customer database\nExpected result: the system accepts the registration and creates the account","correct":true,"why":"Is correct. The test case is related to the registration process, which is not discussed in the user story. The user story is about viewing previous orders"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-1","source":"ISTQB Sample Exam C, Q1","chapter":1,"lo":"FL-1.1.1","k":"K1","stem":"Which of the following is a typical test objective?","stemAfter":null,"table":null,"options":[{"text":"Validating that documented requirements are met","correct":false,"why":"Is not correct. Validating that documented requirements are met is incorrect as validation is concerned with meeting user requirements and expectations, while verification is concerned with meeting specified requirements, so this would be correct if we replaced ‘validating’ with ‘verifying’"},{"text":"Causing failures and identifying defects","correct":true,"why":"Is correct. Causing failures and identifying defects is probably the most common objective of dynamic testing"},{"text":"Initiating errors and identifying root causes","correct":false,"why":"Is not correct. Initiating errors and identifying root causes is incorrect because testers do not initiate errors, they try to cause failures. Errors are typically made by developers (and cannot really be initiated) and result in defects, which testers attempt to identify either directly through static testing or indirectly through failures with dynamic testing. Identifying root causes is useful but is part of debugging, which is a separate activity from testing"},{"text":"Verifying the test object meets user expectations","correct":false,"why":"Is not correct. Verifying the test object meets user expectations is incorrect as verification is concerned with checking specified (documented) requirements are met, while validation is concerned with meeting user requirements and expectations, so this would be correct if we replaced ‘verifying’ with ‘validating’"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-2","source":"ISTQB Sample Exam C, Q2","chapter":1,"lo":"FL-1.1.2","k":"K2","stem":"Which of the following statements BEST describes the difference between testing and debugging?","stemAfter":null,"table":null,"options":[{"text":"Testing causes failures while debugging fixes failures","correct":false,"why":"Is not correct. Dynamic testing does cause failures (from which defects can then be located and fixed). However, debugging is concerned with locating defects and fixing these defects. Therefore, debugging does not fix failures"},{"text":"Testing is a negative activity while debugging is a positive activity","correct":false,"why":"Is not correct. Both testing and debugging contribute to improving the quality of the test object, so both should be considered positively. Debugging is generally considered to be a positive activity as it is fixing something. Dynamic testing does involve intentionally causing the test object to fail, which is why some people consider it a negative activity, but that is a very narrow view (and not one typically held by testers). Both positive and negative test cases are possible. Positive test cases check that the test object correctly performs what it is supposed to do, while negative testing checks that the test object does not do what it is not supposed to do"},{"text":"Testing determines that defects exist while debugging removes defects","correct":true,"why":"Is correct. Testing determines that defects exist either directly through observation of the defect in reviews (or by a tool in static analysis), or indirectly by causing a failure in dynamic testing. Debugging is a separate activity from testing (normally performed by developers) and is concerned with locating defects (only for dynamic testing) and fixing the defects"},{"text":"Testing finds the cause of defects while debugging fixes the cause of defects","correct":false,"why":"Is not correct. The causes of defects are typically human errors. Testing finds defects either directly through static testing, or indirectly by causing failures in dynamic testing, and debugging fixes defects. So, testing does not find the cause of defects and debugging does not fix the causes of defects"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-3","source":"ISTQB Sample Exam C, Q3","chapter":1,"lo":"FL-1.3.1","k":"K2","stem":"The ‘absence-of-defects fallacy’ is one of the principles of testing. Which of the following is an example of addressing this principle in practice?","stemAfter":null,"table":null,"options":[{"text":"Explaining that it is not possible for testing to show the absence of defects","correct":false,"why":"Is not correct. The ‘testing shows the presence, not the absence of defects’ principle explains that while testing can detect the existence of defects in the test object, it is not possible to demonstrate that there are no defects and, therefore, guarantee its correctness. Therefore, explaining that it is not possible for testing to show the absence of defects would partially address this principle, not the ‘absence-of-defects’ fallacy"},{"text":"Supporting the end users to perform acceptance testing","correct":true,"why":"Is correct. By supporting the end user to perform acceptance testing it should be possible to validate that the system meets users' needs and expectations"},{"text":"Ensuring that no implementation defects remain in the delivered system","correct":false,"why":"Is not correct. It is not possible to ensure that no implementation defects remain in the delivered system as the ‘testing shows the presence, not the absence of defects’ principle explains that while testing can detect the existence of defects in the test object, it is not possible to demonstrate that there are no defects and, therefore, guarantee its correctness"},{"text":"Modifying tests that cause no failures to ensure few defects remain","correct":false,"why":"Is not correct. Modifying tests that cause no failures to ensure few defects remain is one way to address the ‘tests wear out’ principle. This principle is concerned with the idea that repeating identical tests on unaltered code is unlikely to uncover novel defects and therefore, modifying tests may be essential. This will not validate that the system meets users' needs and expectations"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"The ‘absence-of-defects fallacy’ is concerned with the idea that ensuring correctness in accordance with the requirements (i.e., verifying the absence of implementation defects) does not guarantee user satisfaction with the system. To address this it is also necessary to validate that the system meets users' needs and expectations, fulfills business objectives, and outperforms competing systems."},{"id":"ISTQB-C-4","source":"ISTQB Sample Exam C, Q4","chapter":1,"lo":"FL-1.4.1","k":"K2","stem":"Which of the following test activities are MOST likely to involve the application of boundary value analysis and equivalence partitioning?","stemAfter":null,"table":null,"options":[{"text":"Test implementation","correct":false,"why":"Is not correct. Test implementation is not likely to involve the use of test techniques as it is mostly concerned with assembling test cases into test procedures, while test techniques create test cases"},{"text":"Test design","correct":true,"why":"Is correct. Test design is likely to involve the use of test techniques to create test cases from test conditions and coverage items"},{"text":"Test execution","correct":false,"why":"Is not correct. Test execution is not likely to involve the use of test techniques as it is mostly concerned with executing test procedures (and so test cases), while test techniques create test cases"},{"text":"Test monitoring","correct":false,"why":"Is not correct. Test monitoring is not likely to involve the use of test techniques. Test monitoring is mostly concerned with ongoing checks to ensure the plan is being followed, while test techniques create test cases"},{"text":"Test analysis","correct":true,"why":"Is correct. Test analysis is likely to involve the use of test techniques to identify test conditions"}],"selectCount":2,"lockOrder":false,"diagramConverted":false,"explanation":"Given the following description of test analysis:\nTo identify the features that require testing, the test basis is analyzed and defined as test conditions, which are then prioritized along with related risks. The systematic identification of test conditions as coverage items often involves using test techniques both during test analysis and as part of the test design activity.\nFrom the above description, it can be seen that test techniques are often used in the test analysis and test design activities. Boundary value analysis and equivalence partitioning are test techniques."},{"id":"ISTQB-C-5","source":"ISTQB Sample Exam C, Q5","chapter":1,"lo":"FL-1.4.3","k":"K2","stem":"Given the following testware:\n1. Coverage items\n2. Change requests\n3. Test execution schedule\n4. Prioritized test conditions\nAnd the following test activities\nA. Test analysis\nB. Test design\nC. Test implementation\nD. Test completion\nWhich of the following BEST shows the testware produced by the activities?","stemAfter":null,"table":null,"options":[{"text":"1B, 2D, 3C, 4A","correct":true,"why":"Is correct. The correct match is: 1B, 2D, 3C, 4A"},{"text":"1B, 2D, 3A, 4C","correct":false,"why":"Is not correct"},{"text":"1D, 2C, 3A, 4B","correct":false,"why":"Is not correct"},{"text":"1D, 2C, 3B, 4A","correct":false,"why":"Is not correct"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":"Considering each of the listed test activities and their output testware:\nA. Test analysis - prioritized test conditions (4) (e.g., acceptance criteria), and defect reports for defects identified in the test basis\nB. Test design - prioritized test cases, test charters, coverage items (1), test data requirements, and test environment requirements\nC. Test implementation - test procedures, automated test scripts, test suites, test data, test execution schedule (3), and test environment elements such as stubs, drivers, simulators, and service virtualizations\nD. Test completion - test completion report, documented lessons learned, action items for improvement, and change requests (2) (as product backlog items)"},{"id":"ISTQB-C-6","source":"ISTQB Sample Exam C, Q6","chapter":1,"lo":"FL-1.4.5","k":"K2","stem":"Which of the following statements about the different testing roles is MOST likely to be\nCORRECT?","stemAfter":null,"table":null,"options":[{"text":"In Agile software development, the test management role is the primary responsibility of the team, while the testing role is primarily the responsibility of a single individual from outside the team","correct":false,"why":"Is not correct. Although it is correct to say that in Agile software development, some of the test management tasks may be handled by the Agile team itself, the testing role is not primarily the responsibility of a single individual from outside the team. Instead the testing is more likely to be performed by various team members following the whole-team approach"},{"text":"The testing role is primarily responsible for test monitoring and test control, while the test management role is primarily responsible for test planning and test completion","correct":false,"why":"Is not correct. The test management role primarily involves activities related to test planning, test monitoring and test control, and test completion. So, although this statement is partially correct, it is wrong to say that the testing role is primarily responsible for test monitoring and test control"},{"text":"In Agile software development, test management activities that span multiple teams are handled by a test manager outside the team, while some test management tasks are handled by the team itself","correct":true,"why":"Is correct. In Agile software development, some of the test management tasks may be handled by the Agile team itself. However, for test activities that span multiple teams within an organization, test managers outside of the development team may perform these tasks"},{"text":"The test management role is primarily responsible for test analysis and test design, while the testing role is primarily responsible for test implementation and test execution","correct":false,"why":"Is not correct. The test management role primarily involves activities related to test planning, test monitoring and test control, and test completion, while the testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Thus the test management role is not normally responsible for test analysis and test design, although it is correct to say that the testing role is primarily responsible for test implementation and test execution"}],"selectCount":1,"lockOrder":false,"diagramConverted":false,"explanation":""},{"id":"ISTQB-C-7","source":"ISTQB Sample Exam C, Q7","chapter":1,"lo":"FL-1.5.2","k":"K1","stem":"Which of the following is an advantage of the whole-team approach?","stemAfter":null,"table":null,"options":[{"text":"Teams with no testers","correct":false,"why":"Is not correct. In the whole-team approach, testers play a vital role by sharing their testing expertise with the team and guiding product development. They collaborate with other team members to achieve the desired quality levels and work with business representatives to create acceptance tests. Testers also partner with
