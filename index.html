rts":[{"l":"","q":"Compare a functional requirement with a non-functional requirement.","m":4,"a":"<p>A functional requirement says *what* the system does, e.g. \"calculate the shipping fee\". A non-functional requirement says *how well* it does it, e.g. \"the page loads within 2 s for 1,000 users\".<\/p><p>ISO 25010 non-functional characteristics: performance efficiency, compatibility, usability, reliability, security, maintainability, portability, safety.<\/p>"}],"marks":4},{"id":"B-C2-confreg","topic":"ch2","title":"Distinguish confirmation testing from regression testing.","src":"Predicted question","scen":"","parts":[{"l":"","q":"Distinguish confirmation testing from regression testing.","m":4,"a":"<p>Confirmation testing re-runs the tests that failed, to check the defect is fixed. Regression testing runs broader tests to check that a change has not broken anything else. Regression suites run often, so they suit automation.<\/p>"}],"marks":4},{"id":"B-C2-accept","topic":"ch2","title":"What is the purpose of acceptance testing? Name its forms.","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"What is the purpose of acceptance testing? Name its forms.","m":4,"a":"<p>To validate that the system is ready for deployment and meets users' business needs. Forms: user acceptance, operational acceptance, contractual and regulatory acceptance, alpha, beta.<\/p>"}],"marks":4},{"id":"B-C2-maint","topic":"ch2","title":"What is the purpose of maintenance testing? Give examples of when it is necessary.","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"What is the purpose of maintenance testing? Give examples of when it is necessary.","m":4,"a":"<p>To test changes to a system already in operation, together with impact analysis. Triggers: modifications (enhancements, hotfixes, corrective changes); upgrades or migrations of the operational environment (including data conversion); retirement (archiving data and testing restore).<\/p>"}],"marks":4},{"id":"B-C2-emerg","topic":"ch2","title":"Elaborate on the process of fixing emergency changes.","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"Elaborate on the process of fixing emergency changes.","m":4,"a":"<p>The fix is made quickly and tested with risk-based confirmation testing and a targeted regression subset, then deployed. Afterwards it goes back through the normal change process: full regression testing, documentation, and updates to test cases and configuration records.<\/p>"}],"marks":4},{"id":"B-C2-sysint","topic":"ch2","title":"In system integration projects, identify TWO (2) major areas of risk and suggest a miti…","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"In system integration projects, identify TWO (2) major areas of risk and suggest a mitigation for each.","m":4,"a":"<ul class=\"mlist\"><li>Interface mismatches between systems (data formats, protocols). Mitigate with agreed interface specifications, early integration, and stubs or drivers.<\/li><li>An external or third-party system is unavailable or unstable. Mitigate with service virtualisation or simulators, and service level agreements.<\/li><li>Test environments that differ from production. Mitigate with a production-like environment.<\/li><\/ul>"}],"marks":4},{"id":"B-C3-benefits","topic":"ch3","title":"Identify THREE (3) benefits of reviews.","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Identify THREE (3) benefits of reviews.","m":3,"a":"<p>Any three: finds defects early and cheaply; finds defect types dynamic testing cannot (requirement ambiguities, design defects, unreachable code); improves shared understanding and communication; reduces total development and test cost.<\/p>"}],"marks":3},{"id":"B-C3-static","topic":"ch3","title":"Distinguish static testing from dynamic testing.","src":"Predicted question","scen":"","parts":[{"l":"","q":"Distinguish static testing from dynamic testing.","m":4,"a":"<p>Static testing finds defects directly in work products without execution, and also works on non-executable items such as requirements. Dynamic testing executes the software and finds failures. Some characteristics, such as performance, can only be measured dynamically.<\/p>"}],"marks":4},{"id":"B-C3-process","topic":"ch3","title":"Describe the activities of the review process. What happens during planning?","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Describe the activities of the review process. What happens during planning?","m":5,"a":"<ol class=\"mlist\"><li>Planning: scope, purpose, quality characteristics, exit criteria, effort and timeframe.<\/li><li>Review initiation: everyone gets access to the work product and understands their role.<\/li><li>Individual review: reviewers record anomalies, recommendations and questions.<\/li><li>Communication and analysis: anomalies are discussed; status, owner and actions are decided.<\/li><li>Fixing and reporting: defect reports are written, fixes made, and results reported against the exit criteria.<\/li><\/ol>"}],"marks":5},{"id":"B-C3-roles","topic":"ch3","title":"Who manages the review process? Name the review roles.","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Who manages the review process? Name the review roles.","m":4,"a":"<p>The <b>review leader<\/b> is responsible for the review overall and organises it. The <b>manager<\/b> decides what is reviewed and provides resources. Other roles: <b>author<\/b>, <b>moderator (facilitator)<\/b> who runs meetings, <b>scribe (recorder)<\/b> who records anomalies, and <b>reviewers<\/b>.<\/p>"}],"marks":4},{"id":"B-C3-walk","topic":"ch3","title":"Compare the differences between a walkthrough and an inspection. Name THREE characteris…","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Compare the differences between a walkthrough and an inspection. Name THREE characteristics of a walkthrough.","m":5,"a":"<p>A walkthrough is <b>led by the author<\/b>. It aims to educate, build consensus, generate ideas and find anomalies; individual preparation is optional; it can be informal or formal; it suits knowledge transfer.<\/p><p>An inspection is the <b>most formal<\/b> type. It is led by a trained moderator (never the author), follows the full process with defined roles, entry/exit criteria and collected metrics, and aims to find as many anomalies as possible.<\/p>"}],"marks":5},{"id":"B-C3-success","topic":"ch3","title":"Identify THREE (3) success factors for a review.","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Identify THREE (3) success factors for a review.","m":3,"a":"<p>Any three: clear objectives and measurable exit criteria; the right review type; small chunks of work product; enough time to prepare; management support; training; feedback to authors and stakeholders; reviews part of the culture.<\/p>"}],"marks":3},{"id":"B-C3-sa","topic":"ch3","title":"Name THREE benefits of static analysis. What is it looking for? What type of defect rel…","src":"Tutorial Week 5","scen":"","parts":[{"l":"","q":"Name THREE benefits of static analysis. What is it looking for? What type of defect relates to a password check?","m":4,"a":"<p>It finds code defects before execution, cheaply and automatically (e.g. in the CI pipeline). It looks for unreachable code, undefined or unused variables, coding-standard violations, security vulnerabilities, and high complexity or maintainability problems.<\/p><p>A password-check problem is a <b>security vulnerability<\/b>.<\/p>"}],"marks":4},{"id":"B-RK-rpn","topic":"risk","title":"Risk priority number and extent of testing","src":"Lecture slides (course extension)","scen":"<p>An online banking app has these quality risks. Technical risk (likelihood) and business risk (impact) are rated 1 = very high to 5 = very low. Risk priority number (RPN) = technical × business. Extent of testing: 1–5 Extensive, 6–10 Broad, 11–15 Cursory, 16–20 Opportunity, 21–25 Report bugs.<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th>Risk<\/th><th>Technical<\/th><th>Business<\/th><\/tr><tr><td>R1 Fund transfer debits twice on timeout<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td>R2 Login is slow at peak hours<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>R3 Wrong interest for joint accounts<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>R4 Statement PDF uses the wrong font<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>R5 Typo in the FAQ page<\/td><td>5<\/td><td>5<\/td><\/tr><\/table><\/div>","parts":[{"l":"1.","q":"Calculate the RPN and the extent of testing for each risk.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Risk<\/th><th>RPN<\/th><th>Extent of testing<\/th><\/tr><tr><td>R1<\/td><td>2 × 1 = 2<\/td><td>Extensive<\/td><\/tr><tr><td>R2<\/td><td>3 × 2 = 6<\/td><td>Broad<\/td><\/tr><tr><td>R3<\/td><td>3 × 4 = 12<\/td><td>Cursory<\/td><\/tr><tr><td>R4<\/td><td>4 × 4 = 16<\/td><td>Opportunity<\/td><\/tr><tr><td>R5<\/td><td>5 × 5 = 25<\/td><td>Report bugs (only if found)<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"In which order should these risks be tested? Justify.","m":3,"a":"<p><b>R1 → R2 → R3 → R4 → R5.<\/b> On this scale a <b>lower<\/b> number means a <b>higher<\/b> risk, so the lowest RPN is tested first and hardest. Risk-based testing runs the tests most likely to find critical defects early.<\/p>"},{"l":"3.","q":"Define risk level and product (quality) risk. Give one tangible and one intangible impact.","m":4,"a":"<p><b>Risk level<\/b> = likelihood × impact of an undesirable outcome. A <b>product (quality) risk<\/b> is the possibility that the system fails to satisfy customers, users or other stakeholders: a family of possible bugs, not one bug.<\/p><p>Tangible: lost revenue when the ATM network is down. Intangible: customer dissatisfaction and loss of trust.<\/p>"},{"l":"4.","q":"Name THREE (3) ways to analyse quality risks.","m":3,"a":"<ul class=\"mlist\"><li><b>Informal (lightweight):<\/b> start from classic risk categories (functionality, performance, data quality, error handling, usability…) and agree priorities with stakeholders.<\/li><li><b>Quality characteristics:<\/b> decompose ISO 9126 / ISO 25010 characteristics into sub-characteristics for the system.<\/li><li><b>FMEA (failure mode and effect analysis):<\/b> list failure modes, predict effects, rate severity, priority and likelihood; their product is the RPN.<\/li><\/ul>"}],"marks":15},{"id":"B-RK-matrix","topic":"risk","title":"Test case coverage matrix and traceability","src":"Lecture slides (FL-1.4.4)","scen":"<p>The coverage matrix below links requirements to test cases (0 or blank = none, 1 = indirect, 2 = direct).<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>TC1<\/th><th>TC2<\/th><th>TC3<\/th><th>TC4<\/th><th>TC5<\/th><th>TC6<\/th><th>Total<\/th><\/tr><tr><td>REQ-1<\/td><td>2<\/td><td><\/td><td><\/td><td>1<\/td><td><\/td><td><\/td><td>3<\/td><\/tr><tr><td>REQ-2<\/td><td><\/td><td>2<\/td><td>2<\/td><td><\/td><td><\/td><td><\/td><td>4<\/td><\/tr><tr><td>REQ-3<\/td><td><\/td><td><\/td><td>1<\/td><td><\/td><td>2<\/td><td><\/td><td>3<\/td><\/tr><tr><td>REQ-4<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>0<\/td><\/tr><tr><td>REQ-5<\/td><td><\/td><td><\/td><td><\/td><td>2<\/td><td>1<\/td><td><\/td><td>3<\/td><\/tr><tr><td>REQ-6<\/td><td>1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>Total<\/td><td>3<\/td><td>2<\/td><td>3<\/td><td>3<\/td><td>3<\/td><td>1<\/td><td>15<\/td><\/tr><\/table><\/div>","parts":[{"l":"1.","q":"Which requirement has a coverage gap? What should be done?","m":2,"a":"<p><b>REQ-4<\/b> has no test at all. Design at least one test that covers it directly.<\/p>"},{"l":"2.","q":"Which requirement is only indirectly covered?","m":2,"a":"<p><b>REQ-6<\/b>: only 1s (indirect) from TC1 and TC6. Add a direct test.<\/p>"},{"l":"3.","q":"Which test case adds the least value? Explain.","m":2,"a":"<p><b>TC6<\/b>: it covers only one requirement, indirectly (total 1). Review whether it is worth keeping or should be strengthened.<\/p>"},{"l":"4.","q":"REQ-2 changes. Which tests must be re-run, and what is this activity called?","m":2,"a":"<p><b>TC2 and TC3.<\/b> Using traceability to find them is <b>impact analysis<\/b>.<\/p>"},{"l":"5.","q":"Calculate the requirement coverage, counting (a) any coverage and (b) direct coverage only.","m":3,"a":"<p>(a) 5 of 6 requirements have at least one test = <b>83%<\/b>. (b) REQ-1, REQ-2, REQ-3 and REQ-5 are covered directly: 4 of 6 = <b>67%<\/b>.<\/p>"},{"l":"6.","q":"Explain FOUR (4) benefits of traceability.","m":4,"a":"<ul class=\"mlist\"><li>Shows how much of the test basis is covered.<\/li><li>Speeds up impact analysis when a requirement changes.<\/li><li>Supports audits, progress reports and defect reports.<\/li><li>Makes testing understandable and justifiable to stakeholders.<\/li><\/ul>"}],"marks":15},{"id":"B-RK-spec","topic":"risk","title":"Test case specification and test development phases","src":"Lecture slides (course extension)","scen":"<p>Requirement REQ-07: \"A password must be at least 8 characters long.\" The login page shows \"Password must be at least 8 characters\" when the rule is broken.<\/p>","parts":[{"l":"1.","q":"Write ONE (1) test case specification for this requirement using boundary value analysis. Include all the usual fields.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Field<\/th><th>Value<\/th><\/tr><tr><td>Identifier<\/td><td>TC-LOGIN-03<\/td><\/tr><tr><td>Test item<\/td><td>Login form: password length rule<\/td><\/tr><tr><td>Preconditions<\/td><td>Account \"student01\" exists; login page is open<\/td><\/tr><tr><td>Input<\/td><td>Username student01; password Ab1!xyz (7 characters)<\/td><\/tr><tr><td>Expected result<\/td><td>Rejected with \"Password must be at least 8 characters\"<\/td><\/tr><tr><td>Environment<\/td><td>Chrome (latest), staging server, test database<\/td><\/tr><tr><td>Dependencies<\/td><td>None<\/td><\/tr><tr><td>Traceability / technique<\/td><td>REQ-07, risk 1.3 · BVA (minimum 8, tested at 7)<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"Name the THREE (3) levels of test specification (IEEE 829) and state what each contains.","m":6,"a":"<ul class=\"mlist\"><li><b>Test design specification:<\/b> a collection of test cases and the conditions they cover; features to test, approach (techniques, tools), test identification, feature pass/fail criteria.<\/li><li><b>Test case specification:<\/b> one test case; identifier, test items, input specs, output specs (expected results), environment needs, special procedural requirements, intercase dependencies.<\/li><li><b>Test procedure specification:<\/b> how to run one or more test cases; purpose, special requirements, steps (set up, start, proceed, measure, shut down, restart, stop, wrap up), contingencies.<\/li><\/ul><p>IEEE 829 is now superseded by ISO/IEC/IEEE 29119-3.<\/p>"},{"l":"3.","q":"Name the THREE (3) phases of test development in an analytical, risk-based strategy and the output of each.","m":3,"a":"<ul class=\"mlist\"><li><b>Quality risk analysis<\/b> (with requirements) → prioritised quality risks by category.<\/li><li><b>High-level test design<\/b> (with system design) → test suites with approach and pass/fail criteria.<\/li><li><b>Low-level test design<\/b> (with implementation) → test cases, test data and test scripts.<\/li><\/ul><p>These map to test analysis, test design and test implementation.<\/p>"}],"marks":15},{"id":"B-DT-shop","topic":"dt","title":"Online shop discounts with an infeasible combination (lecturer's version)","src":"Lecture slides activity","scen":"<p>Online shop rules: members receive 10% off. Orders of $100 or more get free shipping, for everyone. A coupon gives an extra 5% off. The coupon field is only shown to members, so non-members cannot enter a coupon.<\/p>","parts":[{"l":"1.","q":"Build the full decision table and mark infeasible combinations N/A.","m":8,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>N/A<\/th><th>R6<\/th><th>N/A<\/th><th>R8<\/th><\/tr><tr><td>Member<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>Order ≥ $100<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>Coupon entered<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><\/tr><tr><td>10% member discount<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Free shipping<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>Extra 5% coupon<\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Full table = 2³ = 8 columns. The two columns with Member = F and Coupon = T are infeasible.<\/p>"},{"l":"2.","q":"How many test cases are needed for 100% decision table coverage? Why?","m":2,"a":"<p><b>6<\/b>: coverage items are the feasible columns only (8 − 2 infeasible).<\/p>"},{"l":"3.","q":"Give the test cases, using boundary value analysis for the $100 rule.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>TC<\/th><th>Input<\/th><th>Expected<\/th><\/tr><tr><td>TC1<\/td><td>member, $100.00, coupon<\/td><td>10% + 5% off, free shipping<\/td><\/tr><tr><td>TC2<\/td><td>member, $150.00, no coupon<\/td><td>10% off, free shipping<\/td><\/tr><tr><td>TC3<\/td><td>member, $99.99, coupon<\/td><td>10% + 5% off, shipping charged<\/td><\/tr><tr><td>TC4<\/td><td>member, $50.00, no coupon<\/td><td>10% off, shipping charged<\/td><\/tr><tr><td>TC5<\/td><td>non-member, $100.00<\/td><td>No discount, free shipping<\/td><\/tr><tr><td>TC6<\/td><td>non-member, $99.99<\/td><td>No discount, shipping charged<\/td><\/tr><\/table><\/div>"}],"marks":15},{"id":"B-DT-atm","topic":"dt","title":"ATM cash withdrawal decision table","src":"Lecture slides activity","scen":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>Rule 1<\/th><th>Rule 2<\/th><th>Rule 3<\/th><th>Rule 4<\/th><th>Rule 5<\/th><\/tr><tr><td>Valid card<\/td><td>F<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>T<\/td><\/tr><tr><td>Valid PIN<\/td><td>–<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><\/tr><tr><td>Third incorrect PIN attempt<\/td><td>–<\/td><td>F<\/td><td>T<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>Balance sufficient<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>F<\/td><td>T<\/td><\/tr><tr><td>Reject card<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Re-enter PIN<\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Keep card<\/td><td><\/td><td><\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>Re-enter request<\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><td><\/td><\/tr><tr><td>Dispense cash<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>X<\/td><\/tr><\/table><\/div>","parts":[{"l":"1.","q":"Explain what T, F, \"–\" and X mean, and the difference between limited-entry and extended-entry decision tables.","m":4,"a":"<p>T = condition true, F = false, \"–\" = irrelevant for that rule (N/A = infeasible), X = the action occurs. <b>Limited-entry:<\/b> all conditions and actions are Boolean. <b>Extended-entry:<\/b> some conditions take several values, e.g. a speed range 1–10, 11–20, 21–25, &gt;25.<\/p>"},{"l":"2.","q":"Derive the test cases for 100% decision table coverage.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Test<\/th><th>Inputs<\/th><th>Expected<\/th><\/tr><tr><td>DT1<\/td><td>Expired card<\/td><td>Card rejected<\/td><\/tr><tr><td>DT2<\/td><td>Valid card, wrong PIN, first attempt<\/td><td>Asked to re-enter PIN<\/td><\/tr><tr><td>DT3<\/td><td>Valid card, third wrong PIN<\/td><td>Card kept<\/td><\/tr><tr><td>DT4<\/td><td>Valid card and PIN, request 100, balance 20<\/td><td>Asked to re-enter request<\/td><\/tr><tr><td>DT5<\/td><td>Valid card and PIN, request 100, balance 500<\/td><td>Cash dispensed<\/td><\/tr><\/table><\/div>"},{"l":"3.","q":"How would you choose precise data for \"balance sufficient\"?","m":2,"a":"<p>Use EP and BVA: request = balance (sufficient) and request = balance + 1 (insufficient).<\/p>"},{"l":"4.","q":"Give TWO (2) benefits and TWO (2) limitations of decision table testing.","m":4,"a":"<ul class=\"mlist\"><li>Benefits: finds combinations otherwise missed; systematic check for redundancy, contradictions and completeness; one test per feasible column.<\/li><li>Limitations: grows as 2ⁿ; relations between conditions are only implicit; large tables need minimising or risk-based selection; cannot model sequences of events (use state transition testing).<\/li><\/ul>"}],"marks":15},{"id":"B-ST-order","topic":"st","title":"Order lifecycle (lecturer's activity)","src":"Lecture slides activity","scen":"<p>Events: pay, ship, deliver, cancel.<\/p><div class=\"diag\"><svg role=\"img\" aria-label=\"Order lifecycle state diagram\" style=\"width:297px;max-width:100%;min-width:226px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 297 332\"><defs/><g><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"7\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"28.0122\" x=\"17.9939\" y=\"111.729\">New<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"50\" x=\"114\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"26.7109\" x=\"125.6445\" y=\"111.729\">Paid<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"60.6353\" x=\"223.5\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"50.6353\" x=\"228.5\" y=\"111.729\">Shipped<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"68.5762\" x=\"211.5\" y=\"203\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"58.5762\" x=\"216.5\" y=\"227.729\">Delivered<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"71.3184\" x=\"103.5\" y=\"203\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"61.3184\" x=\"108.5\" y=\"227.729\">Cancelled<\/text><ellipse cx=\"32\" cy=\"16\" fill=\"#222222\" rx=\"10\" ry=\"10\" style=\"stroke:#222222;stroke-width:1;\"/><ellipse cx=\"191\" cy=\"315\" fill=\"none\" rx=\"11\" ry=\"11\" style=\"stroke:#222222;stroke-width:1;\"/><ellipse cx=\"191\" cy=\"315\" fill=\"#222222\" rx=\"6\" ry=\"6\" style=\"stroke:#222222;stroke-width:1;\"/><g id=\"sb-order-link_*start*_N\"><path d=\"M32,26.19 C32,40.4 32,62.02 32,80.74 \" fill=\"none\" id=\"sb-order-*start*-to-N\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"32,86.74,36,77.74,32,81.74,28,77.74,32,86.74\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"sb-order-link_N_P\"><path d=\"M57.09,107 C74.14,107 90.61,107 107.7,107 \" fill=\"none\" id=\"sb-order-N-to-P\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"113.7,107,104.7,103,108.7,107,104.7,111,113.7,107\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"20.8301\" x=\"75.5\" y=\"100.625\">pay<\/text><\/g><g id=\"sb-order-link_P_S\"><path d=\"M164.24,107 C181.56,107 198.66,107 217.09,107 \" fill=\"none\" id=\"sb-order-P-to-S\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"223.09,107,214.09,103,218.09,107,214.09,111,223.09,107\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"23.6836\" x=\"182.25\" y=\"100.625\">ship<\/text><\/g><g id=\"sb-order-link_S_D\"><path d=\"M252.66,127.08 C251.18,148.12 249.2404,175.8047 247.7604,196.8747 \" fill=\"none\" id=\"sb-order-S-to-D\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"247.34,202.86,251.9608,194.1624,247.6903,197.8723,243.9805,193.6018,247.34,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"38.4141\" x=\"251\" y=\"169.625\">deliver<\/text><\/g><g id=\"sb-order-link_N_C\"><path d=\"M49.49,127.15 C61.41,140.14 77.58,157.68 92,173 C101.37,182.96 107.7393,189.6269 116.4493,198.6769 \" fill=\"none\" id=\"sb-order-N-to-C\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"120.61,203,117.2511,193.7416,117.1428,199.3974,111.487,199.2892,120.61,203\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"37.4414\" x=\"93\" y=\"169.625\">cancel<\/text><\/g><g id=\"sb-order-link_P_C\"><path d=\"M139,127.08 C139,148.12 139,175.79 139,196.86 \" fill=\"none\" id=\"sb-order-P-to-C\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"139,202.86,143,193.86,139,197.86,135,193.86,139,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"37.4414\" x=\"140\" y=\"169.625\">cancel<\/text><\/g><g id=\"sb-order-link_D_*end*\"><path d=\"M234.34,243.09 C222.61,262.28 208.167,285.8992 199.447,300.1792 \" fill=\"none\" id=\"sb-order-D-to-*end*\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"196.32,305.3,204.4243,299.7035,198.9258,301.0327,197.5966,295.5342,196.32,305.3\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"sb-order-link_C_*end*\"><path d=\"M150.03,243.09 C161,262.08 174.3703,285.2037 182.7003,299.6337 \" fill=\"none\" id=\"sb-order-C-to-*end*\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"185.7,304.83,184.6647,295.0357,183.2003,300.4997,177.7362,299.0353,185.7,304.83\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><\/g><\/svg><\/div>","parts":[{"l":"a)","q":"Give the test cases for all states coverage.","m":3,"a":"<p><b>2 tests:<\/b> T1 = pay, ship, deliver (New → Paid → Shipped → Delivered); T2 = cancel (New → Cancelled).<\/p>"},{"l":"b)","q":"Give the test cases for valid transitions coverage.","m":4,"a":"<p><b>3 tests.<\/b> Two final states with three arrows into them (deliver, cancel from New, cancel from Paid):<\/p><ul class=\"mlist\"><li>T1: pay, ship, deliver<\/li><li>T2: cancel<\/li><li>T3: pay, cancel<\/li><\/ul><p>Together they cover all 5 valid transitions.<\/p>"},{"l":"c)","q":"How many transitions are in the state table, and how many are invalid?","m":4,"a":"<p>5 states × 4 events = <b>20<\/b> cells. 5 valid, so <b>15 invalid<\/b>.<\/p>"},{"l":"d)","q":"Produce the state table.","m":4,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>State<\/th><th>pay<\/th><th>ship<\/th><th>deliver<\/th><th>cancel<\/th><\/tr><tr><td>New (start)<\/td><td>Paid<\/td><td>–<\/td><td>–<\/td><td>Cancelled<\/td><\/tr><tr><td>Paid<\/td><td>–<\/td><td>Shipped<\/td><td>–<\/td><td>Cancelled<\/td><\/tr><tr><td>Shipped<\/td><td>–<\/td><td>–<\/td><td>Delivered<\/td><td>–<\/td><\/tr><tr><td>Delivered (final)<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>Cancelled (final)<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>–<\/td><\/tr><\/table><\/div>"}],"marks":15},{"id":"B-ST-pinall","topic":"st","title":"PIN entry: tests for all three coverage criteria","src":"Lecture slides activity","scen":"<p>Three wrong PIN attempts block the account. A correct PIN on any of the three attempts grants access. States: S1 First try, S2 Second try, S3 Third try, S4 Access granted, S5 Account blocked.<\/p>","parts":[{"l":"1.","q":"Give the minimum tests for all states and for valid transitions coverage.","m":4,"a":"<p><b>All states: 2 tests:<\/b> T1 incorrect ×3 (S1→S2→S3→S5), T2 correct (S1→S4).<\/p><p><b>Valid transitions: 4 tests:<\/b> T1, T2, T3 incorrect, correct (S1→S2→S4), T4 incorrect ×2, correct (S1→S2→S3→S4).<\/p>"},{"l":"2.","q":"Which extra tests are needed for all transitions coverage, and why must each be a separate test?","m":4,"a":"<ul class=\"mlist\"><li>T5: correct, then correct (invalid attempt in S4)<\/li><li>T6: correct, then incorrect (S4)<\/li><li>T7: 3 × incorrect, then correct (invalid attempt in S5)<\/li><li>T8: 3 × incorrect, then incorrect (S5)<\/li><\/ul><p><b>8 tests in total.<\/b> Each invalid attempt goes in its own test to avoid fault masking.<\/p>"},{"l":"3.","q":"Give TWO (2) benefits and TWO (2) limitations of state transition testing.","m":2,"a":"<p>Benefits: fits behaviour that depends on the current state and past events; the diagram or table helps understanding; good for real-time systems and event order. Limitations: needs a finite number of states (large systems explode); all states must be defined; not for stateless systems.<\/p>"}],"marks":10},{"id":"B-WB-fact","topic":"wb","title":"Factorial program: statements, branches, McCabe, basis paths","src":"Lecture slides activity","scen":"<pre class=\"code\">1  read n\n2  if n &lt; 0:\n3      print \"Invalid\"\n4      n = -1\n5  else:\n6      f = 1\n7      for i = 1 to n:\n8          f = f * i\n9      print n, \"! =\", f\n10 return n<\/pre>","parts":[{"l":"1.","q":"How many executable statements are there? Which line is not executable?","m":2,"a":"<p><b>9<\/b> executable statements: lines 1, 2, 3, 4, 6, 7, 8, 9, 10. Line 5 (else) is not executable.<\/p>"},{"l":"2.","q":"Calculate statement coverage for T1 (n = −1), T2 (n = 1) and both together.","m":3,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Test<\/th><th>Lines executed<\/th><th>Statement coverage<\/th><\/tr><tr><td>T1 n = −1<\/td><td>1, 2, 3, 4, 10<\/td><td>5 of 9 = 56%<\/td><\/tr><tr><td>T2 n = 1<\/td><td>1, 2, 6, 7, 8, 9, 10<\/td><td>7 of 9 = 78%<\/td><\/tr><tr><td>T1 + T2<\/td><td>all<\/td><td>9 of 9 = 100%<\/td><\/tr><\/table><\/div>"},{"l":"3.","q":"Draw the control flow graph. How many branches are there, and what branch coverage do T1 and T2 achieve?","m":5,"a":"<div class=\"diag\"><svg role=\"img\" aria-label=\"Factorial control flow graph\" style=\"width:287px;max-width:100%;min-width:218px;height:auto\"\n viewBox=\"0.00 0.00 287.00 380.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"sb-fact-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(4 376)\">\n\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-4,4 -4,-376 283,-376 283,4 -4,4\"/>\n\n<g id=\"sb-fact-node1\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M167.5,-372C167.5,-372 75.5,-372 75.5,-372 69.5,-372 63.5,-366 63.5,-360 63.5,-360 63.5,-348 63.5,-348 63.5,-342 69.5,-336 75.5,-336 75.5,-336 167.5,-336 167.5,-336 173.5,-336 179.5,-342 179.5,-348 179.5,-348 179.5,-360 179.5,-360 179.5,-366 173.5,-372 167.5,-372\"/>\n<text text-anchor=\"middle\" x=\"121.5\" y=\"-350.9\" font-family=\"Arial\" font-size=\"12.00\">1&#45;2 &#160;read n; n &lt; 0 ?<\/text>\n<\/g>\n\n<g id=\"sb-fact-node2\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M125,-243C125,-243 12,-243 12,-243 6,-243 0,-237 0,-231 0,-231 0,-219 0,-219 0,-213 6,-207 12,-207 12,-207 125,-207 125,-207 131,-207 137,-213 137,-219 137,-219 137,-231 137,-231 137,-237 131,-243 125,-243\"/>\n<text text-anchor=\"middle\" x=\"68.5\" y=\"-221.9\" font-family=\"Arial\" font-size=\"12.00\">3&#45;4 &#160;print Invalid; n = &#45;1<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge1\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M107.55,-335.7C104.28,-331.1 101.01,-326.02 98.5,-321 86.97,-298 78.72,-269.66 73.82,-249.95\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"76.19,-249.33 72.16,-243.1 71.43,-250.48 76.19,-249.33\"/>\n<text text-anchor=\"middle\" x=\"117\" y=\"-312.2\" font-family=\"Arial\" font-size=\"11.00\"> e1 true<\/text>\n<\/g>\n\n<g id=\"sb-fact-node3\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M186.5,-294C186.5,-294 156.5,-294 156.5,-294 150.5,-294 144.5,-288 144.5,-282 144.5,-282 144.5,-270 144.5,-270 144.5,-264 150.5,-258 156.5,-258 156.5,-258 186.5,-258 186.5,-258 192.5,-258 198.5,-264 198.5,-270 198.5,-270 198.5,-282 198.5,-282 198.5,-288 192.5,-294 186.5,-294\"/>\n<text text-anchor=\"middle\" x=\"171.5\" y=\"-272.9\" font-family=\"Arial\" font-size=\"12.00\">6 &#160;f = 1<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge2\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M132.85,-335.75C139.75,-325.26 148.66,-311.72 156.18,-300.28\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"158.4,-301.37 160.2,-294.18 154.3,-298.68 158.4,-301.37\"/>\n<text text-anchor=\"middle\" x=\"170\" y=\"-312.2\" font-family=\"Arial\" font-size=\"11.00\"> e2 false<\/text>\n<\/g>\n\n<g id=\"sb-fact-node7\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M113,-36C113,-36 60,-36 60,-36 54,-36 48,-30 48,-24 48,-24 48,-12 48,-12 48,-6 54,0 60,0 60,0 113,0 113,0 119,0 125,-6 125,-12 125,-12 125,-24 125,-24 125,-30 119,-36 113,-36\"/>\n<text text-anchor=\"middle\" x=\"86.5\" y=\"-14.9\" font-family=\"Arial\" font-size=\"12.00\">10 &#160;return n<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge3\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M70,-206.87C73.2,-170.47 80.68,-85.3 84.37,-43.3\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"86.82,-43.41 84.99,-36.22 81.93,-42.98 86.82,-43.41\"/>\n<text text-anchor=\"middle\" x=\"85.5\" y=\"-132.2\" font-family=\"Arial\" font-size=\"11.00\"> e3<\/text>\n<\/g>\n\n<g id=\"sb-fact-node4\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M209.5,-192C209.5,-192 165.5,-192 165.5,-192 159.5,-192 153.5,-186 153.5,-180 153.5,-180 153.5,-168 153.5,-168 153.5,-162 159.5,-156 165.5,-156 165.5,-156 209.5,-156 209.5,-156 215.5,-156 221.5,-162 221.5,-168 221.5,-168 221.5,-180 221.5,-180 221.5,-186 215.5,-192 209.5,-192\"/>\n<text text-anchor=\"middle\" x=\"187.5\" y=\"-170.9\" font-family=\"Arial\" font-size=\"12.00\">7 &#160;i &lt;= n ?<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge4\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M174.29,-257.58C176.86,-241.52 180.7,-217.52 183.58,-199.52\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"186.06,-199.52 184.74,-192.22 181.22,-198.74 186.06,-199.52\"/>\n<text text-anchor=\"middle\" x=\"189.5\" y=\"-222.2\" font-family=\"Arial\" font-size=\"11.00\"> e4<\/text>\n<\/g>\n\n<g id=\"sb-fact-node5\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M164.5,-114C164.5,-114 126.5,-114 126.5,-114 120.5,-114 114.5,-108 114.5,-102 114.5,-102 114.5,-90 114.5,-90 114.5,-84 120.5,-78 126.5,-78 126.5,-78 164.5,-78 164.5,-78 170.5,-78 176.5,-84 176.5,-90 176.5,-90 176.5,-102 176.5,-102 176.5,-108 170.5,-114 164.5,-114\"/>\n<text text-anchor=\"middle\" x=\"145.5\" y=\"-92.9\" font-family=\"Arial\" font-size=\"12.00\">8 &#160;f = f * i<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge5\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M153.13,-167.85C137.03,-163.53 119.28,-155.59 109.5,-141 104.59,-133.68 107.48,-126.12 113.33,-119.37\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"115.09,-121.08 118.3,-114.39 111.62,-117.62 115.09,-121.08\"/>\n<text text-anchor=\"middle\" x=\"128\" y=\"-132.2\" font-family=\"Arial\" font-size=\"11.00\"> e5 true<\/text>\n<\/g>\n\n<g id=\"sb-fact-node6\" class=\"node\">\n\n<path fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" d=\"M267,-114C267,-114 226,-114 226,-114 220,-114 214,-108 214,-102 214,-102 214,-90 214,-90 214,-84 220,-78 226,-78 226,-78 267,-78 267,-78 273,-78 279,-84 279,-90 279,-90 279,-102 279,-102 279,-108 273,-114 267,-114\"/>\n<text text-anchor=\"middle\" x=\"246.5\" y=\"-92.9\" font-family=\"Arial\" font-size=\"12.00\">9 &#160;print n!<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge7\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M200.89,-155.75C209.11,-145.16 219.74,-131.47 228.67,-119.96\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"230.81,-121.21 233.16,-114.18 226.94,-118.2 230.81,-121.21\"/>\n<text text-anchor=\"middle\" x=\"241\" y=\"-132.2\" font-family=\"Arial\" font-size=\"11.00\"> e7 false<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge6\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M154.99,-114.18C160.73,-124.56 168.13,-137.95 174.42,-149.32\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"172.44,-150.81 177.97,-155.75 176.73,-148.44 172.44,-150.81\"/>\n<text text-anchor=\"middle\" x=\"176.5\" y=\"-132.2\" font-family=\"Arial\" font-size=\"11.00\"> e6<\/text>\n<\/g>\n\n<g id=\"sb-fact-edge8\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M213.74,-79.44C189.29,-67.83 155.69,-51.86 129.15,-39.26\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"129.94,-36.92 122.56,-36.13 127.84,-41.35 129.94,-36.92\"/>\n<text text-anchor=\"middle\" x=\"183.5\" y=\"-54.2\" font-family=\"Arial\" font-size=\"11.00\"> e8<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div><p>A branch is any transfer of control between nodes, <b>conditional or unconditional<\/b>, so there are <b>8 branches<\/b> (e1–e8).<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th>Test<\/th><th>Branches<\/th><th>Branch coverage<\/th><\/tr><tr><td>T1 n = −1<\/td><td>e1, e3<\/td><td>2 of 8 = 25%<\/td><\/tr><tr><td>T2 n = 1<\/td><td>e2, e4, e5, e6, e7, e8<\/td><td>6 of 8 = 75%<\/td><\/tr><tr><td>T1 + T2<\/td><td>all 8<\/td><td>100%<\/td><\/tr><\/table><\/div>"},{"l":"4.","q":"Calculate the cyclomatic complexity.","m":2,"a":"<p>C = E − N + 2 = 8 − 7 + 2 = <b>3<\/b>. Check: 1 + 2 decisions (if, for) = 3.<\/p>"},{"l":"5.","q":"Derive the basis paths and basis tests.","m":3,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Path<\/th><th>Nodes (lines)<\/th><th>Input<\/th><th>Expected<\/th><\/tr><tr><td>P1<\/td><td>1-2, 3-4, 10<\/td><td>n = −1<\/td><td>Invalid: −1<\/td><\/tr><tr><td>P2<\/td><td>1-2, 6, 7, 9, 10<\/td><td>n = 0<\/td><td>0! = 1<\/td><\/tr><tr><td>P3<\/td><td>1-2, 6, 7, 8, 7, 9, 10<\/td><td>n = 1<\/td><td>1! = 1<\/td><\/tr><\/table><\/div><p>Basis tests include n = 0 (loop skipped); branch coverage alone needs only n = −1 and n = 1.<\/p>"}],"marks":15},{"id":"B-WB-score","topic":"wb","title":"Grade program: coverage and complexity (lecturer's activity)","src":"Lecture slides activity","scen":"<pre class=\"code\">1 read score\n2 grade = \"Fail\"\n3 if score &gt;= 50:\n4     grade = \"Pass\"\n5 if score &gt;= 80:\n6     print \"Distinction\"\n7 print grade<\/pre>","parts":[{"l":"a)","q":"What is the minimum number of tests for 100% statement coverage?","m":2,"a":"<p><b>1 test:<\/b> score = 90 executes every line.<\/p>"},{"l":"b)","q":"What is the minimum number of tests for 100% branch coverage?","m":3,"a":"<p><b>2 tests:<\/b> score = 90 takes both True outcomes; score = 30 takes both False outcomes.<\/p>"},{"l":"c)","q":"What is the cyclomatic complexity?","m":2,"a":"<p>2 decisions + 1 = <b>3<\/b>.<\/p>"},{"l":"d)","q":"Using BVA, which extra scores would you test, and why?","m":3,"a":"<p>49, 50 and 79, 80: the boundaries of the two decisions. A defect such as &gt; instead of &gt;= is only caught at the boundary value.<\/p>"}],"marks":10},{"id":"B-EP-each","topic":"ep","title":"Next date: each choice vs all combinations","src":"Lecture slides activity","scen":"<p>Input: month (1 to 12), day (1 to 31), year (1812 to 2025). Output: the next date, or \"invalid input date\".<\/p>","parts":[{"l":"1.","q":"Identify suitable equivalence partitions for month, day and year.","m":6,"a":"<ul class=\"mlist\"><li>Month: M1 30-day months · M2 31-day months · M3 February<\/li><li>Day: D1 1–28 · D2 29 · D3 30 · D4 31<\/li><li>Year: Y1 1900 (century, not leap) · Y2 other leap years · Y3 non-leap years<\/li><\/ul>"},{"l":"2.","q":"How many tests are needed for each choice coverage and for all combinations coverage?","m":4,"a":"<p><b>Each choice (weak equivalence class testing): 4<\/b> = the largest set (Day). <b>All combinations (strong): 3 × 4 × 3 = 36.<\/b><\/p><p>CTFL v4.0 defines only each choice coverage; all combinations is a course extension.<\/p>"},{"l":"3.","q":"Give a set of each-choice test cases with expected results.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Test<\/th><th>Month<\/th><th>Day<\/th><th>Year<\/th><th>Expected<\/th><\/tr><tr><td>WECT1<\/td><td>6<\/td><td>14<\/td><td>1900<\/td><td>6/15/1900<\/td><\/tr><tr><td>WECT2<\/td><td>7<\/td><td>29<\/td><td>1912<\/td><td>7/30/1912<\/td><\/tr><tr><td>WECT3<\/td><td>2<\/td><td>30<\/td><td>1913<\/td><td>Invalid date<\/td><\/tr><tr><td>WECT4<\/td><td>6<\/td><td>31<\/td><td>1900<\/td><td>Invalid date<\/td><\/tr><\/table><\/div>"}],"marks":15},{"id":"B-EP-exam","topic":"ep","title":"Exam pass mark and temperature switch (lecturer's activity)","src":"Lecture slides activity","scen":"<p>Problem 1: to pass an examination a candidate must score at least 24 marks. The maximum possible score is 40.<\/p><p>Problem 2: a switch turns off when the temperature falls below 18 and turns on when the temperature is above 21. Between 18 and 21 nothing changes.<\/p>","parts":[{"l":"1.","q":"Problem 1: identify the partitions and the 2-value and 3-value BVA test values.","m":5,"a":"<p>Whole marks assumed. Partitions: invalid &lt; 0 · fail 0–23 · pass 24–40 · invalid &gt; 40.<\/p><p>2-value: <b>−1, 0, 23, 24, 40, 41<\/b>. 3-value: <b>−1, 0, 1, 22, 23, 24, 25, 39, 40, 41<\/b>.<\/p>"},{"l":"2.","q":"Problem 2: identify the partitions and the 2-value and 3-value BVA test values. State your assumption.","m":5,"a":"<p>Whole degrees assumed (state the precision; with 0.1° the neighbours become 17.9 / 18.0 etc.). Partitions: off ≤ 17 · no change 18–21 · on ≥ 22.<\/p><p>2-value: <b>17, 18, 21, 22<\/b>. 3-value: <b>16, 17, 18, 19, 20, 21, 22, 23<\/b>.<\/p>"},{"l":"3.","q":"Explain why EP alone can miss a defect, using an example.","m":3,"a":"<p>Spec: F1 when x ≤ 0, else F2. The code wrongly uses x &lt; 0. Values from inside the partitions (−3, 6) both pass; only the boundary x = 0 fails (gets F2). BVA targets the edges where developers make mistakes.<\/p>"},{"l":"4.","q":"Give TWO (2) limitations of EP and BVA.","m":2,"a":"<p>Any two: each parameter is handled separately, so interactions are hard to see; defining all relevant boundaries can be difficult; good data needs creativity; often applied carelessly because it seems simple.<\/p>"}],"marks":15},{"id":"B-EP-twoparam","topic":"ep","title":"Two parameters with 3-value BVA","src":"Lecture slides activity","scen":"<p>Function findPrice(code, qty): the item code must be 99 to 999 and the quantity 1 to 100.<\/p>","parts":[{"l":"1.","q":"List the 3-value BVA coverage items for each parameter.","m":4,"a":"<p>code: <b>98, 99, 100, 998, 999, 1000<\/b>. qty: <b>0, 1, 2, 99, 100, 101<\/b>. 12 coverage items.<\/p>"},{"l":"2.","q":"Give a minimum set of tests that covers all coverage items.","m":4,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Test<\/th><th>code<\/th><th>qty<\/th><\/tr><tr><td>t1<\/td><td>98<\/td><td>0<\/td><\/tr><tr><td>t2<\/td><td>99<\/td><td>1<\/td><\/tr><tr><td>t3<\/td><td>100<\/td><td>2<\/td><\/tr><tr><td>t4<\/td><td>998<\/td><td>99<\/td><\/tr><tr><td>t5<\/td><td>999<\/td><td>100<\/td><\/tr><tr><td>t6<\/td><td>1000<\/td><td>101<\/td><\/tr><\/table><\/div><p>6 tests: each test pairs one boundary region of code with one of qty.<\/p>"},{"l":"3.","q":"What is the risk in t1 and t6, and how would you fix it?","m":2,"a":"<p>They contain two invalid values at once, so one invalid value can <b>mask<\/b> the other. Split them: (98, 50), (500, 0), (1000, 50), (500, 101).<\/p>"}],"marks":10},{"id":"B-RV-req12","topic":"review","title":"REQ-12 password reset review (lecturer's activity)","src":"Lecture slides activity","scen":"<p>Review REQ-12 using a checklist of typical requirement defects: ambiguity, omission, contradiction, inaccuracy, redundancy.<\/p><ol class=\"mlist\"><li>The system shall allow a registered user to reset their password quickly.<\/li><li>A reset link shall be emailed to the user and remain valid for a reasonable time.<\/li><li>The new password must contain at least 6 characters.<\/li><li>Passwords shall contain at least 8 characters, including one symbol.<\/li><li>If the email address is not found, the system shall display \"Email not registered\".<\/li><li>The reset link can be used any number of times.<\/li><\/ol>","parts":[{"l":"1.","q":"Identify the defects, label each with its type, and suggest a fix.","m":8,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Line<\/th><th>Defect type<\/th><th>Explanation and fix<\/th><\/tr><tr><td>1<\/td><td>Ambiguity<\/td><td>\"Quickly\" is not measurable. State a limit, e.g. within 30 seconds.<\/td><\/tr><tr><td>2<\/td><td>Omission / ambiguity<\/td><td>\"Reasonable time\" is undefined, and behaviour for an expired link is missing.<\/td><\/tr><tr><td>3 and 4<\/td><td>Contradiction<\/td><td>Minimum length is 6 in one line and 8 in another; the symbol rule is missing from line 3.<\/td><\/tr><tr><td>5<\/td><td>Security weakness<\/td><td>Reveals which emails are registered (account enumeration). Use a neutral message.<\/td><\/tr><tr><td>6<\/td><td>Security weakness<\/td><td>A reset link should be single-use and expire after use.<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"What review decision would you make? Name the three possible decisions.","m":2,"a":"<p><b>Major changes needed.<\/b> Possible decisions: reject · major changes needed · accept (possibly with minor changes).<\/p>"}],"marks":10},{"id":"B-EX-atddlib","topic":"exp","title":"ATDD: library book renewal (lecturer's activity)","src":"Lecture slides activity","scen":"<p>User story: As a library member, I want to renew a borrowed book online, so that I avoid late fees.<\/p><p>Rules agreed in conversation: a loan can be renewed at most 2 times, 14 days each; a book reserved by another member cannot be renewed.<\/p>","parts":[{"l":"1.","q":"Write THREE (3) acceptance criteria in Given / When / Then format.","m":6,"a":"<ul class=\"mlist\"><li><b>AC1:<\/b> Given a loan with no renewals and no reservation, When the member renews, Then the due date moves 14 days.<\/li><li><b>AC2:<\/b> Given a loan already renewed twice, When the member renews, Then renewal is refused with a message.<\/li><li><b>AC3:<\/b> Given a book reserved by another member, When the member renews, Then renewal is refused.<\/li><\/ul>"},{"l":"2.","q":"Derive FIVE (5) test cases: positive, negative and non-functional, using BVA for at least one.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>#<\/th><th>Type<\/th><th>Test case<\/th><\/tr><tr><td>1<\/td><td>Positive<\/td><td>First renewal: due date + 14 days<\/td><\/tr><tr><td>2<\/td><td>Positive<\/td><td>Second renewal (count 1 → 2): accepted<\/td><\/tr><tr><td>3<\/td><td>Negative<\/td><td>Third renewal (count 3, above the limit of 2): refused (BVA)<\/td><\/tr><tr><td>4<\/td><td>Negative<\/td><td>Reserved book: renewal refused<\/td><\/tr><tr><td>5<\/td><td>Non-functional<\/td><td>Renewal confirmation appears within 3 seconds<\/td><\/tr><\/table><\/div><p>Order: positive first, then negative, then non-functional.<\/p>"},{"l":"3.","q":"Describe the ATDD process steps.","m":3,"a":"<ol class=\"mlist\"><li>Specification workshop: analyse the story and acceptance criteria, resolve ambiguities.<\/li><li>Create test cases from the criteria (examples of how the software works), in natural language.<\/li><li>Developers implement the feature and automate the tests.<\/li><li>Run the tests: they become executable requirements.<\/li><\/ol>"}],"marks":15},{"id":"B-EX-exploring","topic":"exp","title":"Exploratory, checklist-based and error guessing (slides)","src":"Lecture slides (course extension)","scen":"","parts":[{"l":"1.","q":"Name and explain the FOUR (4) parts of session-based exploratory testing.","m":4,"a":"<ul class=\"mlist\"><li><b>Test charter:<\/b> objectives for the session.<\/li><li><b>Time-boxed session:<\/b> design, run and learn together.<\/li><li><b>Session sheet:<\/b> steps followed, discoveries, questions, ideas for next session.<\/li><li><b>Debriefing:<\/b> discuss results with stakeholders.<\/li><\/ul>"},{"l":"2.","q":"What makes a good checklist item, and what should NOT be in a checklist?","m":3,"a":"<p>Good: phrased as a question that can be checked separately and directly; built from experience and why software fails; updated from defect analysis but kept short.<\/p><p>Avoid: items a tool can check automatically, items better used as entry/exit criteria, and items that are too general.<\/p>"},{"l":"3.","q":"Give FOUR (4) error-guessing areas with an example defect each.","m":4,"a":"<ul class=\"mlist\"><li>Input: valid input not accepted<\/li><li>Output: wrong format<\/li><li>Logic: missing case or wrong operator<\/li><li>Computation: wrong operand<\/li><li>Interfaces: parameter mismatch<\/li><li>Data: incorrect initialisation<\/li><\/ul>"},{"l":"4.","q":"Give TWO (2) advantages and TWO (2) limitations of experience-based techniques.","m":4,"a":"<p>Advantages: effective at finding defects; resists the pesticide paradox; lightweight records; a good check on prepared tests. Limitations: gappy coverage under pressure; hard to estimate; no defect prevention; depends on skilled testers.<\/p>"}],"marks":15},{"id":"B-WB-levels","topic":"wb","title":"Code coverage levels and McCabe bands (course extension)","src":"Lecture slides (course extension)","scen":"","parts":[{"l":"1.","q":"List the code coverage levels from weakest to strongest and explain each.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Level<\/th><th>Requirement<\/th><\/tr><tr><td>Statement<\/td><td>Every executable statement executed (weakest)<\/td><\/tr><tr><td>Branch (decision)<\/td><td>Every branch / decision outcome taken; subsumes statement<\/td><\/tr><tr><td>Condition<\/td><td>Each atomic condition evaluates true and false<\/td><\/tr><tr><td>Multiple condition<\/td><td>Every combination of condition outcomes (2ⁿ)<\/td><\/tr><tr><td>MC/DC<\/td><td>Each condition shown to independently affect the decision; safety-critical<\/td><\/tr><tr><td>Loop<\/td><td>Loops executed zero, once and many times<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"What does cyclomatic complexity tell you, and what are the commonly cited bands?","m":3,"a":"<p>The number of linearly independent paths (basis paths); an upper bound on the tests needed for branch coverage; complex modules tend to be buggy and regression-prone. Bands: <b>1–10 simple, 11–20 moderate, above 20 high risk.<\/b> Rule of thumb: start at 1, add 1 for each if, for, while, do-while and case; else is not counted.<\/p>"}],"marks":9},{"id":"B-C1-jobroles","topic":"ch1","title":"Describe the FOUR (4) typical job roles in a test team.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Describe the FOUR (4) typical job roles in a test team.","m":4,"a":"<ul class=\"mlist\"><li><b>Test manager:<\/b> owns the test plan and strategy, monitors progress, manages team, budget and stakeholders.<\/li><li><b>Tester / test analyst:<\/b> analyses the test basis, designs and executes test cases, reports defects.<\/li><li><b>Technical test analyst:<\/b> designs technical tests (performance, security, structural); needs architecture knowledge.<\/li><li><b>Test automation engineer:<\/b> builds and maintains automation frameworks and CI/CD regression suites.<\/li><\/ul><p>ISTQB defines two generic roles: test management and testing. One person may cover several roles.<\/p>"}],"marks":4},{"id":"B-C1-mindset","topic":"ch1","title":"Compare the tester mindset with the developer mindset, and explain confirmation bias.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Compare the tester mindset with the developer mindset, and explain confirmation bias.","m":4,"a":"<p>Tester: curious and questioning, professional pessimism, attention to detail; asks \"how could this fail?\". Developer: designs and builds solutions, focuses on making it work; asks \"how do I build this?\".<\/p><p><b>Confirmation bias:<\/b> we look for evidence that supports what we already believe, so authors miss their own defects. Defects can feel like criticism, so report facts neutrally, focusing on the product, not the person.<\/p>"}],"marks":4},{"id":"B-C1-testcase","topic":"ch1","title":"What does a test case contain? What is a test oracle?","src":"Lecture slides","scen":"","parts":[{"l":"","q":"What does a test case contain? What is a test oracle?","m":4,"a":"<p>A test case has input values, expected results, preconditions under which it must run, and postconditions that must be met after it runs. If expected and actual results differ, check whether the defect is in the test object, the expected result, the test case or the specification.<\/p><p>A <b>test oracle<\/b> determines the expected (target) values for each test case before it is run.<\/p>"}],"marks":4},{"id":"B-C1-skills","topic":"ch1","title":"Give the FOUR (4) groups of generic skills required for testing, with an example of each.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Give the FOUR (4) groups of generic skills required for testing, with an example of each.","m":4,"a":"<ul class=\"mlist\"><li><b>Testing knowledge:<\/b> techniques, levels and types, risk-based prioritisation.<\/li><li><b>Domain / business knowledge:<\/b> judging what \"correct\" looks like to a user.<\/li><li><b>Technical knowledge:<\/b> architecture, databases, APIs, automation and CI/CD, enough coding to script tests.<\/li><li><b>Soft skills:<\/b> communication, critical and analytical thinking, creativity, teamwork.<\/li><\/ul>"}],"marks":4},{"id":"B-C1-chain","topic":"ch1","title":"Using the discount example, illustrate error, defect and failure, and say which activit…","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Using the discount example, illustrate error, defect and failure, and say which activity targets each.","m":4,"a":"<p><b>Error:<\/b> the developer misreads the discount rule. <b>Defect:<\/b> the wrong formula is coded. <b>Failure:<\/b> the customer is overcharged when it runs.<\/p><p>Her diagram: errors are prevented by <b>standards and education<\/b>; defects are found by <b>static testing<\/b> and removed by <b>debugging and root cause analysis<\/b>; failures are revealed by <b>dynamic testing<\/b>.<\/p>"}],"marks":4},{"id":"B-C2-vbasis","topic":"ch2","title":"In the V-model, state the primary test basis for each test level.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"In the V-model, state the primary test basis for each test level.","m":4,"a":"<ul class=\"mlist\"><li>Acceptance testing ← requirement specification<\/li><li>System testing ← requirements + high-level design<\/li><li>Integration testing ← high-level + detailed design<\/li><li>Component testing ← detailed design + code<\/li><\/ul>"}],"marks":4},{"id":"B-C2-seqiter","topic":"ch2","title":"Compare the typical flaws of sequential (V) and iterative/incremental models.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Compare the typical flaws of sequential (V) and iterative/incremental models.","m":4,"a":"<p>Sequential: schedule- and budget-risk driven and hard to plan that far ahead; when the plan slips, system and acceptance testing at the end get squeezed.<\/p><p>Iterative: testing of the final increment can be rushed; overlapping increments make fixing earlier bugs harder; every increment changes code, so regression risk climbs quickly. Examples: Spiral, RAD, Rational Unified Process; Agile: Scrum, Kanban, XP.<\/p>"}],"marks":4},{"id":"B-C2-ftypes","topic":"ch2","title":"Name the FIVE (5) kinds of functional failure, using a calculator as the example.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Name the FIVE (5) kinds of functional failure, using a calculator as the example.","m":5,"a":"<ul class=\"mlist\"><li><b>Missing function:<\/b> no ADD function at all<\/li><li><b>Inaccessible function:<\/b> ADD exists but the \"+\" key does not respond<\/li><li><b>Impaired function:<\/b> can only add integers, not real numbers<\/li><li><b>Wrong result:<\/b> 2 + 2 = 5<\/li><li><b>Undesirable side-effect:<\/b> 2 / 2 shows \"I\" instead of \"1\"<\/li><\/ul>"}],"marks":5},{"id":"B-C2-4types","topic":"ch2","title":"Name the FOUR (4) test types and say at which test levels they occur.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Name the FOUR (4) test types and say at which test levels they occur.","m":4,"a":"<p><b>Functional<\/b> (what it should do), <b>non-functional<\/b> (how well), <b>white-box<\/b> (how it is built: code-, data-structure- or design-based), and <b>change-related<\/b> (confirmation and regression). All four can, and should, occur at every test level.<\/p>"}],"marks":4},{"id":"B-C2-regstrat","topic":"ch2","title":"Describe FOUR (4) regression strategies after a change.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Describe FOUR (4) regression strategies after a change.","m":4,"a":"<ol class=\"mlist\"><li><b>Repeat all tests:<\/b> best when automated; covers the most ground.<\/li><li><b>Repeat some tests:<\/b> select via traceability, impact or risk analysis.<\/li><li><b>Release more slowly:<\/b> bigger, less frequent releases allow fuller regression.<\/li><li><b>Involve users:<\/b> beta or pilot testing builds confidence before full release.<\/li><\/ol><p>Maintenance testing must cover the change itself and the unchanged parts that should keep working.<\/p>"}],"marks":4},{"id":"B-C3-typescmp","topic":"ch3","title":"Compare the four review types by leader, individual preparation, scribe and outputs.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Compare the four review types by leader, individual preparation, scribe and outputs.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>Informal<\/th><th>Walkthrough<\/th><th>Technical review<\/th><th>Inspection<\/th><\/tr><tr><td>Led by<\/td><td>No defined lead<\/td><td>The author<\/td><td>Trained facilitator (not author)<\/td><td>Trained facilitator (not author)<\/td><\/tr><tr><td>Preparation<\/td><td>Not required<\/td><td>Optional<\/td><td>Required<\/td><td>Required<\/td><\/tr><tr><td>Meeting<\/td><td>May not be held<\/td><td>Yes, typically<\/td><td>Optional<\/td><td>Yes, formal<\/td><\/tr><tr><td>Scribe<\/td><td>Not required<\/td><td>Mandatory<\/td><td>Mandatory (ideally not author)<\/td><td>Mandatory (not author)<\/td><\/tr><tr><td>Output<\/td><td>Optional<\/td><td>Logs / reports may be produced<\/td><td>Logs / reports typically produced<\/td><td>Log, report and metrics<\/td><\/tr><\/table><\/div>"}],"marks":6},{"id":"B-C3-techniques","topic":"ch3","title":"Describe FIVE (5) review techniques used during individual review.","src":"Lecture slides (course extension)","scen":"","parts":[{"l":"","q":"Describe FIVE (5) review techniques used during individual review.","m":5,"a":"<ul class=\"mlist\"><li><b>Ad hoc:<\/b> little guidance; depends on reviewer skill; many duplicate issues.<\/li><li><b>Checklist-based:<\/b> questions drawn from past defects; systematic, but look beyond the list.<\/li><li><b>Scenarios and dry runs:<\/b> guided by expected usage (e.g. use cases).<\/li><li><b>Role-based:<\/b> evaluate from a stakeholder role (new user, admin, performance tester).<\/li><li><b>Perspective-based:<\/b> take stakeholder viewpoints and often produce a derived work product; highly effective for requirements.<\/li><\/ul>"}],"marks":5},{"id":"B-C3-reqdefects","topic":"ch3","title":"Name FIVE (5) types of requirement defect a review checklist looks for, and other defec…","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Name FIVE (5) types of requirement defect a review checklist looks for, and other defects static testing finds easily.","m":5,"a":"<p>Requirement defects: <b>ambiguity, omission, contradiction, inaccuracy, redundancy<\/b> (and inconsistency). Others: design defects (inefficient algorithms, high coupling, low cohesion), coding defects (undefined or unused variables, unreachable or duplicate code), deviations from standards, incorrect interface specs (different units), security vulnerabilities (buffer overflow), traceability gaps, maintainability defects.<\/p>"}],"marks":5},{"id":"B-C3-success2","topic":"ch3","title":"Give TWO (2) organisational and TWO (2) people-related review success factors.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Give TWO (2) organisational and TWO (2) people-related review success factors.","m":4,"a":"<p>Organisational: clear objectives used as exit criteria; suitable review type; up-to-date checklists; small chunks; time to prepare; management support.<\/p><p>People: the right people (testers valued); adequate time and attention; defects handled objectively; well-managed meetings; trust (outcomes not used to evaluate people); training and a learning culture.<\/p>"}],"marks":4},{"id":"B-C3-formality","topic":"ch3","title":"What determines a review's formality, and what can a review focus on?","src":"Lecture slides","scen":"","parts":[{"l":"","q":"What determines a review's formality, and what can a review focus on?","m":3,"a":"<p>Formality depends on the SDLC model, process maturity, complexity of the work product, legal or regulatory needs, and the need for an audit trail. Focus depends on objectives: finding defects, gaining understanding, educating participants, reaching consensus.<\/p>"}],"marks":3},{"id":"B-C3-tools","topic":"ch3","title":"What do static analysis tools check? Give FOUR (4) examples.","src":"Lecture slides","scen":"","parts":[{"l":"","q":"What do static analysis tools check? Give FOUR (4) examples.","m":4,"a":"<p>Coding standards (linters); dangerous constructs (undefined or unused variables, unreachable or duplicate code, buffer overflow risks); code measurement (complexity, maintainability); document checks (spelling, wording); models and simulations; compilers (syntax). They are often built into IDEs and CI/CD pipelines for fast feedback.<\/p>"}],"marks":4},{"id":"B-C4-choose","topic":"exp","title":"What factors influence the choice of test techniques? Give one from each group.","src":"Lecture slides (course extension)","scen":"","parts":[{"l":"","q":"What factors influence the choice of test techniques? Give one from each group.","m":4,"a":"<ul class=\"mlist\"><li><b>Product:<\/b> type of system, complexity, expected use, defects expected<\/li><li><b>Project and compliance:<\/b> time and budget, SDLC model, tools, regulatory/contract requirements<\/li><li><b>Risk and objectives:<\/b> risk levels and types, test objectives<\/li><li><b>People and information:<\/b> documentation available, tester knowledge and skills, experience with the technique<\/li><\/ul><p>No single technique is best; combine them.<\/p>"}],"marks":4},{"id":"B-C4-compare","topic":"exp","title":"Compare black-box, white-box and experience-based techniques: basis, when they can star…","src":"Lecture slides","scen":"","parts":[{"l":"","q":"Compare black-box, white-box and experience-based techniques: basis, when they can start, coverage, strength and limitation.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>Black-box<\/th><th>White-box<\/th><th>Experience-based<\/th><\/tr><tr><td>Derived from<\/td><td>Requirements, specifications<\/td><td>Code, design, architecture<\/td><td>Tester skill, intuition, defect history<\/td><\/tr><tr><td>Can start<\/td><td>Once a spec exists<\/td><td>After design or implementation<\/td><td>Any time, often during execution<\/td><\/tr><tr><td>Coverage by<\/td><td>Partitions, rules, transitions<\/td><td>Statements, branches<\/td><td>No formal measure<\/td><\/tr><tr><td>Strength<\/td><td>Independent of implementation; finds omissions<\/td><td>Whole implementation; objective coverage<\/td><td>Finds defects others miss<\/td><\/tr><tr><td>Limitation<\/td><td>May leave code unexecuted<\/td><td>Misses defects of omission<\/td><td>Depends on skill; hard to repeat<\/td><\/tr><\/table><\/div>"}],"marks":6}]}</script>
<script>
"use strict";
/* ================= data ================= */
const Q = JSON.parse(document.getElementById("qdata").textContent);
const BYID = Object.create(null); Q.forEach(q => BYID[q.id] = q);
const CH = {1: "Fundamentals of Testing", 2: "Testing Throughout the SDLC", 3: "Static Testing", 4: "Test Analysis and Design"};
const PER_CH = 5, PER_PAGE = 20, LETTERS = "ABCDEFGH";
const POOL = {1: [], 2: [], 3: [], 4: []}; Q.forEach(q => POOL[q.chapter].push(q.id));

/* ================= storage (all wrapped) ================= */
const KS = "swe3043.ctfl.stats.v1", KM = "swe3043.ctfl.marathon.v1", KP = "swe3043.ctfl.prefs.v1";
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
function blankStats() { return {seen: {}, q: {}, ch: {1: {c: 0, a: 0}, 2: {c: 0, a: 0}, 3: {c: 0, a: 0}, 4: {c: 0, a: 0}}}; }
let STATS = load(KS, null) || blankStats();
if (!STATS.seen || !STATS.q || !STATS.ch) STATS = blankStats();
let PREFS = Object.assign({mode: "practice", chapters: [1, 2, 3, 4], shuffle: true, weak: false, subjKind: "exam", subjCh: "1", subjTopic: "all", subjCount: "2", subjWeak: false, sbTopic: "all", sbCount: "2", sbWeak: false}, load(KP, {}));
if (!["practice", "marathon", "mock", "secb", "subjective"].includes(PREFS.mode)) PREFS.mode = "practice";

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(c, a) { return a ? Math.round(100 * c / a) : 0; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800); }
function chList(chs) { return "Ch " + chs.slice().sort().join(", "); }

/* ================= paper construction ================= */
function optPerm(q) { const idx = q.options.map((_, i) => i); return q.lockOrder ? idx : shuffle(idx); }

function weakWeight(id) {
  const s = STATS.q[id]; if (!s || !s.w) return 0;
  return s.w * 2 + (s.last === 0 ? 3 : 0) + Math.max(0, s.w - (s.a - s.w)) ;
}
function weightedPick(ids, n, wf) {
  const pool = ids.map(id => ({id, w: wf(id)})).filter(x => x.w > 0), out = [];
  while (out.length < n && pool.length) {
    const tot = pool.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot, k = 0;
    while (k < pool.length - 1 && (r -= pool[k].w) > 0) k++;
    out.push(pool[k].id); pool.splice(k, 1);
  }
  return out;
}
function drawChapter(ch, weak) {
  const ids = POOL[ch]; let picked = [];
  if (weak) picked = weightedPick(ids, PER_CH, weakWeight);
  const rest = ids.filter(id => !picked.includes(id));
  const unseen = shuffle(rest.filter(id => !STATS.seen[id])), seen = shuffle(rest.filter(id => STATS.seen[id]));
  for (const id of unseen.concat(seen)) { if (picked.length >= PER_CH) break; picked.push(id); }
  return picked;
}
function orderIds(groups, shuffleOn) {
  // groups: {ch: [ids]} ; returns {ids, blocks}
  const chs = Object.keys(groups).map(Number).sort();
  if (shuffleOn) return shuffle(chs.flatMap(c => groups[c]));
  return chs.flatMap(c => shuffle(groups[c]));
}
function newPaper(kind, settings, ids) {

/* ================= pen drawing ================= */
function jit(n) { return (Math.random() * 2 - 1) * n; }
function circlePath(cx, cy, rx, ry) {
  // two slightly different loops, start/end overlapping, like a quick pen circle
  const pts = [], turns = 1.12, steps = 28, a0 = -2.2 + jit(.3);
  for (let i = 0; i <= steps; i++) {
    const t = a0 + (i / steps) * Math.PI * 2 * turns;
    const k = 1 + jit(.05) + (i / steps) * 0.08;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]);
  }
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length - 1; i += 2) d += " Q" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1) + " " + pts[i + 1][0].toFixed(1) + " " + pts[i + 1][1].toFixed(1);
  return d;
}
function penCircle(color, animate) {
  const d1 = circlePath(18, 17, 14 + jit(1), 12 + jit(1));

}

  return `<svg class="tick${animate ? " draw" : ""}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}" style="--len:160"/></svg>`;
}

/* ---------- keyword matching ---------- */
function snormMap(s) {
  s = String(s || "");
  let t = " ", map = [-1];
  for (let i = 0; i < s.length; i++) {
    let c = s[i].toLowerCase();
    if ("’‘`'".includes(c)) continue;
    if (c === "&") { for (const ch of " and ") { if (ch === " " && t.endsWith(" ")) continue; t += ch; map.push(i); } continue; }
    if (!/[a-z0-9.%]/.test(c)) { if (!t.endsWith(" ")) { t += " "; map.push(i); } continue; }
    t += c; map.push(i);
  }
  if (!t.endsWith(" ")) { t += " "; map.push(s.length); }
  return {t, map};
}
const RXC = Object.create(null);
function kwRx(kw) {
  if (RXC[kw]) return RXC[kw];
  // "=" prefix: words must be adjacent; "~" prefix: also must not follow "non" (functional vs non-functional)
  const notNon = kw[0] === "~", exact = kw[0] === "=" || notNon;
  const w = snormMap(exact ? kw.slice(1) : kw).t.trim().split(" ").map(x => x.replace(/[.%]/g, m => "\\" + m));
  return RXC[kw] = new RegExp((notNon ? "(?<! non)" : "") + " (" + w.join(exact ? "[a-z0-9.%]* " : "[a-z0-9.%]*(?: [a-z0-9.%]+)? ") + "[a-z0-9.%]*)", "g");
}
function findKw(nt, kw) { const rx = kwRx(kw); rx.lastIndex = 0; const m = rx.exec(nt); return m ? {i: m.index + 1, j: m.index + 1 + m[1].length} : null; }
function matchPoint(nt, pt) {
  if (pt.order) {
    const hits = pt.order.map(g => g.map(k => findKw(nt, k)).filter(Boolean).sort((a, b) => a.i - b.i)[0]);
    const ok = hits.every(Boolean) && hits.every((h, i) => i === 0 || h.i > hits[i - 1].i);
    return {ok, spans: ok ? hits : []};
  }
  const spans = [];
  for (const g of pt.k) {
    const h = g.map(k => findKw(nt, k)).filter(Boolean).sort((a, b) => a.i - b.i)[0];
    if (!h) return {ok: false, spans: []};
    spans.push(h);
  }
  return {ok: true, spans};
}
function markPart(text, part) {
  const nm = snormMap(text), res = part.points.map(pt => matchPoint(nm.t, pt));
  return {nm, res};
}
function partScore(qid, pi) {
  const q = SQB[qid], part = q.parts[pi], ov = ((SP.ov || {})[qid] || {})[pi] || {};
  const {res} = markPart((SP.ans[qid] || [])[pi] || "", part);
  const got = part.points.map((pt, j) => (j in ov ? ov[j] : res[j].ok));
  const raw = part.points.reduce((s, pt, j) => s + (got[j] ? (pt.m || 1) : 0), 0);
  return {got, res, nm: markPart((SP.ans[qid] || [])[pi] || "", part).nm, score: Math.min(part.marks, raw)};
}

/* ---------- paper construction ---------- */
function subjWeakWeight(id) {
  const s = STATS.subj[id]; if (!s) return 0;
  const miss = Object.values(s.miss || {}).reduce((a, b) => a + b, 0);
  return (1 - s.last) * 3 + miss * 0.3;
}
function makeSubj(settings) {

  else pool.sort((a, b) => (STATS.subj[a] ? 1 : 0) - (STATS.subj[b] ? 1 : 0));
  const n = settings.count === "all" ? pool.length : Math.min(+settings.count, pool.length);
  return {kind: "subj", settings: Object.assign({}, settings), ids: pool.slice(0, n), ans: {}, marked: {}, ov: {}, created: Date.now()};
}

function renderSubj() {

/* ================= MOCK MIDTERM ================= */
let MT0 = null, MTI = null;
function fmtTime(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(x).padStart(2, "0"); }
function theorySet() {
  const ch = shuffle(["ch1", "ch2", "ch3"])[0];
  const pool = shuffle(BQ.filter(q => q.topic === ch).map(q => q.id));
  pool.sort((a, b) => (STATS.sb[a] ? 1 : 0) - (STATS.sb[b] ? 1 : 0));
  const pick = []; let m = 0;
  for (const id of pool) { const qm = BQB[id].marks; if (m + qm > 16) continue; pick.push(id); m += qm; if (m >= 12) break; }
  const parts = pick.flatMap((id, k) => BQB[id].parts.map(p => Object.assign({}, p, {l: "abcdefgh"[k] + ")", of: id})));
  return {id: "V-" + ch + "-" + Date.now().toString(36), topic: ch, title: `Chapter ${ch.slice(2)} theory`, src: "Theory set", scen: "", parts};
}
function pickB(topic) {
  const pool = shuffle(BQ.filter(q => q.topic === topic && q.marks >= 10).map(q => q.id));
  pool.sort((a, b) => (STATS.sb[a] ? 1 : 0) - (STATS.sb[b] ? 1 : 0));

}
function makeMock() {

}

function wireMock() {
