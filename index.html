m tests backups, restores, disaster recovery and user administration. Which form is this?","marks":1,"points":[{"t":"Operational acceptance testing","k":[["operational","oat"]],"m":1}]},{"label":"(c)","q":"The bank checks the system against central-bank rules on data protection. Which form is this?","marks":1,"points":[{"t":"Regulatory acceptance testing","k":[["regulat"]],"m":1}]},{"label":"(d)","q":"Branch staff check that they can carry out their daily business processes with the system. Which form is this?","marks":1,"points":[{"t":"User acceptance testing","k":[["user acceptance","uat","user"]],"m":1}]},{"label":"(e)","q":"Explain the difference between alpha testing and beta testing.","marks":2,"points":[{"t":"Alpha: at the developer's (manufacturer's) site, by people outside the development team","k":[["alpha"],["developer","manufacturer","in-house","in house","internal","own site","company"]],"m":1},{"t":"Beta: by customers/users at their own sites (field testing)","k":[["beta"],["customer","user","own site","their site","field","external"]],"m":1}]}],"ch":2},{"id":"C2-test-types","lo":"FL-2.2.2","k":"K2","topic":"types","title":"Test types","scenario":"","parts":[{"label":"(a)","q":"Name the FOUR basic test types.","marks":4,"points":[{"t":"Functional testing","k":[["~functional"]],"m":1},{"t":"Non-functional testing","k":[["non-functional","non functional","nonfunctional"]],"m":1},{"t":"Black-box testing","k":[["black"]],"m":1},{"t":"White-box testing","k":[["white"]],"m":1}]},{"label":"(b)","q":"What is the difference between functional and non-functional testing?","marks":2,"points":[{"t":"Functional testing checks WHAT the system should do (functional completeness, correctness, appropriateness)","k":[["what"]],"m":1},{"t":"Non-functional testing checks HOW WELL the system behaves (quality characteristics, e.g. performance, usability)","k":[["how well","how"]],"m":1}]},{"label":"(c)","q":"What is the difference between black-box and white-box testing?","marks":2,"points":[{"t":"Black-box: based on the specified behaviour (specification), no knowledge of the internal structure","k":[["black"],["specification","specified","requirement","behavio","external"]],"m":1},{"t":"White-box: based on the internal structure (code, architecture, control flow), measured by structural coverage","k":[["white"],["structure","code","internal","architecture","coverage"]],"m":1}]},{"label":"(d)","q":"At which test levels can these test types be performed?","marks":1,"points":[{"t":"At all test levels","k":[["all","any","every"]],"m":1}]}],"ch":2},{"id":"C2-nonfunctional","lo":"FL-2.2.2","k":"K2","topic":"types","title":"Non-functional testing","scenario":"","parts":[{"label":"(a)","q":"List FIVE non-functional quality characteristics (ISO 25010).","marks":5,"points":[{"t":"Performance efficiency","k":[["performance","efficien"]],"m":1},{"t":"Compatibility","k":[["compatib"]],"m":1},{"t":"Usability","k":[["usab"]],"m":1},{"t":"Reliability","k":[["reliab"]],"m":1},{"t":"Security","k":[["securit"]],"m":1},{"t":"Maintainability","k":[["maintainab"]],"m":1},{"t":"Portability","k":[["portab"]],"m":1}]},{"label":"(b)","q":"Explain the difference between performance testing, load testing and stress testing.","marks":3,"points":[{"t":"Performance testing: measures response time (usually with increasing load)","k":[["performance"],["response","time","speed","fast"]],"m":1},{"t":"Load testing: behaviour under changing load (low, typical, peak)","k":[["load"],["low","typical","peak","changing","increas","expected","normal"]],"m":1},{"t":"Stress testing: behaviour under overload, beyond the specified limits","k":[["stress"],["overload","beyond","exceed","above","limit","extreme"]],"m":1}]},{"label":"(c)","q":"Why should non-functional testing start early?","marks":1,"points":[{"t":"Late discovery of non-functional defects can seriously threaten project success","k":[["late","jeopard","threat","expensive","costly","risk"]],"m":1}]}],"ch":2},{"id":"C2-confirm-regress","lo":"FL-2.2.3","k":"K2","topic":"types","title":"Confirmation and regression testing","scenario":"A developer fixes a defect in the discount calculation of a shopping cart.","parts":[{"label":"(a)","q":"What is confirmation testing?","marks":2,"points":[{"t":"Change-related testing after a defect fix","k":[["fix","correct","after"]],"m":1},{"t":"Confirms the defect is fixed / the failure does not reoccur, by re-running the test(s) that failed","k":[["confirm","reoccur","re-occur","recur","re-run","rerun","repeat","failed test","fixed"]],"m":1}]},{"label":"(b)","q":"What is regression testing?","marks":2,"points":[{"t":"Change-related testing to detect whether changes introduced or uncovered defects","k":[["new defect","introduc","uncover","side effect","unintended"]],"m":1},{"t":"…in unchanged areas of the software (or after environment changes)","k":[["unchanged","other area","rest of","existing","not changed","environment"]],"m":1}]},{"label":"(c)","q":"In the scenario, which test type re-runs the discount test that failed?","marks":1,"points":[{"t":"Confirmation testing","k":[["confirmation","retest"]],"m":1}]},{"label":"(d)","q":"Which test type checks that checkout and payment still work after the fix?","marks":1,"points":[{"t":"Regression testing","k":[["regression"]],"m":1}]},{"label":"(e)","q":"Why are regression tests good candidates for automation, and what helps decide their scope?","marks":2,"points":[{"t":"They are run repeatedly with few changes (e.g. in CI)","k":[["repeat","often","frequent","many times","again","continuous","ci"]],"m":1},{"t":"Impact analysis (with traceability) decides the scope","k":[["impact"]],"m":1}]}],"ch":2},{"id":"C2-maintenance","lo":"FL-2.3.1","k":"K2","topic":"maint","title":"Maintenance testing","scenario":"A university's student portal has been live for five years.","parts":[{"label":"(a)","q":"Name the THREE categories of triggers for maintenance testing, with an example of each.","marks":3,"points": rce of a defect; removing it prevents similar defects","items":[{"t":"source/main reason","k":[["source","reason","cause"]]}],"need":1},{"t":"Ambiguous requirement about rounding","items":[{"t":"ambiguous requirement","k":[["ambigu","unclear","requirement","lack"]]}],"need":1}],[{"t":"Error (mistake)","items":[{"t":"error","k":[["error","mistake"]]}],"need":1},{"t":"A human action that produces an incorrect result","items":[{"t":"human action","k":[["human","person","people"]]}],"need":1},{"t":"Developer wrongly assumes rounding down","items":[{"t":"developer assumption","k":[["assum","developer","misunderst"]]}],"need":1}],[{"t":"Defect (fault, bug)","items":[{"t":"defect","k":[["defect","fault","bug"]]}],"need":1},{"t":"An imperfection in a work product (e.g. code) that does not meet its requirements","items":[{"t":"imperfection in work product/code","k":[["code","work product","imperfection","flaw","deficien"]]}],"need":1},{"t":"Rounding-down logic in the code","items":[{"t":"code logic","k":[["code","logic","formula","round"]]}],"need":1}],[{"t":"Failure","items":[{"t":"failure","k":[["failure"]]}],"need":1},{"t":"The system does not do what it should; actual result differs from expected","items":[{"t":"deviation / visible","k":[["expected","deviat","visible","not perform","does not"]]}],"need":1},{"t":"Customer sees balance RM 0.01 too low","items":[{"t":"wrong balance seen","k":[["balance","customer","0.01","wrong","low"]]}],"need":1}]],"ch":1,"topic":"basics"},{"id":"T4-principles","title":"The seven testing principles","lo":"FL-1.3.1","cols":["No.","Principle","Meaning in one line"],"rows":[[{"t":"1","items":[{"t":"1","k":[["1"]]}],"need":1},{"t":"Testing shows the presence, not the absence of defects","items":[{"t":"presence of defects","k":[["presence"]]}],"need":1},{"t":"Testing lowers the chance of undetected defects but cannot prove correctness","items":[{"t":"cannot prove correctness","k":[["prove","correct","cannot","can't","not show","no defect"]]}], y","validat"]]}],"need":1},{"t":"Business processes, user requirements, regulations/contracts, use cases, user documentation","items":[{"t":"business processes","k":[["business"]]},{"t":"requirements","k":[["requirement","use case","user stor"]]},{"t":"regulations/contracts","k":[["regulat","contract","legal"]]}],"need":1},{"t":"Not meeting user/business requirements, business rules, contracts or regulations; non-functional issues","items":[{"t":"requirements/business rules","k":[["requirement","business"]]},{"t":"contract/regulation","k":[["contract","regulat"]]},{"t":"non-functional","k":[["non-functional","non functional","security","performance"]]}],"need":1}]]},{"id":"T6-acceptance","ch":2,"topic":"levels","title":"Forms of acceptance testing","lo":"FL-2.2.1","cols":["Form","Focus / who"],"rows":[[{"t":"User acceptance testing (UAT)","items":[{"t":"user acceptance","k":[["user acceptance","uat"]]}],"need":1},{"t":"Users check the system meets their needs and runs business processes with minimal difficulty, cost and risk","items":[{"t":"user needs / business process","k":[["user","need","business"]]}],"need":1}],[{"t":"Operational acceptance testing (OAT)","items":[{"t":"operational","k":[["operational","oat"]]}],"need":1},{"t":"Operations/admin staff: backup & restore, install/update, disaster recovery, user admin, security, performance","items":[{"t":"backup/recovery/admin","k":[["backup","restor","recover","install","admin","operat"]]}],"need":1}],[{"t":"Contractual acceptance testing","items":[{"t":"contractual","k":[["contract"]]}],"need":1},{"t":"Checks the contract's acceptance criteria are met","items":[{"t":"contract criteria","k":[["contract","criteri"]]}],"need":1}],[{"t":"Regulatory acceptance testing","items":[{"t":"regulatory","k":[["regulat"]]}],"need":1},{"t":"Checks compliance with laws, regulations and standards","items":[{"t":"laws/regulations","k":[["law","regulat","standard","legal","complian"]]}],"need":1}],[{"t":"Alpha testing","items":[{"t":"alpha","k":[["alpha"]]}],"need":1},{"t":"At the developer's site, by people outside the development team (e.g. users, independent testers)","items":[{"t":"developer's site","k":[["developer","manufacturer","in-house","in house","internal"]]}],"need":1}],[{"t":"Beta testing","items":[{"t":"beta","k":[["beta"]]}],"need":1},{"t":"By customers/users at their own sites (field testing)","items":[{"t":"customer's own site","k":[["customer","own site","their site","field","external"]]}],"need":1}]]},{"id":"T7-types","ch":2,"topic":"types","title":"Test types and change-related testing","lo":"FL-2.2.2 / FL-2.2.3","cols":["Test type","What it checks / based on"],"rows":[[{"t":"Functional testing","items":[{"t":"functional","k":[["~functional"]]}],"need":1},{"t":"WHAT the system does: functional completeness, correctness, appropriateness","items":[{"t":"what","k":[["what","completeness","correctness"]]}],"need":1}],[{"t":"Non-functional testing","items":[{"t":"non-functional","k":[["non-functional","non functional","nonfunctional"]]}],"need":1},{"t":"HOW WELL it behaves: performance, compatibility, usability, reliability, security, maintainability, portability","items":[{"t":"how well / quality characteristics","k":[["how well","how","performance","usab","reliab","securit","quality"]]}],"need":1}],[{"t":"Black-box testing","items":[{"t":"black-box","k":[["black"]]}],"need":1},{"t":"Based on the specification; no knowledge of internal structure","items":[{"t":"specification","k":[["specification","specified","requirement","behavio"]]}],"need":1}],[{"t":"White-box testing","items":[{"t":"white-box","k":[["white"]]}],"need":1},{"t":"Based on internal structure (code, architecture); measured by structural coverage","items":[{"t":"internal structure","k":[["structure","code","internal","coverage"]]}],"need":1}],[{"t":"Confirmation testing","items":[{"t":"confirmation","k":[["confirmation","retest"]]}],"need":1},{"t":"After a defect fix: confirms the failure no longer occurs (re-run failed tests)","items":[{"t":"defect fixed / re-run","k":[["fix","reoccur","recur","re-run","rerun","failed"]]}],"need":1}],[{"t":"Regression testing","items":[{"t":"regression","k":[["regression"]]}],"need":1},{"t":"After any change: checks no new defects introduced or uncovered in unchanged areas","items":[{"t":"unchanged areas / side effects","k":[["unchanged","side effect","new defect","introduc","uncover","other area"]]}],"need":1}]]},{"id":"T8-sdlc","ch":2,"topic":"sdlc","title":"Test-first, DevOps, shift-left, retrospectives","lo":"FL-2.1.3–2.1.6","cols":["Concept","Key idea"],"rows":[[{"t":"TDD","items":[{"t":"TDD","k":[["tdd","test driven","test-driven"]]}],"need":1},{"t":"Write a failing test → code to pass → refactor; tests guide coding","items":[{"t":"fail/pass/refactor","k":[["fail","red"],["refactor","pass","green"]]}],"need":1}],[{"t":"ATDD","items":[{"t":"ATDD","k":[["atdd","acceptance test"]]}],"need":1},{"t":"Tests derived from acceptance criteria, in the stakeholders' language, before development","items":[{"t":"acceptance criteria","k":[["acceptance criteri"]]}],"need":1}],[{"t":"BDD","items":[{"t":"BDD","k":[["bdd","behavio"]]}],"need":1},{"t":"Expected behaviour written as Given / When / Then scenarios in natural language","items":[{"t":"Given/When/Then","k":[["given"]]}],"need":1}],[{"t":"DevOps","items":[{"t":"DevOps","k":[["devops","dev ops"]]}],"need":1},{"t":"Development (incl. testing) and operations work together; CI/CD pipeline, high test automation, fast feedback","items":[{"t":"dev + ops / CI/CD","k":[["operation","ci","cd","continuous","pipeline","automat"]]}],"need":1}],[{"t":"Shift-left","items":[{"t":"shift-left","k":[["shift"]]}],"need":1},{"t":"Test earlier in the SDLC: reviews, tests before code, CI, static analysis, early non-functional tests","items":[{"t":"earlier","k":[["earl","before"]]}],"need":1}],[{"t":"Retrospective","items":[{"t":"retrospective","k":[["retro"]]}],"need":1},{"t":"At end of iteration/release: what went well, what to improve, how, risks → process improvement","items":[{"t":"went well / improve","k":[["well","success","improv"]]}],"need":1}]]},{"id":"T9-maintenance","ch":2,"topic":"maint","title":"Maintenance testing triggers","lo":"FL-2.3.1","cols":["Trigger","Examples","What to test"],"rows":[[{"t":"Modification","items":[{"t":"modification","k":[["modif","change","enhance"]]}],"need":1},{"t":"Planned enhancements, corrective fixes, hot fixes","items":[{"t":"enhancements / fixes","k":[["enhance","fix","hot","correct","planned"]]}],"need":1},{"t":"The changed parts (confirmation) plus regression testing, scoped by impact analysis","items":[{"t":"confirmation/regression/impact","k":[["regression","confirmation","impact","changed"]]}],"need":1}],[{"t":"Upgrade / migration","items":[{"t":"migration/upgrade","k":[["migrat","upgrade"]]}],"need":1},{"t":"New platform, OS or database upgrade, data conversion","items":[{"t":"platform/environment/data","k":[["platform","environment","operating system","os","database","data","hardware"]]}],"need":1},{"t":"Operational tests of the new environment and the changed software; data conversion tests","items":[{"t":"new environment / conversion","k":[["environment","conversion","convert","operational"]]}],"need":1}],[{"t":"Retirement","items":[{"t":"retirement","k":[["retire","decommission","end of life"]]}],"need":1},{"t":"The application reaches end of life / is replaced","items":[{"t":"end of life / replaced","k":[["end of life","replace","retire","decommission"]]}],"need":1},{"t":"Data migration, data archiving, restore/retrieval procedures, regression of what remains","items":[{"t":"migration/archiving/restore","k":[["migrat","archiv","restor","retriev"]]}],"need":1}]]}]}</script>
<script type="application/json" id="bdata">{"topics":[["ep","Equivalence partitioning & BVA"],["dt","Decision tables"],["st","State transition testing"],["wb","White-box: CFG, McCabe, statement & branch"],["exp","Experience-based, ATDD & choosing techniques"],["review","Static testing: review a specification"],["risk","Risk-based testing, test specs & traceability (slides)"],["ch1","Chapter 1 theory (short questions)"],["ch2","Chapter 2 theory (short questions)"],["ch3","Chapter 3 theory (short questions)"]],"questions":[{"id":"B-EP-bank","topic":"ep","title":"Bank interest – partitions and 3-value BVA","src":"Tutorial Week 7","scen":"<p>A savings account in a bank earns a different rate of interest depending on the balance in the account. A balance in the range $0 up to $100 has a 3% interest rate, a balance over $100 and up to $1000 has a 5% interest rate, and balances above $1000 have a 7% interest rate.<\/p><p>Figure 1: Bank interest rate<\/p>","parts":[{"l":"1.","q":"What are the partitions and 3-value boundary values to test the interest calculation?","m":6,"a":"<p>Assume dollars with 2 decimal places, so the smallest step is $0.01. State the assumption.<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th>Partition<\/th><th>Balance<\/th><th>Output<\/th><th>Valid?<\/th><\/tr><tr><td>EP1<\/td><td>below $0.00<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><tr><td>EP2<\/td><td>$0.00 – $100.00<\/td><td>3%<\/td><td>Valid<\/td><\/tr><tr><td>EP3<\/td><td>$100.01 – $1000.00<\/td><td>5%<\/td><td>Valid<\/td><\/tr><tr><td>EP4<\/td><td>$1000.01 and above<\/td><td>7%<\/td><td>Valid (no upper limit stated)<\/td><\/tr><tr><td>EP5<\/td><td>not a number (\"abc\")<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><\/table><\/div><p>Boundaries: 0.00, 100.00, 100.01, 1000.00, 1000.01. The 3-value set (each boundary plus both neighbours) is <b>−0.01, 0.00, 0.01, 99.99, 100.00, 100.01, 100.02, 999.99, 1000.00, 1000.01, 1000.02<\/b>, which is 11 values.<\/p><p>In whole dollars: −1, 0, 1, 99, 100, 101, 102, 999, 1000, 1001, 1002.<\/p>"},{"l":"2.","q":"Which are valid partitions and which are invalid partitions?","m":3,"a":"<ul class=\"mlist\"><li>Valid: EP2 ($0–$100, 3%), EP3 ($100.01–$1000, 5%), EP4 (above $1000, 7%).<\/li><li>Invalid: EP1 negative balance (no rate defined) and EP5 non-numeric input.<\/li><\/ul>"},{"l":"3.","q":"Derive test cases for the partitions and boundaries.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>TC<\/th><th>Balance<\/th><th>Covers<\/th><th>Expected<\/th><\/tr><tr><td>TC1<\/td><td>−0.01<\/td><td>EP1, boundary<\/td><td>Rejected<\/td><\/tr><tr><td>TC2<\/td><td>0.00<\/td><td>EP2, boundary<\/td><td>3%<\/td><\/tr><tr><td>TC3<\/td><td>0.01<\/td><td>EP2<\/td><td>3%<\/td><\/tr><tr><td>TC4<\/td><td>99.99<\/td><td>EP2<\/td><td>3%<\/td><\/tr><tr><td>TC5<\/td><td>100.00<\/td><td>EP2, boundary<\/td><td>3%<\/td><\/tr><tr><td>TC6<\/td><td>100.01<\/td><td>EP3, boundary<\/td><td>5%<\/td><\/tr><tr><td>TC7<\/td><td>100.02<\/td><td>EP3<\/td><td>5%<\/td><\/tr><tr><td>TC8<\/td><td>999.99<\/td><td>EP3<\/td><td>5%<\/td><\/tr><tr><td>TC9<\/td><td>1000.00<\/td><td>EP3, boundary<\/td><td>5%<\/td><\/tr><tr><td>TC10<\/td><td>1000.01<\/td><td>EP4, boundary<\/td><td>7%<\/td><\/tr><tr><td>TC11<\/td><td>1000.02<\/td><td>EP4<\/td><td>7%<\/td><\/tr><tr><td>TC12<\/td><td>\"abc\"<\/td><td>EP5<\/td><td>Rejected<\/td><\/tr><\/table><\/div><p>Marks: an expected result in every row, and each partition and boundary covered at least once.<\/p>"}],"marks":15},{"id":"B-EP-postal","topic":"ep","title":"Postal rates – minimum EP set and 2-value BVA","src":"Tutorial Week 7","scen":"<p>Postal rates for 'light letters' are RM0.60 up to 10g, RM1.50 up to 50g, plus an extra RM0.30 for each additional 25g up to 100g.<\/p><p>Figure 2: Postal rates<\/p>","parts":[{"l":"1.","q":"What is the minimum set of test input values (in grams) that would be selected using equivalence partitioning?","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Partition<\/th><th>Weight<\/th><th>Price<\/th><th>Valid?<\/th><\/tr><tr><td>EP1<\/td><td>0 g or less<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><tr><td>EP2<\/td><td>1 – 10 g<\/td><td>RM0.60<\/td><td>Valid<\/td><\/tr><tr><td>EP3<\/td><td>11 – 50 g<\/td><td>RM1.50<\/td><td>Valid<\/td><\/tr><tr><td>EP4<\/td><td>51 – 75 g<\/td><td>RM1.80<\/td><td>Valid<\/td><\/tr><tr><td>EP5<\/td><td>76 – 100 g<\/td><td>RM2.10<\/td><td>Valid<\/td><\/tr><tr><td>EP6<\/td><td>over 100 g<\/td><td>not a light letter<\/td><td>Invalid<\/td><\/tr><\/table><\/div><p>One value per partition, e.g. <b>0, 5, 30, 60, 90, 120: 6 values<\/b> (4 if only valid partitions are asked).<\/p><p>Trap: the 'extra RM0.30 per 25 g' rule creates two partitions (51–75 and 76–100), not one.<\/p>"},{"l":"2.","q":"What are the 2-value boundary values?","m":5,"a":"<p>Each boundary and its closest neighbour in the next partition: <b>0, 1 · 10, 11 · 50, 51 · 75, 76 · 100, 101<\/b>, which is 10 values (whole grams assumed).<\/p>"}],"marks":10},{"id":"B-EP-cinema","topic":"ep","title":"Cinema tickets – partitions and 3-value BVA","src":"Predicted question","scen":"<p>MyCinema prices tickets by age. Children aged 0 to 12 pay RM10, adults aged 13 to 59 pay RM18, and seniors aged 60 and above pay RM12. Age is entered as a whole number; the system accepts ages up to 120.<\/p>","parts":[{"l":"1.","q":"Identify the equivalence partitions and state which are valid and which are invalid.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Partition<\/th><th>Age<\/th><th>Price<\/th><th>Valid?<\/th><\/tr><tr><td>EP1<\/td><td>below 0<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><tr><td>EP2<\/td><td>0 – 12<\/td><td>RM10<\/td><td>Valid<\/td><\/tr><tr><td>EP3<\/td><td>13 – 59<\/td><td>RM18<\/td><td>Valid<\/td><\/tr><tr><td>EP4<\/td><td>60 – 120<\/td><td>RM12<\/td><td>Valid<\/td><\/tr><tr><td>EP5<\/td><td>above 120<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><tr><td>EP6<\/td><td>not a whole number (12.5, \"abc\")<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"Identify the 3-value boundary values.","m":5,"a":"<p>Boundaries: 0, 12, 13, 59, 60, 120. The 3-value set is <b>−1, 0, 1, 11, 12, 13, 14, 58, 59, 60, 61, 119, 120, 121<\/b>, which is 14 values.<\/p>"},{"l":"3.","q":"Derive test cases for the partitions and boundaries.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Age<\/th><th>Expected<\/th><th>Age<\/th><th>Expected<\/th><\/tr><tr><td>−1<\/td><td>Rejected<\/td><td>58<\/td><td>RM18<\/td><\/tr><tr><td>0<\/td><td>RM10<\/td><td>59<\/td><td>RM18<\/td><\/tr><tr><td>1<\/td><td>RM10<\/td><td>60<\/td><td>RM12<\/td><\/tr><tr><td>11<\/td><td>RM10<\/td><td>61<\/td><td>RM12<\/td><\/tr><tr><td>12<\/td><td>RM10<\/td><td>119<\/td><td>RM12<\/td><\/tr><tr><td>13<\/td><td>RM18<\/td><td>120<\/td><td>RM12<\/td><\/tr><tr><td>14<\/td><td>RM18<\/td><td>121<\/td><td>Rejected<\/td><\/tr><tr><td>30<\/td><td>RM18<\/td><td>\"abc\"<\/td><td>Rejected<\/td><\/tr><\/table><\/div>"}],"marks":15},{"id":"B-EP-ship","topic":"ep","title":"Shipping fee – partitions, test table, spec issues","src":"Predicted question","scen":"<p>ShopNow charges shipping based on the order total (in RM, to 2 decimal places). Orders below RM50 pay RM8 shipping, orders from RM50 up to RM150 pay RM4, and orders above RM150 ship free. The minimum order is RM10.<\/p>","parts":[{"l":"a)","q":"Identify the equivalence partitions and 2-value boundary values.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Partition<\/th><th>Order total<\/th><th>Shipping<\/th><th>Valid?<\/th><\/tr><tr><td>EP1<\/td><td>below RM10.00<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><tr><td>EP2<\/td><td>RM10.00 – RM49.99<\/td><td>RM8<\/td><td>Valid<\/td><\/tr><tr><td>EP3<\/td><td>RM50.00 – RM150.00<\/td><td>RM4<\/td><td>Valid<\/td><\/tr><tr><td>EP4<\/td><td>RM150.01 and above<\/td><td>free<\/td><td>Valid<\/td><\/tr><tr><td>EP5<\/td><td>not a number<\/td><td>rejected<\/td><td>Invalid<\/td><\/tr><\/table><\/div><p>2-value boundaries (step RM0.01): <b>9.99, 10.00 · 49.99, 50.00 · 150.00, 150.01<\/b>.<\/p>"},{"l":"b)","q":"Design test cases in a table with test case ID, input and expected result.","m":7,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>TC<\/th><th>Input (RM)<\/th><th>Covers<\/th><th>Expected<\/th><\/tr><tr><td>TC1<\/td><td>9.99<\/td><td>EP1, boundary<\/td><td>Order rejected (below minimum)<\/td><\/tr><tr><td>TC2<\/td><td>10.00<\/td><td>EP2, boundary<\/td><td>Shipping RM8<\/td><\/tr><tr><td>TC3<\/td><td>30.00<\/td><td>EP2<\/td><td>Shipping RM8<\/td><\/tr><tr><td>TC4<\/td><td>49.99<\/td><td>EP2, boundary<\/td><td>Shipping RM8<\/td><\/tr><tr><td>TC5<\/td><td>50.00<\/td><td>EP3, boundary<\/td><td>Shipping RM4<\/td><\/tr><tr><td>TC6<\/td><td>100.00<\/td><td>EP3<\/td><td>Shipping RM4<\/td><\/tr><tr><td>TC7<\/td><td>150.00<\/td><td>EP3, boundary<\/td><td>Shipping RM4<\/td><\/tr><tr><td>TC8<\/td><td>150.01<\/td><td>EP4, boundary<\/td><td>Free shipping<\/td><\/tr><tr><td>TC9<\/td><td>400.00<\/td><td>EP4<\/td><td>Free shipping<\/td><\/tr><tr><td>TC10<\/td><td>\"abc\"<\/td><td>EP5<\/td><td>Error message<\/td><\/tr><\/table><\/div>"},{"l":"c)","q":"Identify THREE (3) issues in the specification.","m":3,"a":"<ul class=\"mlist\"><li>\"Up to RM150\": does RM150.00 itself pay RM4?<\/li><li>Is the total before or after vouchers and discounts?<\/li><li>No maximum order value is given.<\/li><li>\"Minimum order is RM10\": what happens to a RM9.99 order (blocked, or charged a fee)?<\/li><li>Rounding is not stated (e.g. RM49.995 after a discount).<\/li><\/ul>"}],"marks":15},{"id":"B-EP-sid","topic":"ep","title":"Student ID validator – several input variables","src":"Predicted question","scen":"<p>A student ID is valid only if it is exactly 8 characters long, contains only digits, and starts with the digit 2. Example: 23049174.<\/p>","parts":[{"l":"1.","q":"Identify the valid and invalid partitions for each variable.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Variable<\/th><th>Valid partition<\/th><th>Invalid partitions<\/th><\/tr><tr><td>Length<\/td><td>exactly 8<\/td><td>fewer than 8 · more than 8<\/td><\/tr><tr><td>Characters<\/td><td>digits only<\/td><td>contains a non-digit<\/td><\/tr><tr><td>First character<\/td><td>\"2\"<\/td><td>any other character<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"What is the minimum number of test inputs that covers every partition? Give the inputs.","m":4,"a":"<p><b>3 tests.<\/b> The length variable has 3 partitions, and each test can cover one partition of every variable at the same time:<\/p><ul class=\"mlist\"><li>\"23049174\": 8 characters, digits, starts with 2<\/li><li>\"1A3\": fewer than 8, non-digit, starts with another character<\/li><li>\"312345678\": more than 8, digits, starts with another character<\/li><\/ul>"},{"l":"3.","q":"Explain why that minimum set is risky, and give a better set.","m":5,"a":"<p><b>Defect masking:<\/b> \"1A3\" breaks three rules at once. If it is rejected, you cannot tell which check worked, and a missing check for the other rules stays hidden. Test each invalid partition on its own, with all other inputs valid. That gives <b>5 tests<\/b>:<\/p><ul class=\"mlist\"><li>\"23049174\" (valid)<\/li><li>\"2304917\" (7 characters)<\/li><li>\"230491745\" (9 characters)<\/li><li>\"2304917A\" (non-digit)<\/li><li>\"13049174\" (starts with 1)<\/li><\/ul><p>The length values 7, 8 and 9 also double as boundary values.<\/p>"}],"marks":15},{"id":"B-EP-grade","topic":"ep","title":"Exam grades – boundary drill","src":"Predicted question","scen":"<p>Marks are whole numbers from 0 to 100. A = 80–100, B = 65–79, C = 50–64, F = 0–49.<\/p>","parts":[{"l":"1.","q":"List the partitions.","m":4,"a":"<p>Invalid below 0 · F 0–49 · C 50–64 · B 65–79 · A 80–100 · invalid above 100.<\/p>"},{"l":"2.","q":"List the 2-value and the 3-value boundary values.","m":6,"a":"<p>Boundaries: 0, 49, 50, 64, 65, 79, 80, 100.<\/p><p>2-value: <b>−1, 0, 49, 50, 64, 65, 79, 80, 100, 101<\/b> (10 values).<\/p><p>3-value: <b>−1, 0, 1, 48, 49, 50, 51, 63, 64, 65, 66, 78, 79, 80, 81, 99, 100, 101<\/b> (18 values).<\/p>"}],"marks":10},{"id":"B-DT-member","topic":"dt","title":"Member discount – build, collapse and test a decision table","src":"Predicted question","scen":"<p>ShopNow members get 10% off every order. Members who also enter a valid coupon get an extra 5% off. Any order over RM100 gets free shipping. Coupons entered by non-members are ignored.<\/p>","parts":[{"l":"1.","q":"How many rules does the full decision table have?","m":1,"a":"<p>3 conditions, so 2³ = <b>8 rules<\/b>.<\/p>"},{"l":"2.","q":"Draw the full decision table.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>R5<\/th><th>R6<\/th><th>R7<\/th><th>R8<\/th><\/tr><tr><td>C1 Member?<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>C2 Valid coupon?<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>C3 Order &gt; RM100?<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><\/tr><tr><td>A1 10% discount<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>A2 Extra 5%<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>A3 Free shipping<\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/table><\/div>"},{"l":"3.","q":"Simplify the table using \"–\" (don't care).","m":3,"a":"<p>For non-members the coupon makes no difference: R5 = R7 and R6 = R8. Merge each pair with C2 = \"–\". That gives <b>6 rules<\/b>:<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>R5<\/th><th>R6<\/th><\/tr><tr><td>C1 Member?<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>C2 Valid coupon?<\/td><td>T<\/td><td>T<\/td><td>F<\/td><td>F<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>C3 Order &gt; RM100?<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><td>T<\/td><td>F<\/td><\/tr><tr><td>A1 10% discount<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>A2 Extra 5%<\/td><td>X<\/td><td>X<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>A3 Free shipping<\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/table><\/div>"},{"l":"4.","q":"Derive test cases for 100% decision table coverage of the simplified table.","m":3,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>TC<\/th><th>Input<\/th><th>Expected<\/th><\/tr><tr><td>TC1<\/td><td>member, valid coupon, RM150<\/td><td>10% + 5%, free shipping<\/td><\/tr><tr><td>TC2<\/td><td>member, valid coupon, RM80<\/td><td>10% + 5%, pays shipping<\/td><\/tr><tr><td>TC3<\/td><td>member, no coupon, RM150<\/td><td>10%, free shipping<\/td><\/tr><tr><td>TC4<\/td><td>member, no coupon, RM80<\/td><td>10%, pays shipping<\/td><\/tr><tr><td>TC5<\/td><td>non-member, coupon entered, RM150<\/td><td>no discount, free shipping<\/td><\/tr><tr><td>TC6<\/td><td>non-member, no coupon, RM80<\/td><td>no discount, pays shipping<\/td><\/tr><\/table><\/div>"},{"l":"5.","q":"Identify TWO (2) ambiguities in the rules.","m":2,"a":"<ul class=\"mlist\"><li>Is \"over RM100\" checked before or after the discount? (A member's RM105 order is RM94.50 after 10% off.)<\/li><li>Is the extra 5% added to the 10% (15% total), or taken off the discounted price (14.5% total)?<\/li><li>Does an order of exactly RM100 get free shipping?<\/li><li>What makes a coupon \"valid\"?<\/li><\/ul>"}],"marks":15},{"id":"B-DT-insure","topic":"dt","title":"Insurance premium – coverage, contradiction, omission (past-paper style)","src":"Predicted question","scen":"<p>A car insurer assigns a premium category using this decision table.<\/p><div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><th>R4<\/th><th>R5<\/th><th>R6<\/th><th>R7<\/th><\/tr><tr><td>C1 Driver age<\/td><td>18–25<\/td><td>18–25<\/td><td>26–60<\/td><td>26–60<\/td><td>26–60<\/td><td>&gt;60<\/td><td>–<\/td><\/tr><tr><td>C2 Claims in last 3 years<\/td><td>0<\/td><td>≥1<\/td><td>0<\/td><td>0<\/td><td>≥1<\/td><td>–<\/td><td>≥1<\/td><\/tr><tr><td>C3 Car older than 10 years?<\/td><td>–<\/td><td>–<\/td><td>N<\/td><td>Y<\/td><td>–<\/td><td>–<\/td><td>Y<\/td><\/tr><tr><td>Category<\/td><td>B<\/td><td>C<\/td><td>A<\/td><td>B<\/td><td>C<\/td><td>B<\/td><td>D<\/td><\/tr><\/table><\/div><p>Existing tests: TC1 = 22-year-old, 0 claims, 5-year-old car → B. TC2 = 40-year-old, 2 claims, 3-year-old car → C. TC3 = 70-year-old, 0 claims, 4-year-old car → B. TC4 = 30-year-old, 0 claims, 6-year-old car → A.<\/p>","parts":[{"l":"1.","q":"Which rules do the existing tests cover? What is the decision table coverage?","m":4,"a":"<p>TC1 → R1, TC2 → R5, TC3 → R6, TC4 → R3. That is 4 of 7 rules: <b>4 ÷ 7 × 100 ≈ 57%<\/b>.<\/p>"},{"l":"2.","q":"Add the minimum test cases needed for R2 and R4, with expected results.","m":4,"a":"<ul class=\"mlist\"><li>R2: 20-year-old, 1 claim, 3-year-old car → <b>C<\/b><\/li><li>R4: 45-year-old, 0 claims, 12-year-old car → <b>B<\/b><\/li><\/ul>"},{"l":"3.","q":"Give test data showing that the table contains contradictory rules. Explain.","m":4,"a":"<p><b>40-year-old, 2 claims, 12-year-old car.<\/b> It matches R5 (category C) and R7 (category D) at the same time, so the table gives two different outputs for one input. R7 overlaps R2, R5 and R6 in the same way, so any test written for R7 exposes a contradiction.<\/p>"},{"l":"4.","q":"Identify ONE (1) omission in the table.","m":3,"a":"<p>There is no rule for drivers under 18 (e.g. a 17-year-old): should they be rejected or given a category? The table is also silent on ages above any sensible maximum.<\/p>"}],"marks":15},{"id":"B-DT-driving","topic":"dt","title":"Driving test results – omission and contradiction","src":"Tutorial Week 7 (MCQ rewritten)","scen":"<div class=\"qtable\"><table class=\"qt\"><tr><th><\/th><th>R1<\/th><th>R2<\/th><th>R3<\/th><\/tr><tr><td>C1 First attempt?<\/td><td>–<\/td><td>–<\/td><td>F<\/td><\/tr><tr><td>C2 Theory passed?<\/td><td>T<\/td><td>F<\/td><td>–<\/td><\/tr><tr><td>C3 Practical passed?<\/td><td>T<\/td><td>–<\/td><td>F<\/td><\/tr><tr><td>Issue licence<\/td><td>X<\/td><td><\/td><td><\/td><\/tr><tr><td>Additional lessons<\/td><td><\/td><td><\/td><td>X<\/td><\/tr><tr><td>Retake exam<\/td><td><\/td><td>X<\/td><td><\/td><\/tr><\/table><\/div>","parts":[{"l":"1.","q":"List all 8 condition combinations and the rule each one matches.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>C1 C2 C3<\/th><th>Matches<\/th><\/tr><tr><td>T T T<\/td><td>R1<\/td><\/tr><tr><td>T T F<\/td><td><b>none → omission<\/b><\/td><\/tr><tr><td>T F T<\/td><td>R2<\/td><\/tr><tr><td>T F F<\/td><td>R2<\/td><\/tr><tr><td>F T T<\/td><td>R1<\/td><\/tr><tr><td>F T F<\/td><td>R3<\/td><\/tr><tr><td>F F T<\/td><td>R2<\/td><\/tr><tr><td>F F F<\/td><td><b>R2 and R3 → contradiction<\/b> (retake vs lessons)<\/td><\/tr><\/table><\/div>"},{"l":"2.","q":"Identify one omission and one contradiction.","m":5,"a":"<ul class=\"mlist\"><li><b>Omission:<\/b> a first-attempt candidate who passed theory but failed the practical (T, T, F) gets no action.<\/li><li><b>Contradiction:<\/b> (F, F, F) triggers both \"retake exam\" and \"additional lessons\".<\/li><\/ul>"}],"marks":10},{"id":"B-ST-atm","topic":"st","title":"ATM password lock – diagram, table, invalid transition","src":"Tutorial Week 7","scen":"<p>An ATM system function where, if the user enters the invalid password three times, the account will be locked. If the user enters a valid password in any of the first three attempts, the user will be logged in successfully. If the user enters the invalid password in the first or second try, the user will be asked to re-enter the password. And finally, if the user enters an incorrect password the 3rd time, the account will be blocked.<\/p><p>Figure 3: ATM scenario<\/p>","parts":[{"l":"1.","q":"Draw a state transition diagram for the above scenario.","m":5,"a":"<div class=\"diag\"><svg role=\"img\" aria-label=\"ATM state transition diagram\" style=\"width:417px;max-width:100%;min-width:317px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 417 332\"><defs/><g><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"67.5415\" x=\"7\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"57.5415\" x=\"12\" y=\"111.729\">S1: 1st try<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"77.3486\" x=\"147.5\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"67.3486\" x=\"152.5\" y=\"111.729\">S2: 2nd try<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"74.7651\" x=\"297.5\" y=\"87\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"64.7651\" x=\"302.5\" y=\"111.729\">S3: 3rd try<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"130.561\" x=\"107.5\" y=\"203\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"120.561\" x=\"112.5\" y=\"227.729\">S4: Access granted<\/text><rect fill=\"#F1F1F1\" height=\"40\" rx=\"7\" ry=\"7\" style=\"stroke:#181818;stroke-width:1.2;\" width=\"137.5435\" x=\"274\" y=\"203\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"13\" lengthAdjust=\"spacing\" textLength=\"127.5435\" x=\"279\" y=\"227.729\">S5: Account blocked<\/text><ellipse cx=\"41\" cy=\"16\" fill=\"#222222\" rx=\"10\" ry=\"10\" style=\"stroke:#222222;stroke-width:1;\"/><ellipse cx=\"257\" cy=\"315\" fill=\"none\" rx=\"11\" ry=\"11\" style=\"stroke:#222222;stroke-width:1;\"/><ellipse cx=\"257\" cy=\"315\" fill=\"#222222\" rx=\"6\" ry=\"6\" style=\"stroke:#222222;stroke-width:1;\"/><g id=\"sb-atm-link_*start*_S1\"><path d=\"M41,26.19 C41,40.4 41,62.02 41,80.74 \" fill=\"none\" id=\"sb-atm-*start*-to-S1\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"41,86.74,45,77.74,41,81.74,37,77.74,41,86.74\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"sb-atm-link_S1_S2\"><path d=\"M75.36,107 C96.97,107 118.89,107 141.28,107 \" fill=\"none\" id=\"sb-atm-S1-to-S2\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"147.28,107,138.28,103,142.28,107,138.28,111,147.28,107\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"36.6387\" x=\"93.25\" y=\"100.625\">invalid<\/text><\/g><g id=\"sb-atm-link_S2_S3\"><path d=\"M224.76,107 C247.18,107 269.26,107 291.46,107 \" fill=\"none\" id=\"sb-atm-S2-to-S3\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"297.46,107,288.46,103,292.46,107,288.46,111,297.46,107\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"36.6387\" x=\"243\" y=\"100.625\">invalid<\/text><\/g><g id=\"sb-atm-link_S3_S5\"><path d=\"M336.34,127.08 C337.82,148.12 339.7596,175.8047 341.2396,196.8747 \" fill=\"none\" id=\"sb-atm-S3-to-S5\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"341.66,202.86,345.0195,193.6018,341.3097,197.8723,337.0392,194.1624,341.66,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"36.6387\" x=\"340\" y=\"169.625\">invalid<\/text><\/g><g id=\"sb-atm-link_S1_S4\"><path d=\"M63.09,127.08 C87.46,148.12 121.8996,177.8677 146.2896,198.9377 \" fill=\"none\" id=\"sb-atm-S1-to-S4\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"150.83,202.86,146.6343,193.9495,147.0463,199.5914,141.4045,200.0034,150.83,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"26.6426\" x=\"115\" y=\"169.625\">valid<\/text><\/g><g id=\"sb-atm-link_S2_S4\"><path d=\"M183.82,127.08 C181.42,148.12 178.2718,175.8289 175.8618,196.8989 \" fill=\"none\" id=\"sb-atm-S2-to-S4\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"175.18,202.86,180.1768,194.3729,175.7482,197.8924,172.2287,193.4637,175.18,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"26.6426\" x=\"181\" y=\"169.625\">valid<\/text><\/g><g id=\"sb-atm-link_S3_S4\"><path d=\"M307.88,127.08 C277.98,148.12 235.0468,178.3369 205.1068,199.4069 \" fill=\"none\" id=\"sb-atm-S3-to-S4\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"200.2,202.86,209.8622,200.9515,204.289,199.9824,205.2581,194.4092,200.2,202.86\" style=\"stroke:#181818;stroke-width:1;\"/><text fill=\"#000000\" font-family=\"Arial\" font-size=\"12\" lengthAdjust=\"spacing\" textLength=\"26.6426\" x=\"264\" y=\"169.625\">valid<\/text><\/g><g id=\"sb-atm-link_S4_*end*\"><path d=\"M190.81,243.09 C209.11,262.69 232.6162,287.8736 245.6262,301.8136 \" fill=\"none\" id=\"sb-atm-S4-to-*end*\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"249.72,306.2,246.5036,296.8911,246.3085,302.5446,240.655,302.3495,249.72,306.2\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><g id=\"sb-atm-link_S5_*end*\"><path d=\"M324.76,243.09 C306.03,262.69 281.9151,287.922 268.5951,301.862 \" fill=\"none\" id=\"sb-atm-S5-to-*end*\" style=\"stroke:#181818;stroke-width:1;\"/><polygon fill=\"#181818\" points=\"264.45,306.2,273.5596,302.4564,267.9042,302.585,267.7756,296.9296,264.45,306.2\" style=\"stroke:#181818;stroke-width:1;\"/><\/g><\/g><\/svg><\/div><p>5 states, 2 events (valid, invalid), 6 valid transitions. Show the start and final markers.<\/p>"},{"l":"2.","q":"Based on the state transition diagram, produce a state transition table.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>State<\/th><th>Valid password<\/th><th>Invalid password<\/th><\/tr><tr><td>S1: 1st try (start)<\/td><td>S4<\/td><td>S2<\/td><\/tr><tr><td>S2: 2nd try<\/td><td>S4<\/td><td>S3<\/td><\/tr><tr><td>S3: 3rd try<\/td><td>S4<\/td><td>S5<\/td><\/tr><tr><td>S4: Access granted<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>S5: Account blocked<\/td><td>–<\/td><td>–<\/td><\/tr><\/table><\/div><p>There are 6 valid transitions and 4 invalid cells (\"–\").<\/p>"},{"l":"3.","q":"Give an example test case for an invalid transition.","m":2,"a":"<p>Start state <b>S5 (blocked)<\/b>, event = enter a valid password, expected = access refused and the account stays blocked (still S5).<\/p>"},{"l":"4.","q":"What is the minimum number of test cases for 100% valid transitions coverage?","m":3,"a":"<p>S4 and S5 are final, so each test ends on one arrow into S4 or S5. There are 4 such arrows, so <b>4 tests<\/b>:<\/p><ul class=\"mlist\"><li>valid<\/li><li>invalid, valid<\/li><li>invalid, invalid, valid<\/li><li>invalid, invalid, invalid<\/li><\/ul>"}],"marks":15},{"id":"B-ST-food","topic":"st","title":"Food delivery order – from scenario to diagram","src":"Predicted question","scen":"<p>When a customer checks out, the order is Pending Payment. If payment succeeds the order becomes Paid; if payment fails the order is Cancelled. The customer may cancel while the order is Pending Payment or Paid. A Paid order becomes Preparing when the restaurant accepts it, or Cancelled (with refund) if the restaurant rejects it. A Preparing order becomes Out for Delivery when the rider picks it up, an roke-width:1;\"/><\/g><\/g><\/svg><\/div>"},{"l":"2.","q":"How many valid and invalid transitions are there?","m":2,"a":"<p><b>8 valid.<\/b> 5 states × 6 events = 30 cells, so <b>22 invalid<\/b>.<\/p>"},{"l":"3.","q":"A test runs Reserve, Borrow, Due date passed, Return, Borrow, Return. What valid transitions coverage does it achieve?","m":4,"a":"<p>It covers S1→S2, S2→S3, S3→S4, S4→S1, S1→S3 and S3→S1: 6 distinct transitions of 8, so <b>75%<\/b>. It misses S2→S1 (Cancel) and S4→S5 (Report lost).<\/p>"},{"l":"4.","q":"Give the minimum number of test cases for 100% valid transitions coverage.","m":3,"a":"<p><b>1 test.<\/b> Only one arrow leads into the final state, so one long sequence covers everything: Reserve, Cancel, Borrow, Return, Reserve, Borrow, Due date passed, Return, Borrow, Due date passed, Report lost.<\/p>"},{"l":"5.","q":"Give ONE (1) invalid transition test case.","m":2,"a":"<p>State S5 Lost, event Return: rejected, the book stays Lost. (Or: state S2 Reserved, event Report lost: rejected.)<\/p>"}],"marks":15},{"id":"B-ST-criteria","topic":"st","title":"State transition coverage criteria","src":"Predicted question","scen":"","parts":[{"l":"1.","q":"Explain THREE (3) state transition coverage criteria and state which is strongest.","m":5,"a":"<ul class=\"mlist\"><li><b>All states coverage:<\/b> every state is visited at least once.<\/li><li><b>Valid transitions coverage<\/b> (0-switch): every valid transition is exercised at least once. This is the most widely used criterion.<\/li><li><b>All transitions coverage:<\/b> every valid transition is exercised and every invalid transition is attempted. It is the strongest, used for mission- and safety-critical software.<\/li><\/ul><p>Coverage = items exercised ÷ total items × 100%. Full valid transitions coverage guarantees full all-states coverage, but not the reverse.<\/p>"}],"marks":5},{"id":"B-WB-gcd","topic":"wb","title":"GCD code – control flow graph, McCabe, basis paths","src":"Tutorial Week 8","scen":" iddle\" x=\"48.08\" y=\"-14.44\" font-family=\"Arial\" font-size=\"12.00\">a = a &#45; b<\/text>\n<\/g>\n\n<g id=\"sb-gcd-edge4\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M182.08,-96.14C154.84,-81.69 115.63,-60.88 86.66,-45.51\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"87.61,-43.24 80.27,-42.12 85.31,-47.57 87.61,-43.24\"/>\n<text text-anchor=\"middle\" x=\"145.08\" y=\"-66.28\" font-family=\"Arial\" font-size=\"11.00\"> T<\/text>\n<\/g>\n\n<g id=\"sb-gcd-node5\" class=\"node\">\n\n<ellipse fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" cx=\"266.08\" cy=\"-24.04\" rx=\"48.17\" ry=\"24.08\"/>\n<text text-anchor=\"middle\" x=\"266.08\" y=\"-27.44\" font-family=\"Arial\" font-size=\"12.00\">N5: line 6<\/text>\n<text text-anchor=\"middle\" x=\"266.08\" y=\"-14.44\" font-family=\"Arial\" font-size=\"12.00\">b = b &#45; a<\/text>\n<\/g>\n\n<g id=\"sb-gcd-edge5\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M227.21,-90.9C233.92,-79.53 242.16,-65.56 249.33,-53.42\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"251.52,-54.54 252.97,-47.26 247.3,-52.04 251.52,-54.54\"/>\n<text text-anchor=\"middle\" x=\"248.08\" y=\"-66.28\" font-family=\"Arial\" font-size=\"11.00\"> F<\/text>\n<\/g>\n\n<g id=\"sb-gcd-edge6\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M32.08,-46.92C16.73,-70.84 -1.71,-109.57 16.08,-138.17 32.95,-165.28 64.81,-181.42 93,-190.84\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"92.29,-193.19 99.7,-192.98 93.78,-188.52 92.29,-193.19\"/>\n<\/g>\n\n<g id=\"sb-gcd-edge7\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M276.85,-47.69C286.66,-71.93 297.23,-110.61 280.08,-138.17 263.22,-165.28 231.36,-181.42 203.17,-190.84\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"202.39,-188.52 196.47,-192.98 203.88,-193.19 202.39,-188.52\"/>\n<\/g>\n<\/g>\n<\/svg><\/div><p>Edges: N1→N2, N2→N3 (T), N2→N6 (F), N3→N4 (T), N3→N5 (F), N4→N2, N5→N2. Lines 9–12 run in sequence. They add one node and one edge each, so V(G) does not change.<\/p>"},{"l":"2.","q":"Calculate the complexity of the Figure 1 source code using McCabe's metric.","m":3,"a":"<p>V(G) = E − N + 2 = 7 − 6 + 2 = <b>3<\/b>. Check: decisions + 1 = 2 (while, if) + 1 = 3.<\/p>"},{"l":"3.","q":"Derive the basis paths and tests for Figure 1.","m":7,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Path<\/th><th>Route<\/th><th>Input<\/th><th>Expected<\/th><\/tr><tr><td>P1<\/td><td>N1–N2–N6<\/td><td>gcd(5, 5)<\/td><td>5<\/td><\/tr><tr><td>P2<\/td><td>N1–N2–N3–N4–N2–N6<\/td><td>gcd(10, 5)<\/td><td>5<\/td><\/tr><tr><td>P3<\/td><td>N1–N2–N3–N5–N2–N6<\/td><td>gcd(5, 10)<\/td><td>5<\/td><\/tr><\/table><\/div>"}],"marks":15},{"id":"B-WB-fig2","topic":"wb","title":"Code segment – statement vs decision coverage","src":"Tutorial Week 8","scen":"<p>Given the segment of code in Figure 2, answer the questions below.<\/p><pre class=\"code\">1. Read p\n2. Read q\n3. IF p &gt; q Then r = 8\n4. ENDIF<\/pre><p>Figure 2: Segment of code<\/p>","parts":[{"l":"1.","q":"How many test cases are needed to achieve 100% statement coverage? Justify your answer with test case(s).","m":3,"a":"<p><b>1 test:<\/b> p = 5, q = 3 takes the True outcome, so every statement, including r = 8, runs.<\/p>"},{"l":"2.","q":"To achieve 100% decision coverage, how many test cases are needed?","m":3,"a":"<p><b>2 tests:<\/b> p = 5, q = 3 (True) and p = 3, q = 5 (False).<\/p>"},{"l":"3.","q":"What is the difference between statement and decision coverage?","m":4,"a":"<p>Statement coverage = executed statements ÷ executable statements × 100%. Decision (branch) coverage = decision outcomes exercised ÷ all decision outcomes × 100%.<\/p><p>100% decision coverage guarantees 100% statement coverage, but not the reverse. Here one test gives 100% statement coverage but only 50% decision coverage: the False path, which skips the assignment, is never tested.<\/p>"}],"marks":10},{"id":"B-WB-fine","topic":"wb","title":"Library late fine –  stroke=\"black\" stroke-width=\"1.2\" cx=\"346.86\" cy=\"-95.08\" rx=\"45.61\" ry=\"18\"/>\n<text text-anchor=\"middle\" x=\"346.86\" y=\"-91.98\" font-family=\"Arial\" font-size=\"12.00\">N8: line 11<\/text>\n<\/g>\n\n<g id=\"sb-fine-edge9\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M348.99,-152.97C348.61,-142.79 348.16,-130.83 347.78,-120.51\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"350.22,-120.24 347.51,-113.33 345.32,-120.42 350.22,-120.24\"/>\n<text text-anchor=\"middle\" x=\"353.86\" y=\"-130.28\" font-family=\"Arial\" font-size=\"11.00\"> T<\/text>\n<\/g>\n\n<g id=\"sb-fine-node9\" class=\"node\">\n\n<ellipse fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" cx=\"428.86\" cy=\"-24.04\" rx=\"52.15\" ry=\"24.08\"/>\n<text text-anchor=\"middle\" x=\"428.86\" y=\"-27.44\" font-family=\"Arial\" font-size=\"12.00\">N9: line 12<\/text>\n<text text-anchor=\"middle\" x=\"428.86\" y=\"-14.44\" font-family=\"Arial\" font-size=\"12.00\">return<\/text>\n<\/g>\n\n<g id=\"sb-fine-edge10\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M374.39,-155.67C386.49,-144.31 400.29,-129.24 408.86,-113.08 418.31,-95.27 423.31,-73.13 425.95,-55.51\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"428.42,-55.53 426.94,-48.26 423.57,-54.87 428.42,-55.53\"/>\n<text text-anchor=\"middle\" x=\"426.86\" y=\"-92.28\" font-family=\"Arial\" font-size=\"11.00\"> F<\/text>\n<\/g>\n\n<g id=\"sb-fine-edge11\" class=\"edge\">\n\n<path fill=\"none\" stroke=\"black\" d=\"M365.47,-78.42C375.38,-70.07 387.8,-59.61 399.02,-50.17\"/>\n<polygon fill=\"black\" stroke=\"black\" points=\"400.64,-52.01 404.41,-45.62 397.48,-48.26 400.64,-52.01\"/>\n<\/g>\n<\/g>\n<\/svg><\/div><p>Edges: N1→N2, N2→N3 (T), N2→N7 (F), N3→N4 (T), N3→N5 (F), N4→N6, N5→N6, N6→N2, N7→N8 (T), N7→N9 (F), N8→N9.<\/p>"},{"l":"2.","q":"Calculate the cyclomatic complexity using McCabe's metric.","m":2,"a":"<p>E = 11, N = 9, so V(G) = 11 − 9 + 2 = <b>4<\/b>. Check: 3 decisions (while, if, if) + 1 = 4.<\/p>"},{"l":"3.","q":"Derive the basis paths and a test for each.","m":5,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Path<\/th><th>Route<\/th><th>days_late<\/th><th>Expected fine<\/th><\/tr><tr><td>P1<\/td><td>N1-N2-N7-N9 (loop skipped)<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>P2<\/td><td>N1-N2-N3-N4-N6-N2-N7-N9<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>P3<\/td><td>… also takes N3-N5 (day &gt; 7)<\/td><td>8<\/td><td>9<\/td><\/tr><tr><td>P4<\/td><td>… also takes N7-N8 (cap applied)<\/td><td>19<\/td><td>30 (7 + 24 = 31, capped)<\/td><\/tr><\/table><\/div><p>P3 must pass N4 for days 1–7 before it can reach N5. Mention this to show the path is feasible.<\/p>"},{"l":"4.","q":"What is the minimum number of tests for 100% statement coverage and for 100% branch coverage? Justify.","m":4,"a":"<p><b>Statement: 1 test.<\/b> days_late = 19 runs line 6 (days 1–7), line 8 (days 8–19) and line 11 (cap), so every statement runs.<\/p><p><b>Branch: 2 tests.<\/b> days_late = 19 covers while T/F, if-5 T/F and if-10 True. Line 10 also needs its False outcome, so add days_late = 1 (fine 1, no cap).<\/p>"}],"marks":15},{"id":"B-WB-drills","topic":"wb","title":"Statement vs decision coverage drills","src":"Predicted question","scen":"<p>Segment A<\/p><pre class=\"code\">Read x, y\nIF x &gt; 0 THEN Print \"x positive\" ELSE Print \"x not positive\" ENDIF\nIF y &gt; 0 THEN Print \"y positive\" ENDIF<\/pre><p>Segment B<\/p><pre class=\"code\">Read age, member\nIF age &gt;= 60 THEN\n    IF member = \"Y\" THEN discount = 30 ELSE discount = 20 ENDIF\nENDIF<\/pre><p>Segment C<\/p><pre class=\"code\">count = 0\nFOR i = 1 TO n\n    IF a[i] &lt; 0 THEN count = count + 1 ENDIF\nENDFOR<\/pre>","parts":[{"l":"A.","q":"Segment A: minimum tests for 100% statement and 100% decision coverage, with test data.","m":3,"a":"<p><b>Statement 2, decision 2:<\/b> (x=1, y=1) and (x=0, y=0). The second test is needed for the ELSE branch and for y False.<\/p>"},{"l":"B.","q":"Segment B: minimum tests for 100% statement and 100% decision coverage, with test data.","m":4,"a":"<p><b>Statement 2:<\/b> (65, Y) and (65, N). <b>Decision 3:<\/b> add (30, any) for the outer False.<\/p>"},{"l":"C.","q":"Segment C: minimum tests for 100% statement and 100% decision coverage, with test data.","m":3,"a":"<p><b>Statement 1, decision 1:<\/b> n = 2, a = [−1, 5]. The loop body runs twice (if True, then False) and the loop exits (False). A loop lets one test cover both outcomes of a decision.<\/p>"}],"marks":10},{"id":"B-WB-calc","topic":"wb","title":"Coverage calculation and the value of white-box testing","src":"Predicted question","scen":"","parts":[{"l":"a)","q":"A suite executes 18 of 24 executable statements and 10 of 16 decision outcomes. Calculate statement and decision coverage.","m":2,"a":"<p>Statement = 18 ÷ 24 = <b>75%<\/b>. Decision = 10 ÷ 16 = <b>62.5%<\/b>.<\/p>"},{"l":"b)","q":"Give ONE (1) strength and ONE (1) weakness of white-box testing.","m":3,"a":"<p>Strength: the whole implementation is considered, so it finds defects even when the specification is vague or out of date. It also gives an objective measure of thoroughness, and it can be used in static testing (code reviews, dry runs).<\/p><p>Weakness: it cannot find omissions. A requirement that was never implemented has no code to cover.<\/p>"},{"l":"c)","q":"A technique produces 25 coverage items. The executed tests exercise 20 of them. What is the coverage?","m":1,"a":"<p>20 ÷ 25 = <b>80%<\/b>.<\/p>"}],"marks":6},{"id":"B-EX-choose","topic":"exp","title":"Choose the technique and justify","src":"Predicted question","scen":"<p>For each situation, name the most suitable test technique and justify your choice.<\/p><ol class=\"mlist\"><li>An age field accepts 18–65 for a loan form.<\/li><li>Loan approval depends on income, credit score and employment status together.<\/li><li>An account locks after 3 failed logins.<\/li><li>A safety-critical module must have every branch executed.<\/li><li>No specification, little time, an experienced tester.<\/li><\/ol>","parts":[{"l":"1–5.","q":"Technique and justification for each situation (2 marks each).","m":10,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Situation<\/th><th>Technique<\/th><th>Why<\/th><\/tr><tr><td>1<\/td><td>Equivalence partitioning + BVA<\/td><td>Ordered numeric ranges; defects cluster at the edges<\/td><\/tr><tr><td>2<\/td><td>Decision table<\/td><td>Combinations of conditions lead to different actions<\/td><\/tr><tr><td>3<\/td><td>State transition<\/td><td>Behaviour depends on the current state and the event history<\/td><\/tr><tr><td>4<\/td><td>Branch (decision) testing<\/td><td>White-box; measurable coverage of the code's decisions<\/td><\/tr><tr><td>5<\/td><td>Exploratory testing<\/td><td>Design, run and adapt tests together in time-boxed sessions with a charter<\/td><\/tr><\/table><\/div><p>Other pairings to know: repeated crashes on empty fields → error guessing / fault attacks; a company UI or accessibility list → checklist-based testing.<\/p>"}],"marks":10},{"id":"B-EX-story","topic":"exp","title":"User story, acceptance criteria and ATDD","src":"Predicted question","scen":"<p>\"As a student, I want to reset my portal password through my registered email, so that I can log in again if I forget it.\"<\/p>","parts":[{"l":"1.","q":"Write FOUR (4) acceptance criteria in Given/When/Then format.","m":6,"a":"<ul class=\"mlist\"><li><b>AC1:<\/b> Given a registered student on the Forgot Password page, when they enter their registered email, then a reset link is sent to that email.<\/li><li><b>AC2:<\/b> Given a reset link older than 30 minutes, when the student opens it, then the system shows \"Link expired\".<\/li><li><b>AC3:<\/b> Given a valid link, when the student enters a new password that meets the policy (8–16 characters, with upper case, lower case, a digit and a special character), then the password is changed and the old one stops working.<\/li><li><b>AC4:<\/b> Given an email that is not registered, when it is entered, then the same neutral message is shown (the page does not reveal whether the account exists).<\/li><\/ul>"},{"l":"2.","q":"Derive ATDD test cases, including positive and negative tests.","m":5,"a":"<ul class=\"mlist\"><li>Positive: a registered email → a link arrives; a valid link plus \"Sunway@2026\" → password changed.<\/li><li>Negative: a link opened after 31 minutes → expired; the same link used twice → rejected; new password \"abc\" → rejected; an unregistered email → neutral message.<\/li><li>Boundary: new passwords of 7, 8, 16 and 17 characters.<\/li><\/ul><p>The tests are written before the code, from the acceptance criteria, and they drive development.<\/p>"},{"l":"3.","q":"Explain the 3 C's of a user story.","m":3,"a":"<ul class=\"mlist\"><li><b>Card:<\/b> the medium that describes the story.<\/li><li><b>Conversation:<\/b> the discussion that explains how the software will be used.<\/li><li><b>Confirmation:<\/b> the acceptance criteria.<\/li><\/ul>"},{"l":"4.","q":"Name the INVEST criteria.","m":1,"a":"<p><b>Independent, Negotiable, Valuable, Estimable, Small, Testable.<\/b><\/p>"}],"marks":15},{"id":"B-EX-guess","topic":"exp","title":"Error guessing and exploratory testing","src":"Predicted question","scen":"<p>Use the password-reset feature from the user story question (reset link sent to the registered email; a new password of 8–16 characters).<\/p>","parts":[{"l":"a)","q":"List FOUR (4) errors you would guess for the password reset feature.","m":4,"a":"<ul class=\"mlist\"><li>An email with a leading space, or in upper case, is not recognised.<\/li><li>Double-clicking Send creates two valid links.<\/li><li>An old link still works after a newer one is issued.<\/li><li>The new password can be the same as the old one.<\/li><li>A 500-character input crashes the form.<\/li><li>SQL characters in the email field cause an error.<\/li><\/ul>"},{"l":"b)","q":"Why are error guessing and exploratory testing good to do?","m":2,"a":"<p>They find defects that the specification-based techniques miss, they need little preparation, and they work well when specifications are poor or time is short. They work best as a complement to the formal techniques, not a replacement for them.<\/p>"}],"marks":6},{"id":"B-EX-theory","topic":"exp","title":"Black-box, white-box and experience-based – theory","src":"Tutorial Weeks 6 & 8","scen":"","parts":[{"l":"1.","q":"What is a key characteristic of structure-based testing techniques?","m":2,"a":"<p>Tests are derived from the internal structure of the code, and coverage is measured against that structure.<\/p>"},{"l":"2.","q":"Why are both specification-based and structure-based testing techniques useful?","m":4,"a":"<p>Specification-based testing checks that what was specified works and finds missing functions. Structure-based testing checks that all the code is exercised and finds untested code. Each finds defects the other misses.<\/p>"},{"l":"3.","q":"How do experience-based techniques differ from specification-based techniques?","m":4,"a":"<p>Experience-based tests come from the tester's knowledge, skill and intuition. They are less systematic and their coverage is hard to measure. Specification-based tests are derived systematically from the test basis, with measurable coverage.<\/p>"},{"l":"4.","q":"Which of these would structure-based techniques most likely be applied to? I. Boundaries between mortgage interest rate bands. II. An invalid transition between arrears statuses. III. The business process flow for mortgage approval. IV. Control flow of the program to calculate repayment.","m":2,"a":"<p><b>IV<\/b> (control flow of the program). I is BVA, II is state transition, III is specification or process-based (black-box).<\/p>"}],"marks":12},{"id":"B-EX-order","topic":"exp","title":"Test execution schedule order","src":"Tutorial Week 6","scen":"<p>Put the test cases that implement the following test conditions into the best order for the test execution schedule, for a test that checks modifications of customers on a database.<\/p><ul class=\"mlist\"><li>a) Print modified customer record<\/li><li>b) Change customer address: house number and street name<\/li><li>c) Capture and print the on-screen error message<\/li><li>d) Change customer address: postal code<\/li><li>e) Confirm existing customer is on the database by opening that record<\/li><li>f) Close the customer record and close the database<\/li><li>g) Try to add a new customer with no details at all<\/li><\/ul>","parts":[{"l":"","q":"Give the order and justify it.","m":4,"a":"<p><b>e → b → d → a → g → c → f.<\/b> First open the existing record, then change the address and postal code, then print the modified record. Next try the invalid add and capture its error message. Close the record and the database last.<\/p>"}],"marks":4},{"id":"B-RV-reg","topic":"review","title":"Registration requirement review","src":"Tutorial Week 5","scen":"<p>Registration: Users have the possibility to register. Registration is not mandatory, but provides a convenient means to store and access user information such as name, address, credit card details and preferences. Upon registration the user has to select a username and a temporary password will be generated and send via email, in order to validate the email address. Users have possibility of viewing and updating the user information any time. Username is a string containing alpha-numeric characters. It must have at least 8 characters, and not more than 32 characters. Temporary password is generated and send to email by reversing the username given. Password is a string containing alpha-numeric and special characters. It must have at least 8 characters, and not more than 16 characters. A legal password must contain upper and lowercase letters (at least one of each), one special character, and at least one numeric character.<\/p><p>For example: Username = Yarisone, Temporary password = enosiraY<\/p>","parts":[{"l":"1.","q":"Review the requirement. Highlight the ambiguities and problems you find.","m":7,"a":"<ol class=\"mlist\"><li><b>Contradiction:<\/b> the temporary password is the username reversed, but a username can be up to 32 characters and a password at most 16. Reversing a username longer than 16 gives an illegal password.<\/li><li><b>Contradiction:<\/b> a reversed username has only alphanumeric characters, but a legal password needs a special character and a digit. The example \"enosiraY\" breaks the password rule.<\/li><li><b>Security:<\/b> a reversed username is predictable, so anyone can guess the temporary password.<\/li><li>No expiry for the temporary password, and nothing says the user must change it at first login.<\/li><li>Username uniqueness and case sensitivity are not stated.<\/li><li>\"Alpha-numeric\" and \"special characters\" are not defined (is \"_\" allowed? spaces?).<\/li><li>\"Viewing and updating ... any time\": can the username change? Must the user log in first?<\/li><li>Storing credit card details has no security requirement attached.<\/li><\/ol>"},{"l":"2.","q":"Revise the requirement.","m":3,"a":"<p>\"On registration the user enters a unique, case-insensitive username of 8–32 alphanumeric characters. The system generates a random temporary password that meets the password policy and emails it to the user. The temporary password expires after 24 hours and must be changed at first login. A password is 8–16 characters with at least one uppercase letter, one lowercase letter, one digit and one special character from the set !@#$%^&amp;*.\"<\/p>"}],"marks":10},{"id":"B-RV-book","topic":"review","title":"Online bookstore specification review","src":"Tutorial Week 5","scen":"<p>Book Search: users can search for books by title, author, or ISBN. The system should validate: title and author searches should not exceed 100 characters; ISBN must be in a valid format (10 to 13 characters); an empty search query should be return a message.<\/p><p>Order Placement: users can place orders for books. The system should validate: the user must be logged in to place an order; the ordered quantity must be a positive integer; the total price should reflect any applicable discounts.<\/p>","parts":[{"l":"","q":"Conduct a review of the requirements and identify at least THREE (3) potential issues or ambiguities.","m":6,"a":"<ul class=\"mlist\"><li>\"ISBN 10 to 13 characters\": a valid ISBN is exactly 10 or 13 digits, so 11 and 12 should be invalid. Hyphens and the check digit are not mentioned.<\/li><li>\"Should not exceed 100 characters\": what happens at 101 (error or truncate)? No minimum length.<\/li><li>\"An empty search query should be return a message\": which message? Does a query of only spaces count?<\/li><li>\"Positive integer\" quantity: no maximum, nothing about exceeding stock.<\/li><li>\"Any applicable discounts\": which discounts, can they stack, in what order, rounding?<\/li><li>\"Must be logged in\": what happens to a guest's cart? Session timeout?<\/li><li>Search matching rules are not stated: case sensitivity, partial match, combined title AND author.<\/li><\/ul>"}],"marks":6},{"id":"B-RV-course","topic":"review","title":"Course registration specification review","src":"Predicted question","scen":"<p>\"Students can register for courses during registration week. A student may take up to 20 credit hours per semester. Students with a CGPA above 3.5 may take more credits. Registration for a course with a prerequisite should be blocked unless the student has passed the prerequisite. The system should respond fast. Payment must be made within a few days.\"<\/p>","parts":[{"l":"","q":"Identify at least THREE (3) ambiguities and say what you would ask.","m":6,"a":"<ul class=\"mlist\"><li>Which dates are \"registration week\", in which time zone?<\/li><li>\"Up to 20\": is exactly 20 allowed?<\/li><li>\"Above 3.5\": is a CGPA of exactly 3.5 excluded?<\/li><li>\"More credits\": how many more is the maximum?<\/li><li>\"Should be blocked\": mandatory or optional?<\/li><li>\"Passed\": what minimum grade? Transfer credits?<\/li><li>\"Respond fast\" is untestable: give a time and a load, e.g. 2 s for 500 users.<\/li><li>\"A few days\" is vague, and nothing says what happens if payment is late.<\/li><li>Two students competing for the last seat, or a waiting list, are not covered.<\/li><\/ul>"}],"marks":6},{"id":"B-C1-edf","topic":"ch1","title":"Describe the interaction between errors, defects and failures.","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Describe the interaction between errors, defects and failures.","m":3,"a":"<p>A person makes an <b>error<\/b> (mistake). The error produces a <b>defect<\/b> (fault or bug) in a work product such as code or a requirement. When defective code is executed it may cause a <b>failure<\/b>: the system does something it should not, or fails to do something it should.<\/p><p>Not every defect causes a failure. Failures can also come from environmental conditions (radiation, electromagnetic fields). The root cause is the fundamental reason the error happened.<\/p>"}],"marks":3},{"id":"B-C1-classify","topic":"ch1","title":"Classify each as a failure or a defect and explain why: (i) the app crashes when a 10 M…","src":"Tutorial Week 3 style","scen":"","parts":[{"l":"","q":"Classify each as a failure or a defect and explain why: (i) the app crashes when a 10 MB photo is uploaded; (ii) the requirement says \"passwords should be secure\" with no rules; (iii) a loop uses \"<=\" instead of \"<\"; (iv) the total shown is RM10 more than expected.","m":4,"a":"<ul class=\"mlist\"><li>(i) <b>Failure<\/b>: observed while the software runs.<\/li><li>(ii) <b>Defect<\/b>: in a work product, found by review without execution.<\/li><li>(iii) <b>Defect<\/b>: in the code.<\/li><li>(iv) <b>Failure<\/b>: the visible symptom.<\/li><\/ul><p>Week 3 version: slow response time, inconsistent CI colours and out-of-date petrol prices are observed during acceptance testing, so they are failures. Their causes are the defects (inefficient query, wrong colour code, broken price-update interface).<\/p>"}],"marks":4},{"id":"B-C1-principles","topic":"ch1","title":"List the seven testing principles. Select TWO (2) principles, explain them, and give a …","src":"Tutorial Week 3","scen":"","parts":[{"l":"","q":"List the seven testing principles. Select TWO (2) principles, explain them, and give a real-world example for each.","m":6,"a":"<ol class=\"mlist\"><li>Testing shows the presence, not the absence, of defects.<\/li><li>Exhaustive testing is impossible.<\/li><li>Early testing saves time and money.<\/li><li>Defects cluster together.<\/li><li>Tests wear out.<\/li><li>Testing is context dependent.<\/li><li>Absence-of-defects fallacy.<\/li><\/ol><ul class=\"mlist\"><li><b>Defects cluster together:<\/b> in a banking app most defects come from the complex interest-calculation module, so risk-based testing focuses effort there.<\/li><li><b>Absence-of-defects fallacy:<\/b> a booking system passes every test but is too slow and confusing for users, so it still fails its purpose.<\/li><\/ul>"}],"marks":6},{"id":"B-C1-zero","topic":"ch1","title":"Why is \"zero defects\" an insufficient guide to software quality?","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Why is \"zero defects\" an insufficient guide to software quality?","m":2,"a":"<p>This is the absence-of-defects fallacy. A defect-free system can still fail to meet users' needs or be built to the wrong requirements, so validation is also needed.<\/p>"}],"marks":2},{"id":"B-C1-cluster","topic":"ch1","title":"Give TWO (2) reasons why defect clustering may exist.","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Give TWO (2) reasons why defect clustering may exist.","m":2,"a":"<p>Any two: complex modules; code that changes often; inexperienced developers; new technology; unclear requirements for that area.<\/p>"}],"marks":2},{"id":"B-C1-debug","topic":"ch1","title":"What is debugging? Describe the typical debugging process and explain how confirmation …","src":"Tutorial Weeks 2–3","scen":"","parts":[{"l":"","q":"What is debugging? Describe the typical debugging process and explain how confirmation and regression testing relate to it.","m":5,"a":"<p>Debugging is a development activity that finds, analyses and fixes the cause of a failure: reproduce the failure, diagnose it (find the defect), fix it.<\/p><p>Afterwards, <b>confirmation testing<\/b> reruns the failed test to check the fix works, and <b>regression testing<\/b> checks the fix has not broken other parts. Testing triggers failures; debugging removes the defects behind them.<\/p>"}],"marks":5},{"id":"B-C1-activities","topic":"ch1","title":"Describe the main test activities in a typical test process and their testware. Then co…","src":"Tutorial Week 3","scen":"","parts":[{"l":"","q":"Describe the main test activities in a typical test process and their testware. Then compare the test management role and the testing role.","m":6,"a":"<div class=\"qtable\"><table class=\"qt\"><tr><th>Activity<\/th><th>Main output (testware)<\/th><\/tr><tr><td>Test planning<\/td><td>Test plan<\/td><\/tr><tr><td>Monitoring and control<\/td><td>Progress reports, control directives<\/td><\/tr><tr><td>Test analysis<\/td><td>Prioritised test conditions, defect reports on the test basis<\/td><\/tr><tr><td>Test design<\/td><td>Test cases, coverage items, test data and environment requirements<\/td><\/tr><tr><td>Test implementation<\/td><td>Test procedures, scripts, suites, test data, execution schedule, environment<\/td><\/tr><tr><td>Test execution<\/td><td>Test logs, defect reports<\/td><\/tr><tr><td>Test completion<\/td><td>Test completion report, improvement actions, archived testware<\/td><\/tr><\/table><\/div><p>The <b>test management role<\/b> covers planning, monitoring and control, and completion. The <b>testing role<\/b> covers analysis, design, implementation and execution.<\/p>"}],"marks":6},{"id":"B-C1-devtest","topic":"ch1","title":"Contrast the advantages and disadvantages of developers testing their own code.","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Contrast the advantages and disadvantages of developers testing their own code.","m":4,"a":"<p>Advantages: they know the code well, find defects quickly and cheaply, and test early. Disadvantages: confirmation bias, the same wrong assumptions, emotional attachment, and missed misunderstandings of the requirements. Independent testers bring different viewpoints, at the risk of isolation and communication gaps.<\/p>"}],"marks":4},{"id":"B-C1-confront","topic":"ch1","title":"Suggest TWO (2) ways that confrontation can be avoided.","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Suggest TWO (2) ways that confrontation can be avoided.","m":2,"a":"<p>Any two: report defects neutrally with facts and no blame; stress the shared goal of better quality; collaborate rather than battle; check the other person understood; explain the benefit (reduced risk).<\/p>"}],"marks":2},{"id":"B-C1-consequence","topic":"ch1","title":"Software failures can cause losses. Give TWO (2) consequences of software failures.","src":"Tutorial Week 2","scen":"","parts":[{"l":"","q":"Software failures can cause losses. Give TWO (2) consequences of software failures.","m":2,"a":"<p>Any two: financial loss, damage to reputation, injury or death in safety-critical systems, legal liability, wasted time.<\/p>"}],"marks":2},{"id":"B-C2-vv","topic":"ch2","title":"What is meant by verification and validation?","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"What is meant by verification and validation?","m":2,"a":"<p>Verification: \"are we building the product right?\", checked against the specified requirements. Validation: \"are we building the right product?\", checked against user needs in the real environment.<\/p>"}],"marks":2},{"id":"B-C2-vmodel","topic":"ch2","title":"Identify a benefit and a drawback of the V-model.","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"Identify a benefit and a drawback of the V-model.","m":2,"a":"<p>Benefit: each development phase has a matching test level, and test design starts early. Drawback: rigid and sequential, working software arrives late, and change is costly.<\/p>"}],"marks":2},{"id":"B-C2-iter","topic":"ch2","title":"Name three activities typically associated with an iterative model, and identify a sign…","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"Name three activities typically associated with an iterative model, and identify a significant benefit.","m":4,"a":"<p>Activities: plan, design and build, test and evaluate, in every iteration. Benefit: early working software and fast feedback, so changes can be accommodated.<\/p>"}],"marks":4},{"id":"B-C2-good","topic":"ch2","title":"List THREE (3) characteristics of good testing in any SDLC.","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"List THREE (3) characteristics of good testing in any SDLC.","m":3,"a":"<ul class=\"mlist\"><li>Every development activity has a corresponding test activity.<\/li><li>Each test level has its own specific objectives.<\/li><li>Test analysis and design start during the matching development phase.<\/li><li>Testers review work products as soon as drafts exist.<\/li><\/ul>"}],"marks":3},{"id":"B-C2-tdd","topic":"ch2","title":"Explain TDD, ATDD and BDD.","src":"Predicted question","scen":"","parts":[{"l":"","q":"Explain TDD, ATDD and BDD.","m":6,"a":"<ul class=\"mlist\"><li><b>TDD:<\/b> a developer writes a failing component test, writes code until it passes, then refactors.<\/li><li><b>ATDD:<\/b> tests are written from acceptance criteria before development, and they drive it.<\/li><li><b>BDD:<\/b> the desired behaviour is written in Given/When/Then natural language that stakeholders understand, then turned into executable tests.<\/li><\/ul><p>All three are test-first and shift-left.<\/p>"}],"marks":6},{"id":"B-C2-shift","topic":"ch2","title":"Give THREE (3) examples of the shift-left approach.","src":"Predicted question","scen":"","parts":[{"l":"","q":"Give THREE (3) examples of the shift-left approach.","m":3,"a":"<p>Any three: review requirements before they are accepted; write tests before the code; continuous integration for fast feedback; static analysis before dynamic testing; non-functional tests at component level.<\/p>"}],"marks":3},{"id":"B-C2-devops","topic":"ch2","title":"Give the benefits and risks of DevOps for testing.","src":"Predicted question","scen":"","parts":[{"l":"","q":"Give the benefits and risks of DevOps for testing.","m":4,"a":"<p>Benefits: fast feedback, automated regression in CI/CD, shift-left, stable environments. Risks: the pipeline must be defined and maintained, CI/CD tools need effort, and test automation needs extra resources.<\/p>"}],"marks":4},{"id":"B-C2-retro","topic":"ch2","title":"What do retrospectives cover, and what are their benefits for testing?","src":"Predicted question","scen":"","parts":[{"l":"","q":"What do retrospectives cover, and what are their benefits for testing?","m":3,"a":"<p>They cover what went well, what did not, and how to improve. Benefits: better test effectiveness and efficiency, better testware, team bonding, a better test basis, and better cooperation between development and testing.<\/p>"}],"marks":3},{"id":"B-C2-pair","topic":"ch2","title":"Pair the test levels with their descriptions: 1 Unit, 2 Integration, 3 System, 4 Accept…","src":"Tutorial Week 4","scen":"","parts":[{"l":"","q":"Pair the test levels with their descriptions: 1 Unit, 2 Integration, 3 System, 4 Acceptance; A tests the behaviour of the whole system, B performed by customers, C tests any separately testable module, D tests the interactions of the interfaces.","m":4,"a":"<p><b>1 → C, 2 → D, 3 → A, 4 → B.<\/b><\/p>"}],"marks":4},{"id":"B-C2-fnf","topic":"ch2","title":"Compare a functional requirement with a non-functional requirement.","src":"Tutorial Week 4","scen":"","pa
